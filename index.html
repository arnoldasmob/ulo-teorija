ktyvesnis ir saugesnis. Todėl orlaivis, turintis atsakiklį, veikiančią A ir C arba S režimu, gali būti tiksliai stebimas ir valdomas oro eismo tarnybų.","hint":""},{"id":"856","q":"Parodomuosius renginius ir aviacijos sporto varžybas rengti galima:","a":["tik suderinus su vietos savivaldybe","LTSA nustatyta tvarka ir turint TKA leidimą","tik suderinus su vietos savivaldybe ir gavus KOP leidimą"],"c":[1],"expl":"","hint":""},{"id":"857","q":"Per kiek laiko reikia išlaikyti visus ULO teorijos egzaminus?","a":["per 12 mėnesių nuo pirmojo egzamino išlaikymo datos","per 24 mėnesių nuo pirmojo egzamino išlaikymo datos","per 12 mėnesių nuo paskutinio egzamino išlaikymo datos"],"c":[0],"expl":"","hint":""},{"id":"858","q":"Prie kokios zonos priskiriama EYD12 zona?","a":["Draudžiamos zonos","Pavojingų zonos","Ribojimų zonos"],"c":[1],"expl":"","hint":""},{"id":"859","q":"Prie kokios zonos priskiriama EYP4 zona?","a":["Draudžiamos zonos","pavojingos zonos","ribojimų zonos"],"c":[0],"expl":"","hint":""},{"id":"860","q":"Prie kokios zonos priskiriama EYR28 zona?","a":["Draudžiamos zonos","Pavojingos zonos","Ribojimų zonos"],"c":[2],"expl":"","hint":""},{"id":"861","q":"Prieš kiek laiko reikia gauti skrydžių vadovo leidimą įskristi į valdomąją oro erdvę?","a":["prieš 5 minutes","prieš 10 minučių","prieš 30 minučių"],"c":[1],"expl":"","hint":""},{"id":"862","q":"TKA uždraudžia orlaiviui išskristi iš Lietuvos Respublikos oro uosto, aerodromo ar lauko aikštelės Reglamente (ES) Nr. 965/2012 numatytais atvejais arba jeigu:","a":["kyla pagrįstų abejonių dėl orlaivio tinkamumo skraidyti ar orlaivio skrydžio įgulos nario galimybių tinkamai eiti savo pareigas dėl piktnaudžiavimo alkoholiu, narkotinėmis, toksinėmis, psichotropinėmis arba kitomis psichiką veikiančiomis medžiagomis, dėl susižeidimo, nuovargio, vaistų vartojimo, ligos ar kitų panašių priežasčių;","orlaivio įgulos nariai neturi atitinkamos licencijos ar orlaivyje nėra privalomų Reglamente (ES) Nr. 965/2012 nurodytų dokumentų, kuriuos reikia turėti skrydžio metu;","įtariama, kad kilo grėsmė orlaivio saugumui","visi atsakymai teisingi"],"c":[3],"expl":"","hint":""},{"id":"863","q":"ULOPF turi teisę sustabdyti ULO piloto licencijos galiojimą, jeigu jos savininkas:","a":["pažeidė vizualiųjų skrydžių taisykles, sukeldamas pavojų kitų asmenų turtui, sveikatai, gyvybei","Naudojosi licencijos suteiktomis teisėmis būdamas neblaivus ar apsvaigęs nuo narkotinių, psichotropinių ar kitų psichiką veikiančių medžiagų","atliko skrydžius neturėdamas reikiamos kvalifikacijos ar leidimo","visi atsakymai teisingi"],"c":[3],"expl":"","hint":""},{"id":"864","q":"Vizualius skrydžius valdomoje oro erdvėje leidžiama atlikti:","a":["Jeigu pilotas baigęs radijo ryšio aviacijos frazeologijos kursus lietuvių kalba (skrydžiams valdomoje oro erdvėje Lietuvoje) ir/arba radijo ryšio aviacijos frazeologijos kursus anglų kalba (tarptautiniams skrydžiams)","Visiems ULO pilotams","Jeigu pilotas baigęs radijo ryšio aviacijos frazeologijos kursus lietuvių kalba arba radijo ryšio aviacijos frazeologijos kursus anglų kalba ir išlaikiusiam ULOPF teorijos bei praktinių gebėjimų egzaminus"],"c":[2],"expl":"","hint":""},{"id":"865","q":"Kokiame aukštyje galima praskristi virš zonos EYP19? (Prie Klaipėdos aerodromo pagal 2024m žemėlapį)","a":["iki 1500 pėdu","nuo 1500 pėdu","negalima"],"c":[0],"expl":"","hint":""}]},"Radijo ryšys":{"slug":"radijo-rysys","questions":[{"id":"9","q":"Kurį apibrėžimą atitinka sąvoka “abipusis oro ir žemės ryšys”- (air-ground communication)?","a":["Aviacijos mobilios tarnybos antžeminė radijo stotis;","Abipusis ryšys tarp orlaivio ir radijo stoties, esančios žemėje;","Mobilus ryšys tarp antžeminio aviacijos radijo stočių ir orlaivių arba tarp orlaivių radijo stočių."],"c":[1],"expl":"Sąvoka „air-ground communication“arba lietuviškai „abipusis oro ir žemės ryšys“reiškia radijo ryšį tarp orlaivio ir antžeminės stoties. Tai gali būti naudojama perduoti informaciją apie orlaivio judėjimą, navigaciją, orą ar aviacijos saugą.","hint":""},{"id":"224","q":"Kurį apibrėžimą atitinka sąvoka “aerodromo eismas”-(aerodrome traffic)?","a":["Teikiamos skrydžio valdymo paslaugos aerodromo eismui","Visas judėjimas aerodromo manevravimo lauke ir visi skrydžiai arti aerodromo","Orlaivis yra arti aerodromo, skrydžiai aerodromo rate, įskrenda arba išskrendant iš jo"],"c":[1],"expl":"Aerodromo eismas apima tiek orlaivių judėjimą žemėje (manevravimo lauke), tiek visus skrydžius netoli aerodromo, įskaitant pakilimą, leidimąsi ir skrydį aerodromo rate.","hint":""},{"id":"225","q":"Kurį apibrėžimą atitinka sąvoka “skrydžių aerodromo ratas”-(aerodrome traffic circuit)?","a":["Judėjimas aerodromo manevravimo lauke","Arti aerodromo skraidymui nustatyta speciali trajektorija","Visi skrendantys ir manevravimo lauke judantys orlaiviai"],"c":[1],"expl":"","hint":""},{"id":"226","q":"Kurį apibrėžimą atitinka sąvoka “prieigos valdymo paslaugos”-(approach control service)?","a":["Skrydžio valdymo paslaugos teikiamos kontroliuojamiems atvykstančių ir išvykstančių orlaivių skrydžiams","Skrydžio valdymo paslaugos kontroliuojamiems orlaivių skrydžiams jo jurisdikcijos kontroliuojamoje erdvėje","Teikiamos skrydžių valdymo paslaugos skrydžiams pagal SPT ir VST-(IFR ir VFR)"],"c":[0],"expl":"Prieigos valdymo paslaugos yra atsakingos už orlaivių valdymą, kai jie artėja prie oro uosto arba iš jo išskrenda, kol perduodami bokštui ar skrydžių valdymo centrui. Atsakymas a tiksliausiai apibrėžia šią funkciją.","hint":""},{"id":"227","q":"Kurį apibrėžimą atitinka sąvoka “oro kelias”-(airway)?","a":["Bendras terminas, reiškiantis atitinkamą skrydžio informacijos tarnybą, teikiančią oro eismo paslaugas regiono oro erdvėje","Kontroliuojama oro erdvė, arba koridoriaus formos nustatyta jos dalis, aprūpinta radionavigacinėmis priemonėmis","Orlaivio judėjimo trajektorijos projekcija žemės paviršiuje, reiškiama kampo laipsniais nuo šiaurės dienovidinio (meridiano)"],"c":[1],"expl":"Oro kelias yra tam tikra nustatyta oro erdvės dalis, dažniausiai koridoriaus formos, kurioje orlaiviai skrenda pagal nustatytus maršrutus. Ši erdvė yra kontroliuojama ir paprastai turi įrengtas radionavigacijos priemones, kad būtų užtikrintas tikslus navigavimas. Tai leidžia skrydžių saugą ir efektyvų eismo valdymą.","hint":""},{"id":"228","q":"Kurį apibrėžimą atitinka sąvoka “oro eismas”-(air traffic)?","a":["Visas judėjimas aerodromo manevravimo lauke ir visi skrydžiai arti aerodromo","Visi skrendantys ir aerodromo manevravimo lauke judantys orlaiviai","Leidimas orlaiviui veikti pagal skrydžio valdymo tarnybos nustatytas sąlygas"],"c":[1],"expl":"Oro eismas apima visus orlaivius, kurie yra ore (skrenda) arba juda ant žemės aerodromo manevravimo lauke. Tai yra bendras terminas, nusakantis visą orlaivių judėjimą, kurį gali tekti valdyti ar stebėti oro eismo tarnyboms.","hint":""},{"id":"229","q":"Kurį apibrėžimą atitinka sąvoka “pranešimo punktas (taškas)” - (reporting point)?","a":["Punktas iki kurio galioja skrydžio valdymo tarnybos leidimas orlaiviui","Numatytas orlaiviui pranešimo punktas, nustatytoje oro erdvëje","Nustatytas geografinis orientyras, kurio atžvilgiu gali būti pranešama orlaivio vieta","Kontroliuojamas orlaivio skrydis iš žemės arba vietos nustatymas pagal antžeminę sistemą"],"c":[2],"expl":"","hint":""},{"id":"230","q":"Kurį apibrėžimą atitinka sąvoka “leidimo galiojimo riba”-(clearance limit)?","a":["Oro erdvė, kurioje teikiamos skrydžių valdymo paslaugos skrydžiams","Punktas, iki kurio galioja skrydžio valdymo tarnybos leidimas orlaiviui","Atvykstančių ir išvykstančių orlaivių aprūpinimas atitinkama informacija"],"c":[1],"expl":"","hint":""},{"id":"231","q":"Kurį apibrėžimą atitinka sąvoka “kontroliuojamoji zona”-(control zone)?","a":["Kontroliuojama oro erdvė, esanti tarp žemės ir nustatytos viršutinės ribos","Nustatyto dydžio oro erdvė, kurioje teikiamos skrydžių valdymo paslaugos","Skrydžių valdymo paslaugos aerodromo eismui"],"c":[0],"expl":"","hint":""},{"id":"232","q":"Kurį apibrėžimą atitinka sąvoka “vizualusis skrydis”-(VFR flight)?","a":["Skrydis atliekamas pagal žemės orientyrus","Pilotas, esantis orlaivyje, gali atpažinti žemės vietovę","Skridimas vadovaujantis vizualiųjų skrydžių taisyklėmis"],"c":[2],"expl":"Vizualusis skrydis (VFR – Visual Flight Rules) yra skrydis, vykdomas laikantis nustatytų vizualiųjų skrydžių taisyklių, kai pilotas skrydžio metu orientuojasi pagal regimąją aplinką. Tai neapsiriboja vien tik žemės orientyrais ar gebėjimu atpažinti vietovę – svarbiausia, kad būtų laikomasi teisinių VFR reikalavimų, įskaitant matomumą, atstumą nuo debesų ir kt.","hint":""},{"id":"233","q":"Kurį apibrėžimą atitinka sąvoka “(užėjimas) tūpti”-(visual approach)?","a":["Meteorologinės sąlygos geresnės už nustatytą minimumą","Artėjimas pagal SPT-(IFR), kai artėjimo schema visiškai arba iš dalies nevykdoma pagal SPT-(IFR), ir tolesnis artėjimas atliekamas pagal žemės orientyrus (vizualiai)","Instrumentinis skridimas vadovaujantis vizualiųjų skrydžių taisyklėmis"],"c":[1],"expl":"Vizualusis užėjimas tūpti (visual approach) yra procedūra, kai orlaivis skrenda pagal instrumentines skrydžio taisykles (IFR), tačiau tam tikru momentu pereina prie vizualaus (pagal regimąją aplinką) artėjimo prie tako. Tai leidžiama, kai yra tinkamos oro sąlygos ir matomumas, o pilotas gali matyti oro uostą arba orlaivį, kurio jis laikosi. Atsakymas a yra tik sąlyga tokiai procedūrai, o c – prieštaringas, nes instrumentinis skrydis ir vizualiosios taisyklės nėra derinamos taip, kaip ten parašyta","hint":""},{"id":"234","q":"Kurį apibrėžimą atitinka sąvoka “laukimo taškas-(holding point)”?","a":["Numatytas orlaiviams manevras, nustatytose ribose, laukiant kitų nurodymų (leidimo)","Vizualiai ar kitu būdu atpažinta nustatyta vieta, virš kurios, pagal skrydžių valdymo tarnybos leidimą, skrendantis orlaivis atlieka laukimo procedūrą","Procedūra, kuri atliekama, kai artėjimas tūpti negali būti tęsiamas"],"c":[1],"expl":"","hint":""},{"id":"235","q":"Ką reiškia santrumpa “ATIS”?","a":["Automatinis krypties nustatymo įrenginys","Artimojo veikimo pagalbinės navigacijos priemonės","Aerodromo rajono informacijos automatinio perdavimo tarnyba"],"c":[2],"expl":"ATIS (Automatic Terminal Information Service) yra sistema, kuri automatiškai perduoda svarbią informaciją apie oro uostą ir jo aplinką, tokią kaip oro sąlygos, eismo situacija, specialūs pranešimai, kad pilotai galėtų lengviau pasiruošti skrydžiui ar nusileidimui.","hint":""},{"id":"236","q":"Ką reiškia santrumpa “AIP”?","a":["Oro navigacinės informacijos tarnyba","Aerodromo skrydžio informacijos tarnyba","Oro navigacijos informacinis rinkinys"],"c":[2],"expl":"AIP (Aeronautical Information Publication) yra oficialus dokumentas, kuriame pateikiama išsami ir oficiali informacija apie oro navigaciją, oro uostus, taisykles, procedūras ir kt. Tai pagrindinis šaltinis pilotams ir oro eismo valdymo tarnyboms. Atsakymai a ir b neatitinka AIP apibrėžimo.","hint":""},{"id":"237","q":"Ką reiškia santrumpa “CTR”?","a":["Aerodromo eismo zona","Kontroliuojamoji zona","Oro eismo paslaugos (tarnybos)"],"c":[1],"expl":"CTR (Control Zone) yra oro erdvės dalis aplink aerodromą, kurioje vykdomas oro eismo valdymas, siekiant užtikrinti saugų skrydžių pakilimą, leidimąsi ir judėjimą. Tai kontroliuojama erdvė, kuriai taikomi specialūs skrydžių apribojimai.","hint":""},{"id":"238","q":"Ką reiškia santrumpa “ETD”?","a":["Apskaičiuotasis išvykimo laikas arba apskaičiuotasis išvykimas","Apskaičiuotasis praėjęs laikas","Apskaičiuotasis atvykimo laikas arba apskaičiuotasis atvykimas"],"c":[0],"expl":"ETD (Estimated Time of Departure) reiškia numatomą arba apskaičiuotą laiką, kada orlaivis planuoja išvykti iš oro uosto. Atsakymai b ir c nurodo kitus laiko tipus, todėl nėra teisingi.","hint":""},{"id":"239","q":"Ką reiškia santrumpa “NDB”?","a":["Nekryptinis radijo švyturys","Pirminis apžvalgos radaras","Aukšto dažnio visakryptinis radijo švyturys"],"c":[0],"expl":"NDB (Non-Directional Beacon) yra radijo navigacijos priemonė, siunčianti signalą visuose kryptingumo kampuose, kurį orlaivio radionavigacijos įranga gali priimti ir naudoti orientavimuisi.","hint":""},{"id":"240","q":"Ką reiškia santrumpa “TMA”?","a":["Standartinis atvykimas pagal prietaisus","Aerodromo skrydžių valdymo rajonas","Skrydžių informacijos rajonas"],"c":[1],"expl":"TMA (Terminal Control Area) yra oro erdvės dalis aplink oro uostą, kurioje teikiamos skrydžių valdymo paslaugos, siekiant koordinuoti atvykstančius ir išvykstančius orlaivius bei užtikrinti saugumą. Atsakymai a ir c nėra susiję su TMA apibrėžimu.","hint":""},{"id":"241","q":"Ką reiškia santrumpa “ADR”?","a":["Inercinė navigacinė sistema","Paskaičiuotas praėjęs laikas","Konsultacinis maršrutas"],"c":[2],"expl":"ADR (Advisory Route) yra maršrutas, skirtas patarti ar rekomenduoti orlaiviams, dažnai naudojamas siekiant pagerinti eismo srautų valdymą arba užtikrinti efektyvų judėjimą tam tikrose oro erdvės dalyse. Atsakymai a ir b nėra susiję su ADR reikšme.","hint":""},{"id":"242","q":"Ką reiškia frazė “kaip mane girdite”-(how do you read)?","a":["Ar jūs teisingai priėmėte šį pranešimą","Kaip girdite mano pranešimą","Patikrinkite radijo ryšį"],"c":[1],"expl":"Frazė „kaip mane girdite“(how do you read) naudojama radijo ryšyje, kai norima sužinoti, kaip gerai pašnekovas priima ir supranta siunčiamą signalą ar pranešimą. Tai yra būdas įvertinti ryšio kokybę.","hint":""},{"id":"243","q":"Ką reiškia frazė “naujas leidimas”-(recleared)?","a":["Yra pakeitimai paskutiniame leidime, kurį jūs gavote. Pakeistas ankstesnis leidimas arba jo dalis","Patikrinkite ir palyginkite su originalu","Šiuo panaikinami anksčiau duoti leidimai"],"c":[0],"expl":"","hint":""},{"id":"244","q":"Koks laikas naudojamas civilinėje aviacijoje?","a":["Vietinis","Grinvičiaus (UTC)","Vidurio Europos laikas (MET)"],"c":[1],"expl":"Civilinėje aviacijoje visame pasaulyje naudojamas universalusis koordinuotasis laikas (UTC), dar vadinamas Grinvičiaus laiku. Tai užtikrina vienodą laiko apskaitą visose šalyse ir išvengia painiavos, susijusios su vietiniais laikais ar sezoniniais pasikeitimais.","hint":""},{"id":"245","q":"Priežeminio vėjo greičio matavimo vienetai naudojami LR civilinėje aviacijoje:","a":["pėdos","km/val.","mazgai"],"c":[2],"expl":"","hint":""},{"id":"246","q":"Matomumo (RVR) matavimo vienetai ant KTT naudojami LR civilinėje aviacijoje:","a":["kilometrai","metrai","pėdos","mylios"],"c":[1],"expl":"","hint":""},{"id":"247","q":"Vertikalaus matomumo arba debesų pado matavimo vienetai naudojami LR civilinėje aviacijoje:","a":["metrai","pėdos","mazgai"],"c":[1],"expl":"","hint":""},{"id":"248","q":"Orlaivio skrydžio greičio matavimo vienetai naudojami LR civilinėje aviacijoje:","a":["mazgai","m/sek.","mylios/val. (MPH)"],"c":[0],"expl":"","hint":""},{"id":"249","q":"Orlaivio skrydžio aukščio matavimo vienetai naudojami LR civilinėje aviacijoje:","a":["metrai","pėdos","kilometrai"],"c":[1],"expl":"","hint":""},{"id":"250","q":"Kaip pranešamas orlaivio skridimo kursas?","a":["02 - nulis du (du)","20° - du nulis (dvidešimt)","020° - nulis du nulis (nulis dvidešimt)"],"c":[2],"expl":"Orlaivio skrydžio kursas perduodamas trimis skaitmenimis, kad būtų išvengta painiavos. Todėl kursas 20 laipsnių sakomas kaip „nulis du nulis “arba „nulis dvidešimt “.","hint":""},{"id":"251","q":"Kaip galima sutrumpinti orlaivio šaukinį LY - AMB?","a":["LY - MB","...AMB","L - MB"],"c":[2],"expl":"","hint":""},{"id":"252","q":"Keliais skaitmenimis perduodamas laikas (minutėmis)?","a":["04 min. - (nulis keturios)","4 min. - (keturios)","Abu variantai teisingi"],"c":[2],"expl":"Laikas minutėmis dažniausiai perduodamas dviem skaitmenimis, kad būtų išvengta nesusipratimų, pavyzdžiui, „04“ – tai aiškus formatas, kuriame pirmasis skaitmuo reiškia nulį, o antrasis – minutes. Tačiau taip pat leidžiama perduoti vienu skaitmeniu, jei tai yra aišku kontekste („4“– keturios minutės).","hint":""},{"id":"253","q":"Kuris orlaivis pagal sukeliamą valkties turbulenciją yra lengvas (L), jei jo maksimali kilimo masė mažesnė nei..?","a":["5700 kg","7000 kg","7500 kg"],"c":[0],"expl":"ICAO Doc 4444 (PANS-ATM) , 14 skyrius apie oro eismo valdymą ir orlaivių kategorijas, apibrėžia: Lengvas orlaivis (Light aircraft) – orlaivis, kurio maksimalioji kilimo masė yra mažesnė nei 5700 kg (12,500 svarų).","hint":""},{"id":"254","q":"Kaip perduodamas radijo ryšio dažnis?","a":["Kaip nurodo skrydžio vadovas","Kaip nurodyta aeronavigaciniame leidinyje (JEPPESEN arba AIP)","Abu atsakymai teisingi"],"c":[2],"expl":"Radijo ryšio dažnis perduodamas taip, kaip nurodo skrydžio vadovas arba kaip jis pateiktas oficialiuose aeronavigaciniuose leidiniuose, pavyzdžiui, JEPPESEN arba AIP. Abu šie šaltiniai gali būti naudojami, todėl abu atsakymai yra teisingi.","hint":""},{"id":"255","q":"Kada orlaivio įgula gali Aerodromo skrydžių valdymo rajonas į kitą radijo ryšio dažnį?","a":["Bet kada","Skrydžio vadovui nurodžius","Paliekant radijo ryšio zoną"],"c":[1],"expl":"","hint":""},{"id":"256","q":"Kaip nurodoma veikianti KTT...?","a":["Laipsniais","Numeriu","Perduodamas dviem pirmais skaičiais nuo KTT suapvalinto magnetinio kurso"],"c":[2],"expl":"","hint":""},{"id":"257","q":"Kokį kodą orlaivio įgula privalo surinkti nutrūkus radijo ryšiui?","a":["A - 2000","A - 7500","A - 7600"],"c":[2],"expl":"","hint":""},{"id":"258","q":"Kokį kodą privalo surinkti orlaivio įgula esant nesankcionuotam įsikišimui?","a":["A - 7700","A - 7500","A - 7600"],"c":[1],"expl":"","hint":""},{"id":"304","q":"Kokį kodą privalo surinkti orlaivio įgula atsakius įrangai, esant avarinėms sąlygoms arba pavojingai situacijai (nelaimės būsenoje)?","a":["A - 7700","A - 7500","A - 7600"],"c":[0],"expl":"","hint":""},{"id":"305","q":"Kuris tarptautinis aviacinis avarinis dažnis naudojamas avarijos atveju?","a":["500 KHz","121,500 MHz","124,00 MHz"],"c":[1],"expl":"","hint":""},{"id":"306","q":"Kokiais vienetais matuojamas orlaivio vertikalus greitis LR civilinėje aviacijoje?","a":["Pėdos per minutę","m/sek.","Abu atsakymai tesingi"],"c":[2],"expl":"","hint":""},{"id":"307","q":"Kas nustato eiliškumą radijo ryšiui, kai antžeminę radijo stotį kviečia keli orlaiviai vienu metu?","a":["Už ryšio nustatymą atsako radijo stotis, turinti perduoti pranešimą","Eiliškumą ryšiui nustato antžeminė radijo stotis (skrydžių vadovas)","Orlaivis, norintis gauti informaciją apie oro eismą"],"c":[1],"expl":"","hint":""},{"id":"308","q":"Kuriuo atmosferos slėgiu naudojasi galutiniame etape artėjantis tūpti orlaivis kontroliuojamame aerodrome?","a":["MSL","QNE","Aerodromo QFE"],"c":[2],"expl":"Galutiniame etape artėjant tūpti kontroliuojamame aerodrome orlaivis naudoja aerodromo QFE slėgį, kuris yra oro slėgis ties aerodromo lygiu. Tai leidžia pilotui matyti tikrąjį aukštį virš aerodromo paviršiaus, kas svarbu saugiam nusileidimui.","hint":""},{"id":"309","q":"Ką privalo atlikti orlaivio įgula, prieš pradėdama radijo ryšį?","a":["Nuspausti mygtuką","Paklausyti eterį","Patikrinti radijo stoties veikimą"],"c":[1],"expl":"Prieš pradėdama radijo ryšį, įgula privalo paklausyti eterį, kad įsitikintų, jog dažnis yra laisvas ir nėra kitų skrydžių ar pokalbių, kurie gali trukdyti arba būti sutrikdyti. Tai padeda išvengti radijo ryšio sutrikimų ir užtikrina saugų bendravimą. Atsakymai a ir c nėra pagrindiniai prieš pradedant kalbėti.","hint":""},{"id":"310","q":"Kurie terminai naudojami radijo ryšyje?","a":["Draudžiu, leidžiu, supratau, pakartokite","Neprieštarauju, įvykdysiu, patvirtinu, nesupratau","Draudžiu, neleidžiu, pakartokite, negalima"],"c":[0],"expl":"Radijo ryšyje naudojami aiškūs, oficialūs ir standartizuoti terminai, kurie užtikrina vienareikšmį supratimą ir saugumą.","hint":""},{"id":"311","q":"Kurie terminai naudojami radijo ryšyje?","a":["Kilkite, leiskitės","Aukštėkite, žemėkite","Užimkite aukštį, leidžiuosi"],"c":[1],"expl":"Radijo ryšyje naudojami aiškūs, oficialūs ir standartizuoti terminai, kurie užtikrina vienareikšmį supratimą ir saugumą.","hint":""},{"id":"312","q":"Kada naudoti frazę: “esu tiesiojoje ir pasiruošęs tūpti”(on final)?","a":["Artėjimas ir užėjimas tūpti pagal ILS","Artėjant tūpti vizualiai (VST)","Artėjant tūpti pagal radarą (SRA)"],"c":[1],"expl":"Frazė „esu tiesiojoje ir pasiruošęs tūpti “(on final) naudojama, kai pilotas jau yra galutinėje nusileidimo trajektorijoje (tiesiojoje) ir pasiruošęs tūpti, dažniausiai tai taikoma vizualiam tūpimui (VFR). Ši frazė parodo, kad orlaivis yra tiesioginės nusileidimo linijos pradžioje ir pasiruošęs tęsti nusileidimą.","hint":""},{"id":"313","q":"Ką privalo daryti orlaivio įgula, perėjusi į skrydžių vadovo norodytą dažnį ir negalinti užmegzti radijo ryšio?","a":["Pereiti į 121,500 MHz dažnį","Grįžti į prieš tai buvusį dažnį","Surinkti radijo atsakiklyje kodą A - 7600"],"c":[1],"expl":"Jei orlaivio įgula perėjo į skrydžių vadovo nurodytą naują dažnį, bet negali užmegzti ryšio, pirmas veiksmas – grįžti į ankstesnį dažnį, kuriame ryšys buvo sėkmingas, ir informuoti apie problemą. Tai leidžia skrydžių vadovui žinoti apie situaciją ir suteikti tolesnes instrukcijas. Kodas 7600 transponderyje naudojamas kai patiriamas visiškas radijo ryšio sutrikimas, o 121,500 MHz – tai tarptautinis avarinis dažnis, kuris naudojamas kraštutiniais atvejais, bet ne kaip pirmas žingsnis ryšio sutrikimo metu.","hint":""},{"id":"314","q":"Kuriais atvėjais naudojamas žodis “iškviesiu” (stand by)?","a":["Laukite iki jus iškviesiu","Baigtas informacijos perdavimas","Sustokite ir laukite šioje vietoje"],"c":[0],"expl":"","hint":""},{"id":"315","q":"Ką reiškia frazė “ryšio pabaiga” (out)?","a":["Ryšys baigtas, atsakymo nelaukite","Daugiau informacijos, nurodymų neturiu","Jums skirta informacija visa perduota"],"c":[0],"expl":"","hint":""},{"id":"316","q":"Kaip turi būti panaudotas orlaivio šaukinys pakartojimuose?","a":["Orlaivio šaukinys pirmoje vietoje","Orlaivio įgula pakartojimą užbaigia pasakydama savo šaukinį","Informacijos priėmimą patvirtina šaukiniu"],"c":[1],"expl":"","hint":""},{"id":"317","q":"Ką reiškia žodis “pakartokite” (read back)?","a":["Nesupratau jūsų perduotos informacijos","Blogai girdžiu, nepilnai priėmiau","Pakartokite viską arba dalį pranešimo tiksliai, kaip ją priėmėte"],"c":[2],"expl":"","hint":""},{"id":"318","q":"Kokia žodžių rekšmė: “galima, leidžiama” (approved)?","a":["Duodamas leidimas numatytiems veiksmams ir turi tą pačią reikšmę kaip ir leidžiu","Turi tą pačią reikšmę kaip ir leidžiu","Duodamas leidimas numatytiems veiksmams"],"c":[2],"expl":"","hint":""},{"id":"319","q":"Kuriais atvėjais vartojami žodžiai “atšaukiu, anuliuoju” (cancel)?","a":["Laukite naujų nurodymų","Panaikinamas anksčiau perduotas leidimas arba nurodymas","Papildysiu anksčiau duotą nurodymą"],"c":[1],"expl":"","hint":""},{"id":"320","q":"Kokia žodžio reikšmė “prašau” (request)?","a":["Aš norėčiau žinoti..., aš pageidauju gauti...","Aš priėmiau visą jūsų paskutinę informaciją","Praneškite man šią informaciją"],"c":[0],"expl":"","hint":""},{"id":"321","q":"Kokius veiksmus suteikia teisę vykdyti žodis “leista” (cleared)?","a":["Leidžiu atlikti veiksmus nurodytom sąlygom","Užimti KTT..., kilti, tūpti, keisti aukštį, kursą, greitį","Paleisti variklius, pradėti riedėti,keisti kursą"],"c":[0],"expl":"","hint":""},{"id":"322","q":"Kuriuos orlaivio įgulos veiksmus apriboja žodis “draudžiu\" (negative)?","a":["Vykdyti skrydžio vadovo nurodymus","Užimti KTT..., kilti, tūpti, keisti skrydžio aukštį","Tai yra neteisinga, leidimas neduodamas"],"c":[2],"expl":"","hint":""},{"id":"323","q":"Kokiais atvėjais vartojamas žodis “supratau” (roger)?","a":["Kai kuriuos leidimus ir nurodymus patvirtinti","Priėmiau jūsų visą paskutinę informaciją","Abu atsakymai teisingi"],"c":[2],"expl":"","hint":""},{"id":"324","q":"Kokia frazės reikšmė “ryšys su...” (contact)?","a":["Nustatyti radijo ryšį su ...","Patikrinkite radijo ryšio kokybę su ...","Galite suderinti veiksmus ..."],"c":[0],"expl":"","hint":""},{"id":"325","q":"Kokia eilės tvarka orlaivio įgula praneša apie savo buvimo vietą?","a":["Buvimo vieta, laikas, skrydžio maršrutas, šaukinys","Orlaivio šaukinys, buvimo vieta, laikas, aukštis, kitas punktas ir laikas","Laikas, vieta, šaukinys, aukðtis"],"c":[1],"expl":"","hint":""},{"id":"326","q":"Kuriais atvejais naudojama frazė “radijo ryšį baigiau” (over)?","a":["Priėmiau visą jūsų paskutinę informaciją","Mano perdavimas baigtas ir aš laukiu atsakymo","Radijo ryšio patikrinimas baigtas"],"c":[1],"expl":"","hint":""},{"id":"327","q":"Kokie įgulos veiksmai kontroliuojamame aerodrome, jeigu nebuvo gauta leidimo tūpti?","a":["Vykdo nuėjimą į antrą ratą (pakartotiną artėjimą)","Esant geram matomumui, vykdo savarankišką tūpimą","Abu atsakymai teisingi"],"c":[0],"expl":"","hint":""},{"id":"328","q":"Jei skrydžių vadovo nurodymai kelia grėsmę skrydžio saugai, įgula privalo:","a":["vykdyti visus skrydžių vadovo nurodymus","įgulos vadas priima savarankišką sprendimą","užklausti pakeitimo duotam nurodymui"],"c":[2],"expl":"","hint":""},{"id":"329","q":"Kokiais atvėjais vartojamas žodis “skubiai” (immediately)?","a":["Kai orlaivio įgula nenori vykdyti skrydžio laukimo zonoje","Kai veiksmai saugai užtikrinti turi būti pradėti nedelsiant","Jūs nukrypote nuo nustatyto oro kelio, skubiai užimkite reikiamą skridimo kursą"],"c":[1],"expl":"","hint":""},{"id":"330","q":"Kokiems tikslams skrydžių vadovas duoda orlaiviui nurodymą “vykdykite orbita” arba posūkis 360°?","a":["Užsilaikymui arba saugiam intervalui užtikrinti","Orlaivio greičiui sumažinti","Orlaivio aukščiui sumažinti"],"c":[0],"expl":"","hint":""},{"id":"331","q":"Kokiais atvėjais naudojami žodžiai “pataisa, taisau-(correction)?","a":["Padaryta klaida. Teisingai yra taip...","Kartoju dėl aiškumo ar pabrėždamas","Šiuo panaikinami anksčiau perduoti leidimai, nurodymai"],"c":[0],"expl":"","hint":""},{"id":"332","q":"Kokia žodžio “klausytis” (monitor) prasmė?","a":["Pereiti į radijo ryšį su kitu korespondentu","Klausyti nurodytą radijo ryšio dažnį","Paklausiau nurodytą dažnį, informaciją priėmiau"],"c":[1],"expl":"","hint":""},{"id":"333","q":"Žodžių eiliškumo tvarka įgulai tikrinant radijo ryšį:","a":["savo šaukinys, užklausimas “kaip mane girdite”","radijo stoties šaukinys, orlaivio šaukinys, “ryšio patikrinimas”","nustatyti radijo ryšio dažnį ir paklausti “kaip girdite”"],"c":[1],"expl":"","hint":""},{"id":"334","q":"Skrydžių vadovo atsakymai orlaivio įgulai, tikrinančiai radijo ryšį:","a":["savo šaukinys, ryšio kokybės įvertinimas","orlaivio šaukinys, ryšio kokybės įvertinimas, savo šaukinys","šaukinys ir radijo ryšio kokybė"],"c":[1],"expl":"","hint":""},{"id":"335","q":"Kokiems tikslams skirti “TIBA” pranešimai?","a":["Orlaiviams vykdantiems skrydį nekontroliuojamoje oro erdvėje","Orlaivio įgulos pranešimui apie buvimo vietą","Vykdančių skrydį nekontroliuojamoje oro erdvėje tarpusavio informavimui apie skridimą ir orlaivio įgulos pranešimui apie savo veiksmus"],"c":[2],"expl":"TIBA (Traffic Information Broadcast by Aircraft) pranešimai yra skirti orlaiviams, vykdantiems skrydį nekontroliuojamoje oro erdvėje, tarpusavio informavimui apie skridimą ir orlaivio įgulos pranešimui apie savo veiksmus. Šie pranešimai padeda užtikrinti saugų skrydį, kai nėra skrydžių valdymo tarnybos, nes leidžia orlaivių įguloms žinoti apie kitų orlaivių buvimo vietą, kryptį ir ketinimus.","hint":""},{"id":"336","q":"Kaip įgula prašo paleisti orlaivio variklius?","a":["...aikštelė, prašau paleisti variklius","...šaukinys, skrydžio planas pateiktas","...orlaivio šaukinys, ...aikštelė, prašau paleisti variklius, ATIS informacija “...”"],"c":[2],"expl":"","hint":""},{"id":"337","q":"Skrydžių vadovo atsakymai orlaivio įgulai , prašančiai paleisti variklius:","a":["...šaukinys, variklius paleisti galima, leista-(approved), QNH...","...šaukinys, variklius paleisti leista-(cleared), QNH...","šaukinys, planuokite išvykmo laiką..."],"c":[1],"expl":"","hint":""},{"id":"338","q":"Kokią informaciją skrydžio vadovas pateikia orlaivio įgulai prieš pradedant riedėjimą?","a":["Riedėjimo maršrutą, veikiantį KTT...; QNH","Riedėjimo maršrutą, veikiantį KTT..., QNH... ir išėjimo sąlygas iš aerodromo","Riedėjimo maršrutą, nurodymą apie veikiančio KTT ir jo užėmimą, QNH... ir išėjimo sąlygas iš aerodromo, vėjo duomenis"],"c":[0],"expl":"","hint":""},{"id":"339","q":"Kuris skrydžių vadovo nurodymas leidžia orlaivio įgulai užimti vykdomąjį?","a":["Laukti prie KTT, atlaisvinus galėsite užimti","... orlaivio šaukinys, leidžiu vykdomąjį startą KTT...","Leidžiu užimti KTT"],"c":[2],"expl":"","hint":""},{"id":"340","q":"Kaip turi atsakyti riedančio orlaivio įgula gavusi konkretų nurodymą “laukti”?","a":["Supratau","Sustojau ir laukiu","Laukiu prie..."],"c":[2],"expl":"","hint":""},{"id":"341","q":"Kuri skrydžų vadovo komanda orlaivio įgulai duoda teisę pakilti (startuoti)?","a":["Leidžiu vykdomąjį KTT...","Leidžiu kilti KTT...","Kilkite su kursu..."],"c":[1],"expl":"","hint":""},{"id":"342","q":"Kaip orlaivio įgula pakartoja gautą leidimą kilti?","a":[".....(šaukinys) kylu (startuoju)","Vykdau pakilimą","Leista kilti nuo KTT..."],"c":[0],"expl":"","hint":""},{"id":"343","q":"Ką turi pranešti orlaivio įgula esanti vykdomąjame KTT... ir turinti problemų dėl pakilimo?","a":["atlaisvinu KTT...","pakilimas užsilaiko ..... minutes","pakilimas po ..... minučių",".....priežastis ir tolimesni veiksmai"],"c":[3],"expl":"","hint":""},{"id":"344","q":"Pakilusi orlaivio įgula praneša skrendant pagal VST (VFR):","a":["kairiu (dešiniu) posūkiu","pakilau (..... minučių) aukštėjame iki...","prašau užimti ..... aukštį"],"c":[2],"expl":"","hint":""},{"id":"345","q":"Skrydžių vadovo nurodymai orlaiviui, vizualiai artėjančiam tūpti:","a":["KTT... ir vėjo duomenis","QNH... ir vėjo duomenis","KTT..,vėjo duomenys, QNH..."],"c":[2],"expl":"","hint":""},{"id":"346","q":"Kokioje oro erdvėje naudojamas “TIBA” radijo ryšio pranešimas?","a":["Kontroliuojamoje oro erdvėje","Nekontroliuojamoje oro erdvėje","Rezervuotojoje oro erdvėje"],"c":[1],"expl":"TIBA (Traffic Information Broadcast by Aircraft) pranešimai yra skirti orlaiviams, vykdantiems skrydį nekontroliuojamoje oro erdvėje, tarpusavio informavimui apie skridimą ir orlaivio įgulos pranešimui apie savo veiksmus. Šie pranešimai padeda užtikrinti saugų skrydį, kai nėra skrydžių valdymo tarnybos, nes leidžia orlaivių įguloms žinoti apie kitų orlaivių buvimo vietą, kryptį ir ketinimus.","hint":""},{"id":"347","q":"Kokiame aeronavigaciniame dokumente teikiama informacija apie laikinus radionavigacinės įrangos pasikeitimus, apribojimus ir kitus klausimus, susijusius su skrydžių sauga?","a":["NOTAM","SNOWTAM","AIP"],"c":[0],"expl":"NOTAM – tai pranešimas, kuriame skelbiama laikina informacija, susijusi su skrydžių sauga, pavyzdžiui, apie radionavigacinės įrangos pokyčius, apribojimus ar kitus svarbius veiksnius, kurie gali turėti įtakos skrydžiams ir dar nėra įtraukti į oficialius leidinius.","hint":""},{"id":"502","q":"Skrydžių vadovo nurodymai orlaivio įgulai apie išvykimo sąlygas iš kontroliuojamos aerodromo zonos skrendant VST -( VFR):","a":["pakilę per ... punktą, aukštėkite iki ...","pakilę su kursu skriskite maršrutu ...","kairiu (dešiniu) posūkiu per ... punktą maršrutu ..."],"c":[0],"expl":"","hint":""},{"id":"503","q":"Kurią reikšmę atitinka pranešimas apie savo buvimo vietą “artimas užėjimas” (short final)?","a":["Esant tiesiojoje 7 km (4 NM)","Esant tiesiojoje 5 km (3 NM)","Esant tiesiojoje 10 km (5 NM)"],"c":[1],"expl":"","hint":""},{"id":"504","q":"Koks skrydžių vadovo nurodymas orlaivio įgulai suteikia leidimą užimti veikiančią KTT...?","a":["Leidžiu","Leidžiu KTT... ir pakilimą","Užimkite vykdomąjį KTT...","Teisingi b) ir c)"],"c":[3],"expl":"","hint":""},{"id":"505","q":"Koks skrydžių vadovo nurodymas įpareigoja orlaivio įgulą laukti parengtiniame starte?","a":["Sustoti ir laukti esamoje vietoje","Draudžiu užimti KTT...","a) ir b) teisingi"],"c":[2],"expl":"","hint":""},{"id":"506","q":"Kokia skrydžių vadovo komanda orlaivio įgulai suteikia teisę kilti?","a":["Leidžiu","Leidžiu kilti KTT...","Kilkite su kursu ..."],"c":[1],"expl":"","hint":""},{"id":"507","q":"Kaip orlaivio įgula praneša apie užimtą skrydžio aukštį skrendant pagal VST (VFR)?","a":["Užėmiau ... metrų aukštį","Užėmiau ... pėdų aukštį pagal QNH ...","Skrydžio lygis 2500 pėdų"],"c":[1],"expl":"Skrendant pagal vizualiųjų skrydžių taisykles (VFR), aukštis pranešamas pėdomis ir kartu nurodomas QNH, nes tai yra vietinis oro slėgis, pagal kurį skaičiuojamas tikras aukštis virš jūros lygio.","hint":""},{"id":"508","q":"Skrydžių vadovas, duodamas nurodymą orlaivio įgulai pakeisti skrydžio kursą, nurodo...:","a":["... (šaukinys) pakeiskite kursą į ... skridimo vietą","... (šaukinys)... (priežastis), keiskite kursą ...","...(šaukinys) pasukite į kairę (dešinę) ... laipsnių","teisingi visi variantai"],"c":[3],"expl":"","hint":""},{"id":"509","q":"Kokiu dažniu orlaivio įgula turi pranešti apie nelaimės arba avarinę būklę?","a":["Dažniu ant kurio palaikomas radijo ryšys","Dažniu, kuriuo palaikomas radijo ryšys arba dažniu 121,500 MHz","Tik dažniu 121,500 MHz"],"c":[1],"expl":"","hint":""},{"id":"510","q":"Skrydžių vadovo nurodymai orlaivio įgulai apie nuėjimą į antrą ratą (pakartotinam artėjimui):","a":["tūpti draudžiu, vykdykite pakartotiną artėjimą","pakartotinas skridimas aerodromo ratu","tūpti draudžiu, vykdykite pakartotiną artėjimą ( nueikite į antrą ratą )","teisingi visi variantai"],"c":[3],"expl":"","hint":""},{"id":"511","q":"Kaip skrydžių vadovas nurodo keičiant leidimą?","a":["Veikite savo nuožiūra","Duodu naują nurodymą","Duodu naują leidimą"],"c":[2],"expl":"","hint":""},{"id":"512","q":"Kokius skrydžio vadovo leidimus orlaivio įgula privalo pakartoti?","a":["Leidimą užimti KTT..., kilti, pakeisti dažnį, kursą","Leidimą tūpti, kilti, užimti KTT..., pakeisti aukštį, keisti kursą, išeiti į kontroliuojamą oro erdvę","Įeiti į skridimo ratą, pakeisti aukštį, QNH"],"c":[1],"expl":"","hint":""},{"id":"513","q":"Kaip CTR - (aerodromo zonos) skrydžių vadovas duoda orlaivio įgulai artėjimo tūpti sąlygas?","a":["Darbinę KTT... ir artėjimo sąlygas","Darbinę KTT... ir QNH...","Darbinę KTT..., QNH... artėjimo sąlygas ir vėjo duomenis"],"c":[2],"expl":"Skrydžių vadovas CTR zonoje privalo pateikti visas svarbias sąlygas orlaivio įgulai – ne tik darbinį kilimo-tūpimo taką, bet ir oro slėgį (QNH), artėjimo sąlygas bei vėjo informaciją. Tai užtikrina saugų ir efektyvų artėjimą ir tūpimą, nes įgula turi visus reikalingus duomenis tinkamam sprendimui priimti.","hint":""},{"id":"514","q":"Skrydžio vadovo nurodymai orlaivio įgulai po tūpimo kontroliuojamame aerodrome:","a":["atlaisvinkite KTT riedėjimo taku “...”, maršrutas “..”, aikštelė Nr...","nutūpėte ... min. atlaisvinkite KTT pirmu taku iš kairės (dešinės)","riedėkite į stovėjimo aikštelę Nr..."],"c":[0],"expl":"","hint":""},{"id":"515","q":"Skrendama kontroliuojamoje oro erdvėje pagal VST -(VFR). Orlaivio įgulos veiksmai atsakius radijo ryšiui:","a":["Tęsiamas skrydis vizualiomis meteorologinėmis sąlygomis","Tūpiama artimiausiame atitinkančiame aerodrome ir operatyvia ryšio priemone pranešama apie nutūpimą atitinkamai skrydžių valdymo tarnybai","a) ir b) teisingi"],"c":[1],"expl":"","hint":""},{"id":"516","q":"Ar orlaiviams, paliekantiems kontroliuojamą oro erdvę, nurodomi išėjimo taškai?","a":["Nurodomi","Nenurodomi","Nurodomi pagal aplinkybes"],"c":[2],"expl":"Išėjimo taškai orlaiviams, paliekantiems kontroliuojamą oro erdvę, nurodomi ne visuomet, o priklausomai nuo situacijos. Kartais dėl saugumo ar eismo valdymo reikalavimų skrydžių vadovas gali pateikti konkrečius išėjimo taškus, o kartais tai nėra būtina. Todėl sprendimas nurodyti išėjimo taškus priklauso nuo skrydžio sąlygų ir oro eismo situacijos.","hint":""},{"id":"517","q":"Kokie įgulos veiksmai, gavus skrydžio vadovo draudimą tūpti?","a":["Esant tiesiojoje užsiprašo leidimo tūpti","Nueina į antrą ratą, vykdo pakartotiną artėjimą","Esant geram matomumui savarankiškai tūpia"],"c":[1],"expl":"","hint":""},{"id":"518","q":"Skubos pranešimas - “PAN, PAN, PAN” turi pirmenybę:","a":["visų kitų pranešimų atžvilgiu, išskyrus nelaimės pranešimą","visų kitų pranešimų atžvilgiu","a) ir b) teisingi"],"c":[0],"expl":"PAN, PAN, PAN“ yra skubos pranešimas, kuris turi pirmenybę prieš visus kitus radijo pranešimus, išskyrus nelaimės („MAYDAY“) pranešimus, kurie visada turi aukščiausią prioritetą.","hint":""},{"id":"519","q":"Kokią reikšmę turi “PAN, PAN, PAN”?","a":["Nesankcionuotas įsikišimas į įgulos veiksmus","Būsena, susijusi su orlaivio arba asmenų esančių jame, kuriems dar nereikalinga neatidėliotina pagalba","Būvis, kurio metu esti rimtas ir/arba neišvengiamas pavojus ir būtina neatidėliotina pagalba"],"c":[1],"expl":"","hint":""},{"id":"520","q":"Koką reikšmę turi “MAYDAY, MAYDAY, MAYDAY?","a":["Būvis, kurio metu yra rimtas ir/arba neišvengiamas pavojus ir būtina neatidėliotina pagalba","Būsena, susijusi su orlaivio arba asmenų, esančių jame, kuriems dar nereikalinga neatidėliotina pagalba","Esant stiprios blaškos zonoje"],"c":[0],"expl":"","hint":""},{"id":"521","q":"Kokiais atvėjais gali būti panaudotas terminas “perduodu aklai”- (blind)?","a":["Kai negali užmegzti radijo ryšio dėl imtuvo gedimo","Kitų radijo stočių suteikiamą paramą, retransliuojant pranešimą","Perduodant skrydžių vadovo leidimus, nurodymus, bei meteo informaciją"],"c":[0],"expl":"Terminas „perduodu aklai“ (blind) naudojamas, kai perduodi pranešimą, bet nėra galimybės patvirtinti, ar jį gavo dėl ryšio sutrikimų, pavyzdžiui, imtuvo gedimo arba prasto ryšio.","hint":""},{"id":"522","q":"Altitudė arba absoliutusis aukštis tai yra?","a":["Lygio, taško ar objekto, laikomo tašku, vertikalus atstumas išmatuotas nuo standartinio slėgio","Lygio, taško ar objekto, laikomo tašku, vertikalus atstumas išmatuotas nuo žemės","Lygio, taško ar objekto, laikomo tašku, vertikalus atstumas išmatuotas nuo vidutinio jūros lygio (MSL)"],"c":[2],"expl":"","hint":""},{"id":"523","q":"FL 195 reiškia:","a":["Draudžiamą sektorių ICAO žemėlapyje","Flight level (skrydžio aukštį) 19į00 pėdų nuo standartinio slėgio","Flight level (skrydžio aukštį) 1950 pėdų virš vidutinio jūros lygio"],"c":[1],"expl":"1 FL = 100ft 10FL= 1000ft","hint":""},{"id":"524","q":"Ką reiškia santrumpa VMC?","a":["Inercinė navigacinė sistema","Paskaičiuotas praėjęs laikas","Vizualiosios meteorologinės sąlygos"],"c":[2],"expl":"VMC (Visual Meteorological Conditions) reiškia oro sąlygas, kai matomumas ir debesuotumas leidžia pilotui skristi pagal vizualias skrydžių taisykles (VFR). Tai svarbu, nes esant VMC pilotas gali orientuotis pagal žemės orientyrus be instrumentų pagalbos.","hint":""},{"id":"525","q":"Kaip skrydžių vadovas nurodo keičiant leidimą?","a":["Veikite savo nuožiūra","Duodu naują leidimą"],"c":[1],"expl":"","hint":""},{"id":"526","q":"Kas yra FIS?","a":["Skrydžių informacijos centras","Skrydžių informacijos regionas","Skrydžių informacijos paslauga"],"c":[2],"expl":"FIS (Flight Information Service) yra paslauga, teikiama pilotams siekiant suteikti aktualią informaciją apie oro sąlygas, eismo situaciją, navigacijos ribojimus ir pan., kad būtų užtikrintas saugus skrydis.","hint":""},{"id":"527","q":"Keliais skaitmenimis perduodamas laikas minutėmis?","a":["4 min. - (keturios)","04 min. - (nulis keturios) arba 4 min. (keturios)","04 min. - (nulis keturios)"],"c":[1],"expl":"Laikas minutėmis dažniausiai perduodamas dviem skaitmenimis, kad būtų išvengta nesusipratimų, pavyzdžiui, „04“– tai aiškus formatas, kuriame pirmasis skaitmuo reiškia nulį, o antrasis – minutes. Tačiau taip pat leidžiama perduoti vienu skaitmeniu, jei tai yra aišku kontekste („4“– keturios minutės).","hint":""},{"id":"528","q":"Oro eismas tai?","a":["Visas judėjimas aerodromo manevravimo lauke ir visi skrydžiai arti aerodromo","Visi skrendantys ir aerodromo manevravimo lauke judantys orlaiviai","Visi skrendantys orlaiviai"],"c":[1],"expl":"Oro eismas apima visą orlaivių judėjimą ore bei judėjimą manevravimo lauke, t.y. tiek skrydžius, tiek judėjimą ant aerodromo paviršiaus.","hint":""},{"id":"529","q":"Skaičiai, kurie turi dešimtąsias ir šimtąsias dalis, perduodami po sveikųjų skaičių pasakant kokį žodį?","a":["\"Kabliataškis\"","\"Taškas\"","\"Kablelis\""],"c":[2],"expl":"","hint":""}]},"Skrydžių charakteristikos ir planavimas":{"slug":"skrydziu-charakteristikos-ir-planavimas","questions":[{"id":"8","q":"Kurie iš nurodytų faktorių nedaro įtakos OL skrydžio charakteristikoms?","a":["Slėgis","temperatūra","matomumas"],"c":[2],"expl":"Slėgis ir temperatūra tiesiogiai veikia oro tankį, kuris lemia orlaivio keliamąją galią, variklio efektyvumą ir aerodinamines savybes. Matomumas, nors svarbus saugiam skrydžiui ir navigacijai, tačiau neturi tiesioginės įtakos orlaivio skrydžio charakteristikoms.","hint":""},{"id":"12","q":"Ar turi teisę aviacijos saugumo patrulis sustabdyti riedantį OL?","a":["turi","neturi"],"c":[1],"expl":"","hint":""},{"id":"13","q":"Pagal kokį slėgį matuojamas absoliutus skrydžio aukštis žemiau perėjimo lygio (transmition level)?","a":["pagal QNE","pagal QFE","pagal QNH"],"c":[2],"expl":"","hint":""},{"id":"14","q":"Kai visos OL veikiančios jėgos viena kitą atsveria:","a":["OL aukštėja","OL skrenda horizontaliai pastoviu greičiu","OL skrenda horizontaliai didėjančiu greičiu"],"c":[1],"expl":"","hint":""},{"id":"15","q":"Stabdymo ruožas (stopway) gali būti naudojamas:","a":["avariniai OL eksploatacijai","kaip alternatyvus KTT","Orlaivį sustabdyti už KTT ribų jo nepažeidus"],"c":[2],"expl":"","hint":""},{"id":"16","q":"OL pakilimo distancija susideda iš:","a":["distancijos įsibėgėjimo žemėje","distancijos nuo OL įsibėgėjimo pradžios iki bus pasiektas kreiserinis lygis","abu teisingi"],"c":[1],"expl":"","hint":""},{"id":"17","q":"Nepririštas krovinys stabdomame OL juda:","a":["į priekį","atgal","žemyn"],"c":[0],"expl":"Stabdant orlaivį, veikia inercija – nepririštas krovinys dėl savo judėjimo noro tęsia judėjimą ta pačia kryptimi , kuria judėjo orlaivis prieš stabdymą. Todėl jis juda į priekį , net jei pats orlaivis lėtėja. Tai pavojinga, todėl visi kroviniai turi būti tvirtai pritvirtinti","hint":""},{"id":"18","q":"Virškrova OL kilimo ir tūpimo distanciją:","a":["padidina","sumažina","įtakos neturi"],"c":[0],"expl":"Virškrova reiškia didesnį nei įprasta orlaivio svorį. Didesnis svoris reikalauja daugiau jėgos pakilimui, padidina riedėjimo laiką, taip pat padidina stabdymo kelią tūpimo metu. Todėl kilimo ir tūpimo distancija pailgėja.","hint":""},{"id":"19","q":"Virškrova OL atitrūkimo greitį:","a":["mažina","padidina","įtakos neturi"],"c":[1],"expl":"Atitrūkimo greitis (greitis, kuriuo orlaivis atsiplėšia nuo žemės) priklauso nuo svorio. Kuo orlaivis sunkesnis, tuo didesnė keliamoji jėga reikalinga pakilimui. Kad ją pasiektų, reikia didesnio oro srauto aplink sparnus – tai reiškia, kad reikia didesnio greičio.","hint":""},{"id":"20","q":"Virškrova OL skrydžio nuotolį ir degalų naudojimą:","a":["OL skrydžio nuotolį didina, o degalų naudojimą mažina","OL skrydžio nuotolį sumažina, o degalų naudojimą padidina","įtakos neturi"],"c":[0],"expl":"Virškrova padidina pasipriešinimą ir variklio apkrovą, todėl orlaivis sunaudoja daugiau degalų. Didesnis degalų sunaudojimas trumpina skrydžio nuotolį. Be to, sunkesniam orlaiviui reikia daugiau traukos norint išlaikyti skrydį.","hint":""},{"id":"21","q":"Koks oras tankesnis?","a":["šiltesnis","karštas","šaltesnis"],"c":[2],"expl":"Šaltesnis oras yra tankesnis, nes molekulės yra arčiau viena kitos. Dėl to oras sveria daugiau viename tūryje ir turi didesnį tankį","hint":""},{"id":"22","q":"Kokios eksploatacijos sąlygos gali sukelti OL konstrukcijos pažeidimus ?","a":["leistinų greičių viršijimas, perkrovų viršinimas","grubus tūpimas, perkrova","visi atsakymai teisingi"],"c":[2],"expl":"Leistino greičio viršijimas, perkrovų viršijimas ir grubus tūpimas gali sukelti dideles jėgas, kurios pažeidžia orlaivio konstrukciją. Todėl visi šie veiksniai yra pavojingi ir gali lemti konstrukcijos pažeidimus.","hint":""},{"id":"23","q":"Sukimo momentas yra:","a":["Jėga x petys","Jėga x 9,8m/s","Greitis x petys"],"c":[0],"expl":"","hint":""},{"id":"24","q":"Kai kūnas A greičiu 100kt ir kūnas B greičiu 150kt lygiagrečiai priešiniais kursais artėja vienas prie kito, jų santykinis greitis yra:","a":["50 kt","15000 kt","250 kt"],"c":[2],"expl":"Kai du kūnai juda vienas kitam priešinga kryptimi , jų santykinis greitis yra jų greičių suma . 100 kt + 150 kt = 250 kt.","hint":""},{"id":"25","q":"Visas OL svoris yra suma svorių:","a":["konstrukcijos elementų ir įrangos","b)keleivio ir krovinio","degalų","visi teisingi"],"c":[3],"expl":"","hint":""},{"id":"26","q":"Žemėje visą OL svorį laiko:","a":["važiuoklė","konstrukcija","sparnai"],"c":[0],"expl":"","hint":""},{"id":"27","q":"Skirtumas tarp leistinų skrydžio greičių – didžiausio ir mažiausio, vadinamas","a":["Greičių diapazonas","Greičių poliarė","Greičių distancija"],"c":[0],"expl":"","hint":""},{"id":"28","q":"Kalbant apie OL degalus, „endurance“ reiškia:","a":["laiką, kurį OL gali išbūti ore, atsižvelgiant į turimą degalų kiekį","OL valandinę degalų sąnaudą","OL degalų talpą"],"c":[0],"expl":"","hint":""},{"id":"29","q":"Po 16 min. skrydžio TAS 100 kt greičiu esant nugarinei 20 kt vėjo dedamajai jūs turite grįžti į išvykimo aerodromą. Jūs atvyksite po:","a":["30 min.","24 min.","35 min."],"c":[1],"expl":"Į priekį skrendant buvo nugarinis vėjas, todėl greitis žemės atžvilgiu buvo 100 + 20 = 120 kt. Per 16 min (0,267 val.) orlaivis nuskrido 120 × 0,267 ≈ 32 NM. Grįžtant vėjas tampa priešinis, tad grįžimo greitis žemės atžvilgiu: 100 − 20 = 80 kt. Laikas grįžti: 32 ÷ 80 = 0,4 val. = 24 min.","hint":""},{"id":"30","q":"Aukštesnė oro temperatūra:","a":["kopimo galimybėms įtakos neturi","sumažina kopimo kampą, bet padidina spartą","sumažina ir kopimo spartą ir kampą"],"c":[],"expl":"Aukštesnė oro temperatūra sumažina oro tankį. Mažesnis oro tankis reiškia, kad: Variklis generuoja mažiau galios (mažiau deguonies degimui), sraigtas tampa mažiau efektyvus (mažiau oro masės \"stumti\"), Sumažėja keliamoji jėga (sparnai gauna mažiau oro dalelių vienam plotui). Dėl to: Kopimo sparta mažėja (OL pakyla lėčiau per laiko vienetą), Kopimo kampas mažėja (OL pakyla lėčiau horizontalaus atstumo atžvilgiu).","hint":""},{"id":"31","q":"Kaip RWY nuolydis įtakoja kilimo masę jei kiti faktoriai nesikeičia ?","a":["mažina","didina","neturi įtakos"],"c":[1],"expl":"Kai pakilimo tako (RWY) nuolydis yra žemyn (neigiamas nuolydis), orlaiviui lengviau įsibėgėti, todėl galima kilti su didesne mase. Jei įkalnė– įsibėgėjimas lėtesnis, todėl didelė kilimo masė turi būti mažesnė.","hint":""},{"id":"32","q":"Kilimo-tūpimo takas, kurio magnetinė kryptis yra 273° žymimas taip:","a":["RWY 270","RWY 27","RWY 02"],"c":[1],"expl":"Kilimo-tūpimo takai žymimi suapvalinus jų magnetinę kryptį dešimtims laipsnių be paskutinio skaičiaus.","hint":""},{"id":"33","q":"Kilimo-tūpimo takas, kurio magnetinė kryptis yra 073° žymimas taip:","a":["RWY 07","RWY 073","RWY 06"],"c":[],"expl":"Kilimo-tūpimo takai žymimi suapvalinus jų magnetinę kryptį dešimtims laipsnių be paskutinio skaičiaus .","hint":""},{"id":"34","q":"Kai aerodromo kilimo-tūpimo tako kursas yra 153°, priešingas kursas paskaičiuojamas taip:","a":["153- 180","153+180","153+360"],"c":[1],"expl":"Priešingas kursas (angl. reciprocal heading) apskaičiuojamas pridedant arba atimant 180° nuo pradinio kurso. Jeigu gautas skaičius viršija 360°, tiesiog atimame 360°.","hint":""},{"id":"35","q":"Kai aerodromo kilimo-tūpimo tako kursas yra 353°, priešingas kursas paskaičiuojamas taip:","a":["353- 180","353+ 180","353- 360"],"c":[0],"expl":"Priešingas kursas (angl. reciprocal heading) apskaičiuojamas pridedant arba atimant 180° nuo pradinio kurso. Jeigu gautas skaičius viršija 360°, tiesiog atimame 360°.","hint":""},{"id":"36","q":"Lėktuvui nusileidus atsarginiame aerodrome, pilotas apie tai paskirties aerodromo skrydžių valdymo tarnybai privalo pranešti per (buvo duotas skrydžio planas):","a":["20min.","10 min.","30 min."],"c":[2],"expl":"","hint":""},{"id":"37","q":"Reikiamas OL pakilti įsibėgėjimo ilgis didėja, jeigu:","a":["Jei kilimo takas padengtas pliure","Jei kilimo takas padengtas pliure ir kylama pavėjui","Kilimo takas turi nuokalnę. Tai sumažina sparno atakos kampą","Sumažinama kilimo masė ir kylama pavėjui"],"c":[1],"expl":"Pakilimo įsibėgėjimo ilgis padidėja, kai: Padidėja riedėjimo pasipriešinimas (pvz., takas padengtas pliure – vandeniu, purvu, sniegu); Kylama pavėjui , nes tai padidina realų atitrūkimo greitį žemės atžvilgiu.","hint":""},{"id":"38","q":"Ką pilotas privalo pirmiausiai atlikti sutrikus variklio darbui iki V1 kylant?","a":["Nutraukti kilimą, sumažinti variklio trauką","įjungti aerodinaminius stabdžius ir keliamosios jėgos nutraukėjus (spoilerius","pilnai nuspausti stabdžius","įjungti variklio atbulinę trauką"],"c":[0],"expl":"Iki V1 greičio (sprendimo greičio) pilotas turi būti pasirengęs nutraukti kilimą bet kokio rimto gedimo atveju , pavyzdžiui, variklio sutrikimo. Pirmas veiksmas – nutraukti kilimą ir sumažinti trauką , kad būtų galima saugiai stabdyti orlaivį likusioje tako dalyje. V1 yra ta riba, po kurios kilimas turi būti tęsiamas net ir sugedus varikliui.","hint":""},{"id":"39","q":"OL kyla nuo kilimo tako, kuris padengtas 5mm šlapio sniego sluoksniu. Jo kilimo distancija","a":["sumažės, jei pilnai atlenkti užsparniai","pailgės","neturi įtakos"],"c":[1],"expl":"Pakilimo įsibėgėjimo ilgis padidėja, kai: Padidėja riedėjimo pasipriešinimas (pvz., takas padengtas pliure – vandeniu, purvu, sniegu).","hint":""},{"id":"40","q":"Kokiame aukštyje galima vizualiai skristi virš gyvenamųjų vietovių:","a":["ne mažesniame negu 2000 ft aukštyje","ne mažesniame negu 1000 ft aukštyje virš aukščiausios kliūties","aukštyje, iš kurio išjungus variklį lėktuvas nusklęs už gyvenamosios vietovės, bet ne mažesniame kaip 1000 ft. (300m) aukštyje."],"c":[0,2],"expl":"","hint":""},{"id":"41","q":"Centruotei nustatyti naudojama nulinė atskaita – tai:","a":["lėktuvo gamintojo nustatytas taškas lėktuvo išilginėje ašyje, bet būtinai lėktuvo viduje (tarp lėktuvo priekinės dalies ir uodegos)","lėktuvo gamintojo nustatytas taškas lėktuvo išilginėje ašyje, bet nebūtinai tarp lėktuvo priekinės dalies ir uodegos.","lėktuvo gamintojo nustatytas taškas lėktuvo išilginėje ašyje, esantis tarp lėktuvo priekio."],"c":[1],"expl":"Nulinė atskaita (angl. datum) yra taškas , nuo kurio matuojamos visų svorio komponentų sukimo momentai. Ji nebūtinai turi būti pačiame orlaivio viduje – gamintojas ją gali nustatyti bet kurioje vietoje lėktuvo išilginėje ašyje, net ir už lėktuvo nosies ribų, kad skaičiavimai būtų paprastesni.","hint":""},{"id":"42","q":"Aukštėjant, didėjantis su aukščiu priešinis vėjas, lyginant su štiliumi (prietaisinis greitis pastovus):","a":["aukštėjimo spartai poveikio neturi","aukštėjimo spartą sumažina","aukštėjimo spartą padidina"],"c":[0],"expl":"Aukštėjimo sparta priklauso nuo vertikalaus greičio, kuris yra susijęs su orlaivio keliamąja jėga ir trauka, bet ne nuo horizontalaus oro srauto (priešinio ar palankaus vėjo). Priešinis vėjas veikia tik žemės greitį ir navigacinę padėtį, bet ne realų kopimo greitį oro atžvilgiu.","hint":""},{"id":"43","q":"Tankio aukštis naudojamas:","a":["pereinamam aukščiui nustatyti","pereinamam skrydžio lygiui nustatyti","lėktuvo skrydžio charakteristikoms nustatyti"],"c":[2],"expl":"Tankio aukštis – tai aukštis, kuris atitinka standartinę oro tankio vertę, ir jis naudojamas siekiant įvertinti orlaivio skrydžio charakteristikas, tokius kaip variklio galia, kilimo ir tūpimo savybės, nes jos priklauso nuo oro tankio. Pereinamam aukščiui ir pereinamam skrydžio lygiui nustatyti naudojamas barometrinis aukštis.","hint":""},{"id":"44","q":"Jeigu kilimo takas padengtas vandens sluoksniu, OL maksimaliai leistina kilimo masė:","a":["sumažės","bus ta pati","padidės"],"c":[0],"expl":"Vandens sluoksnis ant kilimo tako sumažina sukibimą tarp ratų ir tako paviršiaus, todėl prailgėja įsibėgėjimo distancija ir sumažėja trauka. Dėl to būtina sumažinti maksimalų leistiną kilimo masę, kad būtų užtikrintas saugus pakilimas.","hint":""},{"id":"45","q":"VST skrydžio plane nurodytas skrydžio laikas – tai:","a":["paskaičiuotas laikas nuo variklio paleidimo iki nusileidimo paskirties aerodrome + 10min.","paskaičiuotas skrydžio laikas nuo pakilimo iki atskridimo virš paskirties aerodromo","paskaičiuotas laikas nuo variklio paleidimo iki nusileidimo paskirties aerodrome"],"c":[1],"expl":"Skrydžio laikas VST plane paprastai reiškia laiką, per kurį orlaivis yra ore – nuo pakilimo iki atskridimo virš paskirties aerodromo, nepriklausomai nuo variklio paleidimo ar užgesinimo laiko.","hint":""},{"id":"46","q":"OL svorio (masės) centras – tai:","a":["taškas, kuris naudojamas, kaip nulinė atskaita momentams paskaičiuoti","taškas, kuriame visų veikiančių lėktuvo liemenį momentų suma lygi nuliui","taškas, kuriame visų išorinių jėgų dedamųjų suma lygi nuliui","visų masės jėgų dedamųjų pridėjimo taškas"],"c":[3],"expl":"","hint":""},{"id":"47","q":"Sklendimo kampas mažiausias bus:","a":["kai a (atakos kampas) naud (OL Kokybė didžiausia)","kai skrendama a ekon.","kai skrendama a max."],"c":[0],"expl":"Sklendimo kampas yra santykis tarp kylimo jėgos ir pasipriešinimo. Mažiausias sklendimo kampas reiškia didžiausią orlaivio kokybę (L/D santykį). Tai pasiekiama prie optimalaus atakos kampo (a naud), kai orlaivis skrenda efektyviausiai, t.y. maksimalus kilimo jėgos ir pasipriešinimo santykis. Skrendant didesniu ar mažesniu atakos kampu (pvz., a max ar a ekon.) sklendimo kampas didėja.","hint":""},{"id":"48","q":"Sklendimo sparta (Vy) bus minimali:","a":["a ekon.","a max","a min"],"c":[0],"expl":"","hint":""},{"id":"49","q":"Didžiausias aukštėjimo kampas bus skrendant, kai:","a":["a max ir V ekon.","a ekon. ir V ekon.","a ekon. ir V max"],"c":[0],"expl":"Didžiausias aukštėjimo kampas pasiekiamas, kai orlaivis skrenda su maksimaliu atakos kampu (a max) ir optimaliu greičiu (V ekon.), kuris leidžia išgauti maksimalų keliamąjį svorį ir efektyviai kilti vertikaliai.","hint":""},{"id":"50","q":"OL sklendimo nuotolis išlaikant tą patį atakos kampą bus didesnis:","a":["su mažesne lėktuvo mase","su didesne lėktuvo mase","sklendžiant pavėjui"],"c":[2],"expl":"Sklendžiant pavėjui , lėktuvas juda vėjo kryptimi, todėl jo tikrasis greitis žemės atžvilgiu yra didesnis. Tai reiškia, kad nors oro greitis ir atakos kampas išlieka tie patys, dėl pavėjinio poveikio lėktuvas nuvažiuoja ilgesnį atstumą.","hint":""},{"id":"51","q":"Kada orlaivis nusklęs toliau?","a":["pavėjui","štiliuje","prieš vėją"],"c":[0],"expl":"Sklendžiant pavėjui , lėktuvas juda vėjo kryptimi, todėl jo tikrasis greitis žemės atžvilgiu yra didesnis. Tai reiškia, kad nors oro greitis ir atakos kampas išlieka tie patys, dėl pavėjinio poveikio lėktuvas nuvažiuoja ilgesnį atstumą.","hint":""},{"id":"52","q":"Kokį V pasirinktumėte, kad sklendžiant ilgiau išsilaikyti ore?","a":["V max","V ekon.","V min"],"c":[1],"expl":"","hint":""},{"id":"53","q":"Orlaivio smukos greitis bus didesnis, kai:","a":["lėktuvas turi galinę centruotę ir didesnę masę;","lėktuvas turi galinę centruotę ir mažesnę masę; c) lėktuvas turi priekinę centruotę ir didesnę masę","lėktuvas turi priekinę centruotę ir didesnę masę"],"c":[0],"expl":"Didesnė masė didina smukos greitį, nes orlaivis turi didesnį inercijos jėgos ir reikia didesnio greičio, kad išlaikytų stabilumą. Galinė centruotė taip pat didina smukos greitį, nes sumažina stabilumą ir orlaivis linkęs smukti greičiau.","hint":""},{"id":"55","q":"Keliamosios jėgos koeficientą galima padidinti atlenkus užsparnius arba:","a":["padidinus greitį","padidinus atakos kampą","sumažinus lėktuvo masę"],"c":[1],"expl":"Užsparniai keičia sparno profilio formą, didindami keliamosios jėgos koeficientą. Taip pat keliamosios jėgos koeficientas didėja didinant atakos kampą iki tam tikros ribos, nes tuomet sparnas generuoja daugiau keliamosios jėgos.","hint":""},{"id":"56","q":"Kokį poveikį skrydžio charakteristikoms turi mažesnis aerodromo barometrinis aukštis?","a":["saugiai pakilti reikalingas trumpesnis kilimo takas","saugiai sustoti nutraukiant kilimą reikės ilgesnio kilimo tako","saugiai palikti reikalingas ilgesnis kilimo takas"],"c":[0],"expl":"Mažesnis barometrinis aukštis reiškia tankesnį orą, todėl lėktuvas turi didesnę keliamosios jėgos galią ir variklio trauką, todėl pakilti galima trumpesniu taku.","hint":""},{"id":"58","q":"Padidėjęs atmosferos slėgis, tarp kitų poveikių turi ir poveikį kilimo charakteristikoms:","a":["sumažėja kilimo nuotolis ir suprastėja pradinis kopimas","sumažėja kilimo nuotolis ir pagerėja pradinis kopimas","padidėja kilimo nuotolis ir suprastėja pradinis kopimas d) padidėja kilimo nuotolis ir pagerėja pradinis kopimas"],"c":[1],"expl":"Padidėjęs atmosferos slėgis reiškia tankesnį orą, todėl lėktuvo variklis veikia efektyviau, keliamosios jėgos koeficientas didesnis, todėl kilimo nuotolis trumpėja, o pradinio kopimo kokybė gerėja.","hint":""},{"id":"62","q":"Sumažėjęs atmosferos slėgis:","a":["padidėja kilimo nuotolis ir suprastėja pradinis kopimas","padidėja kilimo nuotolis ir pagerėja pradinis kopimas","sumažėja kilimo nuotolis ir suprastėja pradinis kopimas"],"c":[0],"expl":"Mažesnis atmosferos slėgis reiškia mažesnį oro tankį, todėl variklis ir sparnai veikia mažiau efektyviai. Dėl to reikia ilgesnio kilimo tako, o pradinio kopimo kokybė blogėja.","hint":""},{"id":"63","q":"Didesnis aerodromo barometrinis aukštis:","a":["saugiai sustoti nutraukiant kilimą reikės ilgesnio kilimo tako","saugiai palikti reikalingas ilgesnis kilimo takas","saugiai pakilti reikalingas trumpesnis kilimo takas"],"c":[1],"expl":"Didesnis barometrinis aukštis reiškia mažesnį oro tankį, todėl orlaivis turi prastesnes kilimo ir kopimo savybes, todėl reikalingas ilgesnis kilimo takas, kad saugiai paliktų aerodromą.","hint":""},{"id":"65","q":"Aukštesnė temperatūra:","a":["padidina kopimo kampą, bet sumažina kopimo spartą","neturi pastebimos įtakos kopimo galimybėms","sumažina ir kopimo kampą ir sparta"],"c":[2],"expl":"Aukštesnė temperatūra sumažina oro tankį, todėl orlaivio kilimo ir kopimo charakteristikos prastėja — tiek kopimo kampas, tiek kopimo sparta sumažėja","hint":""},{"id":"67","q":"Žemesnė negus standartinė temperatūra:","a":["neturi pastebimos įtakos kopimo galimybėms","padidina ir kopimo kampą ir sparta","sumažina kopimo kampą ,bet padidina kopimo sparta"],"c":[1],"expl":"Žemesnė oro temperatūra reiškia didesnį oro tankį, todėl gerėja orlaivio kilimo charakteristikos — padidėja kopimo kampas ir kopimo sparta.","hint":""},{"id":"70","q":"Kopimo sparta:","a":["nuožulnusis TAS komponentas","horizontalusis TAS komponentas","kilimo gradientas padaugintas iš TAS ir padalintas iš 100"],"c":[2],"expl":"Kopimo sparta apskaičiuojama kaip kilimo kampo (gradientas, %) padaugintas iš tikrojo oro greičio (TAS), padalintas iš 100, kad būtų gautas greitis vertikalioje ašyje.","hint":""},{"id":"71","q":"Kaip pasikeis OL kopimo charakteristikos paėmus vieną papildomą keleivį?","a":["nepasikeis","pagerės","pablogės"],"c":[2],"expl":"Paėmus vieną papildomą keleivį OL kopimo charakteristikos pablogės — kopimo greitis sumažės, o reikalingas kilimo takas padidės.","hint":""},{"id":"73","q":"OL turi dvi užsparnių padėtis tūpimui: 25° ir 35°. Jei pilotas vietoj 35° užsparnių išleis 25° padėtį, tai:","a":["sumažės tūpimo nuotolis ir pagerės nuėjimo į antrą ratą galimybės","padidės tūpimo nuotolis ir pagerės nuėjimo į antrą ratą galimybės","padidės tūpimo nuotolis ir pablogės nuėjimo į antrą ratą galimybės"],"c":[1],"expl":"Mažesnis užsparnių kampas (25° vietoj 35°) reiškia mažesnį aerodinaminį pasipriešinimą, bet ir mažesnę keliamosios jėgos padidėjimą. Dėl to orlaivis nusileidžia didesniu greičiu, todėl tūpimo nuotolis padidėja. Be to, prastesnės užsparnių tūpimo padėties charakteristikos sumažina galimybę greitai ir saugiai pakilti į antrą ratą (go-around), nes greitis ir nusileidimo kampas yra neoptimalūs.","hint":""},{"id":"75","q":"Koks laikas rašomas ATS plane:","a":["vietinis","UTC","centrinis Europos"],"c":[1],"expl":"ATS (oro eismo tarnybų) plane laikas visada rašomas koordinuotu pasauliniu laiku (UTC), kad būtų užtikrintas vieningas laiko standartas visame pasaulyje ir išvengta nesusipratimų dėl laiko juostų skirtumų.","hint":""},{"id":"77","q":"Į METAR informaciją įjungiami atmosferos slėgio duomenys pagal slėgį:","a":["QNH","QFE","QFF"],"c":[0],"expl":"METAR pranešimuose atmosferos slėgis dažniausiai pateikiamas kaip QNH – tai slėgis, koreguotas iki jūros lygio, kurį naudoja pilotai ir oro eismo tarnybos orientacijai bei aukščio nustatymui.","hint":""},{"id":"78","q":"Į METAR informaciją įjungiami duomenys apie:","a":["priežeminį vėją","gradientinį vėją","terminį vėją"],"c":[0],"expl":"METAR pranešimuose nurodomas priežeminis vėjas – tai vėjo greitis ir kryptis tiesiai prie aerodromo paviršiaus, svarbi informacija pilotams dėl saugaus pakilimo, tūpimo ir skrydžio planavimo.","hint":""},{"id":"80","q":"Kai aukštimačio barometrinėje skalėje nustatytas slėgis QNH – jis rodo:","a":["absoliutų aukštį (altitudę)","santykinį aukštį","skrydžio lygį (FL)"],"c":[0],"expl":"","hint":""},{"id":"82","q":"Kuomet aukštimačio barometrinėje skalėje nustatytas slėgis 1013 hPa (760 mmHg) jis rodo:","a":["skrydžio lygį FL","absoliutų aukštį (altitudę)","santykinį aukštį"],"c":[0],"expl":"","hint":""},{"id":"83","q":"Kai aukštimačio barometrinėje skalėje nustatytas slėgis QFE (slėgis aerodromo paviršiuje) jis rodo:","a":["skrydžio lygį FL","absoliutų aukštį (altitudę)","santykinį aukštį"],"c":[2],"expl":"","hint":""},{"id":"84","q":"Kas yra orlaivio vadas ?","a":["OL valdytojo paskirtas vienas iš įgulos narių","aukščiausias aviacijos organizacijos pareigūnas, esantis OL skrydžio metu","OL valdytojo paskirtas pilotas, atsakingas už OL valdymą ir saugą skrydžio metu","pilotas"],"c":[2],"expl":"","hint":""},{"id":"106","q":"OL kyla su nekeičiamo žingsnio sraigtu, sraigto trauka","a":["sraigto trauka (P) greičiui (V) didėjant- mažėja","sraigto trauka (P) greičiui (V) didėjant- didėja","nesikeičia"],"c":[],"expl":"Kai orlaivis su nekeičiamo žingsnio sraigtu įsibėgėja, sraigto mentės vis labiau \"atsilieka\" nuo oro srauto kampo (atakos kampas mažėja), todėl trauka mažėja.","hint":""},{"id":"108","q":"OL per 36 min nuskrido 157 NM. Kokį atstumą nuskris OL pavėjui, pučiant 60 kt vėjui?","a":["157 NM","146 NM","193 NM"],"c":[2],"expl":"Norėdami nustatyti, kokį atstumą orlaivis nuskris su 60 kt pavėjui, pirmiausia apskaičiuojame jo tikrąjį oro greitį (TAS). Jei per 36 minutes (0,6 val.) orlaivis nuskrido 157 jūrmyles, tai jo greitis buvo 261,67 kt (157 ÷ 0,6). Pridėjus pavėjinę vėjo dedamąją (60 kt), gauname naują orlaivio žemės greitį (GS) – 321,67 kt. Tuomet skaičiuojame, kiek orlaivis nuskris per tą patį laiką (36 minutes): 321,67 × 0,6 = 193 jūrmylės.","hint":""},{"id":"110","q":"Skrendate 360 m aukštyje 150 km/h greičiu. Esate 10 km iki kontrolinio taško. Duota komanda aukštėti taip, kad virš kontrolinio punkto būtumėte 600 m aukštyje. Kokią aukštėjimo spartą privalote laikyti?","a":["2 m/s","1 m/s","3m/s"],"c":[1],"expl":"Skrendate 360 metrų aukštyje 150 km/h (tai yra apie 41,67 m/s) greičiu. Esate 10 km (10 000 metrų) atstumu nuo kontrolinio taško, o duota komanda aukštėti taip, kad virš kontrolinio taško būtumėte 600 metrų aukštyje. Tai reiškia, kad per tą atstumą turite pakilti 600 m – 360 m = 240 metrų. Laikas, per kurį įveiksite 10 km atstumą, yra: 10 000 m / 41,67 m/s ≈ 240 sekundžių. Kad per 240 sekundžių pakiltumėte 240 metrų, aukštėjimo sparta turi būti: 240 m / 240 s = 1 m/s .","hint":""},{"id":"112","q":"Aukštėjimo gradientas – tai:","a":["tikrojo greičio ir aukštėjimo spartos santykis","tikrojo greičio ir aukštėjimo spartos santykis","aukščio ir nuskristo atstumo ore santykis"],"c":[2],"expl":"Aukštėjimo gradientas (angl. climb gradient ) – tai kampinis rodiklis, rodantis, kiek aukščio įgyjama tam tikram horizontaliai nuskristam atstumui. Dažniausiai išreiškiamas procentais (%), pavyzdžiui, 5 % reiškia, kad per 100 m horizontalaus atstumo lėktuvas pakyla 5 metrus.Formulė: Gradientas (%) = (aukštis / horizontalus atstumas) × 100 .","hint":""},{"id":"114","q":"Kodėl avarijos dažniausiai nutinka pirmaisiais skraidymo metais?","a":["nes aviacinę technika greit genda","pervertinamos galimybės, patyrimo stoka"],"c":[1],"expl":"","hint":""},{"id":"115","q":"Kada pradedama ruoštis skraidymams:","a":["dieną prieš skrydį","namuose/ skraidymo klasėje","prieš pat skrydį"],"c":[1],"expl":"","hint":""},{"id":"117","q":"Ar svarbu prieš skrydį studijuoti orų prognozes:","a":["ne","būtina","nesvarbu"],"c":[1],"expl":"","hint":""},{"id":"119","q":"Informacija apie vėją startuojant yra didelė pagalba. Kur statomos vėjarodės:","a":["prie KTT arba kitoje gerai matomoje aerodromo vietoje","prie angaro","prie bokšto"],"c":[0],"expl":"","hint":""},{"id":"121","q":"Kur negalima skraidyti be leidimo?","a":["pasienio zonoje, pavojingose, ribojamose zonose, virš žmonių susibūrimo vietų, karinių aerodromų","pasienio zonoje, pavojingose, ribojamose zonose, virš žmonių susibūrimo vietų","karinių aerodromų pasienio zonoje, pavojingose, ribojamose zonose"],"c":[0],"expl":"","hint":""},{"id":"123","q":"Ar pavojinga startuoti miško proskynoje?","a":["pavojinga","nepavojinga"],"c":[0],"expl":"Startuoti miško proskynoje yra pavojinga, nes gali susidaryti oro srautų turbulencija dėl medžių, ypač pavėjinėje pusėje. Proskynos ribose dažnai susidaro nelygus reljefas ir pavojingi oro sūkurių reiškiniai. Taip pat yra ribotas manevravimo aukštis bei vieta avariniam nusileidimui. Medžiai riboja matomumą ir gali kliudyti, jei reikia nutraukti kilimą. Dėl šių priežasčių kilimas miško proskynoje laikomas padidintos rizikos veiksniu.","hint":""},{"id":"124","q":"Prieš startą keičiasi vėjo kryptis. Ką darote?","a":["laukiate kol pasikeis vėjo kryptis","greitai kylate","pakeičiate kilimo kryptį, startuojate prieš vėją"],"c":[2],"expl":"","hint":""},{"id":"126","q":"Kodėl ruošiantis startui, visą OL reikia tikrinti visada tokia pat tvarka?","a":["kad nieko nepraleisti","OL tikrinimo eiliškumas nesvarbus","kad tai išmokti mintinai"],"c":[0],"expl":"","hint":""},{"id":"128","q":"Jūs skrendate vienas ir skrisdamas atsiduriate toli nuo apgyvendintos vietovės. Apie ką turite pagalvoti?","a":["ar nepamiršote skrydžio plano","apie pagalbą avarijos atveju","apie galimybę pasiklysti"],"c":[1],"expl":"Jūs skrendate vienas ir atsiduriate toli nuo apgyvendintos vietovės – tokiu atveju svarbiausia pagalvoti apie pagalbą avarijos atveju. Tai reiškia, kad reikia įvertinti savo buvimo vietą, ryšio galimybes, artimiausią alternatyvų tūpimo lauką ar maršruto keitimą saugumo sumetimais. Taip pat svarbu užtikrinti, kad avarinė įranga būtų paruošta naudojimui.","hint":""},{"id":"130","q":"Ko galite laukti, jeigu artėjate prie audros (Cb) debesies?","a":["vėjo, turbulencijos","lietaus","audros, kilimo (liūtinio lietaus ,griaustinio, žaibų, krušos, škvalinio vėjo)"],"c":[2],"expl":"","hint":""},{"id":"131","q":"Koks yra pavojus, jeigu jūs skrendate po Cb debesim ir patenkate į stiprėjantį kilimą?","a":["pavojaus nėra","didelės perkrovos","iškrovos į lėktuvą"],"c":[1],"expl":"Cb (kumulonimbus) debesys dažnai susiję su stipriomis turbulencijomis, kurios gali sukelti pavojingas dideles perkrovas orlaiviui.","hint":""},{"id":"133","q":"Koks galimas pavojus skrendant kalnuose:","a":["užkliūti už žemai esančių laidų ir transporto komunikacijų","pavojaus nėra","pakilti per aukštai"],"c":[0],"expl":"","hint":""},{"id":"134","q":"Skraidyklė skrisdama sukelia oro srauto sūkurį. Ar gali tai sudaryti sunkumų paskui jus skrendančiam pilotui?","a":["ne","taip"],"c":[1],"expl":"Kai skraidyklė skrenda, jos sparnai sukuria oro srautą, kuris viršija sparnų galus ir sukelia sūkurinius oro srautus, vadinamus „vortexais“. Šie sūkuriai gali būti labai stiprūs ir nenuspėjami, ypač mažesniems orlaiviams, kurie skrenda paskui — tai gali sukelti staigius pakilimus arba praradimus stabilumo, todėl sekančiam pilotui tai gali būti pavojinga. Todėl pilotai privalo atsižvelgti į kitų orlaivių sukurtus oro sūkurinius efektus ir laikytis saugaus atstumo.","hint":""},{"id":"135","q":"FL 195 reiškia:","a":["skridimo aukštį 1950 ft pagal standartinį slėgį (1013hp arba 760 mmHg","skridimo aukštį 19500 ft pagal standartinį slėgį (1013hp arba 760 mmHg)","skridimo aukštį 1950 pagal QFE"],"c":[1],"expl":"FL (Flight Level) reiškia skrydžio lygį, kuris matuojamas šimtų pėdų vienetais pagal standartinį atmosferos slėgį (1013 hPa). Taigi FL 195 yra 195 × 100 ft = 19 500 ft aukštis.","hint":""},{"id":"136","q":"MSL yra:","a":["absoliutus aukštis (altitudė)","aerodromo aukštis","santykinis aukštis"],"c":[0],"expl":"MSL (Mean Sea Level) reiškia vidutinį jūros lygį, todėl tai yra absoliutus aukštis, matuojamas nuo vidutinio jūros lygio.","hint":""},{"id":"137","q":"Kokiame aukštyje juntamas deguonies stygius ilgiau paskridus:","a":["3050 m.","4500 m.","2500 m."],"c":[0],"expl":"","hint":""},{"id":"138","q":"Kokie požymiai rodo, kad trūksta deguonies:","a":["mieguistumas, euforija","euforija, šaltis,","lėtas kvėpavimas, mieguistumas"],"c":[0],"expl":"","hint":""},{"id":"139","q":"Jūs stipriai sloguojate, bet vis tiek nusprendžiate kilti į 1500 m aukštį. Kas atsitiks:","a":["užguls ausies kanalą, smarkiai skaudės","nieko","bus pažeistas ausies kanalas"],"c":[0],"expl":"Kai pakilsite į 1500 m aukštį, dėl oro slėgio pokyčių gali užsikimšti arba užgulti ausies kanalai, ypač jei sergate sloga, nes nosies ir ausies vamzdelių (Eustachijaus vamzdelių) ventiliacija yra sutrikusi. Tai sukelia spaudimo disbalansą ausyje, dėl kurio skauda ausį ir jaučiamas diskomfortas.","hint":""},{"id":"140","q":"Kaip elgsitės, jei prieš startą blogai jaučiatės:","a":["atsisakote skristi","išgersite vaistų","vis tiek skrendate"],"c":[0],"expl":"","hint":""},{"id":"141","q":"Ką ir kaip reikia daryti gelbstint nukentėjusįjį:","a":["pranešti gelbėjimo tarnybai ir suteikti pirmąją pagalbą","nejudinti nukentėjusio","pranešti jo artimiesiems"],"c":[0],"expl":"","hint":""},{"id":"142","q":"Kokią paskirtį turi vėjarodė nusileidimo vietoje:","a":["rodo vėjo kryptį","nustatyti vėjo kryptį ir stiprumą","rodo vėjo stiprumą"],"c":[1],"expl":"","hint":""},{"id":"143","q":"Koks pavojus gali kilti po nusileidimo, pučiant stipriam vėjui?","a":["OL gali staiga kilti į viršų","jokio pavojaus","blaška"],"c":[0],"expl":"Po nusileidimo, pučiant stipriam vėjui, ypač jei tai gūsinis vėjas ar vėjo šuoliai (angl. wind shear), orlaivis gali netikėtai būti pakeltas į viršų, nes staigiai kinta oro srautas. Tai gali būti pavojinga, nes pilotas turi greitai sureaguoti, kad išlaikytų kontrolę.","hint":""},{"id":"144","q":"Prieš pat nusileidžiant staiga pasikeičia vėjo kryptis. Pastebite, kad vėjas pučia į nugarą:","a":["nueinate į antrą ratą, artėjate tūpti priešiniu vėju","tūpiate ir smarkiai stabdote","tūpiate neišleidus užsparnių"],"c":[0],"expl":"Staiga pasikeitus vėjo krypčiai ir vėjas pučiant į nugarą, nusileidimas tampa pavojingas, nes orlaivis gali ilgai skristi tako paviršiumi ir gali būti sunku tiksliai kontroliuoti leidimąsi. Todėl saugiausia yra eiti į antrą ratą (pakilti vėl į aukštį) ir prieiti prie tūpimo su priešiniu vėju, kuris suteikia geresnį stabilumą ir kontrolę.","hint":""},{"id":"145","q":"Ar leidimosi vietoje yra privaloma vėjarodė?","a":["neprivaloma","privaloma"],"c":[1],"expl":"","hint":""},{"id":"146","q":"Kaip nustatote vėjo kryptį, jeigu leidžiantis vėjarodės aikštelėje nepastebite:","a":["paklausiate SV apie vėją","pagal dūmų kryptį","pagal medžius"],"c":[0],"expl":"Jei vėjarodės aikštelėje vėjo kryptis nėra aiški (nebūna matoma), saugiausia ir tiksliausia yra paklausti skrydžių valdymo tarnybos (SV – skrydžių valdymo) apie esamą vėjo kryptį. Tai užtikrina, kad gausite patikimą ir naujausią informaciją.","hint":""},{"id":"147","q":"Praskridimas pro nusileidimo aikštelę prieš leidžiantis:","a":["pranešate SV","laikyti stabilų greitį","apžiūrėti kliūtis, ar nėra pašalinių daiktų ant juostos"],"c":[2],"expl":"","hint":""},{"id":"148","q":"Kuriems aparatams kyla didžiausias susidūrimo pavojus leidžiantis į aikštelę?","a":["UL orlaiviams","sklandytuvams","oro balionams"],"c":[1],"expl":"Leidžiantis į aikštelę, didžiausias susidūrimo pavojus kyla sklandytuvams, nes jie dažnai juda be variklio, jų manevringumas yra ribotas, o judėjimas priklauso nuo oro sąlygų.","hint":""},{"id":"149","q":"Kas svarbiausia, kai leidžiatės į aikštelę:","a":["aikštelės ilgis","kliūtys","aikštelės nuolydis"],"c":[1],"expl":"Leidžiantis į aikštelę svarbiausia atkreipti dėmesį į kliūtis – medžius, pastatus, stulpus ar kitus objektus, kurie gali trukdyti saugiai tūpti. Nors aikštelės ilgis ir nuolydis taip pat svarbūs, kliūčių buvimas gali tiesiogiai sukelti avarines situacijas.","hint":""},{"id":"150","q":"Ko galite tikėtis leisdamiesi už kliūties:","a":["turbulencijos","nieko","vėjo poslinkio"],"c":[2],"expl":"Kliūtys sukelia oro srautų pokyčius, dažnai atsiranda vėjo poslinkiai — staigūs ir nenuspėjami vėjo greičio ar krypties pasikeitimai, kurie gali apsunkinti skrydį leidžiantis.","hint":""},{"id":"151","q":"Kaip startuojama pučiant stipriam nugariniam vėjui?","a":["nestartuojama","startuojama nepilnais gazais","startuojama įprastai"],"c":[0],"expl":"","hint":""},{"id":"152","q":"Skrendate pučiant 20 km/h nugariniam vėjui. Kokiu greičiu reikia skristi, jei norite nuskristi kuo didesnį atstumą?","a":["V ekon.","V naud.","V max"],"c":[0],"expl":"Kai skrendate su nugariniu vėju (t. y. vėjas pučia iš galo), norėdami nuskristi kuo didesnį atstumą, turite pasirinkti ekonominį greitį (V ekon.). Tai yra greitis, kuris suteikia geriausią keliamoji našumą (keliamąją jėgą prie kuro sąnaudų ar energijos sąnaudų). Skrendant per greitai (V max) arba per lėtai (V naud) efektyvumas bus prastesnis.","hint":""},{"id":"153","q":"Kokie pavojai tyko leidžiantis į vandenį?","a":["jokių","paskęsti","vasarą- jokių pavojų"],"c":[1],"expl":"","hint":""}]},"Bendrosios žinios apie orlaivį":{"slug":"bendrosios-zinios-apie-orlaivi","questions":[{"id":"3","q":"Kas sudaro maksimalų orlaivio svorį?","a":["naudinga krova + tuščio orlaivio masė","Orlaivio svoris su pilotu ir keleiviais","Orlaivio svoris su pilnais kuro bakais ir keleiviais"],"c":[0],"expl":"","hint":""},{"id":"629","q":"Kokia sparno priešsparnių paskirtis?","a":["Padidinti atakos kampą, sumažinti tūpimo greit (smukos), padidinti Y","Sumažinti atakos kampą, padidinti tūpimo greitį, padidinti Y"],"c":[0],"expl":"Priešsparniai (angl. slats) yra aerodinaminiai paviršiai, įtaisyti prie sparno priekinės briaunos. Jie: padidina leistiną atakos kampą neatsiskiriant srautui nuo sparno paviršiaus; pagerina oro srauto pritekėjimą prie sparno viršutinio paviršiaus, sumažindami atplėšimo (stall) riziką, sumažina tūpimo (smukos) greitį, nes leidžia generuoti didesnę keliamąją jėgą (Y) prie mažesnio greičio.","hint":""},{"id":"630","q":"Kokia aukštumos vairų trimerio pagrindinė paskirtis?","a":["Kompensuoti aukštumos vairo aerodinaminę apkrovimo jėgą (šarnyruose veikiančių momentų koeficientus)","Padidinti aukštumos vairo aerodinaminę apkrovimo jėgą."],"c":[0],"expl":"Trimeris yra mažas paviršius, įtaisytas ant pagrindinio vairavimo paviršiaus, pavyzdžiui, aukštumos vairo. Jo pagrindinė paskirtis – palengvinti piloto darbą, sumažinant poreikį nuolat laikyti jėgą ant vairalazdės ar šturvalo. Trimeris kompensuoja aerodinaminę apkrovą, kurią sukuria, pavyzdžiui, aukštumos vairas, kai orlaivis skrenda pastoviomis sąlygomis. Tai leidžia išlaikyti stabilų skrydį be pastovių pilotavimo veiksmų.","hint":""},{"id":"631","q":"Kaip suprantamas diferencinis eleronų sistemos valdymas?","a":["Eleronai žemyn atsilenkia daugiau negu į viršų","Eleronai aukštyn atsilenkia daugiau negu į viršų"],"c":[1],"expl":"Diferencialinis eleronų valdymas reiškia, kad eleronai neatsilenkia simetriškai: tas, kuris juda aukštyn, atsilenkia daugiau negu tas, kuris juda žemyn. Tai padeda sumažinti indukuotą sukimo momentą , kuris atsiranda dėl papildomos keliančiosios jėgos ir pasipriešinimo eleronui, atsilenkiančiam žemyn. Kai eleronas leidžiasi žemyn (didesnis keliamasis plotas), jis sukuria daugiau pasipriešinimo, todėl orlaivis linksta suktis priešinga kryptimi nei norima posūkio kryptis. Diferencialinis judėjimas kompensuoja šį efektą, pagerindamas valdymą.","hint":""},{"id":"632","q":"Kokia yra lėktuvo smukos įspėjimo sistemos paskirtis?","a":["Įspėja apie kritinius atakos kampus: smukos režimą, atitrūkinėjantį oro srautą","Įspėja, kai artėjama į suktuką","Įspėja apie prasidėjusią smuką"],"c":[0],"expl":"Lėktuvo smukos įspėjimo sistema yra skirta įspėti pilotą prieš prasidedant smukai, t. y. kai atakos kampas artėja prie kritinio, kai oro srautas pradeda atsiskirti nuo sparno paviršiaus, o keliamoji jėga greitai mažėja.","hint":""},{"id":"633","q":"Kam reikalingi stabilizatoriai?","a":["Stabilizuoti OL skersinės ašies atžvilgiu","Stabilizuoti OL vertikalios ašies atžvilgiu","Stabilizuoti OL išilginės ašies atžvilgiu","Atlikti pokrypius"],"c":[0],"expl":"Stabilizatoriai, o tiksliau – horizontalusis stabilizatorius (esančios uodegoje), yra skirti: užtikrinti išilginį stabilumą, padeda orlaiviui išlaikyti pastovų atakos kampą, subalansuoja aerodinamines jėgas, kad orlaivis nesisvyruotų nosimi aukštyn ar žemyn.","hint":""},{"id":"634","q":"Pagal kokius kriterijus reikėtų rinktis orlaivį?","a":["Pagal maksimalų greitį","Pagal kainą","Pagal kuro sunaudojimo kiekį","Orlaivis turi atitikti gamintojo sertifikatus, piloto svorio ribas"],"c":[3],"expl":"Renkantis orlaivį, svarbiausia yra saugumas ir atitikimas techniniams bei eksploataciniams reikalavimams: Gamintojo sertifikatai nurodo, kam orlaivis yra tinkamas (pvz., mokymams, akrobatikai, keleivių gabenimui ir pan.). Svorio ribos (maksimali kilimo masė, svorio centras ir pan.) turi būti griežtai laikomasi dėl skrydžio saugumo ir stabilumo.","hint":""},{"id":"635","q":"Kur geriausiai laikyti orlaivį/skraidymo įrangą?","a":["Angare (uždaroj, vėdinamoj, sausoje patalpoje)","Lauke","Nesvarbu","Sausoje patalpoje"],"c":[0],"expl":"Orlaivio ar skraidymo įrangos laikymo sąlygos turi tiesioginę įtaką jų saugumui, ilgaamžiškumui ir patikimumui. Todėl: Angaras suteikia apsaugą nuo oro sąlygų – kritulių, saulės spindulių, temperatūros svyravimų, vėjo. Vėdinimas apsaugo nuo kondensato ir korozijos. Sausa aplinka būtina, kad būtų išvengta drėgmės pažeidimų elektronikai, konstrukcijai.","hint":""},{"id":"636","q":"Kiek laiko reikia džiovinti gelbėjimosi parašiutą?","a":["Kol išdžius (netiesioginiuose saulės spinduliuose)","Parą","Dvi paras"],"c":[0],"expl":"","hint":""},{"id":"637","q":"Kokie saulės spinduliai yra pavojingiausi sparnui?","a":["Tiesioginiai","Netiesioginiai"],"c":[0],"expl":"Tiesioginiai saulės spinduliai yra pavojingiausi orlaivio konstrukcijai, ypač: Sparnui, jei jis padengtas kompozitinėmis, plastikinėmis ar audinio medžiagomis (pvz., sklandytuvai, ultralengvieji orlaiviai).Jie gali sukelti: Perkaitimą – deformacijas ar medžiagų nuovargį; UV spindulių poveikį – ilgainiui pažeidžiami dažai, danga, audiniai, net plastikas.","hint":""},{"id":"638","q":"Kas yra svarbiausia renkantis šalmą?","a":["Dydis ir matomumas","Kaina","Patogumas"],"c":[0],"expl":"Renkantis skraidymo šalmą svarbiausia, kad jis tinkamai priglustų prie galvos ir neužgožtų matymo lauko. Netinkamas dydis gali sumažinti apsaugą avarijos atveju, o prastas matomumas kelia pavojų skrydžio metu.","hint":""},{"id":"639","q":"Kokios jėgos veikia OL konstrukciją?","a":["Aerodinaminės jėgos -Y, X, G, P","Aerodinaminės jėgos -Y, X","Aerodinaminės jėgos -Y, X, G, P, A"],"c":[0],"expl":"","hint":""},{"id":"640","q":"Pagrindinės važiuoklės funkcijos yra:","a":["užtikrinti OL manevringumą ant žemės ir ore, suteikti OL reikiamą aukštį, kad būtų sudarytas reikiamas aukštis tarp žemės ir sklandmens, propelerių, variklių, užsparnių ir t.t., taip pat sugerti kinetinę energiją tūpimo metu","suteikti OL reikiamą aukštį, kad būtų sudarytas reikiamas aukštis tarp žemės ir sklandmens, p
