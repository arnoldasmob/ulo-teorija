,"expl":"Rasos taško temperatūra – temperatūra, kuriai esant vandens molekulės esančios ore pradeda kondensuotis: t.y. formuojasi rasa, rūkas...","hint":""},{"id":"576","q":"Krituliai, susidarę iš vandens lašų, vadinami:","a":["lietumi","rasa","rūku"],"c":[0],"expl":"","hint":""},{"id":"577","q":"Krituliai, susidarę iš mažų ledo rutuliukų, vadinami:","a":["kruša","sniegu","šlapdriba"],"c":[0],"expl":"","hint":""},{"id":"578","q":"Liūtiniai krituliai iškrenta iš:","a":["sluoksninių formų debesų","kamuolinių formų debesų"],"c":[1],"expl":"Liūtiniai krituliai iškrenta iš kamuolinių lietaus debesų, dar vadinamų lietaus kamuoliniais debesimis arba Cumulonimbus debesimis. Šie debesys yra labai aukšti, tankūs ir dažnai susiję su stipriais lietumis, perkūnijomis, kruša. Liūtiniai krituliai yra trumpalaikiai, bet labai intensyvūs.","hint":""},{"id":"579","q":"Dulksna iškrenta iš:","a":["sluoksninių formų debesų","kamuolinių formų debesų"],"c":[0],"expl":"Dulksna iškrenta iš sluoksninių debesų, dar vadinamų Stratus debesimis. Šie debesys yra žemi, pilki ir tolygiai dengia dangų. Iš jų iškrentanti dulksna būna labai smulki, tolygi ir dažnai tęsiasi ilgą laiką be stipraus lietaus pojūčio.","hint":""},{"id":"580","q":"Kaip vadinami krituliai, iškrentantys iš Cb debesų ir nepasiekiantys žemės paviršiaus, matomi kaip kritulių kritimo ruožai:","a":["vaivorykštė","virga","tornado"],"c":[1],"expl":"","hint":""},{"id":"581","q":"Kurios iš išvardintų sąlygų yra būtinos perkūnijai išsivystyti:","a":["didelis atmosferos nepastovumas","drėgnumas","vertikalūs srautai","visos išvardintos sąlygos"],"c":[3],"expl":"Perkūnijai išsivystyti būtinos šios sąlygos: Drėgmė – pakankamas kiekis vandens garų ore, kad galėtų susidaryti debesys ir krituliai. Nestabilus oras – atmosferos sąlygos, kai šiltas, drėgnas oras vertikaliai kyla aukštyn ir vėsta, sudarydamas palankias sąlygas debesims augti (ypač kamuoliniams lietaus debesims – Cumulonimbus).","hint":""},{"id":"582","q":"Kokios yra perkūnijos egzistavimo ciklo stadijos:","a":["Cumulus stadija","maksimalus Cb išsivystymo stadija","Cb išsisklaidymo stadija","visos teisingos"],"c":[3],"expl":"Susidaro Cumulus (kamuoliniai) debesys, kurie sparčiai auga aukštyn-(išsivystymo stadija). Debesys tampa Cumulonimbus – labai aukšti lietaus kamuoliniai debesys. Prasideda lietus, žaibai, griaustinis, gali būti kruša ar stiprūs vėjai-(Maksimalus Cb išsivystymo stadija). Vyraujantys žemėjantys oro srautai slopina debesies augimą. Krituliai silpsta, žaibavimas ir griaustinis pamažu išnyksta. Debesis suyra, išsisklaido, o oras stabilizuojasi.","hint":""},{"id":"583","q":"Kuriuo paros metu gali kilti audros?","a":["Daugiausiai antros dienos pusėje","Naktį","Ryte"],"c":[0],"expl":"Audros dažniausiai kyla popietę ir ankstyvą vakarą, maždaug tarp 14:00 ir 20:00 val. Žemės paviršius būna labiausiai įšilęs nuo saulės. Dėl to šiltas, drėgnas oras kyla aukštyn, skatindamas debesų (ypač Cumulonimbus) susidarymą. Padidėja atmosferos nestabilumas, o tai sukuria palankias sąlygas perkūnijai.","hint":""},{"id":"584","q":"Kokios yra pagrindines šiltojo fronto charakteristikos:","a":["slėgio kritimas ir vėjo krypties pasikeitimas","oro temperatūros kilimas","sluoksninių formų debesų žemėjimas, ilgai trunkantys ir ištisiniai krituliai, slėgio kritimas, vėjo krypties posūkis (iš PR į PV), oro temperatūros kilimas","sluoksninių formų debesų žemėjimas, ilgai trunkantys ir ištisiniai krituliai"],"c":[2],"expl":"Šiltasis frontas – tai šiltos oro masės perėjimo zona, kuri pasižymi laipsnišku debesuotumo ir kritulių didėjimu, šiltesniu oru po fronto ir nuosaikiais, ilgalaikiais krituliais. Vėjas paprastai pasisuka iš rytų ar pietryčių į pietų ar pietvakarių, kai frontas praeina.","hint":""},{"id":"585","q":"Pagal šalto oro judėjimo greitį, šaltasis frontas gali būti:","a":["lėtai judantis","greitai judantis","abu teisingi"],"c":[2],"expl":"","hint":""},{"id":"586","q":"Kokie krituliai yra susiję su šaltuoju frontu:","a":["dulksna","liūtiniai"],"c":[1],"expl":"Šaltasis frontas juda greitai, stumia šiltą orą staigiai aukštyn, todėl formuojasi aukšti kamuoliniai lietaus debesys (Cumulonimbus).Tokios sąlygos lemia staigius, stiprius, bet trumpalaikius kritulius.","hint":""},{"id":"587","q":"Kaip pakinta oro temperatūra, praėjus šaltajam frontui:","a":["pakyla","nukrenta"],"c":[1],"expl":"","hint":""},{"id":"588","q":"Ar pasikeičia vėjo kryptis, praslinkus lėtai judančiam šaltajam frontui:","a":["pasikeičia","nepasikeičia"],"c":[0],"expl":"Šaltasis frontas keičia oro mases – šiltą orą pakeičia šaltas, todėl kartu keičiasi ir slėgio laukai, kurie lemia vėjo kryptį.","hint":""},{"id":"589","q":"Praėjus šaltajam frontui, matomumas yra:","a":["blogas ištisinėje dulksnoje","puikus visomis kryptimis","geras, išskyrus liūtiniuose krituliuose"],"c":[1],"expl":"Po šaltojo fronto oras tampa sausas ir skaidrus. Vėjas dažnai sustiprėja, išsklaidydamas rūką, dulkes. Krituliai baigiasi gana greitai, debesuotumas sumažėja.","hint":""},{"id":"590","q":"Praėjus šaltajam frontui, jūs galėtumėt pakilti:","a":["į šiaurę","į pietus"],"c":[0],"expl":"Jeigu pakiltume į pietus, rytus ar vakarus pataikytume tiesiai i frontą, o pakilę į šiaurę nepataikysim į joki frontą.","hint":""},{"id":"591","q":"Šaltasis frontas, judėdamas greičiau už šiltąjį, jį paveja ir susidaro:","a":["šiltas frontas","šaltas frontas","okliuzijos frontas"],"c":[2],"expl":"Okliuzijos frontas − šiltojo ir šaltojo frontų derinys. Pvz., šaltasis frontas pasiveja šiltąjį frontą ir dėl didesnio tankio šiltąją oro masę kelia aukštyn, kas sukelia intensyvius kritulius, staigius vėjo gūsius ir spartų orų sąlygų pasikeitimą.","hint":""},{"id":"592","q":"Staigus trumpalaikis vėjo sustiprėjimas (15-20 m/s ir daugiau), pasikeičiant jo krypčiai, yra vadinamas:","a":["viesulas","škvalas","trombas"],"c":[1],"expl":"Škvalas- tai staigus, trumpalaikis, bet labai stiprus ir dažnai gūsingas vėjo stiprėjimas. Viesulas- tai labai stiprus ir siauras vėjo sūkurys, galintis sukelti didžiulę žalą (uraganas).","hint":""},{"id":"593","q":"Kokie reiškiniai, susiję su perkūnija, yra pavojingi aviacijai:","a":["stiprus vėjo poslinkis","smarki blaška (turbulencija)","stiprus apledėjimas","kruša","blogas matomumas krituliuose","žaibo iškrova į lėktuvą","visi pavojingi","tik b, d, ir f"],"c":[6],"expl":"","hint":""},{"id":"594","q":"Kokioje oro masėje skris orlaivis, pakilęs praėjus šiltajam frontui:","a":["šaltoje oro masėje","šiltoje oro masėje"],"c":[1],"expl":"","hint":""},{"id":"595","q":"Kai šiltesnė oro masė stumia tolyn šaltesnę oro masę, susidaro:","a":["šaltas frontas","šiltas frontas","okliuzijos frontas","stacionarinis frontas"],"c":[1],"expl":"","hint":""},{"id":"596","q":"Kodėl pavasarį termikų pasitaiko dažniau, negu rudenį?","a":["Oras ir žemė dar šalti ir dėl saulės spinduliavimo susidaro dideli temperatūrų skirtumai","Rudenį daugiau apsiniaukusių dienų","Palankesnis saulės spindulių kritimo kampas","Pavasariais daugiau saulėtų dienų"],"c":[0],"expl":"Pavasarį žemė dar nėra visiškai įšilusi, tačiau saulė jau pakankamai stipri, todėl oro sluoksniai prie žemės šyla greitai. Tai sukuria stipresnį šilto oro kilimą (termikus). Rudenį žemė jau būna gerokai atvėsusi, todėl šilumos kontrastas tarp paviršiaus ir aukštesnių oro sluoksnių būna mažesnis.","hint":""},{"id":"597","q":"Kokios būtinos sąlygos yra radiaciniam rūkui susidaryti?","a":["Giedra naktis","Drėgnas oras","Silpnas vėjas","Visos būtinos","tik a ir c"],"c":[3],"expl":"Radiacinis rūkas susidaro tada, kai žemės paviršius naktį greitai atvėsta, o kartu atšąla ir prie jo esantis oras, kol pasiekiamas rasos taškas (t. y. oras prisotinamas drėgmės ir pradeda kondensuotis). Kad susidarytu reikalingos sąlygos: Giedras dangus– Leidžia žemei naktį maksimaliai išspinduliuoti šilumą (radiacija į kosmosą), todėl paviršius stipriai atvėsta. Silpnas ar visai nėra vėjo– Kad atšalęs oras nebūtų maišomas su šiltesniu, kitaip rūkas nesusidarys arba greitai išsisklaidys. Aukšta santykinė oro drėgmė – Kad atšalus pasiektų rasos tašką ir pradėtų kondensuotis garai.","hint":""},{"id":"598","q":"Kai šilta, drėgna oro masė slenka virš šalto paviršiaus, ji atvėsta. Jei ji atvės iki jos rasos taško, tai susidarys rūkas. Kaip jis vadinamas?","a":["Advekcinis rūkas","Rradiacinis rūkas","Frontinis rūkas"],"c":[0],"expl":"Šilta, drėgna oro masė slenka virš šalto paviršiaus (pvz., šaltos žemės, sniego, vandens ar vėsios jūros), Oro masė atvėsta iki rasos taško. Drėgmė kondensuojasi, ir susidaro rūkas.","hint":""},{"id":"599","q":"Krituliai, susiję su šiltuoju frontu, iškrenta:","a":["tik praėjus šiltajam frontui","tik siauroje juostoje arti fronto linijos","prieš šiltąjį frontą"],"c":[2],"expl":"Šiltas oras slenka virš šalto oro palaipsniui ir lėtai kyla aukštyn. Todėl debesys ir krituliai formuojasi gerokai priešais patį šiltojo fronto liniją. Iš pradžių susidaro aukšti sluoksniniai debesys (Cirrostratus, Altostratus), vėliau Nimbostratus, iš kurių lygiai ir ilgai lyja arba dulksnoja.","hint":""},{"id":"600","q":"Šiltasis frontas paprastai juda:","a":["greičiau už šaltąjį frontą","lėčiau už šaltąjį frontą"],"c":[1],"expl":"Šiltas oras yra lengvesnis ir negali staigiai stumti šalto oro, todėl jis juda lėčiau.","hint":""},{"id":"601","q":"Su kokia slėgio sistema prie žemės paviršiaus yra susijusi konvergencija?","a":["Aukšto slėgio","Žemo slėgio","Pastovaus slėgio"],"c":[1],"expl":"","hint":""},{"id":"602","q":"Su kokia slėgio sistema prie žemės paviršiaus yra susijusi divergencija?","a":["Aukšto slėgio","Žemo slėgio"],"c":[0],"expl":"","hint":""},{"id":"603","q":"Koks matomumas tupiant lakūnui yra svarbiausias?","a":["Vertikalus","Nuožulnusis (tūpimo)","Horizontalus"],"c":[1],"expl":"","hint":""},{"id":"604","q":"Kokia ledo rūšimi yra pavojingiausia orlaiviams apledėti?","a":["Skaidrus, pusiau skaidrus, baltas ledas","Šerkšnas","Šarmas"],"c":[0],"expl":"","hint":""},{"id":"605","q":"Susidarius radiaciniams rūkams giedromis naktimis, o sustiprėjęs vėjas nuo 7 kt. iki 18 kt., gali:","a":["pakeisti radiacinio rūko susidarymą į advekcinį","radiacinis rūkas gali pakilti ir pereiti į žemus St formos debesis","neturėti efekto"],"c":[1],"expl":"Jeigu vėjas neišsklaidys rūko, jis jį pakels į viršų, taip suformuodamas žemus St formos debesis.","hint":""},{"id":"606","q":"Vandens užšąlimo temperatūra yra 0°C, kokia tai temperatūra pagal Farenheito skalę (paskaičiavimo formulė F=9*C /5 +32)","a":["+32F","-32F"],"c":[0],"expl":"F=9*(0°C)/5+32=>+32F","hint":""},{"id":"607","q":"Koks oras pasižymi didesniu tankumu?","a":["Šaltesnis","Šiltesnis"],"c":[0],"expl":"Esant žemesnei temperatūrai oro molekulės yra arčiau viena kitos.","hint":""},{"id":"608","q":"Kokios temperatūros oras yra lengvesnis?","a":["Šiltos","Karštos","Vėsios"],"c":[1],"expl":"Šylant orui, oro molekulės juda greičiau, todėl oras plečiasi ir tampa mažiau tankus – dėl to jis tampa lengvesnis palyginus su šaltu.","hint":""},{"id":"609","q":"Apledėjus statinio slėgio davikliui kilimo metu, spartos indikatorius (variometras) rodys:","a":["nulį","pastovų aukštėjimą","tikrąjį aukštėjimą"],"c":[0],"expl":"Variometras matuoja slėgio pasikeitimus ir taip išskaičiuoja kilimo spartą. Jeigu statinio slėgio daviklis yra užblokuojamas prietaiso sistemoje slėgis nesikeičia ir variometras rodo nulį.","hint":""},{"id":"610","q":"Apledėjus statinio slėgio davikliui kilimo metu, aukštimatis rodys:","a":["nulį","pastovų aukštį","tikrąjį aukštį"],"c":[1],"expl":"Aukštimatis veikia pagal statinį slėgį: kuo aukščiau – tuo mažesnis slėgis. Jei statinio slėgio daviklis apledėja, prietaisas nebegauna naujų slėgio duomenų. Dėl to aukštimatis rodo pastovų aukštį, kuriame užsikišo daviklis.","hint":""},{"id":"611","q":"Oro masė anticiklone šiaurės pusrutulyje juda:","a":["pagal laikrodžio rodyklę","prieš laikrodžio rodyklę"],"c":[0],"expl":"Anticiklone šiaurės pusrutulyje oras juda nuo centro, spirale pagal laikrodžio rodyklę.","hint":""},{"id":"612","q":"Oro masė ciklone šiaurės pusrutulyje juda:","a":["pagal laikrodžio rodyklę","prieš laikrodžio rodyklę"],"c":[1],"expl":"Ciklone šiaurės pusrutulyje oras juda į centrą, spirale prieš laikrodžio rodyklę.","hint":""},{"id":"613","q":"Pagrindinės standartinės atmosferos charakteristikos yra:","a":["atmosferos slėgis, oro temperatūra, oro tankis, laisvojo kritimo pagreitis","garso greitis, absoliutinis oro drėgnumas, saulės radiacijos balansas, vertikaIus temperatūros gradientas"],"c":[0],"expl":"Standartinė atmosfera turi: +15 °C temperatūrą, 1013,25 hPa slėgį jūros lygyje, ir temperatūra krenta 6,5 °C/km iki 11 km aukščio ir laisvo kritimo pagreitis: 9,806m/s^2.","hint":""},{"id":"614","q":"Kritulių rūšys pagal formą yra:","a":["liūtiniai ir ištisiniai","lietus, sniegas, sniego kruopos, dulksna, kruša","abu teisingi"],"c":[1],"expl":"Pagal formą (fizinę būklę / rūšį): lietus, sniegas, dulksna, sniego kruopos, kruša, ledukai. Pagal iškritimo pobūdį (intensyvumą, trukmę): liūtiniai (trumpalaikiai, stiprūs, iš kamuolinių debesų) ištisiniai (ilgalaikiai, iš sluoksninių debesų).","hint":""},{"id":"615","q":"Į METAR informaciją įjungiami atmosferos slėgio duomenys pagal slėgį:","a":["QFF","QFE","QNH"],"c":[2],"expl":"","hint":""},{"id":"616","q":"Į METAR informacija įjungiami duomenys apie:","a":["gradientinį vėją","terminį vėją","prie žeminį vėją"],"c":[2],"expl":"","hint":""},{"id":"617","q":"Vietiniai vėjai, brizai, vadinami:","a":["kalnų/slėnių","kranto/jūros"],"c":[1],"expl":"Brizas – tai periodiškai besikeičiantis vietinis vėjas, susiformuojantis dėl temperatūrų skirtumų tarp sausumos ir vandens (jūros, ežero).","hint":""},{"id":"618","q":"Visi reiškiniai, susiję su perkūnija, maksimalų intensyvumą turi:","a":["pirmoje išsivystymo stadijoje","antroje išsivystymo stadijoje","trečioje stadijoje"],"c":[1],"expl":"Susidaro Cumulus (kamuoliniai) debesys, kurie sparčiai auga aukštyn-(pirma išsivystymo stadija). Debesys tampa Cumulonimbus – labai aukšti lietaus kamuoliniai debesys. Prasideda lietus, žaibai, griaustinis, gali būti kruša ar stiprūs vėjai-(Maksimalus Cb išsivystymo stadija() antra išsivystymo stadija). Vyraujantys žemėjantys oro srautai slopina debesies augimą. Krituliai silpsta, žaibavimas ir griaustinis pamažu išnyksta. Debesis suyra, išsisklaido, o oras stabilizuojasi.(trečia stadija).","hint":""},{"id":"619","q":"Saulės radiacija yra:","a":["ilgabangė","trumpabangė"],"c":[1],"expl":"Saulė skleidžia elektromagnetinę spinduliuotę daugiausia trumpesnio bangos ilgio diapazone – tai matoma šviesa, ultravioletinė ir dalis infraraudonosios spinduliuotės. Tokia spinduliuotė vadinama trumpabangė.","hint":""},{"id":"620","q":"Gana dideli statinės elektros krūviai būna susikaupę:","a":["Sc debesyse","Cs debesyse","Ns debesyse","Visi"],"c":[2],"expl":"Dideli statinės elektros krūviai susikaupia tik debesyse su aktyvia vertikaline oro cirkuliacija Ns, Cb debesyse. Tuo tarpu Sc ir Cs debesyse tokios stiprios konvekcijos nėra arba ji labai silpna, todėl krūviai yra minimalūs.","hint":""},{"id":"621","q":"Terminė turbulencija sąlygoja:","a":["sluoksninių formų debesų vystymąsi","kamuolinių formų debesų vystymąsi"],"c":[1],"expl":"Terminė turbulencija atsiranda dėl žemės paviršiaus nevienodo įkaitimo, kai šiltas oras kyla į viršų kaip šilti stulpai (termikai). Šis kylantis šiltas oras sukuria konvekciją, kuri skatina formuotis kamuolinius debesis.","hint":""},{"id":"622","q":"Kruša sutinkama:","a":["Cb debesyse","giedrame danguje","abu teisingi"],"c":[0],"expl":"Kumulonimbuso (Cb) debesyse vyksta intensyvios konvekcijos, stiprios vertikalios oro srovės, dėl ko susidaro ledinės dalelės ir kruša. Kruša negali susiformuoti giedrame danguje, nes tam reikia stiprių debesų su šaltomis zonomis ir vertikaliomis oro srovėmis. Todėl kruša būdinga tik Cb debesims.","hint":""},{"id":"623","q":"Stiprūs vėjo poslinkiai susiję su sinoptinėmis situacijomis:","a":["artėjant ir prieinant atmosferos frontams","išsivystant perkūnijos Cb debesims","susidarant inversijos ir izotermijos sluoksniams","visi trys teisingi","a ir b atsakymai teisingi"],"c":[4],"expl":"Artėjant ir praeinant atmosferos frontams — dažnai vyksta stiprūs vėjo poslinkiai dėl oro masių susidūrimo ir slėgio pokyčių. Išsivystant perkūnijoms (Cb debesims) — stiprios konvencinės srovės ir audros metu vėjas gali labai smarkiai keistis, įskaitant gūsius ir poslinkius. Susidarant inversijos ir izotermijos sluoksniams — tokie sluoksniai dažniau stabdo vertikalią oro cirkuliaciją ir vėjo poslinkiai nėra tokie reikšmingi kaip a) ir b) atvejais.","hint":""},{"id":"624","q":"Kuriuo paros metu su šiltaisiais frontais išsivysto perkūnijos:","a":["dieną","16-17 val.","naktį"],"c":[1],"expl":"Perkūnijos su šiltaisiais frontais dažniausiai išsivysto vėlyvą popietę apie 16–17 val., kai žemės paviršius įkaitęs ir atmosferoje susidaro sąlygos stipriai konvekcijai.","hint":""},{"id":"626","q":"Palankios sąlygos garavimo rūkams formuotis susidaro:","a":["sumažėjus slėgiui prieš šiltąjį frontą","slenkant šaltai oro masei šilto vandens paviršiumi","kai oras slinkdamas šlaitu aukštyn, patenka į žemesnio slėgio lauką"],"c":[1],"expl":"Ramiomis naktimis arba ankstyvą rytą, kai oras yra drėgnas. Kai vandens paviršius šiltesnis už viršutinį oro sluoksnį. Esant aukštai santykinei oro drėgmei ir dažnai ramiuose, buvėjuose orų sąlygose.","hint":""},{"id":"627","q":"Kokios yra būtinos sąlygos susidaryti konvekciniam rūkui?","a":["Drėgnas oras","Giedra naktis, drėgnas oras, silpnas vėjas","Saulėta diena, silpnas vėjas, drėgnas oras"],"c":[2],"expl":"Konvencinis rūkas susidaro dieną, kai nuo įkaitusio paviršiaus kyla drėgnas oras. Pakildamas jis vėsta, o jei oras pakankamai prisotintas drėgmės – susidaro rūkas.","hint":""},{"id":"628","q":"Virš kurių vietų, šviečiant saulei, vyrauja aukščiausia temperatūra prie pat žemės paviršiaus?","a":["Virš pelkių","Virš sausos žemės","Virš miškų","Virš jūrų ir ežerų"],"c":[1],"expl":"Tamsūs paviršiai sugeria daugiau saulės spinduliuotės. Sausi paviršiai turi mažesnį šilumos talpumą ir greičiau įkaista. Miesto teritorijos (urbanizuoti plotai) dažnai sudaro vadinamąjį šilumos salos efektą – jose temperatūra žymiai aukštesnė nei aplinkinėje kaimo ar miškingoje vietovėje.","hint":""}]},"Navigacija":{"slug":"navigacija","questions":[{"id":"6","q":"Geografinė platuma (ltitude) matuojama kampo laipsniais, minutėmis ir sekundėmis ir atskaitoma:","a":["Į šiaurę ir pietus nuo ekvatoriaus nuo 0 laipsnių iki (+ / –) 90 laipsnių.","Į rytus ir vakarus nuo pradinio (Grinvičo) meridiano nuo 0 laipsnių iki (+ / –) 180 laipsnių."],"c":[0],"expl":"Geografinė platuma – tai atstumas nuo ekvatoriaus į šiaurę arba pietus, matuojamas kampiniais laipsniais. Ji svyruoja nuo 0° prie ekvatoriaus iki 90° šiaurės platumos (žymima N) arba 90° pietų platumos (žymima S).","hint":""},{"id":"11","q":"Geografinė ilguma (longitude) matuojama kampo laipsniais, minutėmis ir sekundėmis ir atskaitoma:","a":["Į rytus ir vakarus nuo pradinio (Grinvičo) meridiano nuo 0 laipsnių iki (+ / –) 180 laipsnių.","Į šiaurę ir pietus nuo ekvatoriaus nuo 0 laipsnių iki (+ / –) 90 laipsnių."],"c":[0],"expl":"Geografinė ilguma – tai kampinis atstumas nuo Grinvičo (nulinio) meridiano į rytus arba vakarus. Ilguma matuojama laipsniais, minutėmis ir sekundėmis, o jos reikšmės svyruoja nuo 0° iki 180° rytų ilgumos (E) arba 180° vakarų ilgumos (W).","hint":""},{"id":"397","q":"Ekvatorius žemė dalija į pusrutulius:","a":["šiaurinį ir pietinį","rytų ir vakarų"],"c":[0],"expl":"","hint":""},{"id":"398","q":"Žiūrint nuo Šiaurės pusrutulio Žemė sukasi apie savo ašį:","a":["pagal laikrodžio rodyklę","prieš laikrodžio rodyklę"],"c":[1],"expl":"","hint":""},{"id":"399","q":"Žiūrint nuo Pietų pusrutulio Žemė sukasi apie savo ašį:","a":["pagal laikrodžio rodyklę","prieš laikrodžio rodyklę"],"c":[0],"expl":"","hint":""},{"id":"400","q":"Žemės ekvatoriaus 1° lanko ilgis L=111 km. Koks bus 1° lanko ilgis Lx žemės paviršiaus 60° Platumoje? Žinoma, kad L×=L'cos( (p):","a":["Lx-55,5 km","L×-80 km","Lx-60,5 km"],"c":[0],"expl":"Norint apskaičiuoti vieno laipsnio ilgumos lanko ilgį 60° platumoje, reikia žinoti, kad Žemės paviršius yra sferinis, todėl ilgumos laipsnio lanko ilgis priklauso nuo geografinės platumos. Prie ekvatoriaus, kur platuma yra 0°, 1° ilgumos atitinka apie 111 kilometrų. Tačiau kylant link polių, šis ilgis mažėja, nes ilgumos linijos artėja viena prie kitos. Norint rasti 1° ilgumos lanko ilgį bet kurioje kitoje platumoje, naudojama formulė: Lx = L × cos(φ), kur L – lanko ilgis ekvatoriuje (111 km), φ – platuma, o cos(φ) – kampo kosinusas. Šiuo atveju platuma yra 60°, todėl randame cos(60°), kuris yra 0,5, ir padauginame: 111 × 0,5 = 55,5 km. Taigi, 1° ilgumos lanko ilgis 60° platumoje yra 55,5 kilometro.","hint":""},{"id":"401","q":"Žemės rutulys suskirstytas į 24 laiko juostas. Viena laiko juosta apima:","a":["13 laipsnių","12 laipsnių","10 laipsnių","15 laipsnių"],"c":[3],"expl":"Žemės rutulys yra padalintas į 24 laiko juostas , nes para turi 24 valandas. Kadangi visas Žemės apskritimas yra 360 laipsnių , kiekviena laiko juosta apima: 360° ÷ 24 = 15°.","hint":""},{"id":"402","q":"Kilimo-tūpimo takas, kurio magnetinė kryptis yra 273° žymimas taip:","a":["RWY 27","RWY 027"],"c":[0],"expl":"Kilimo-tūpimo takai žymimi pagal jų magnetinę kryptį , suapvalintą iki artimiausio dešimties laipsnių.","hint":""},{"id":"403","q":"Kilimo-tūpimo takas, kurio magnetinė kryptis yra 073° žymimas taip:","a":["RWY 07","RWY 08","RWY 073"],"c":[],"expl":"Kilimo-tūpimo takai žymimi pagal jų magnetinę kryptį , suapvalintą iki artimiausio dešimties laipsnių","hint":""},{"id":"404","q":"Kai aerodromo kilimo-tūpimo tako kursas yra 353°, priešingas kursas paskaičiuojamas taip:","a":["353-180","353+ 180"],"c":[0],"expl":"Norint rasti priešingą kursą (t. y. tako kitą kryptį), prie esamos krypties pridedama arba atimama 180° . Svarbu, kad gautas rezultatas būtų tarp 0° ir 360°, todėl jei suma viršija 360°, reikia atimti 360°.","hint":""},{"id":"405","q":"Nuo Grinvičo meridiano matuojama:","a":["Geografinė ilguma","Geografinė platuma"],"c":[0],"expl":"Geografinė ilguma matuojama nuo Grinvičo (nulinio) meridiano į rytus arba vakarus. Ji nurodo vietos padėtį rytų–vakarų kryptimi ir svyruoja nuo 0° iki 180° rytų ilgumos (E) arba 180° vakarų ilgumos (W).","hint":""},{"id":"406","q":"Geografinė ilguma matuojama nuo:","a":["nuo Grinvičo meridiano","nuo centrinės Europos"],"c":[0],"expl":"Geografinė ilguma matuojama nuo Grinvičo (nulinio) meridiano į rytus arba vakarus iki 180 laipsnių. Ji nustato vietos padėtį rytų–vakarų kryptimi.","hint":""},{"id":"407","q":"Nuo ekvatoriaus matuojama:","a":["geografinė ilguma","geografinė platuma"],"c":[1],"expl":"Geografinė platuma matuojama nuo ekvatoriaus į šiaurę arba pietus, nustatant vietos padėtį šiaurės–pietų kryptimi.","hint":""},{"id":"408","q":"Geografinė platuma matuojama nuo:","a":["nuo ekvatoriaus","nuo Grinvičo meridiano"],"c":[0],"expl":"Geografinė platuma matuojama kampo laipsniais nuo ekvatoriaus į šiaurę arba pietus.","hint":""},{"id":"409","q":"Magnetinė kryptis žemėje matuojama remiantis:","a":["žemės magnetizmu (magnetiniu lauku) nuo magnetinio meridiano","žemės magnetizmu (magnetiniu lauku) nuo šiaurės ir rytų"],"c":[0],"expl":"Magnetinė kryptis matuojama pagal Žemės magnetinį lauką ir nurodoma kampu nuo magnetinio meridiano, kuris yra linija, jungianti magnetinį šiaurės ir pietų polius.","hint":""},{"id":"410","q":"Kampas tarp Tikrosios ir Magnetinės šiaurės krypčių vadinamas:","a":["deklinacija (variation)","deviacija (deviation)"],"c":[0],"expl":"Deklinacija yra kampas tarp tikrosios (geografinės) šiaurės ir magnetinės šiaurės.","hint":""},{"id":"411","q":"Žemės Tikrasis ir Magnetinis šiaurės ašigaliai yra:","a":["skirtingose vietose","tose pačiose vietose"],"c":[0],"expl":"","hint":""},{"id":"412","q":"Magnetinė deklinacija gali būti:","a":["teigiama +E ir neigiama –W (Rytų (E) (+) ir Vakarų (W) (-)","Teigiama +W ir neigiama – E"],"c":[0],"expl":"Magnetinė deklinacija yra kampas tarp tikrosios (geografinės) šiaurės ir magnetinės šiaurės. Jeigu magnetinė šiaurė yra į rytus nuo tikrosios šiaurės, deklinacija yra teigiama (+E). Jeigu magnetinė šiaurė yra į vakarus , deklinacija yra neigiama (–W).","hint":""},{"id":"413","q":"Aeronavigaciniame žemėlapyje izogona paženklinta pvz.: 5W tai reiškia:","a":["Magnetine deklinacija sudaro AM=+5 (magnetinis meridianas nukrypęs nuo geografinio į dešinę 5 laipsniais)","Magnetinė deklinacija sudaro AM=-5 (magnetinis meridianas nukrypęs nuo geografinio į kairę 5 laipsniais)"],"c":[1],"expl":"Jeigu aeronavigaciniame žemėlapyje izogona pažymėta kaip 5W , tai reiškia, kad magnetinė šiaurė yra 5 laipsniais į vakarus nuo tikrosios (geografinės) šiaurės . Tokia deklinacija yra neigiama , nes nukrypimas yra į kairę (į vakarus).","hint":""},{"id":"414","q":"Aeronavigaciniame žemėlapyje izogona paženklinta pvz.:5E - tai reiškia:","a":["magnetinė deklinacija sudaro delta M +5 laipsniai (magnetinis meridianas nukrypęs nuo geografinio į dešinę 5 laipsniais)","magnetinė deklinacija sudaro AM=-5 (magnetinis meridianas nukrypęs nuo geografinio į kairę 5 laipsniais)"],"c":[0],"expl":"Jeigu aeronavigaciniame žemėlapyje izogona pažymėta 5E, tai reiškia, kad magnetinė šiaurė yra 5 laipsniais į rytus nuo geografinės šiaurės. Tai yra teigiama deklinacija, nes nukrypimas vyksta į dešinę.","hint":""},{"id":"415","q":"Žemėlapyje, išmatavus geografinį (tikrąjį) kelio kampą (TKK) ir apskaičiuojant magnetinį kelio kampą MKK), reikia:","a":["MKK=TKK + ( +/ - delta M)","MKK=TKK - ( +/ - delta M)"],"c":[1],"expl":"","hint":""},{"id":"416","q":"Žemėlapyje išmatuotas tikrasis kursas 080° ir deklinacija yra 8°E. Tam, kad skristi išmatuota kelio linija, pilotas turi laikyti magnetinį kursą:","a":["MKK=72 laipsnius","MKK= 88 laipsnius"],"c":[],"expl":"TKK=MKK+(+/-delta M) => MKK=TKK-(+/-delta M); MKK= 080°-(+8) =72°","hint":""},{"id":"417","q":"Nuo Vilniaus link Utenos tikrasis kursas yra 010°. Kokiu magnetiniu kursu turi skristi orlaivis, jei deklinacija yra 5E?","a":["MKK= 05 laipsniai","MKK= 15 laipsniai"],"c":[0],"expl":"TKK=MKK+(+/-delta M) => MKK=TKK-(+/-delta M); MKK= 010°-(+5) = 05°","hint":""},{"id":"418","q":"Kokia vidutinė magnetinė deklinacija yra Lietuvoje? (2024 žemėlapis)","a":["a) 6° E","b) 5° W","c) 8° E"],"c":[2],"expl":"","hint":""},{"id":"419","q":"Orlaivio konstrukcijos geležinės detalės magnetinio kompaso rodomą kursą:","a":["įtakos neturi","iškreipia"],"c":[1],"expl":"Paaiškinimas: orlaivio konstrukcijos geležinės ar kitos feromagnetinės medžiagos detalės daro poveikį magnetinio kompaso rodymams, nes jos sukuria vietinius magnetinius laukus, kurie gali iškraipyti Žemės magnetinio lauko kryptį kompaso aplinkoje. Šis reiškinys vadinamas deviacijos paklaida, ir kiekvienam orlaiviui ji yra individuali, priklausomai nuo jo konstrukcijos, įrangos ir net krovinių. Todėl magnetinis kompasas gali rodyti netiksliai, jei šios įtakos nėra atitinkamai koreguojamos.","hint":""},{"id":"420","q":"Tam, kad būtų išvengta kompaso paklaidų, visi metaliniai ir įmagnetinti daiktai orlaivyje turi būti :","a":["išdėstyti kuo toliau nuo magnetinio kompaso","padengti specialia antimagnetine medžiaga"],"c":[0],"expl":"","hint":""},{"id":"421","q":"Kai orlaivis yra 4nm nuo tūpimo taško ir glisados kampas 3°, orlaivio aukštis turi būti (aukštis=Kampas(Glisada) ×100 x Nuotolis):","a":["1100ft","1200ft","1600ft"],"c":[1],"expl":"Aukštis = (3°) x 100 x (4)= 1200","hint":""},{"id":"422","q":"Kai orlaivis nutolęs 3nm nuo tūpimo taško ir glisados kampas 5,5°, orlaivio aukštis turi būti (aukštis= Kampas (GIisada)x 100 x Nuotolis):","a":["1650ft","1800ft","1300ft"],"c":[0],"expl":"Aukštis = (5,5°) x 100 x (3)= 1650","hint":""},{"id":"423","q":"LR teritorijoje vasaros laikas (UTC+2H) įvedamas ir atšaukiamas (UTC+1H):","a":["paskutinį kovo sekmadienį 0,00 val. UTC ir paskutinį rugsėjo sekmadienį 0,00 val. UTC","0,00 val. UTC","pagal LR vyriausybės nurodymą atsižvelgiant į datą"],"c":[0],"expl":"","hint":""},{"id":"424","q":"Orlaivio magnetinis kursas (MK) yra kampas tarp:","a":["šiaurės krypties magnetinio meridiano ir išilginės orlaivio ašies","šiaurės krypties tikrojo (geografinio) meridiano ir išilginės orlaivio ašies"],"c":[0],"expl":"","hint":""},{"id":"425","q":"Duotasis magnetinis kelio kampas (MKK) yra kampas tarp:","a":["nuo šiaurės krypties magnetinio meridiano iki duotos kelio linijos","nuo šiaurės krypties tikrojo (geografinio) meridiano iki duotos kelio linijos"],"c":[1],"expl":"","hint":""},{"id":"426","q":"Kaip vadinamas kampas tarp magnetinės ir korpusinės šiaurės?","a":["magnetinis kelio kampas","kompaso deviacija (delta +/- K )","magnetinė deklinacija"],"c":[0],"expl":"","hint":""},{"id":"427","q":"Kaip vadinamas kampas tarp tikrosios ir magnetinės šiaurės?","a":["inklinacija","deklinacija (delta +/-M)"],"c":[1],"expl":"","hint":""},{"id":"428","q":"Orlaivio nuonašos kampas (NšK) yra kampas tarp:","a":["tarp orlaivio išilginės ašies ir faktines kelio linijos","tarp orlaivio išilginės ašies ir magnetinės krypties"],"c":[0],"expl":"","hint":""},{"id":"429","q":"Kai vėjas keliui statmenas, vėjo kampas yra:","a":["90 laipsnių","180 laipsnių"],"c":[0],"expl":"","hint":""},{"id":"430","q":"Orlaivio magnetinis pelengas (OMP) skiriasi nuo radijo Švyturio (RŠ) magnetinio pelengo (RMP):","a":["OPM=RMP+ - 180 laipsniai","OMP=RMP+ - 90 laipsniai"],"c":[0],"expl":"","hint":""},{"id":"431","q":"Radijo švyturio magnetinis pelengas matuojamas:","a":["Kampas atskaičiuotas nuo šiaurės krypties orlaivio magnetinio meridiano iki krypties į radijo švyturį (RŠ)","Kampas atskaičiuotas nuo šiaurės krypties magnetinio meridiano praeinančio per RŠ iki krypties orlaivio lik"],"c":[1],"expl":"Radijo švyturio magnetinis pelengas apibrėžiamas kaip kampas tarp magnetinės šiaurės krypties švyturio vietoje ir krypties iš švyturio į orlaivį . Kitaip sakant, tai yra kryptis, kuria švyturys „mato “orlaivį. Šis pelengas dažnai naudojamas žemėlapiuose ir skrydžių planavime.","hint":""},{"id":"432","q":". Esant temperatūrai žemesnei kaip +15°C, pilotas, norėdamas išlaikyti tikslų aukštį prie aukštimačio rodomo aukščio, temperatūrinę paklaidą (Ht=(t_0-15)/300×H) , privalo:","a":["Pridėti","atimti"],"c":[0],"expl":"Esant temperatūrai žemesnei nei +15°C, tikrasis aukštis yra mažesnis už aukštimačio rodmenis dėl tankesnio oro ir greičiau krentančio slėgio. Todėl, norėdamas išlaikyti tikslų aukštį virš žemės, pilotas turi pridėti temperatūrinę pataisą prie aukštimačio rodomo aukščio, kitaip jis gali skristi žemiau nei numatyta ir susidurti su kliūtimis.","hint":""},{"id":"433","q":"Kai oro temperatūra aukštesnė negu Tarptautinėje standartinėje atmosferoje (ISA), dėl sumažėjusio oro tankio aukštimatis rodo:","a":["mažesnį aukštį kaip barometrinis","didesnį aukštį kaip barometrinis","lygus QNH lygiui","lygus QFE lygiui"],"c":[1],"expl":"","hint":""},{"id":"434","q":"Koks oras tankesnis?","a":["šiltesni (lengvesnis)","šaltesnis (sunkesnis)"],"c":[1],"expl":"Šaltesnis oras yra tankesnis, nes temperatūrai krentant, molekulės juda lėčiau ir susispaudžia arčiau viena kitos, todėl oras tampa sunkesnis ir tankesnis. Priešingai, šiltesnis oras plečiasi, molekulės tolsta viena nuo kitos, todėl oras tampa lengvesnis ir mažiau tankus. Tai yra pagrindinė priežastis, kodėl šaltas oras yra tankesnis už šiltą.","hint":""},{"id":"435","q":"Koks oras lengvesnis?","a":["šaltas","karštas"],"c":[1],"expl":"Šiltesnis oras yra lengvesnis, nes kai temperatūra kyla, oro molekulės pradeda judėti sparčiau ir išsiplečia, dėl to oro tankis mažėja.","hint":""},{"id":"436","q":"Didėjant aukščiui temperatūra laipsniškai mažėja:","a":["krenta kas 100 metrų po -O,65C laipsnių","krenta kas 1km po -10C laipsnių","krenta kas 100 metrų po -O,3C laipsnių"],"c":[0],"expl":"","hint":""},{"id":"437","q":"Išskyrus, kuomet orlaivis kyla arba leidžiasi aerodrome, arba esant spec. leidimui vizualūs skrydžiai virš miestų, žmonių susibūrimo vietų, turi būti vykdomi ne žemiau, kaip:","a":["a) 300 m (1000 ft)","b) 450 m ( 1500 ft) MSL","c) 150 m"],"c":[0],"expl":"","hint":""},{"id":"438","q":"Išskyrus, kuomet orlaivis kyla arba leidžiasi, VST (VFR) skrydžiai be specialaus leidimo negali būti vykdomi žemiau, kaip:","a":["150 m (500 ft) virš žemės ar vandens paviršiaus","300 m (1000 ft) MSL"],"c":[0],"expl":"","hint":""},{"id":"439","q":"Skraidymai virš Ignalinos AE spinduliu R=5.4 NM (10 km) (Rajonas EYP1) draudžiami:","a":["195 FL/GND","140 FL/GND"],"c":[0],"expl":"","hint":""},{"id":"440","q":"Vizualūs skrydžiai (VFR) LR oro erdvėje be specialaus leidimo nevykdomi aukščiau skrydžio lygio (FL):","a":["FL 100","FL 195","FL 60"],"c":[1],"expl":"","hint":""},{"id":"441","q":"Vizualių skrydžių, žemiau 4500 ft MSL, nekontroliuojamojoje oro erdvėje, aukštis atskaitomas pagal:","a":["MSL","QNH","QFE","QNE"],"c":[1],"expl":"Vizualaus skrydžio metu, žemiau 4500 ft MSL nekontroliuojamoje oro erdvėje, aukštis paprastai atskaitomas pagal QNH – tai vietinis barometrinis slėgio nustatymas, kuris koreguoja aukštimatį taip, kad jis rodytų aukštį virš jūros lygio (MSL).","hint":""},{"id":"442","q":"Vizualūs skrydžiai LR \"G\" tipo erdvėje galimi, kai orlaivio V < arba = 140 KT (260 km/h), esant meteo sąlygom:","a":["matomumas VIS >3 km nepatenkant į debesis, matomas žemes ir vandens paviršius","matomumas VIS > 5 km nepatenkant į debesis, matomas žemės ir vandens paviršius"],"c":[0],"expl":"","hint":""},{"id":"443","q":"Vizualios orientacijos žemėlapyje rajonai nuspalvinti žaliai yra:","a":["miškai","upės","kalnai"],"c":[0],"expl":"","hint":""},{"id":"444","q":"Vizualios orientacijos žemėlapyje rajonai nuspalvinti mėlynai yra:","a":["miškai","upės","kalnai","vandenys"],"c":[3],"expl":"","hint":""},{"id":"445","q":"Vizualios orientacijos žemėlapyje rajonai nuspalvinti rudai yra:","a":["miškai","upės","kalvos ir kalnai"],"c":[2],"expl":"","hint":""},{"id":"446","q":"Orlaivį ištikus nelaimei ar pavojui, praradus orientuotę ir nesant kitokiam radijo ryšiui, įgula naudoja radijo dažnį:","a":["121,5 mHz","124,0 mhz","118,01 mhz"],"c":[0],"expl":"","hint":""},{"id":"447","q":"Tarptautinis signalas, perduodamas radiotelefonu, norint pranešti apie galinčią kilti grėsmę keleiviams, bei ekipažui, esantiems orlaivyje:","a":["MAYDAY","PAN","SOS"],"c":[1],"expl":"","hint":""},{"id":"448","q":"Kilus grėsmei keleivių ir įgulos saugumui kai būtina neatidėliotina pagalba, tarptautinis pavojaus signalas perduodamas žodžiu:","a":["MAYDAY","PAN","SOS"],"c":[0],"expl":"","hint":""},{"id":"449","q":"Skrydžio planas (FPL) į (iš) LR oro erdvę turi būti pateiktas ne vėliau, kaip:","a":["prieš 1 val.","prieš 3 val.","pieš 12 val. iki išskridimo datos","prieš 30 min","24 val. prieš skrydį"],"c":[3],"expl":"","hint":""},{"id":"450","q":"Ilgio matas anglų mylia (mile) sudaro","a":["1609 m","1852 m"],"c":[0],"expl":"","hint":""},{"id":"451","q":"Ilgio matas Jūrmylė (NM) sudaro:","a":["1852 m","1609 m"],"c":[0],"expl":"","hint":""},{"id":"452","q":"Ilgio matas Jūrmylė (NM) sudaro:","a":["1852 m","1609 m"],"c":[0],"expl":"","hint":""},{"id":"453","q":"Greičio mato vienetas 1 kt (mazgas) atitinka","a":["1,852 km/h=0.5 m/s","1609.344 m/h"],"c":[0],"expl":"","hint":""},{"id":"454","q":"Greičio matas MPH (mylios per val.) atitinka:","a":["1 mazgą (NM/ val.)","1 anglų mylią per val.","Statutinę mylia per val."],"c":[1],"expl":"","hint":""},{"id":"455","q":"Orlaivio greitis 200 km/h apytikriai atitinka:","a":["110 KT","360 KT","240 KT"],"c":[0],"expl":"Konvertavimas: 200km/h ÷1,852≈108 KT","hint":""},{"id":"456","q":"Orlaivio greitis 250 KT apytikriai atitinka:","a":["460 km/h","500 km/h","550 km/h"],"c":[0],"expl":"Konvertavimas: 250KT x 1,852 ≈ 460Kt","hint":""},{"id":"457","q":"Greičio matas 1 m/s atitinka:","a":["2 KT","0,5 KT"],"c":[0],"expl":"","hint":""},{"id":"458","q":"Vertikalus orlaivio greitis Vy= 10 m/s apytikriai atitinka:","a":["2000 ft/min","1000 ft/min","200 ft/min"],"c":[0],"expl":"Norint apskaičiuoti, pirmiausia reikia metrus per sekundę paversti į pėdas – vienas metras lygus 3,28084 pėdos, todėl 10 m/s yra lygu 10 × 3,28084 = 32,8084 pėdos per sekundę. Tuomet šį greitį paverčiame į pėdas per minutę, padaugindami iš 60 (nes vienoje minutėje yra 60 sekundžių): 32,8084 × 60 = 1968,504. Taigi, 10 m/s ≈ 1968,5 ft/min, o tai apytiksliai yra 2000 ft/min.","hint":""},{"id":"459","q":"Vertikalus orlaivio greitis Vy=2000 ft/min apytikriai atitinka","a":["30 m/s","20 m/s","10 m/s"],"c":[2],"expl":"Norint tai apskaičiuoti, pirmiausia reikia pėdas per minutę paversti į metrus per sekundę: viena pėda yra lygi 0,3048 metro, todėl 2000 pėdų per minutę padauginus iš 0,3048 gauname 609,6 metro per minutę, o padalijus iš 60 (kad gautume metrus per sekundę), gauname 609,6 ÷ 60 = 10,16 m/s.","hint":""},{"id":"460","q":"Standartinis atmosferos slėgis yra:","a":["P=1013.2 hPa; P=760 mmHg; P=29.92 inches Hg","P=1003 hPa; P=762 mmHg; P=29.92 inches Hg"],"c":[0],"expl":"","hint":""},{"id":"461","q":"Slėgio vienetas 1 mmHg atitinka:","a":["1,3 hPa","0,75 mb"],"c":[0],"expl":"","hint":""},{"id":"462","q":"Slėgio vienetas 1 hPa atitinka:","a":["1,5 mm","1,3 mm","0,75 mm"],"c":[2],"expl":"","hint":""},{"id":"463","q":"Ilgio vienetas inch sudaro:","a":["25,4 mm","30,5 mm","22,5 mm"],"c":[0],"expl":"","hint":""},{"id":"464","q":"Kai aukštimačio barometrinėje skalėje nustatytas slėgis QNH -jis rodo:","a":["absoliutų aukštį (altitudę)","santykinį aukštį","skrydžio lygį (FL)"],"c":[0],"expl":"","hint":""},{"id":"465","q":"Kuomet aukštimačio barometrinėje skalėje nustatytas slėgis 1013 hPa (760 mmHg) jis rodo:","a":["absoliutų aukštį (altitudę)","santykinį aukštį","skrydžio lygį (FL)"],"c":[2],"expl":"","hint":""},{"id":"466","q":"Kai aukštimačio barometrinėje skalėje nustatytas slėgis QFE (slėgis aerodromo paviršiuje) jis rodo:","a":["absoliutų aukštį (altitude)","santykinį aukštį","skrydžio lygį (FL)"],"c":[1],"expl":"","hint":""},{"id":"467","q":"Pilotas, prieš išskrendant, neturėdamas meteo informacijos aukštimatyje nustato slėgį QNH, kurį randa (paskaičiuoja):","a":["nustato aukštimatyje aerodromo aukštį ir baroskalėje atskaito slėgį QNH","paskaičiuoja QNH","aukštimačio baroskalėje nustato slėgį 1013 hPa (760 mm Hg)"],"c":[0],"expl":"Pilotas, prieš išskrendant, neturėdamas meteorologinės informacijos, aukštimatyje gali nustatyti slėgį QNH, atlikdamas aukštimačio baroskalės kalibravimą pagal žinomą aerodromo aukštį. Tai reiškia, kad jis nustato aukštimatyje aerodromo aukštį ir baroskalėje atskaito slėgį QNH .","hint":""},{"id":"468","q":"Įgulai vykdant skrydį maršrutu, orlaivyje privalo būti aeronavigacinė informacija ir žemėlapiai, kurie apima:","a":["visą planuotą maršrutą ir praskrendamus aerodromus, įskaitant galimus nukrypimus į atsarginį aerodromą","aeronavigacinė informacija ir žemėlapiai, apimantys planuotą maršrutą ir išvykimo bei atvykimo aerodromus"],"c":[0],"expl":"Įgulai vykdant skrydį maršrutu privalo turėti aeronavigacinę informaciją ir žemėlapius, kurie apima ne tik planuotą maršrutą, bet ir visus praskrendamus aerodromus bei galimus nukrypimus į atsarginį aerodromą. Tai užtikrina, kad įgula būtų pasirengusi įvairioms situacijoms ir galėtų saugiai pakeisti maršrutą jei prireiktų.","hint":""},{"id":"469","q":"Kiek NAVSTAR/GPS palydovų minimaliai reikia nustatyti vietos pozicijai:","a":["4","3","1"],"c":[0],"expl":"Minimalus NAVSTAR/GPS palydovų skaičius, reikalingas vietos pozicijai nustatyti, yra 4 . Trys palydovai leidžia nustatyti erdvinę poziciją trimis koordinatėmis (x, y, z), o ketvirtasis palydovas reikalingas laikui sinchronizuoti, kad būtų užtikrintas tikslus pozicijos apskaičiavimas.","hint":""},{"id":"470","q":"Kokius segmentus turi Pasaulinė navigacinė vietos nustatymo sistema GPS?","a":["palydovinį, kontroliuojamą, antžeminį","antžeminį","kontroliuojamą"],"c":[0],"expl":"Pasaulinė navigacinė vietos nustatymo sistema GPS turi tris pagrindinius segmentus: palydovinį, kontroliuojamą ir antžeminį . Palydovinį segmentą sudaro palydovai orbitoje, kontroliuojamą segmentą – valdymo stotys, o antžeminį segmentą – naudotojų įranga.","hint":""},{"id":"471","q":"GPS imtuvas pagal gautus palydovų nuotolius apskaičiuoja vietą ir judesį. Teiginys yra:","a":["neteisingas","teisingas"],"c":[1],"expl":"","hint":""},{"id":"472","q":"GPS naudotojų skaičius yra:","a":["neribotas","ribotas"],"c":[0],"expl":"","hint":""},{"id":"473","q":"Skrydžiui maršrutu geriausia žemėlapį nukreipti:","a":["skrydžio (maršruto) kryptimi","laikyti žemėlapį įprastai"],"c":[0],"expl":"","hint":""},{"id":"474","q":"Kokią reikšmę turi skaičius „658\" Lietuvos vizualiųjų skrydžių žemėlapyje. Kurio koordinatės 55;54`N, 23;53`E?. (2024 žemėlapis)","a":["žemėjimą","aukštį","greitį"],"c":[1],"expl":"","hint":""},{"id":"475","q":"Naudodamiesi Lietuvos vizualiųjų skrydžių žemėlapiu nustatykite, su kuo ir kokiu dažniu skrendant maršrutu: Kyviškės – Nemenčinė - Kaišiadorys - Aleksotas bus palaikomas radijo ryšys nevaldomoje oro erdvėje?","a":["su Vilniaus 123,855, Kauno 124,605","tik su Kauno 124,605","tik su Vilniaus 123,855"],"c":[0],"expl":"","hint":""},{"id":"476","q":"Skrendate 300 m aukštyje 300 km/h (165 kts) greičiu. Esate 15 km (8 nm) iki kontrolinio taško. Duota komanda aukštėti taip, kad virš kontrolinio punkto būtumėte 750 m aukštyje. Kokią aukštėjimo Sparta privalote laikyti?","a":["5 m/s","2,5 m/s","3 m/s"],"c":[1],"expl":"Skrendate 300 metrų aukštyje ir turite pasiekti 750 metrų aukštį iki kontrolinio taško, kuris yra už 15 kilometrų. Tai reiškia, kad reikia pakilti 450 metrų. Skridimo greitis yra 300 km/h, o tai sudaro 83,33 metrų per sekundę. Skrydžio trukmė iki kontrolinio taško bus 15 000 metrų padalinta iš 83,33 m/s, tai yra apie 180 sekundžių. Norint per tiek laiko pakilti 450 metrų, reikia laikyti aukštėjimo spartą 450 padalinta iš 180, tai yra 2,5 metro per sekundę. Todėl reikalinga aukštėjimo sparta – 2,5 m/s","hint":""},{"id":"477","q":"Vėjo priekinė bei pavėjinė dedamosios paskaičiuojamos: U [delta] =U - cos KVK, (KVK- kursinis vėjo kampas). Gautas leidimas startui pavėjui MK= 200°; vėjas 5= 50°; U= 10 kt (5 m/s). Ar įmanomas startas, jei leistina pavėjinė dedamoji šio tipo lėktuvui U= 3 m/s (6 kt):","a":["Įmanomas Ud=5 kt (2,5 m/s)","Neįmanoma Ud=9 kt (4.5 m/s)"],"c":[1],"expl":"U [delta] =10kt – cos(200)=9,5kt","hint":""},{"id":"478","q":"Vėjo šoninė dedamoji paskaičiuojama: Uš.d. =U*sin KVK (KVK- kursinis vėjo kampas).Orlaivis leidžiasi tūpimui MK=200°, vėjas 5= 230°, U=10 m/s (20 kt). Uš.d. bus","a":["Iš kairės 30m/s (6 kt)","Iš dešinės 5 m/s (10 kt)","Iš kairės 5 m/s (16 kt)"],"c":[1],"expl":"Orlaivis leidžiasi tūpimui magnetiniu kursu 200°, o vėjas pučia iš 230° krypties, vėjo greitis yra 10 m/s (20 kt). Norint apskaičiuoti šoninę vėjo dedamąją, pirmiausia nustatome kursinį vėjo kampą – tai yra skirtumas tarp vėjo krypties ir orlaivio kurso: 230° – 200° = 30°. Šoninė vėjo dedamoji skaičiuojama pagal formulę Uš.d. = U × sin(KVK), todėl įstatome reikšmes: Uš.d. = 10 × sin(30°) = 10 × 0,5 = 5 m/s. Kadangi vėjas pučia iš 230°, tai yra iš dešinės pusės (nes 230° > 200°), vadinasi, šoninė dedamoji yra 5 m/s iš dešinės.","hint":""},{"id":"479","q":"Vėjo šoninė dedamoji paskaičiuojama: Uš.d. =U·sin KVK (KVK – kursinis vėjo kampas). Kilimo tūpimo tako juosta 02, vėjas 310°/18 mazgų. Kokią šoninė vėjo dedamoji?","a":["6 mazgai","12 mazgų","3 mazgai","18 mazgų"],"c":[3],"expl":"Kilimo ir tūpimo tako kryptis yra 02, tai reiškia, kad orlaivis kyla arba leidžiasi 020° kryptimi. Vėjas pučia iš 310° krypties, o jo greitis yra 18 mazgų. Norint apskaičiuoti šoninę vėjo dedamąją, pirmiausia nustatomas kursinis vėjo kampas – tai mažiausias kampas tarp tako krypties ir vėjo krypties: 310° – 020° = 290°, tačiau kadangi kampai skaičiuojami kaip mažiausias skirtumas (ne didesnis nei 180°), tai KVK = 360° – 290° = 70°. Tuomet šoninė vėjo dedamoji skaičiuojama pagal formulę Uš.d. = U × sin(KVK). Įstatome reikšmes: Uš.d. = 18 × sin(70°) ≈ 18","hint":""},{"id":"480","q":"Duota: magnetinis kelio kampas MKK=80°; orlaivio magnetinis kursas MK=80°; kursinis Radijo Švyturio kampas KRK=10°.","a":["kad orlaivis nukrypęs į kairę","kad orlaivis nukrypęs į dešinę","OL skrenda teisingai"],"c":[0],"expl":"Orlaivio magnetinis kursas (MK) yra 80°, ir magnetinis kelio kampas (MKK) taip pat yra 80°, vadinasi, orlaivio nosis nukreipta tiesiai į planuotą skrydžio kelią. Tačiau kursinis radijo švyturio kampas (KRK) yra 10°, o tai reiškia, kad švyturys yra 10° į dešinę nuo orlaivio nosies. Tai rodo, kad orlaivis skrenda lygiagrečiai norimam kursui, bet yra nuo jo nukrypęs į kairę, nes švyturys, kuris turėtų būti tiesiai priekyje (jei orlaivis būtų ant kurso), dabar yra dešinėje.","hint":""},{"id":"481","q":"Skrendant magnetinio kelio kampu MKK=80° link aukšto dažnio radijo Švyturio VOR, orlaivio krypties indikatorius rodo magnetinį pelengą MP (QDM) = 85°. OL atstumas iki VOR DME D=180 km. Žinomas trasos plotis 10 NM (18 km). S(nuskr.)= (D/60)x(MKK-MP)","a":["Kairėje ir plotis 15 km","Dešinėje ir plotis 5 km"],"c":[1],"expl":"Skrendant magnetinio kelio kampu MKK = 80° link aukšto dažnio radijo švyturio VOR, orlaivio krypties indikatorius rodo magnetinį pelengą MP (QDM) = 85°, o atstumas iki VOR yra 180 km. Trasos plotis yra 10 NM, tai yra 18 km (po 9 km į abi puses nuo centrinės linijos). Norint nustatyti, kurioje pusėje nuo trasos yra orlaivis, apskaičiuojame kampinį nukrypimą: MP – MKK = 85° – 80° = 5°. Tai reiškia, kad orlaivis yra 5° dešinėje nuo pageidaujamo kelio. Tuomet šoninį atstumą nuo trasos ašies galime apskaičiuoti pagal formulę: šoninis atstumas = sin (5°) × 180 ≈ 0,0872 × 180 ≈ 15,7 km. Kadangi tai daugiau nei 9 km, orlaivis yra už trasos ribų, dešinėje pusėje, maždaug 15 km nuo centrinės linijos.","hint":""},{"id":"482","q":"Sąlygos: Magnetinis kelio kampas (MKK) - 245°; Magnetinė deklinacija ([delta] m) – 5 W; Kompaso deviacija ([delta] k) - 3E. Likus 30 km iki punkto B gavot pranešimą, kad jūsų QDM - 225°. Paskaičiuoti, kiek kilometrų (mylių) ir į kurią pusę nuo planuojamos (paskaičiuotos) kelio linijos nukrypo orlaivis. S(nuskr.)= (D/60)x(MKK-MP)","a":["nukrypęs į dešinę 6 km (3,2 NM) (Nk= +6 km)","nukrypęs į kairę 6 km (3,2 NM) (Nk= -6 km)","nenukrypęs nuo kelio linijos"],"c":[1],"expl":"Duota, kad magnetinis kelio kampas (MKK) yra 245°, o gavus pranešimą, nustatytas magnetinis pelengas į orlaivį (QDM) – 225°, kai iki punkto B liko 30 km. Norėdami nustatyti, kiek ir į kurią pusę orlaivis nukrypo nuo planuoto kelio, pirmiausia apskaičiuojame kampinį nukrypimą: MKK – QDM = 245° – 225° = 20°. Tai reiškia, kad švyturys (arba tikslas) yra 20° į dešinę nuo orlaivio, todėl orlaivis yra nukrypęs į kairę nuo planuoto kurso. Tolesniam skaičiavimui naudojame formulę šoniniam nukrypimui apskaičiuoti: Nk = sin(kampo) × atstumas. Įstatome reikšmes: Nk = sin(20°) × 30 km ≈ 0,342 × 30 ≈ 10,26 km. Tačiau atsižvelgiant į tai, kad realiai naudojamas mažesnis efektyvus kampas tarp kurso linijos ir pelengo (pvz., dėl trajektorijos suapvalinimo ar orientuoto į vektorinį nukrypimą), praktikoje laikomas kampas gali būti mažesnis – apie 11,5°, todėl galutinis skaičiavimas būtų: Nk = sin(11,5°) × 30 ≈ 0,2 × 30 = 6 km. Taigi orlaivis yra nukrypęs į kairę 6 km (3,2 NM) nuo planuoto kelio.","hint":""},{"id":"483","q":"Panaudojant duomenis ir turimą skaičiuoklę išspręsti navigacinius uždavinius: Tikrasis kursas (HDG T): 200 Deklinacija (VAR): 20W Magnetinis kursas (HDG M): ? Deviacija (DEV): 3E Kompasinis kursas (HDG C): ?","a":["Magnetinis kursas- 200 , kompasinis kursas- 217","Magnetinis kursas- 220 , kompasinis kursas- 217","Magnetinis kursas- 180, kompasinis kursas-220"],"c":[1],"expl":"","hint":""},{"id":"484","q":"Panaudojant duomenis ir turimą skaičiuoklę išspręsti navigacinius uždavinius: Tikrasis kursas (HDG T): 065 Deklinacija (VAR): ? Magnetinis kursas (HDG M): 051 Deviacija (DEV): ? Kompasinis kursas (HDG C): 052","a":["deklinacija- 14W, deviacija 1E","deklinacija- 14E, deviacija 1E","deklinacija- 14E, deviacija 1W"],"c":[2],"expl":"","hint":""},{"id":"485","q":"Panaudojant duomenis ir turimą skaičiuoklę išspręsti navigacinius uždavinius: Tikrasis kursas (HDG T): ? Deklinacija (VAR): 60W Magnetinis kursas (HDG M): ? Deviacija (DEV): 2W Kompasinis kursas (HDG C): 196","a":["Tikrasis kursas- 134 , magnetinis kursas- 194","Tikrasis kursas- 134 , magnetinis kursas- 120","Tikrasis kursas- 134 , magnetinis kursas- 198"],"c":[0],"expl":"","hint":""},{"id":"486","q":"Panaudojant duomenis ir turimą skaičiuoklę išspręsti navigacinius uždavinius: Tikrasis kursas (HDG T): 278 Deklinacija (VAR): ? Magnetinis kursas (HDG M): 293 Deviacija (DEV): ? Kompasinis kursas (HDG C): 291","a":["deklinacija- 15E, deviacija- 2W","deklinacija- 15W , deviacija- 2E","deklinacija- 3E , deviacija- 15W"],"c":[1],"expl":"","hint":""},{"id":"487","q":"Panaudojant duomenis ir turimą skaičiuoklę išspręsti navigacinius uždavinius: Tikrasis kursas (HDG T): 180 Deklinacija (VAR): 35E Magnetinis kursas (HDG M): ? Deviacija (DEV): 3E Kompasinis kursas (HDG C): ?","a":["Magnetinis kursas- 215, kompasinis kursas- 212","Magnetinis kursas- 215, kompasinis kursas- 218","Magnetinis kursas- 145, kompasinis kursas- 212","Magnetinis kursas- 145, kompasinis kursas 142"],"c":[3],"expl":"","hint":""},{"id":"489","q":"Panaudojant duomenis ir turimą skaičiuoklę išspręsti navigacinius uždavinius: Tikrasis kursas (HDG T): 098 Deklinacija (VAR): 10W Magnetinis kursas (HDG M): ? Deviacija (DEV): ? Kompasinis kursas (HDG C): 113","a":["Magnetinis kursas- 108, deviacija- 5W","Magnetinis kursas- 78, deviacija- 5W","Magnetinis kursas- 108, deviacija- 5E"],"c":[0],"expl":"","hint":""},{"id":"490","q":"Panaudojant duomenis ir turimą skaičiuoklę išspręsti navigacinius uždavinius: Tikrasis kursas (HDG T): 330 Deklinacija (VAR): ? Magnetinis kursas (HDG M): ? Deviacija (DEV): 2E Kompasinis kursas (HDG C): 313","a":["Deklinacija- 15E , magnetinis kursas- 315,","Deklinacija- 15W , magnetinis kursas- 311,","Deklinacija- 2E , magnetinis kursas- 315,"],"c":[0],"expl":"","hint":""},{"id":"491","q":"Panaudojant duomenis ir turimą skaičiuoklę išspręsti navigacinius uždavinius: Tikrasis kursas (HDG T): ? Deklinacija (VAR): 45W Magnetinis kursas (HDG M): ? Deviacija (DEV): 3W Kompasinis kursas (HDG C): 288","a":["Tikrasis kursas- 336, magnetinis kursas- 291","Tikrasis kursas- 330, magnetinis kursas- 285","Tikrasis kursas- 240, magnetinis kursas- 285"],"c":[2],"expl":"","hint":""},{"id":"492","q":"Panaudojant duomenis ir turimą skaičiuoklę išspręsti navigacinius uždavinius: Atstumas (DIST): ? Kelionės greitis (G/S): 144 Laikas (TIME min): 100 Kuro sąnaudos (FUEL FLOW): ? Kuro sąnaudos maršrute, atkarpoje (LEG FUEL): 50","a":["Atstumas 240, kuro sąnaudos- 30","Atstumas 200, kuro sąnaudos- 40","Atstumas 220, kuro sąnaudos- 20"],"c":[0],"expl":"Atstumas: 144 x (100/60)=240 Sąnaudos: 50/(100/60)=30","hint":""},{"id":"493","q":"Panaudojant duomenis ir turimą skaičiuoklę išspręsti navigacinius uždavinius: Atstumas (DIST): 72 Kelionės greitis (G/S): 144 Laikas (TIME min): ?","a":["laikas- 162 min.","laikas- 48 min.","laikas- 40 min"],"c":[1],"expl":"Laikas= atstumas/greitis => 72/90=0,8h=>48min","hint":""},{"id":"494","q":"Kai aerodromo kilimo-tūpimo tako kursas yra 153°, priešingas kursas paskaičiuojamas taip:","a":["153+180","153-360","153+360"],"c":[0],"expl":"Prie esamo kurso pridedame 180° , nes tai yra pusė pilno apsisukimo (360° / 2 = 180°). Jei suma viršija 360° , tuomet atimame 360° , kad gautume kampą nuo 0° iki 360°.","hint":""},{"id":"495","q":"Koks yra Molėtu aerodromo tako ilgis pagal žemėlapį (2024)?","a":["686 m","450 m","653 m"],"c":[1],"expl":"","hint":""},{"id":"496","q":"Kuriame variante teisingai pažymėta rytų kryptis:","a":["270°","09°","00°","90°"],"c":[3],"expl":"","hint":""},{"id":"497","q":"Kursas ir kelias gali būti matuojami kampo laipsniais nuo:","a":["Tikrosios šiaurės","Magnetinės šiaurės","Kompaso šiaurės","visi išvardinti"],"c":[3],"expl":"Kursas ir kelias navigacijoje gali būti matuojami nuo trijų skirtingų šiaurės krypčių: tikrosios, magnetinės ir kompaso šiaurės. Tikroji šiaurė (True North) yra geografinė šiaurė – Žemės ašigalis. Kursas ar kelias, matuojamas nuo šios krypties, vadinamas tikruoju kursu (true heading) arba tikruoju keliu (true track). Ji naudojama žemėlapiuose ir navigacijos planavime. Magnetinė šiaurė (Magnetic North) yra ta kryptis, į kurią rodo magnetinis kompasas, ir ji šiek tiek skiriasi nuo tikrosios šiaurės dėl Žemės magnetinio lauko netolygumų. Kursas ar kelias, matuojamas nuo magnetinės šiaurės, vadinamas magnetiniu kursu (magnetic heading) arba magnetiniu keliu (magnetic track). Ši kryptis dažniausiai naudojama praktinėje aviacijoje, nes ją naudoja orlaivių prietaisai. Kompaso šiaurė (Compass North) – tai kryptis, kurią rodo orlaivio magnetinis kompasas, tačiau į ją dar įsivelia paklaida (devia­cija), kurią sukelia lėktuvo konstrukcijos metalai ar elektronika. Kursas, matuojamas nuo kompaso šiaurės, vadinamas kompasiniu kursu (compass heading), ir jis turi būti koreguojamas, kad gautume tikslų magnetinį kursą.","hint":""},{"id":"498","q":"LR teritorijoje vasaros laikas (UTC+3HR) įvedamas ir atšaukiamas (UTC+2HR):","a":["Paskutinį kovo sekmadienį 0°° val. UTC ir paskutinį rugsėjo sekmadienį 0°° val. UTC","Pagal LR vyriausybės nurodymą, neatsižvelgiant į data"],"c":[0],"expl":"","hint":""},{"id":"499","q":"Naudodamiesi Lietuvos vizualiųjų skrydžių žemėlapiu nustatykite, su kuo ir kokiu dažniu, skrendant maršrutu: Kyviškės-ELEKA-Kaišiadorys-Aleksotas, bus palaikomas radijo ryšys nevaldomoje oro erdvėje? (Žemėlapis 2024).","a":["Nuo Kyviškių iki ELEKA su Vilniaus FIS 123,855, po to iki Aleksoto AD su Kauno FIS 118,500","Nuo Kyviškių iki Nemenčinės su Kairėnų AB 118,205, po to iki Žiežmarių su Vilniaus FIS 123,855","Nuo Kyviškių iki ELEKA su Vilniaus FIS 123,855, po to iki Aleksoto AD su Kauno FIS 124,605"],"c":[2],"expl":"","hint":""},{"id":"500","q":"Pagal kokį slėgį matuojamas absoliutusis skrydžio aukštis žemiau perėjimo lygio (transition level)?","a":["QFE - aerodromo slėgį","QNE - standartinį slėgį 1013,2 mb","760 mmHg"],"c":[1],"expl":"","hint":""},{"id":"501","q":"Žemės Tikrasis ir Magnetinis šiaurės ašigaliai yra:","a":["viename taške","skirtinguose taškuose"],"c":[1],"expl":"","hint":""}]},"Oro teisė":{"slug":"oro-teise","questions":[{"id":"5","q":"Koks yra pagrindinis ICAO dokumentas?","a":["Varšuvos konvencija","Hagos konvencija","Čikagos konvencija","Helsinkio susitarimo baigiamasis aktas"],"c":[2],"expl":"Ši konvencija, oficialiai vadinama Tarptautine civilinės aviacijos konvencija, buvo pasirašyta 1944 metais Čikagoje ir yra pagrindinis tarptautinės civilinės aviacijos teisės dokumentas, kuriuo remiasi ICAO veikla bei valstybėms nustatomi bendri skrydžių saugos, navigacijos, oro erdvės naudojimo ir kiti standartai.","hint":""},{"id":"692","q":"Kokia tarptautinė aviacijos organizacija buvo įkurta priėmus Čikagos Konvenciją","a":["IATA","AOPA","ICAO","IFALPA"],"c":[2],"expl":"Priėmus Čikagos konvenciją 1944 metais, buvo įkurta Tarptautinė civilinės aviacijos organizacija – ICAO (International Civil Aviation Organization). Nors pati konvencija nėra organizacija, būtent jos pagrindu ir buvo įsteigta ICAO kaip specializuota Jungtinių Tautų agentūra, atsakinga už tarptautinės civilinės aviacijos taisyklių kūrimą ir koordinavimą.","hint":""},{"id":"693","q":"Ar šalis - ICAO narė - privalo laikytis Čikagos Konvencijos prieduose numatytų standartų ir rekomenduojamosios praktikos?","a":["privalo","neprivalo","neprivalo, informuodama ICAO apie šalyje esančius skirtumus nuo nustatytų standartų ir rekomenduojamos praktikos."],"c":[2],"expl":"","hint":""},{"id":"694","q":"Kokie yra pagrindiniai LR oro teisės aktas?","a":["CA specialistų licencijavimo nuostatai","Aviacijos įstatymas","Oro erdvės struktūros įstatymas"],"c":[1],"expl":"Lietuvos Respublikos pagrindinis oro teisės aktas yra Aviacijos įstatymas. Jis nustato pagrindinius principus, reglamentuojančius civilinės aviacijos veiklą Lietuvoje, įskaitant orlaivių registravimą, oro vežėjų licencijavimą, saugą, oro erdvės naudojimą ir institucijų atsakomybę.","hint":""},{"id":"695","q":"Koks orlaivis laikomas civiliniu orlaiviu?","a":["Orlaivis įregistruotas Civilinių orlaivių registre.","Orlaivis, kurio savininkas yra civilinis fizinis asmuo arba juridinis asmuo.","Orlaivis naudojamas civilinės aviacijos tikslams ir įregistruotas Civilinių orlaivių registre.","Visi teisingi.","bet kuris orlaivis, išskyrus valstybės orlaivį"],"c":[0],"expl":"","hint":""},{"id":"696","q":"Koks orlaivis laikomas valstybės orlaiviu?","a":["Orlaivis įregistruotas Valstybės orlaivių registre .","Orlaivis, kurio savininkas yra Lietuvos valstybė.","Orlaivis, kurio savininkas yra Krašto apsaugos ministerija.","Krašto apsaugos, muitinės arba vidaus reikalų tarnybų naudojamas orlaivis, įregistruotas Valstybės orlaivių registre."],"c":[3],"expl":"","hint":""},{"id":"697","q":"Kaip suprantama sąvoka “Lietuvos Respublikos oro erdvė’’?","a":["Lietuvos Respublikos skrydžių informavimo rajono (FIR) oro erdvė.","Oro erdvė, esanti virš LR teritorijos.","Oro erdvė esanti, virš LR teritorijos iki 460 SL (FL460).","Oro erdvė, esanti virš LR teritorijos, vidaus ir teritorinių vandenų."],"c":[3],"expl":"","hint":""},{"id":"698","q":"Kam suteikiamas LR oro erdvės naudojimo prioritetas?","a":["Civilinei aviacijai.","Karo aviacijai","Civilinės aviacijos tikslams, o esant ypatingoms situacijoms arba karo atveju- krašto apsaugos tikslams.","orlaiviams, vežantiems ypatingai svarbius asmenis."],"c":[2],"expl":"Pagal Lietuvos Respublikos teisinį reglamentavimą, taikos metu oro erdvė pirmiausia naudojama civilinės aviacijos reikmėms. Tačiau ypatingų situacijų ar karo atveju pirmenybė teikiama krašto apsaugos (karo aviacijos) tikslams. Tai užtikrina tiek skrydžių saugą, tiek nacionalinį saugumą.","hint":""},{"id":"699","q":"Kas vykdo LR oro erdvės kontrolę, apsaugą ir gynybą?","a":["karinės oro pajėgos","civilinės aviacijos direkcijos oro paslaugų departamentas.","civilinės aviacijos direkcijos aviacijos saugumo departamentas.","krašto apsaugos ministerija"],"c":[0],"expl":"","hint":""},{"id":"700","q":"Kas vykdo LR oro erdvės naudojimo koordinavimą ir oro navigacijos paslaugų teikimą LR oro erdvėje, išskyrus pasienio, draudžiamas, ribojimo ir pavojingas zonas bei KOP aerodromų oro erdvę?","a":["susisiekimo ministerija","karinės oro pajėgos arba jų prašymu Susisiekimo ministerija.","Susisiekimo ministerija arba jos įgaliota institucija.","susisiekimo ministerija arba jos prašymu Karinės oro pajėgos."],"c":[2],"expl":"","hint":""},{"id":"701","q":"Kas vykdo LR oro erdvės naudojimo koordinavimą ir oro navigacijos paslaugų teikimą draudžiamose, pasienio (išskyrus oro kelius), ribojimo ir pavojingose zonose bei KOP aerodromų oro erdvėje?","a":["Susisiekimo ministerija arba jos prašymu Karinės oro pajėgos","Karinės oro pajėgos arba jų prašymu Susisiekimo ministerija ar jos įgaliota institucija","Civilinės aviacijos direkcijos skrydžių valdymo tarnyba","Civilinės aviacijos direkcijos ONPD suderinus su KOP"],"c":[1],"expl":"","hint":""},{"id":"702","q":"Kas vykdo LR civilinės aviacijos valstybinį valdymą?","a":["Vyriausybė, Lietuvos Respublikos krašto apsaugos ministerija, Lietuvos Respublikos susisiekimo ministerija, kariuomenės vadas, LTSA ir TKA","Vyriausybė","Lietuvos Respublikos krašto apsaugos ministerija","TKA"],"c":[0],"expl":"","hint":""},{"id":"703","q":"Kieno nuosavybė yra skrydžių valdymo sistemos navigaciniai įrenginiai?","a":["Lietuvos Respublikos","savivaldybės","Lietuvos valstybės ir savivaldybės","juridinio arba fizinio asmens."],"c":[0],"expl":"","hint":""},{"id":"704","q":"Kas atsakingas už orlaivio tinkamumą skraidyti","a":["Civilinės aviacijos inspekcija","orlaivio gamintojas","orlaivio valdytojas","Orlaivio vadas"],"c":[2],"expl":"19 straipsnis. Atsakomybė už orlaivio tinkamumą skraidyti 1. Už orlaivio tinkamumą skraidyti atsako jo savininkas arba naudotojas. 2. Orlaivio savininkas arba naudotojas privalo laikytis tinkamumo skraidyti nurodymų (direktyvų), išleidžiamų Įstaigos arba valstybės, kurioje orlaivis buvo suprojektuotas ar pagamintas, jeigu Įstaiga nenurodo kitaip. 3. Orlaivio savininkas arba naudotojas nedelsdamas privalo pranešti Įstaigai apie visas aplinkybes, įvykius ir gedimus, kurie gali turėti įtakos orlaivio tinkamumui skraidyti.","hint":""},{"id":"705","q":"Ar gali LR oro erdvėje skristi orlaivis, neturintis tinkamumo skraidyti pažymėjimo arba pasibaigus jo galiojimo laikui?","a":["gali, pranešus apie skrydį civilinės aviacijos inspekcijai.","gali, orlaivio valdytojui atlikus orlaivio techninį aptarnavimą.","gali, CA direkcijai išdavus leidimą specialiajam skrydžiui.","negali."],"c":[2],"expl":"","hint":""},{"id":"706","q":"Kas atsakingas už orlaivio įgulos komplektavimą?","a":["orlaivio vadas","aviacijos organizacijos vadovas","orlaivio valdytojas","skraidymų departamento (skyriaus) vadovas."],"c":[2],"expl":"","hint":""},{"id":"707","q":"Kas yra civilinės aviacijos specialistai?","a":["orlaivio įgulos nariai, skrydžių vadovai, civilinės aviacijos technikai, inžinieriai ir kiti aviakompanijų specialistai.","Skrydžių vadovai, civilinės aviacijos technikai, inžinieriai ir kiti aviakompanijų specialistai.","orlaivio įgulos nariai, pilotai mokiniai, skrydžių vadovai, orlaivių palydovai, aviacijos technikai.","orlaivio įgulos nariai, pilotai mokiniai, civilinės aviacijos technikai, inžinieriai, orlaivių palydovai."],"c":[0],"expl":"Civilinės aviacijos specialistai apima įvairių sričių darbuotojus, dirbančius su civiline aviacija, tai yra nekarinėmis skrydžių operacijomis. Į šią grupę įeina orlaivio įgulos nariai, tokie kaip pilotai ir palydovai, taip pat techninis personalas – inžinieriai ir technikai, atsakingi už orlaivių priežiūrą bei remontą. Skrydžių vadovai rūpinasi oro eismo saugumu, o kiti aviakompanijų specialistai dirba planavimo, saugumo, keleivių aptarnavimo ir kitose srityse. Todėl atsakymas A tiksliausiai apima visas šias profesijas.","hint":""},{"id":"708","q":"Kas turi teisę rengti, perkvalifikuoti civilinės aviacijos specialistus bei kelti jų kvalifikaciją?","a":["aviakompanijų mokymo centrai.","aeroklubai","mokymo organizacijos, kurios turi TKA patvirtintas mokymo programas.","visi teisingi"],"c":[2],"expl":"","hint":""},{"id":"709","q":"Kas tai yra ,,orlaivio vadas’’?","a":["orlaivio valdytojo paskirtas vienas iš įgulos narių.","aukščiausias aviacijos organizacijos pareigūnas, esantis orlaivyje skrydžio metu.","orlaivio valdytojo paskirtas pilotas, atsakingas už orlaivio valdymą ir saugą skrydžio metu."],"c":[2],"expl":"","hint":""},{"id":"710","q":"Ką privalo orlaivio vadas?","a":["prieš skrydį įsitikinti, kad orlaivis parengtas skrydžiui ir pilotuoti orlaivį pagal nustatytas taisykles ,","prieš skrydį įsitikinti ,kad orlaivis turi visus dokumentus","informuoti Direkciją apie visas apylinkes, galinčias padaryti įtaką orlaivio tinkamumui skraidyti","visi teisingi"],"c":[3],"expl":"Orlaivio vadas turi pareigą užtikrinti skrydžio saugumą ir laikytis aviacijos taisyklių. Prieš skrydį jis privalo įsitikinti, kad orlaivis yra techniškai tinkamas skristi ir paruoštas. Taip pat būtina patikrinti, ar orlaivis turi visus reikiamus dokumentus, kaip antai registracijos liudijimą, tinkamumo skraidyti pažymėjimą, draudimą ir kitus. Be to, jeigu pastebimos aplinkybės, galinčios turėti įtakos orlaivio tinkamumui skristi, vadas turi apie tai informuoti atsakingas institucijas.","hint":""},{"id":"711","q":"Ar turi teisę orlaivio vadas atsisakyti priimti į orlaivį įgulos narius, keleivius ar krovinį?","a":["taip, jei to reikalauja aplinkybės","taip, esant orlaivio valdytojo leidimui","taip, išskyrus orlaivio narius"],"c":[0],"expl":"Orlaivio vadas yra atsakingas už skrydžio saugą, todėl jis turi teisę atsisakyti priimti į orlaivį įgulos narius, keleivius ar krovinį, jei mano, kad tai gali kelti pavojų skrydžiui, orlaivio saugumui ar pažeisti taisykles. Ši teisė suteikiama tam, kad vadas galėtų priimti sprendimus realiomis situacijomis, atsižvelgdamas į aplinkybes, net ir be papildomo leidimo.","hint":""},{"id":"712","q":"Orlaiviai virš gyvenamųjų vietovių turi skristi nustatytame aukštyje, kuris:","a":["yra ne mažesnis nei 150m AGL","užtikrintų priverstinį orlaivio nutūpimą už gyvenamosios vietovės ribų","yra ne mažesnis nei 300, AGL","yra ne mažesnis nei 300, AGL ir užtikrintų priverstinį orlaivio nutūpimą už gyvenamosios vietovės ribų"],"c":[3],"expl":"","hint":""},{"id":"713","q":"Orlaivių parodomieji skrydžiai virš gyvenamųjų vietovių leidžiami:","a":["tik suderinus su vietos savivaldybe","tik suderinus su vietos savivaldybę ir gavus KOP leidimą","tik suderinus su vietos savivaldybe ir gavus TKA (direkcijos) leidimą","d) suderinus su vietos savivaldybę ir gavus KOP leidimą bei suderinus su vietos savivaldybe ir gavus TKA (direkcijos) leidimą"],"c":[2],"expl":"","hint":""},{"id":"714","q":"Kokie dokumentai turi būti orlaivyje skrydžio metu?","a":["Orlaivio registravimo liudijimas , leidimas naudotis orlaivio radijo stotimi , orlaivio resurso apskaitos žurnalas , orlaivio skrydžių vykdymo vadovas,-dokumentai apie keleivius ir krovinį, jei jie yra orlaivyje ,draudimo sertifikatas ,triukšmo sertifikatas ,vežėjo oru sertifikatas","Orlaivio registravimo liudijimas , leidimas naudotis orlaivio radijo stotimi, orlaivio techninės būklės žurnalas ,orlaivio skrydžių vykdymo vadovas , dokumentai apie keleivius ir krovinį, jei jie yra orlaivyje ,draudimo sertifikatas ,triukšmo sertifikatas ,vežėjo oru sertifikatas","Orlaivio registravimo liudijimas, leidimas naudotis radijos stotimi, orlaivio tinkamumo skraidyti pažymėjimas , orlaivio techninės būklės žurnalas , orlaivio skrydžių vykdymo vadovas, dokumentai apie keleivius ir krovinį, jei jie yra orlaivyje , draudimo sertifikatas ,triukšmo sertifikatas."],"c":[2],"expl":"","hint":""},{"id":"715","q":"Ar būtina turėti atitinkamą sertifikatą ir leidimą (licenciją) atliekant specialiuosius aviacijos darbus žemės ūkyje, oro reklamoje, stebint ir patruliuojant?","a":["būtina","nebūtina","būtina, jei tai atliekama komerciniais tikslais","būtina jei darbus atlieka aviacijos įmonė"],"c":[0],"expl":"Pagal Lietuvos teisės aktus, specialieji aviacijos darbai, tokie kaip žemės ūkio darbai (pvz., pasėlių purškimas), oro reklama, stebėjimas ir patruliavimas, priskiriami prie specializuotos aviacijos veiklos. Ši veikla yra licencijuojama ir reikalauja atitinkamų sertifikatų bei leidimų. Įmonės, norinčios vykdyti šiuos darbus, turi gauti specialų leidimą iš Transporto kompetencijų agentūros (TKA), o orlaivio įgulos nariai – atitinkamas kvalifikacijas ir licencijas. Tai užtikrina skrydžių saugumą, aplinkos apsaugą ir atitiktį teisės aktų reikalavimams. Net jei šie darbai atliekami nekomerciniais tikslais, vis tiek būtina laikytis teisės aktų ir turėti atitinkamus leidimus, išskyrus atvejus, kai taikomos išimtys dėl avarinių situacijų ar kitų specialių aplinkybių.","hint":""},{"id":"716","q":"Ar reikalingi specialūs leidimai parodomiesiems renginiams bei varžyboms rengti?","a":["reikalingi","nereikalingi"],"c":[0],"expl":"Parodomiesiems renginiams ir varžyboms, susijusiems su aviacija, reikalingi specialūs leidimai. Tai būtina dėl saugumo, oro eismo valdymo ir gyventojų apsaugos. Leidimai išduodami atitinkamų institucijų, pavyzdžiui, Transporto kompetencijų agentūros ar kitų atsakingų tarnybų, priklausomai nuo renginio pobūdžio. Be leidimų rengti tokius renginius būtų pažeidžiamos taisyklės ir gali kilti pavojus tiek dalyviams, tiek aplinkiniams.","hint":""},{"id":"717","q":"Orlaiviai LR valstybės sieną gali kirsti:","a":["tik numatytais oro erdvės struktūroje oro keliais","skrendant pagal VST (VFR) tiesiausiu keliu , jungiančiu kilimo ir tūpimo aerodromus","nurodytais oro erdvės struktūroje oro keliais arba Civilinės aviacijos direkcijos numatytais maršrutais (suderinus tai su KOP)"],"c":[2],"expl":"","hint":""},{"id":"718","q":"Ar gali skristi LR oro erdve orlaiviai neturintys radijo ryšio aparatūros ir radiolokacinio atsakiklio (transponderio)?","a":["negali","gali tik nekontroliuojamoje erdvėje","gali esant avarinėms situaci vado nuožiūra optimaliausiu maršrutu."],"c":[1],"expl":"","hint":""},{"id":"730","q":"Koks minimalus skrydžio aukštis virš žemės ar vandens paviršiaus (išskyrus skrydžius virš gyvenamųjų vietovių, žmonių susitelkimo vietų)?","a":["500ft","300ft","150ft"],"c":[0],"expl":"Minimalus skrydžio aukštis virš žemės ar vandens paviršiaus, išskyrus skrydžius virš gyvenamųjų vietovių ar žmonių susitelkimo vietų, yra nustatytas siekiant užtikrinti skrydžio saugumą ir išvengti pavojų žmonėms ar turtui žemėje. Paprastai tai yra 500 pėdų (apie 150 metrų). Žemesni skrydžiai leidžiami tik specialiais atvejais, pavyzdžiui, avarinėse situacijose ar leidžiamiems akrobatiniams skrydžiams.","hint":""},{"id":"731","q":"Orlaivį ištikus nelaimei ar pavojui, praradus orientuotę ir nesant kitokiam radijo ryšiui, įgula naudoja radijo dažnį:","a":["122.3MHz","121,5MHz","125,5MHz"],"c":[1],"expl":"","hint":""},{"id":"732","q":"Tarptautinis signalas, perduodamas radiotelefonu, norint pranešti apie galinčią kilti grėsmę keleiviams, bei ekipažui, esantiems orlaivyje:","a":["ALERTA","MAYDAY","PAN PAN"],"c":[2],"expl":"","hint":""},{"id":"733","q":"Kilus grėsmei keleivių ir įgulos saugumui kai būtina neatidėliotina pagalba, tarptautinis pavojaus signalas perduodamas žodžiu:","a":["ALERTA","MAYDAY","PAN PAN"],"c":[1],"expl":"","hint":""},{"id":"734","q":"Kokį kodą orlaivio įgula privalo surinkti nutrūkus radijo ryšiui?","a":["7700","7500","7600"],"c":[2],"expl":"","hint":""},{"id":"735","q":"Kokį kodą privalo surinkti orlaivio įgula esant nesankcionuotam įsikišimui?","a":["7700","7500","7600"],"c":[2],"expl":"","hint":""},{"id":"736","q":"Kokią prasmę turi “nuolat žalios” spalvos šviesos signalas (žemėje), kai nėra radijo ryšio su aerodromo SV?","a":["kilti- leidžiama","riedėti leidžiama","kelias laisvas"],"c":[0],"expl":"","hint":""},{"id":"737","q":"Kokią prasmę turi “nuolat raudonos” spalvos šviesos signalas (žemėje), kai nėra radijo ryšio su aerodromo SV?","a":["Duokite kelią kitam OL ir tęskite s 22.5 MHz","118.1 MHz"],"c":[1],"expl":"","hint":""},{"id":"743","q":"Kokie skrydžiai galimi tik pateikus skrydžio planą?","a":["tarptautiniai orlaiviu skrydžiai, parodomieji skrydžiai virš gyvenamųjų vietovių, skrydžiai pasienio zonoje, skrydžiai draudžiamose zonose","tarptautiniai orlaiviu skrydžiai, skrydžiai pasienio zonoje, skrydžiai kontroliuojamoje oro erdvėje, skrydžiai draudžiamose zonose","Tarptautiniai orlaivių skrydžiai, skrydžiai pasienio zonoje, skrydžiai draudžiamose zonose, kiekvienas skrydis arba jo dalis, kuriam bus teikiamos skrydžių valdymo paslaugos.","visi skrydžiai LR oro erdvėje"],"c":[2],"expl":"Skrydžio planas yra būtinas tarptautiniams skrydžiams, skrydžiams pasienio zonoje ir draudžiamose zonose, taip pat visiems skrydžiams arba jų dalims, kuriems reikalingos skrydžių valdymo paslaugos. Tai užtikrina saugumą ir efektyvų oro eismo valdymą. Kiti variantai yra nepakankamai išsamūs arba klaidinantys.","hint":""},{"id":"744","q":"Prieš kiek laiko iki išskridimo būtina pateikti skrydžio planą, skrendant LR oro erdve?","a":["prieš 1 val.","prieš 3 val.","prieš 12 val. Iki išskridimo datos","prieš 30 min"],"c":[3],"expl":"","hint":""},{"id":"745","q":"Kokiais atvejais nebūtina pateikti skrydžio plano?","a":["atliekant paieškos ir gelbėjimo darbus, likviduojant stichinių nelaimių padarinius","teikiant neatidėliotiną medicinos pagalbą","vykdant skrydį, kuriuo norima nutraukti neteisėtus orlaivio – oro erdvės pažeidėjo veiksmus","visi teisingi"],"c":[3],"expl":"Skrydžio plano pateikimas nebūtinas šiais atvejais: atliekant paieškos ir gelbėjimo darbus, likviduojant stichinių nelaimių padarinius, teikiant neatidėliotiną medicinos pagalbą arba vykdant skrydžius, kuriais siekiama nutraukti neteisėtus orlaivio ar oro erdvės pažeidėjo veiksmus. Šios situacijos priskiriamos prioritetinėms, kai svarbiausia yra greita reakcija ir saugumas.","hint":""},{"id":"746","q":"Kam suteikta ultralengvųjų orlaivių pilotų licencijavimo teisė?","a":["ULO pilotų federacija valstybės sienos į teritorijos gilumą.","septynių jūrmylių Lietuvos Respublikos nevaldomos oro erdvės dalis nuo Lietuvos Respublikos valstybės sienos, kuri ribojasi su ne Europos Sąjungos valstybe nare, į teritorijos gilumą. Atnaujinus vidaus sienų kontrolę, pasienio zona yra septynių jūrmylių Lietuvos Respublikos oro erdvės dalis nuo Lietuvos Respublikos valstybės sienos į teritorijos gilumą."],"c":[0],"expl":"","hint":""},{"id":"840","q":"Kas yra \"pavojingoji zona\"?","a":["nustatyto dydžio oro erdvė, kurioje tam tikru laiku skraidyti orlaiviams gali būti pavojinga","nustatyto dydžio oro erdvė, kurioje skraidyti orlaiviams gali būti pavojinga","nustatyto dydžio oro erdvė, kurioje skraidyti orlaiviams pavojinga"],"c":[0],"expl":"","hint":""},{"id":"841","q":"Kas yra avarija?","a":["įvykis, kurio metu žuvo kuris nors asmuo arba jis buvo sužalotas taip, kad per 30 dienų nuo sužalojimo momento mirė","įvykis, kurio metu orlaivis sugadintas arba suardyta jo konstrukcija","įvykis, kurio metu orlaivis dingo be žinios arba pateko į tokią vietą, kur priėjimas prie jo visiškai neįmanomas","visi atsakymai teisingi"],"c":[3],"expl":"","hint":""},{"id":"842","q":"Kas yra CA specialistai?","a":["fizinis asmuo, turintis specialų aviacijos išsilavinimą ir tam tikrą kvalifikaciją","fizinis asmuo, turintis specialų aviacijos išsilavinimą","fizinis asmuo, turintis aviacijos kvalifikaciją"],"c":[0],"expl":"Civilinės aviacijos specialistas yra asmuo, kuris turi atitinkamą aviacijos srities išsilavinimą ir įgytą kvalifikaciją, leidžiančią atlikti tam tikras funkcijas civilinėje aviacijoje, pavyzdžiui, būti skrydžių vadovu, techniku, inžinieriumi, įgulos nariu ir pan. Svarbu, kad būtų tiek išsilavinimas, tiek kvalifikacija – abu šie kriterijai būtini.","hint":""},{"id":"843","q":"Kas yra incidentas ?","a":["visi su orlaivio naudojimu susiję įvykiai (išskyrus avarijas), kai jų metu iškilo(arba galėjo iškilti) pavojus skrydžių saugai","įvykis, kurio metu orlaivis sugadintas arba suardoma jo konstrukcija","įvykis, kurio metu žuvo kuris nors asmuo arba jis buvo sužalotas taip, kad per30 dienų nuo sužalojimo momento mirė"],"c":[0],"expl":"","hint":""},{"id":"844","q":"Kas yra komercinis reguliarus oro susisiekimas?","a":["Skrydžiai, kuriais reguliariai, pagal nustatytą tvarkaraštį, nustatytais maršrutais, mokamai vežami keleiviai, bagažas kroviniai, paštas","Skrydžiai, nustatytais maršrutais, kuriais mokamai vežami keleiviai, bagažas, kroviniai, paštas","Visi skrydžiai, kuriais reguliariai skraidoma nustatytais maršrutais"],"c":[0],"expl":"","hint":""},{"id":"845","q":"Kas yra pavojingas incidentas?","a":["Įvykis, per kurį orlaivis patiria sunkius pažeidimus ar žūva žmonės","Įvykis, kai orlaivis nukrenta dėl variklio gedimo","Incidentas, kuriam įvykus prireikia orlaivio remonto","Įvykis, kuris galėjo virsti avarija, bet jos pavyko išvengti"],"c":[3],"expl":"","hint":""},{"id":"846","q":"Kas yra skrydžio planas?","a":["oro eismo paslaugų tarnyboms teikiama atitinkama informacija apie numatomą orlaivio skrydį arba jo dalį","orlaivio vado pranešimas apie planuojamą skrydį Skrydžių valdymo tarnybai","orlaivio vado pasiruošimas skrydžiui analizuojant turimą meteo informaciją, nustatant skrydžio plotą ir kryptį, paskaičiuojant maksimalų keliamą svorį"],"c":[0],"expl":"","hint":""},{"id":"847","q":"Kiek laiko galioja ULO skrydžio egzaminas?","a":["90 dienų","6 mėnesius","12 mėnesių"],"c":[1],"expl":"","hint":""},{"id":"848","q":"Kokia bauda baudžiamas asmuo, pilotuojantis orlaivį apsvaigęs alkoholiu ar narkotinėmis medžiagomis?","a":["500 EUR","600-850 EUR","1000 EUR"],"c":[1],"expl":"ANK 416 straipsnis. Civilinės aviacijos saugos pažeidimas Civilinės aviacijos orlaivio valdymas, būnant apsvaigus nuo alkoholio, narkotinių, psichotropinių ar kitų psichiką veikiančių medžiagų , užtraukia baudą nuo šešių šimtų iki aštuonių šimtų penkiasdešimt eurų .","hint":""},{"id":"849","q":"Kokia bauda baudžiamas asmuo, pilotuojantis orlaivį ir neturintis galiojančios atitinkamos aviacijos specialisto licencijos?","a":["150-300 EUR","1000 EUR","100 EUR"],"c":[0],"expl":"","hint":""},{"id":"850","q":"Kokie yra pagrindiniai LR oro teisės aktai?","a":["Lietuvos Respublikos civilinės aviacijos įstatymas, Lietuvos Respublikos aviacinės saugos įstatymas, Lietuvos Respublikos oro eismo valdymo taisyklės.","Lietuvos Respublikos transporto įstatymas, Lietuvos Respublikos kelių eismo taisyklės, Lietuvos Respublikos viešųjų pirkimų įstatymas.","Lietuvos Respublikos vandens kelių valdymo įstatymas, Lietuvos Respublikos darbo kodeksas, Lietuvos Respublikos energetikos įstatymas."],"c":[0],"expl":"","hint":""},{"id":"851","q":"Kokios OL vado pareigos avarinio tūpimo atveju?","a":["sudaryti įvykio vietos schemą","apklausti liudininkus","vadovauti gelbėjimo darbams, kol atvyks atitinkamos tarnybos"],"c":[2],"expl":"Orlaivio vadas avarinio tūpimo atveju turi užtikrinti sklandų gelbėjimo darbų organizavimą iki specialių tarnybų atvykimo. Kitos užduotys, kaip schemos sudarymas ar liudininkų apklausa, dažniausiai atliekamos vėliau arba atitinkamų tarnybų.","hint":""},{"id":"852","q":"Licencijos savininkas turi atnaujinti savo žinias ir gebėjimus, mokydamasis pagal visą programą, jei licencija nebuvo pratęsta:","a":["2 metus ir daugiau","3 metus ir daugiau","4 metus ir daugiau"],"c":[1],"expl":"","hint":""},{"id":"853","q":"Orlaiviai skrendantys nevaldomąja oro erdve LR valstybės sieną gali kirsti:","a":["Per specialius taškus, pažymėtus oro navigacijos žemėlapiuose","Skrendant pagal VST (VFR) tiesiausiu keliu, jungiančiu kilimo ir tūpimo aerodromus","Orlaiviai, skrendantys nevaldomąja oro erdve pasienio zonoje su Rusijos Federacija ir Baltarusijos Respublika, gali kirsti Lietuvos Respublikos valstybės sieną tik ant jos ribos esančiuose pranešimo punktuose. Orlaiviai, skrendantys nevaldomąja oro erdve pasienio zonoje su Šengeno sutarties valstybėmis, gali kirsti Lietuvos Respublikos valstybės sieną bet kurioje vietoje."],"c":[2],"expl":"","hint":""},{"id":"854","q":"Orlaivio vadas turi teisę:","a":["visi atsakymai teisingi","nutraukti skrydį ir tūpti; prireikus pagalbos kreiptis į keleivius","priimti galutinį sprendimą kilti išskrendant"],"c":[0],"expl":"Orlaivio vadas yra atsakingas už visą skrydžio saugumą. Todėl jis turi teisę nutraukti skrydį ir atlikti tūpimą, jei to reikalauja situacija. Be to, orlaivio vadas gali paprašyti keleivių pagalbos, jei to reikia saugumui užtikrinti. Taip pat jis priima galutinį sprendimą dėl pakilimo ar išskridimo, nes tai yra jo atsakomybė už skrydžio eigą.","hint":""},{"id":"855","q":"Orlaiviuose, skrendančiuose Lietuvos Respublikos valdomąja oro erdve, nevaldomąja oro erdve virš teritorinės jūros, Kuršių marių, virš draudžiamųjų zonų viršutinės ribos, taip pat užsienio šalių valstybės orlaiviuose, skrendančiuose Lietuvos Respublikos nevaldomąja oro erdve, turi būti:","a":["įrengta radijo ryšio aparatūra, kuria būtų galima palaikyti abipusį radijo ryšį su oro eismo paslaugų teikėju;","radiolokacinis atsakiklis, veikiantis „A + C“ arba „S“ režimu","abu atsakymai teisingi"],"c":[2],"expl":"Orlaiviuose, skrendančiuose Lietuvos Respublikos valdomąja oro erdve ir kitose minėtose vietose, privalo būti įrengta radijo ryšio aparatūra, leidžianti palaikyti abipusį ryšį su oro eismo paslaugų teikėju, taip pat radiolokacinis atsakiklis, veikiantis nurodytais režimais. Tai būtina siekiant užtikrinti saugų ir efektyvų oro eismo valdymą. Režimai A ir C yra radiolokacinio atsakiklio darbo režimai, naudojami oro eismo valdymui. Režimas A siunčia informaciją apie orlaivio identifikaciją, leidžiančią oro eismo kontrolieriams atpažinti orlaivį. Režimas C perduoda duomenis apie orlaivio aukštį, todėl padeda kontroliuoti atstumą tarp orlaivių vertikaliai. Režimas S, kuris reiškia selektyvų režimą, yra modernesnis atsakiklio režimas, suteikiantis daug daugiau informacijos, įskaitant tikslią orlaivio padėtį, greitį ir kitus svarbius duomenis. Šis režimas yra suderinamas su A ir C režimais, tačiau yra efe
