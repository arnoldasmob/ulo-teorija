ropelerių, variklių, užsparnių ir t.t., taip pat sugerti kinetinę energiją tūpimo metu","užtikrinti OL manevringumą ant žemės, suteikti OL reikiamą aukštį, kad būtų sudarytas reikiamas aukštis tarp žemės ir sklandmens, propelerių, variklių, užsparnių ir t.t., taip pat sugerti kinetinę energiją tūpimo metu."],"c":[2],"expl":"","hint":""},{"id":"641","q":"Orlaivio važiuoklė būna:","a":["su galiniu ratuku ir pagrindine važiuokle","su priekiniu ratuku ir pagrindine važiuokle","su priekiniu ratuku ir pagrindine važiuokle arba su galiniu ratuku ir pagrindine važiuokle"],"c":[2],"expl":"","hint":""},{"id":"642","q":"Neįtraukiama važiuoklė dažniausiai naudojama:","a":["mažuose negreituose orlaiviuose, pagal konstrukciją","greituose orlaiviuose","sportiniuose orlaiviuose"],"c":[0],"expl":"","hint":""},{"id":"643","q":"Spyrinės konstrukcijos važiuoklė sušvelnina tūpimą:","a":["spyruokliuodama automatiškai išsitraukdami","susitraukdama ir išplėsdama cilindrines dalis","spyruokliuodama"],"c":[2],"expl":"Spyrinės konstrukcijos važiuoklė sušvelnina tūpimą naudodama lankstų, spyruokliuojantį elementą – dažniausiai tai yra plieninė arba kompozitinė svirtis, kuri sugeria smūgį nusileidimo metu spyruokliuodama. Kiti variantai netinka, nes jie labiau apibūdina amortizatorines sistemas, o ne spyrines.","hint":""},{"id":"644","q":"OL masės apkrova į žemės plotą didesnė, kai:","a":["važiuoklės ratai siauresni arba jų skaičius mažesnis","važiuoklės ratai platesni arba jų skaičius didesnis"],"c":[0],"expl":"Masės apkrova į žemės plotą priklauso nuo orlaivio svorio ir rato (ar ratų) kontakto ploto su žeme. Kuo mažesnis kontaktinis plotas (siauresni ratai, mažiau ratų), tuo didesnis slėgis į žemę, t. y. didesnė masės apkrova vienam žemės ploto vienetui.","hint":""},{"id":"645","q":"OL stabdžių sistemos funkcionavimas yra užtikrinamas:","a":["trinties pagalba","smarkiu stabdymu","kai oro slėgis padangose tinkamas"],"c":[0],"expl":"Orlaivio stabdžių sistema veikia pagrinde trinties principu – stabdžių kaladėlės spaudžia stabdžių diskus arba būgnus, sukeldamos trintį, kuri sumažina ratų sukimąsi ir taip stabdo orlaivį.","hint":""},{"id":"646","q":"Kaip vadinamas nuotolis, kurį pirmyn oru nuslenka oro sraigtas per vieną apsisukimą?","a":["Sraigto naudingas kelias","Sraigto kelias","Faktinis žingsnis"],"c":[2],"expl":"Faktinis žingsnis – tai realus nuotolis, kurį orlaivis nuslenka per vieną sraigto apsisukimą, atsižvelgiant į slydimą ir kitas sąlygas.","hint":""},{"id":"647","q":"Kokia pagrindinė oro sraigto paskirtis?","a":["Reguliuoti tolygų oro srautą","Traukos jėgai ore sukurti (variklio jėgą N paversti traukos jėga )","Sukurti keliamąją jėgą"],"c":[1],"expl":"","hint":""},{"id":"648","q":"Oro sraigto menčių išcentrinis sukamasis momentas verčia mentes suktis:","a":["į žingsnio didėjimo pusę","į žingsnio mažėjimo pusę"],"c":[1],"expl":"Oro sraigto mentės sukasi labai dideliu greičiu, todėl jų galus veikia stipri išcentrinė jėga. Ši jėga veikia taip, kad stumia mentės masę į išorę, o tai sukelia sukamąjį momentą, kuris linkęs sukti mentę į didesnio žingsnio (didesnio atakos kampo) pusę.","hint":""},{"id":"649","q":"Oro sraigto menčių atsvarai verčia mentes suktis:","a":["į žingsnio mažėjimo pusę","į žingsnio didėjimo pusę"],"c":[0],"expl":"Oro sraigto menčių atsvarai (centrifuginės jėgos veikiami) paprastai verčia mentes pasisukti į mažesnio žingsnio padėtį. Tai yra savaiminė apsaugos savybė, leidžianti mentėms sumažinti žingsnį, jeigu slėgis sistemoje sumažėtų (pvz., esant gedimui). Tai padeda palaikyti sūkius ir išvengti variklio užgesimo.","hint":""},{"id":"650","q":"Ką rodo padangos protektoriaus centrinės dalies padidėjęs susidėvėjimas?","a":["Per didelį slėgį padangose","Per mažą slėgį padangose","Prastos kokybės padangas"],"c":[0],"expl":"","hint":""},{"id":"651","q":"Ar galima naudoti lėktuvo stiklų valymui benziną, acetoną, ant apledėjimo skystį:","a":["negalima","galima nedidelį kiekį","galima"],"c":[0],"expl":"Benzinas, acetonas ir kai kurios ant apledėjimo priemonės yra chemiškai agresyvūs ir gali: Pažeisti orlaivio stiklų paviršių (ypač jei tai organinis stiklas, pvz., akrilas ar polikarbonatas).","hint":""},{"id":"652","q":"Nuimant orlaivio bateriją, kurį antgalį reikia atjungti pirmiausiai?","a":["Minusinį","Pliusinį","Neturi reikšmės"],"c":[0],"expl":"Pirmiausia reikia atjungti minusinį (neigiamą) gnybtą, nes tai sumažina trumpojo jungimo riziką. Jei pirmiausia atjungtum pliusinį, ir atsitiktinai liestum įrankiu orlaivio metalinę dalį (kuri yra sujungta su minusu), galėtų įvykti kibirkštis ar trumpas jungimas.","hint":""},{"id":"653","q":"Kodėl degalų bakai suskirstomi į atskirus skyrius arba juose įrengiamos pertvaros?","a":["Saugoti degalus nuo sutekėjimo į vieną pusę, kai OL keičia padėtį ore","Kad visuomet liktų kuro rezervas","Kad sustiprinti bakų konstrukciją"],"c":[0],"expl":"","hint":""},{"id":"654","q":"Kokia yra svarbiausia sąlyga skatinanti mikroorganizmų augimą degaluose?","a":["Vanduo","Karštas oras","Mikroorganizmai nesidaugina degaluose"],"c":[0],"expl":"Mikroorganizmai (bakterijos, grybeliai) gali augti degaluose, ypač aviaciniuose kuruose, bet tik tada, kai yra vandens. Jie kaupiasi vandens ir kuro sandūroje (pvz., bako dugne), kur turi reikiamą terpę daugintis.","hint":""},{"id":"655","q":"Kur orlaivyje turi būti įmontuotas pagrindinis degalų sistemos filtras?","a":["Po kuro siurbliu","Žemiausiame taške","Aukščiausiame taške"],"c":[0],"expl":"Žemiausias taškas degalų sistemoje yra ten, kur degalai natūraliai susirenka, bet čia dažnai kaupiasi nuosėdos, vanduo ar nešvarumai. Jei filtras būtų čia, jis greičiau užsikimštų. Be to, kuro siurblys turi tiekti degalus, o jei filtras būtų prieš siurblį (t.y. žemiausiame taške), siurbliui būtų sunkiau siurbti per užsikimšusį filtrą, ir tai gali sukelti sistemos gedimus. Todėl filtras pagrinde montuojamas po kuro siurbliu, kad siurblys pirmiausia pasiimtų kuro, o filtras užtikrintų, kad į variklį patektų švarūs degalai.","hint":""},{"id":"656","q":"Nuosėdos kure tikrinamos:","a":["prieš kiekvieną skraidymų dieną, o taip pat po kiekvieno užpylimo","vieną kartą per savaitę","po kuro užpylimo"],"c":[0],"expl":"","hint":""},{"id":"657","q":"Jei nupiltame iš bako kuro mėginys yra neskaidrus, jame matosi „debesėlių\" susidarymas:","a":["kure yra mikro organizmų - vandens ar kitų priemaišų","kuras nekokybiškas","kure yra vandens"],"c":[0],"expl":"","hint":""},{"id":"658","q":"Detonacija gali įvykti dėl:","a":["Visi atsakymai teisingi","Dėl aukštos mišinio įsiurbimo temperatūros","Dėl ne tos rūšies degalų naudojimo","Dėl neteisingo uždegimo sistemos sureguliavimo"],"c":[0],"expl":"","hint":""},{"id":"659","q":"Kaip vadinasi įrenginys, kuriuo valdomas į cilindrus patenkančio degalų/oro mišinio santykis (mišinio kokybė)?","a":["Karbiuratorius","Aukščio reguliatorius","Degalų/ oro mišinio reguliatorius"],"c":[0],"expl":"","hint":""},{"id":"660","q":"Kaip vadinasi įrenginys, kuris reguliuoja į cilindrus patenkančio degalų/oro mišinio masę?","a":["Droselinis vožtuvas","Degalų reguliatorius","Atbulinis vožtuvas"],"c":[0],"expl":"Droselinis vožtuvas reguliuoja oro srautą, patenkantį į variklį, o kartu ir degalų/oro mišinio masę, kuri patenka į cilindrus. Tai leidžia kontroliuoti variklio galingumą.","hint":""},{"id":"661","q":"Kas atsitiktų, jeigu variklio tepalo filtras visiškai užsikimštų?","a":["Nieko neatsitiktų","Tepalo filtras turi būti sukonstruotas taip, kad tepalas patektų į variklį ir tepalo filtrui užsikimšus","Perkaistų variklis"],"c":[1],"expl":"","hint":""},{"id":"662","q":"Kokiam tikslui stūmoklinio variklio tepalas gali būti atskiedžiamas benzinu?","a":["Pagerinti tepalo tepimo savybes","Sumažinti tepalo slėgį, esant šaltam tepalui ir taip išvengti tepalo radiatoriaus sugadinimo","Sumažinti tepalo klampumui ir palengvinti variklio užvedimui, esant šaltam orui"],"c":[2],"expl":"Šaltuoju metų laiku tepalas tampa storesnis (klampesnis), todėl varikliui sunkiau sukti alkūninį veleną ir užsivesti. Praskiedus tepalą benzinu, jo klampumas sumažėja, todėl tepalas lengviau teka ir variklis užsiveda greičiau bei lengviau. Tai yra svarbu, kad variklio dalys būtų tinkamai sutepamos jau nuo užvedimo momento.","hint":""},{"id":"663","q":"Kokią informacija gaus lakūnas, jeigu į variklį bus tiekiama nepakankamai tepalo?","a":["Tepalo temperatūra bus aukšta, slėgis – žemas","Tepalo temperatūra normali, slėgis – žemas","Tepalo temperatūra bus žema, slėgis – žemas"],"c":[0],"expl":"Kai į variklį tiekiama nepakankamai tepalo, tepalo slėgis sumažėja, nes tepalo kiekis ir cirkuliacija prastėja. Dėl prasto tepalo tiekimo variklio dalys greičiau kaista, todėl tepalo temperatūra pakyla. Tai signalizuoja lakūnui apie galimą tepalo sistemos gedimą.","hint":""},{"id":"664","q":"Pagrindinė tepalo paskirtis yra:","a":["tepti variklį","apsaugoti nuo korozijos","tepti variklį, judančias ir sukamąsias detales bei saugoti nuo korozijos"],"c":[2],"expl":"Tepalas ne tik sumažina trintį ir dėvėjimąsi, bet ir apsaugo variklio dalis nuo korozijos bei šilumos pertekliaus. Jis atlieka kelias svarbias funkcijas vienu metu.","hint":""},{"id":"665","q":"Smulkaus valymo tepalo filtras:","a":["statomas už tepalo pompos","statomas prieš tepalo pompą"],"c":[0],"expl":"Smulkaus valymo arba pilno srauto tepalo filtras montuojamas už tepalo pompos, t.y. slėginėje linijoje, prieš tepalo padavimą į variklį. Taip daroma todėl, kad: Tepalo pompa pirmiausia paima tepalą iš karterio (per stambaus valymo filtrą arba tinklelį), Tada suspaudžia jį ir perduoda į smulkaus valymo filtrą, Išfiltruotas tepalas patenka į variklio tepimo taškus (guolius, velenus ir t. t.). Jeigu filtras būtų prieš pompą, siurblys negalėtų efektyviai veikti — padidėtų pasipriešinimas, sumažėtų srautas, atsirastų gedimų rizika.","hint":""},{"id":"666","q":"Kokiu būdu dažniausiai apsaugomas karbiuratorius nuo apledėjimo?","a":["Pašildomas į karbiuratorius patenkantis (įsiurbiamas) oras","Pašildomas kuras karbiuratoriuje","Dalis karbiuratoriaus uždengiama ir apsaugoma nuo šalto oro patekimo"],"c":[0],"expl":"","hint":""},{"id":"667","q":"Kokiomis oro sąlygomis karbiuratorius labiausiai ledėja?","a":["-1 +4C","-4 +4C","-10 -5C"],"c":[0],"expl":"","hint":""},{"id":"668","q":"Pastebėti, kad užšąla karbiuratorius galima:","a":["mažėjant sūkiams","mažėjant aukščiui","atsiradus poskyriams"],"c":[0],"expl":"Kai karbiuratorius pradeda apledėti, susiaurėja oro ir degalų srauto kanalai, todėl į cilindrus patenka per mažai mišinio. Dėl to: sumažėja variklio galia, krentant sūkiams variklis gali pradėti dirbti netolygiai ar net užgesti.","hint":""},{"id":"669","q":"Pastebėjus Žymų tepalo slėgio kritimą:","a":["nekreipti dėmesio, skristo toliau","padidinti sūkius, skristi iki artimiausios aikštelės","nedelsiant sumažinti sūkius, rinktis aikštelę ir tūpti"],"c":[2],"expl":"Žymus tepalo slėgio kritimas reiškia, kad variklis negauna tinkamo tepimo, o tai gali labai greitai sukelti rimtą variklio gedimą (užstrigimą, perdegimą). Todėl būtina: Nedelsiant sumažinti variklio sūkius, kad sumažėtų apkrova ir šilumos išsiskyrimas. Pasirinkti tinkamą vietą tūpimui ir saugiai leistis, kol variklis dar veikia.","hint":""},{"id":"670","q":"Koks slėgio sistemos agregatas leidžia skysčiui tekėti viena kryptimi, bet neleidžia tekėti priešinga kryptimi?","a":["Skysčio tekėjimo reguliatorius","Atbulinis vožtuvas","Droselinis vožtuvas"],"c":[1],"expl":"","hint":""},{"id":"671","q":"Orlaivio konstrukcijos geležinės detalės magnetinio kompaso rodomą kursą:","a":["kompaso rodmenis patikslina","įtakos neturi","iškreipia"],"c":[2],"expl":"Orlaivio konstrukcijos geležinės (feromagnetinės) detalės ir įranga gali paveikti magnetinį lauką aplink kompasą. Dėl to kompasas rodo ne tik Žemės magnetinį lauką, bet ir reaguoja į trukdžius, kuriuos sukelia paties orlaivio metalinės dalys ar elektra maitinama įranga. Šis reiškinys vadinamas devijacija. Norint tiksliai naudotis kompasu, atliekama jo kalibravimą ir sudaroma deviacijos lentelė.","hint":""},{"id":"672","q":"Tam, kad būtų išvengta kompaso paklaidų, visi metaliniai ir įmagnetinti daiktai orlaivyje turi būti:","a":["metaliniai daiktai įtakos kompasui neturi","kuo atokiau nuo kompaso"],"c":[1],"expl":"Orlaivio konstrukcijos geležinės (feromagnetinės) detalės ir įranga gali paveikti magnetinį lauką aplink kompasą. Dėl to kompasas rodo ne tik Žemės magnetinį lauką, bet ir reaguoja į trukdžius, kuriuos sukelia paties orlaivio metalinės dalys ar elektra maitinama įranga. Šis reiškinys vadinamas devijacija. Norint tiksliai naudotis kompasu, atliekama jo kalibravimą ir sudaroma deviacijos lentelė.","hint":""},{"id":"673","q":"Kokiais vienetais matuojama elektros variklio galia?","a":["Vatais","Amper-valandomis","Voltais"],"c":[0],"expl":"","hint":""},{"id":"674","q":"Kokiais vienetais matuojamas induktyvumas?","a":["Omais","Henriais","Vatais"],"c":[1],"expl":"","hint":""},{"id":"675","q":"Elektros krūvio nešėjai laidininkuose?","a":["Elektronai","Diodai","Protonai"],"c":[0],"expl":"","hint":""},{"id":"676","q":"Koks slėgis veikia dinaminio slėgio sistemos imtuvą:","a":["dinaminis slėgis ir statinis","dinaminis","statinis"],"c":[0],"expl":"Dinaminio slėgio sistemos imtuvą (dažniausiai pitot vamzdelį) veikia bendrasis (pilnutinis) slėgis, kuris susideda iš: statinio slėgio – aplinkos slėgio oro masėje, dinaminio slėgio – slėgio, atsirandančio dėl orlaivio judėjimo per orą.","hint":""},{"id":"677","q":"Kas yra variometras?","a":["Prietaisas rodantis OL vertikalų aukštėjimą arba žemėjimą (dinaminio slėgio pagalba)","Prietaisas rodantis OL vertikalų aukštėjimą arba žemėjimą (statinio slėgio pagalba)","Variometras - prietaisas kuro slėgiui matuoti"],"c":[1],"expl":"Variometras – tai prietaisas, kuris rodo orlaivio vertikalų greitį (t. y. kaip greitai kyla ar leidžiasi orlaivis). Jis veikia pagal statinio slėgio pokyčius laike – kylant slėgis mažėja, leidžiantis didėja. Variometras nustato šių pokyčių greitį ir pagal tai rodo vertikalų greitį metrais per sekundę (m/s) arba pėdomis per minutę (ft/min).","hint":""},{"id":"678","q":"Kuriam iš šių prietaisų reikalinga ir statinio ir dinaminio slėgio sistemos?","a":["Greitimačiui","Variometrui","Aukštimačiui"],"c":[0],"expl":"Greičiamačiui (oro greičio indikatoriui) reikia abiejų: Statinio slėgio – kuris atspindi aplinkos oro slėgį. Dinaminio slėgio – kuris priklauso nuo orlaivio judėjimo greičio. Greičio matavimui naudojama formulė: Dinaminis slėgis = bendrasis slėgis (iš pitot vamzdžio) – statinis slėgis. Todėl greičiamačiui būtina gauti bendrąjį slėgį iš pitot vamzdžio ir statinį slėgį iš statinio slėgio imtuvo.","hint":""},{"id":"679","q":"Kaip keičiasi slėgis leidžiantis?","a":["Nekinta","Mažėja","Didėja"],"c":[2],"expl":"Leidžiantis orlaiviui, jis artėja prie Žemės paviršiaus, kur oro sluoksniai yra tankesni. Tankesnis oras reiškia didesnį atmosferos slėgį. Todėl statinis oro slėgis didėja, kai orlaivis leidžiasi.","hint":""},{"id":"680","q":"Kaip reaguoja variometras?","a":["Vėluodamas","Iš karto"],"c":[0],"expl":"Variometras veikia pagal statinio slėgio pokyčio greitį, kuris fiksuojamas per specialų slopintuvą (kapiliarinį vamzdelį ar diafragmą). Dėl to slėgio pokyčiai į prietaiso vidų patenka ne iš karto, o su nedideliu vėlavimu.","hint":""},{"id":"681","q":"Su kuo sujungta statinio oro slėgio sistema aukštimatyje?","a":["Su aukštimačio korpusu","Su aneroidine dėžute per specialųjį ribojantį vožtuvą","Su aneroidine dėžute"],"c":[0],"expl":"","hint":""},{"id":"682","q":"Didėjant aukščiui aneroidinė dėžutė:","a":["plečiasi","nepakinta","traukiasi"],"c":[0],"expl":"","hint":""},{"id":"683","q":"Aukštimačiu galima išmatuoti:","a":["aukštį","reljefą","kliūtis","barometrinį aukštį","visi atsakymai teisingi"],"c":[3],"expl":"Aukštimatis matuoja barometrinį aukštį, kuris apskaičiuojamas pagal atmosferos slėgio pokyčius. Tai nėra tiesioginis reljefo ar kliūčių matavimas, o aukštis virš tam tikro slėgio lygio (paprastai jūros lygio). Tikras aukštis virš žemės (reljefo) ar kliūčių matavimui reikia papildomos informacijos. Aukštimatis nėra skirtas tiesiogiai matuoti kliūtims ar reljefui.","hint":""},{"id":"684","q":"Barometrinis aukščio matavimo principas remiasi:","a":["barometrinio (dinaminio) slėgio pasikeitimu","barometrinio (statinio) slėgio pasikeitimu"],"c":[1],"expl":"Barometrinis aukščio matavimas remiasi atmosferos statinio slėgio pokyčiu kylant arba leidžiantis. Aukštesniame aukštyje oro slėgis mažėja, o žemesniame – didėja. Aukštimatis fiksuoja šiuos slėgio pokyčius ir pagal juos apskaičiuoja aukštį.","hint":""},{"id":"685","q":"Kokio prietaiso pagalba nustatomas posūkyje slydimas?","a":["Rutuliuko (gulsčiuko) pagalba","Aviahorizonto","Variometro"],"c":[0],"expl":"","hint":""},{"id":"686","q":"Kai oro temperatūra aukštesnė negu Tarptautinėje standartinėje atmosferoje (TSA) aukštimatis rodo:","a":["aukštį, didesnį negu prie standartinės temperatūros","aukštį, mažesnį negu prie standartinės temperatūros","normalų barometrinį aukštį"],"c":[0],"expl":"Kai oro temperatūra yra aukštesnė nei Tarptautinėje standartinėje atmosferoje (TSA), oro tankis mažėja, o atmosferos sluoksnis išsiplečia. Dėl to orlaivio tikrasis aukštis bus mažesnis nei aukštimatis rodo, nes slėgio pokyčiai vyksta lėčiau. Aukštimatis, remdamasis standartine temperatūra, parodys didesnį aukštį nei yra iš tikrųjų.","hint":""},{"id":"687","q":"Ką reiškia užrašas orlaivyje VNE?","a":["Greitis, kurio niekada negalima viršyti","Kruizinis greitis","Maksimalus leidžiamas greitis"],"c":[0],"expl":"","hint":""},{"id":"688","q":"Ką reiškia skaičius, kuriuo pažymėta OL kokybė?","a":["OL konstrukcijos kokybė","Kokį atstumą nusklendžia OL iš 5 km","Kokį atstumą nusklendžia OL iš 1 km"],"c":[2],"expl":"","hint":""},{"id":"689","q":"Skirtumas tarp leistinų skrydžio greičių - didžiausio ir mažiausio, vadinamas:","a":["greičių amplitude","greičių diapazonu","greičių polerė"],"c":[1],"expl":"","hint":""},{"id":"690","q":"Ką reiškia spindulinė raudona linija, nubrėžta ant orlaivio prietaiso skalės?","a":["Tai neleistini variklio kontrolės parametrai","Reikšmę, kurią draudžiama pasiekti","Tai neleistini skrydžio parametrai"],"c":[1],"expl":"","hint":""},{"id":"691","q":"Ką reiškia raudona linija, nubrėžta ant orlaivio prietaiso skalės?","a":["Skrydžio arba variklio darbo parametrų draudžiamą ribą","Skrydžio arba variklio darbo parametrų leidžiamą ribą","Skrydžio arba variklio darbo parametrų ribinį darbą"],"c":[0],"expl":"","hint":""},{"id":"754","q":"Ką reiškia geltonas lankas, nubrėžtas ant orlaivio prietaiso skalės?","a":["Skrydžio arba variklio darbo parametrų nukrypimai nuo normalių parametrų","Įspėja apie darbą ant ribos","Rekomenduojamas darbo rėžimas"],"c":[1],"expl":"","hint":""},{"id":"755","q":"Kurioje orlaivio vietoje gali atsirasti apledėjimo sąlygos šiltu oru ir kai nėra matomų drėgmės šaltinių?","a":["Karbiuratoriuose","Ant sparnų","Ant priekinio stiklo"],"c":[0],"expl":"Net esant šiltam orui ir nesant matomos drėgmės (pvz., kai nėra debesų ar kritulių), karbiuratoriuje gali susidaryti apledėjimo sąlygos. Tai vyksta dėl vadinamojo adiabatinio slėgio kritimo ir garavimo efekto, kai: Per droselinį vožtuvą tekantis oras smarkiai išsiplečia. Garuodami degalai sugeria šilumą, o temperatūra staiga krenta.","hint":""},{"id":"756","q":"Kokie yra variklio detonavimo požymiai?","a":["Variklis dirba su trūkiais","Jaučiami virpesiai","Triukšmingas variklis","Visi teisingi (Variklis dirba netolygiai, purtosi, girdisi aštrūs pašaliniai garsai)"],"c":[3],"expl":"","hint":""},{"id":"757","q":"Kokie požymiai rodo, kad variklyje vyksta savaiminis uždegimas?","a":["Variklis dirba maksimaliais sūkiais","Užgesinus variklį jis purtomas dirba toliau","Aukšta galvučių temperatūra"],"c":[1],"expl":"Savaiminis uždegimas– tai reiškinys, kai variklis toliau veikia net ir išjungus uždegimo sistemą. Tai vyksta dėl to, kad degalų ir oro mišinys užsidega nuo perkaistų variklio dalių, o ne nuo žvakės kibirkšties. Tokiu atveju variklis dirba netolygiai, purtomai, ir tai rodo problemą, kuri gali būti susijusi su netinkamais degalais, per didele variklio temperatūra arba uždegimo sistemos sutrikimais.","hint":""},{"id":"758","q":"Kuri orlaivio elektros grandinė paprastai neturi saugikliu ar grandinės išjungiklių?","a":["Starterio","Generatoriaus","Akumuliatoriaus"],"c":[0],"expl":"Starterio grandinė paprastai neturi saugiklių ar grandinės išjungiklių, nes: Starteris trumpam sunaudoja labai didelę srovę (kartais šimtus amperų), kuri reikalinga varikliui užvesti. Jei tokioje grandinėje būtų įprastas saugiklis ar pertraukiklis, jis galėtų išsijungti dėl natūralios didelės srovės, net jei nėra jokios gedimo. Vietoj to naudojami stiprūs relės (solenoidai) ir tvirta laidų sistema, pritaikyta tokioms apkrovoms.","hint":""},{"id":"759","q":"Kokio santykio degalų/oro mišinį naudodamas stūmoklinis variklis gali išvystyti didžiausią galią?","a":["1/12","9/12","2/12"],"c":[0],"expl":"","hint":""},{"id":"760","q":"Kokios priemonės naudojamos pakeisti lynų judėjimo kryptį valdymo sistemose?","a":["Lynų valdymo trosai","Skriemuliai","Specialūs ribotuvai"],"c":[1],"expl":"","hint":""},{"id":"761","q":"Kokios keturios pagrindinės jėgos veikia skrendantį lėktuvą?","a":["G, X","Y, P","Visos išvardintos"],"c":[2],"expl":"","hint":""},{"id":"762","q":"Vidaus degimo variklio galia kylant (valdymo sverto padėtis išlieka pastovi) krenta todėl, kad:","a":["didėja oro tankis","mažėja oro tankis","tai rodo variklio gedimą"],"c":[1],"expl":"","hint":""},{"id":"763","q":"Keturtakčio variklio darbo ciklai yra:","a":["įsiurbimas- degimas- einamasis taktas- išmetimas","įsiurbimas- eiga- degimas- išmetimas","įsiurbimas- suspaudimas- darbo eiga- išmetimas"],"c":[2],"expl":"","hint":""},{"id":"764","q":"Teisingas išsireiškimas tarp ryšio su vidaus degimo variklio suspaudimo laipsniu ir kuro oktaniniu skaičiumi yra :","a":["kuo didesnis suspaudimo laipsnis, tuo didesnis kuro oktaninis skaičius","kuo mažesnis suspaudimo laipsnis, tuo didesnis kuro oktaninis skaičius","kuo didesnis suspaudimo laipsnis, tuo mažesnis kuro oktaninis skaičius"],"c":[0],"expl":"Kuo didesnis variklio suspaudimo laipsnis, tuo aukštesnė temperatūra ir slėgis susidaro cilindre prieš užsidegant mišiniui. Tokiose sąlygose padidėja savaiminio uždegimo (detonacijos) rizika.","hint":""},{"id":"765","q":"Ilgalaikis variklio darbas mažais sūkiais turi neigiamos įtakos:","a":["varikliui","uždegimo žvakėms","išmetimo galvučių temperatūrai"],"c":[1],"expl":"Maži sūkiai ir žema degimo temperatūra reiškia, kad degalų ir oro mišinys nesudega visiškai. Tai sukelia anglies nuosėdų kaupimąsi ant žvakių elektrodų, o tai gali lemti: prastą kibirkštį, uždegimo praleidimus, apsunkintą variklio užvedimą.","hint":""},{"id":"766","q":"Šiuolaikiniuose karbiuratoriuose degiojo mišinio santykis keičiamas koreguojant:","a":["degalų ir oro mišinio santykį","degalų santykį","oro santykį"],"c":[2],"expl":"Šiuolaikiniuose karbiuratoriuose degiojo mišinio kokybė dažniausiai keičiama reguliuojant į cilindrus patenkančio oro kiekį. Tai daroma per oro sklendę arba oro vožtuvą, kurie kontroliuoja, kiek oro maišosi su degalais.","hint":""},{"id":"767","q":"Keisti vidaus degimo varikliui degiojo mišinio santykį kylant reiškia..:","a":["liesinti mišinį","riebinti mišinį","tik oro tankį kompensuoti"],"c":[0],"expl":"Kylant (aukštesniame aukštyje) atmosferos slėgis ir oro tankis mažėja, todėl į variklį patenka mažiau oro. Norint išlaikyti tinkamą degalų ir oro santykį, reikia sumažinti degalų kiekį — tai vadinama mišinio liesinimu. Taip variklis gauna optimalų, liesesnį mišinį, kuris geriau degs esant mažesniam oro tankiui.","hint":""},{"id":"768","q":"Tos pačios markės alyvos klampumas priklausys nuo:","a":["nuo esamos temperatūros (ir nuo variklio temperatūros)","nuo alyvos kokybės","nuo alyvos gamintojo"],"c":[0],"expl":"","hint":""},{"id":"769","q":"Fiksuoto žingsnio sraigto didžiausias efektyvumas dažniausiai parenkamas:","a":["aukštėjant","žemėjant","horizontaliame skridime (kelionės metu)"],"c":[2],"expl":"","hint":""},{"id":"770","q":"Pernelyg riebų kuro mišinį parodo:","a":["ugnies “liežuvis”","balti dūmai","juodi dūmai"],"c":[2],"expl":"Pernelyg riebus kuro mišinys reiškia, kad variklyje yra per daug degalų ir nepakankamai oro, todėl degimas yra neišsamus. Dėl to susidaro juodi dūmai — tai degalų suodžių ir nesudegusių dalelių išmetamosios dujos","hint":""},{"id":"771","q":"Kai akumuliatorių baterijos visiškai išsikrovę, atsiranda tendencija:","a":["augti įtampai","kristi įtampai"],"c":[1],"expl":"","hint":""},{"id":"772","q":"Akumuliatoriaus baterijų talpumas reiškiamas terminu:","a":["amper- voltais","vatais","amper- valandomis"],"c":[2],"expl":"","hint":""},{"id":"773","q":"Didinant tikrąjį skridimo greitį ir palaikant nekintamus variklio sūkius, fiksuoto žingsnio sraigto atakos kampas:","a":["didėja","mažėja","nekinta"],"c":[1],"expl":"Fiksuoto žingsnio sraigtas turi pastovų pasvirimo kampą savo mentėms. Kai didėja tikrasis skridimo greitis, oras pradeda tekėti greičiau per sraigto mentes, todėl santykinis oro srauto kampas (atakos kampas) ant sraigto menčių mažėja. Tai vyksta todėl, kad menčių judėjimo kampas nekinta, bet oro srauto greitis didėja, todėl oro srauto kryptis santykinai pasisuka.","hint":""},{"id":"774","q":"Stringeriai yra viena iš orlaivio fiuzeliažo dalių. Kokia jų paskirtis?","a":["Atlikti saulės ir šiluminės izoliacijos funkciją","Atlaikyti kirpimo jėgas","Apjungti slėgio apkrovas, kurias danga keičia į tempimo apkrovas"],"c":[2],"expl":"","hint":""},{"id":"775","q":"Vidaus degimo variklio dalis, kuri keičia slenkamąjį judesį į sukamąjį, vadinama:","a":["generatorius","reduktorius","alkūninis velenas"],"c":[2],"expl":"","hint":""},{"id":"776","q":"Vidaus degimo variklis gali perkaisti dėl pernelyg:","a":["didelių apsukų","riebaus degalų mišinio","lieso degalų mišinio"],"c":[2],"expl":"Liesas degalų mišinys reiškia, kad variklyje yra per daug oro ir per mažai degalų, todėl degimas vyksta karščiau, o temperatūra variklyje kyla. Dėl to variklis gali perkaisti. Riebus mišinys dažniau sukelia variklio užsikimšimą ar dūmingumą, o dideli apsukų kiekiai ne visada sukelia perkaitimą, jei mišinio sudėtis tinkama.","hint":""},{"id":"777","q":"Orlaivio variklio sukimo momentas matuojamas nuo:","a":["alkūninio veleno","pagalbinio reduktoriaus","reduktoriaus, sumontuoto tarp variklio ir sraigto","sraigto mentės"],"c":[2],"expl":"","hint":""},{"id":"778","q":"Pernelyg ekonomiškam kuro naudojimui sureguliuotas kuro mišinys gali iššaukti:","a":["variklio purtymą","aukštą cilindrų galvučių ir išmetamųjų dujų temperatūrą","žemą galvučių temperatūrą"],"c":[1],"expl":"Pernelyg liesas (ekonomiškas) kuro mišinys degdamas sukelia aukštesnę degimo temperatūrą, todėl kyla cilindrų galvučių ir išmetamųjų dujų temperatūra. Tai gali sukelti perkaitimą ir variklio pažeidimus. Variklio purtymas dažniau būna dėl netolygios degimo eigos ar uždegimo problemų, o žema galvučių temperatūra rodo per riebų mišinį ar kitokias problemas.","hint":""},{"id":"779","q":"Magnetų jungiklis išjungtas (padėtyje „OFF“). Tačiau variklis toliau dirba normaliai. Labiausiai tikėtina tokio gedimo priežastis bus:","a":["nutrūkęs jungiklio įžeminimo laidas","nutrūkęs komutatoriaus įžeminimo laidas","laidas nuo magnetų kontaktuoja su variklio metalinėmis dalimis","apanglėję žvakių elektrodai"],"c":[0],"expl":"Magnetų jungiklis („magnetinis jungiklis“) valdo uždegimo grandinės užbaigimą įžeminant ją, taip išjungdamas variklį. Jei įžeminimo laidas nutrūkęs, jungiklis negali užbaigti grandinės ir išjungti uždegimo, todėl variklis toliau dirba, net jei jungiklis yra „OFF“ padėtyje. Kiti variantai nesukeltų tokio gedimo tokiu būdu.","hint":""},{"id":"780","q":"Jeigu viena iš 12 švino-rūgštinių akumuliatorių baterijų išėjo iš rikiuotės, tai akumuliatorius:","a":["netinkamas, neveikia","tinkamas naudojimui"],"c":[0],"expl":"","hint":""},{"id":"781","q":"Duraliuminio lydinys:","a":["sudarytas iš aliuminio pagrindo, sunkiai virinasi, laidus šilumai","sudarytas iš aliuminio-magnio pagrindo","lengvai virinasi","sunkiai virinasi","geras šilumos laidininkas","gerai apsaugotas nuo korozijos"],"c":[0],"expl":"","hint":""},{"id":"782","q":"Jeigu įžeminimo laidas tarp uždegimo jungiklio ir magneto atsijungė, tai variklis:","a":["variklis dirbs toliau","užges","neįsijungs"],"c":[0],"expl":"Įžeminimo laidas tarp uždegimo jungiklio ir magneto skirtas užbaigti uždegimo grandinę ir išjungti variklį. Jei šis laidas atsijungia, grandinė nebus užbaigta, todėl uždegimas neveiks taip, kaip turi, ir variklis toliau dirbs, nepaisant to, kad jungiklis gali būti išjungtas.","hint":""},{"id":"783","q":"Sąlygos prie kurių variklio galia išgaunama didesnė:","a":["įpučiant papildomai oro (turbinos pagalba)","didinant sūkius","prie tinkamų oro sąlygų"],"c":[0],"expl":"Daugiau oro į cilindrus reiškia, kad galima sudeginti daugiau degalų, todėl išgaunama didesnė galia. Tai efektyvesnis būdas nei vien tik sūkių didinimas ar palankios oro sąlygos.","hint":""},{"id":"784","q":"Lėktuvo magnetai išsijungia:","a":["išjungus magnetų jungiklius","automatiškai"],"c":[0],"expl":"","hint":""},{"id":"785","q":"Pagrindinis keičiamo žingsnio sraigto privalumas lyginant su fiksuoto žingsnio sraigtu yra:","a":["aukštesnis naudingumo koeficientas kreiseriniuose diapazonuose","nekintantis naudingumo koeficientas visuose skrydžio diapazonuose","mažesnės sraigto menčių apkrovos","aukštesnis naudingumo koeficientas visuose skrydžio diapazonuose"],"c":[3],"expl":"","hint":""},{"id":"787","q":"Jeigu vidaus degimo variklio oro ir kuro masės santykis yra maždaug 9:1, sakoma, kad mišinys yra:","a":["riebus","liesas"],"c":[0],"expl":"Riebus mišinys reiškia, kad degalų̨ yra daug, o oro – mažai.(Pirmas skaičius kuras, antras oras)","hint":""},{"id":"788","q":"Šaltu oru, paleisdamas variklį pilotas pastebi, kad alyvos slėgis šiek tiek aukštesnis negu normalus. Tai reiškia, kad:","a":["normalu","normalu, jei slėgis tuoj pat atsistato"],"c":[1],"expl":"","hint":""},{"id":"789","q":"Keturtakčio variklio „varomasis\" taktas yra:","a":["uždegimas","uždegto mišinio plėtimasis","įsiurbimas"],"c":[1],"expl":"","hint":""},{"id":"790","q":"„Saugia konstrukcija\" vadinama:","a":["kai sugedus vienai OL konstrukcijai ją pakeičia kita","pigus ir supaprastintas konstrukcijos tipas","mažiems OL skirtas konstrukcijos tipas"],"c":[0],"expl":"","hint":""},{"id":"791","q":"Kas nutinka esant per stipriai įtemptiems vairų valdymo trosams?","a":["Greičiau susidėvi, sunkiai valdosi","Sunkiai valdosi","Greičiau susidėvi"],"c":[0],"expl":"","hint":""},{"id":"792","q":"Aviacinio vidaus degimo variklio uždegimo sistema priklauso nuo:","a":["pastovios srovės elektros generatoriaus","kintamos srovės generatoriaus","nepriklauso nuo lėktuvo elektros sistemos","baterijų"],"c":[2],"expl":"Aviaciniuose vidaus degimo varikliuose naudojamos magnetinės uždegimo sistemos (magnetai), kurios generuoja elektros srovę savarankiškai ir nepriklauso nuo orlaivio elektros sistemos.","hint":""},{"id":"793","q":"Ką reiškia užrašas orlaivyje VMAX?","a":["Didžiausias leistinas greitis","Didžiausias manevravimo greitis","Didžiausias horizontalaus skridimo greitis"],"c":[2],"expl":"","hint":""},{"id":"794","q":"Kokios jėgos veikia OL konstrukciją?","a":["Tempimas, gniuždymas","Kirpimas","Lenkimas","Sukimas","Lankstymas","Laužimas, įlenkimas","Teisingi a,b,c,d"],"c":[6],"expl":"","hint":""},{"id":"795","q":"Pagrindinė tepalo paskirtis yra:","a":["mažinti trintį","mažinti komponentų susidėvėjimą","apsaugoti nuo korozijos","valyti variklį nuo nuosėdų","visi išvardinti"],"c":[4],"expl":"Tepalas vienu metu mažina trintį, saugo nuo susidėvėjimo, apsaugo nuo korozijos ir padeda išnešioti bei pašalinti nuosėdas iš variklio vidaus. Visos šios funkcijos yra svarbios sklandžiam variklio darbui.","hint":""},{"id":"796","q":"Riebesnis degusis mišinys gali būti naudojamas kopimo etapuose, jo poveikis:","a":["išgaunamas didesnis sukimo momentas","didesnis variklio naudingumo koeficientas","mažas galingumo praradimas","mažesnė cilindro galvučių temperatūra"],"c":[3],"expl":"Riebesnis mišinys kopimo metu naudojamas tam, kad sumažintų variklio temperatūrą, ypač cilindrų galvučių srityje, nes papildomas degalai padeda vėsinti variklį ir apsaugo nuo perkaitimo. Tai yra svarbiausia jo naudojimo priežastis.","hint":""},{"id":"797","q":"Vidaus degimo variklis gali perkaisti dėl pernelyg:","a":["lieso mišinio","žemo atmosferos slėgio","riebaus mišinio","aukšto barometrinio slėgio"],"c":[0],"expl":"Liesas mišinys turi per daug oro ir per mažai degalų, todėl degimas vyksta aukštesnėje temperatūroje, kas gali sukelti variklio perkaitimą.","hint":""},{"id":"798","q":"Keturtakčiuose vidaus degimo varikliuose uždegimas kiekviename cilindre įvyksta (VMT viršutinis mirties taškas):","a":["uždegimas įvyksta po mirties taško","uždegimas nesusijęs su stūmoklio padėtimi","prieš mirties tašką kas antrą alkūninio veleno apsisukimą","uždegimas vyksta tik esant stūmokliui žemiausiame taške"],"c":[2],"expl":"Keturtakčiuose varikliuose uždegimas vyksta prieš viršutinį mirties tašką (VMT) kas antrą alkūninio veleno apsisukimą, kad uždegimas ir degimas įvyktų optimaliai ir užtikrintų efektyvų variklio darbą.","hint":""},{"id":"799","q":"Kokiu oru variklis išgauna didesnę galią?","a":["Sausas oras , aukštas slėgis , šaltas oras","Variklis išgauna didesnę galią esant mažam atmosferos slėgiui","Variklis išgauna didesnę galią karštame, drėgname ore","Variklio galia nepriklauso nuo oro tankio"],"c":[0],"expl":"Sausas oras, aukštas slėgis ir šaltas oras yra sąlygos, kurios užtikrina didesnį oro tankį. Didesnis oro tankis leidžia varikliui įsiurbti daugiau deguonies, todėl galima išgauti didesnę galią.","hint":""}]},"Žmogaus galimybės skraidyti":{"slug":"zmogaus-galimybes-skraidyti","questions":[{"id":"7","q":"Kas atsakingas už sveikatos būklės palaikymą?","a":["darbdavys","pats pilotas","aviacijos medicinos ekspertai"],"c":[1],"expl":"Piloto sveikatos būklės palaikymas yra pačio piloto atsakomybė – jis turi rūpintis tinkama fizine ir psichine būkle, kad galėtų saugiai skraidyti.","hint":""},{"id":"176","q":"Prieš pat skrydį sunegalavote. Jūs:","a":["niekam apie tai nesakote ir toliau ruošiatės skristi","perspėjate kartu skrendančius kolegas, kad nesveikuojate","atsisakote skristi"],"c":[2],"expl":"Jei pilotas jaučia, kad yra nesveikas, jis turi atsisakyti skristi, kad neužkrautų pavojaus sau ir keleiviams.","hint":""},{"id":"177","q":"Didžiausią Žemės atmosferos dujų dalį sudaro:","a":["deguonis","azotas","anglies dvideginis"],"c":[1],"expl":"Azotas (N₂) – apie 78 %, Deguonis (O₂) – apie 21 %, Argonas (Ar) – apie 0,93 %, Anglies dioksidas (CO₂) – apie 0,04 % .","hint":""},{"id":"178","q":"Koks oras tankesnis?","a":["šaltesnis","šiltesnis"],"c":[0],"expl":"Šaltas oras yra tankesnis , nes šiluma plečia oro molekules, o vėsa jas sutraukia. Todėl šaltas oras turi didesnį tankį .","hint":""},{"id":"179","q":"Didėjant aukščiui temperatūra laipsniškai mažėja:","a":["0,65C kas 100 m","0,5C kas 100 m","1,65C kas 150 m"],"c":[0],"expl":"Standartinis atmosferos temperatūros mažėjimo greitis yra apie 6,5 °C per 1000 m arba 0,65 °C kas 100 m.","hint":""},{"id":"180","q":"Kvėpavimo proceso metu oras įtraukiamas į plaučius. Ką raudonieji kraujo kūneliai (eritrocitai) gabena iš plaučių į audinius?","a":["Deguonį","gliukozę","anglies monoksidą"],"c":[0],"expl":"Eritrocitai perneša deguonį iš plaučių į audinius, kur jis reikalingas organizmo funkcionavimui.","hint":""},{"id":"181","q":"Kaip krauju transportuojamas anglies dvideginis?","a":["kraujo plazmos pagalba","baltaisiais kraujo kūneliais","eritrocitų pagalba"],"c":[0],"expl":"","hint":""},{"id":"182","q":"Didėjant aukščiui, santykinis deguonies kiekis ore:","a":["didėja","mažėja","nekinta"],"c":[2],"expl":"Santykinis kiekis (%) nesikeičia, nes oro sudėtis išlieka ta pati (78 % azoto, 21 % deguonies ir t. t.). Absoliutus deguonies kiekis (t. y. molekulių skaičius) mažėja.","hint":""},{"id":"183","q":"Didėjant aukščiui, oro tankumas:","a":["mažėja","didėja","nekinta"],"c":[0],"expl":"Kylant aukštyn, atmosferos slėgis mažėja – kuo aukščiau, tuo oro dalelių mažiau, todėl oro masė ir slėgis mažėja .","hint":""},{"id":"184","q":"Koks iš išvardintų cheminių junginių vykstant normaliai medžiagų apykaitai pašalinamas iš organizmo per plaučius?","a":["švino tetratėliau","anglies dvideginis","gliukozė"],"c":[1],"expl":"","hint":""},{"id":"185","q":"Įsisavinamo deguonies kiekis, didėjant aukščiui:","a":["didėja","mažėja","nesikeičia"],"c":[1],"expl":"Atmosferos slėgis su aukščiu mažėja , todėl ir deguonies dalinis slėgis (t. y. kiek jo patenka į plaučius) taip pat mažėja .","hint":""},{"id":"259","q":"Dėl kurio pakitusio aplinkos parametro, padidėjus skridimo aukščiui, organizmas gauna mažiau deguonies?","a":["Temperatūros","Slėgio","Procentinio deguonies santykio su kitomis įkvepiamomis dujomis"],"c":[1],"expl":"Atmosferos slėgis su aukščiu mažėja , todėl ir deguonies dalinis slėgis (t. y. kiek jo patenka į plaučius) taip pat mažėja .","hint":""},{"id":"260","q":"Koks yra normalus minutinis kvėpavimo tūris?","a":["dažnis 15-20 kartų per min., o įkvepiame vienu kartu apie O,5-0,6 l oro tai 8 litrai per min.","3 l","5 l"],"c":[0],"expl":"Normalus minutinis kvėpavimo tūris ramybės būsenoje yra apie 7–9 litrų per minutę. Vidutinis kvėpavimo dažnis : 15–20 kartų per minutę, tūris per įkvėpimą ~0,5–0,6 l.","hint":""},{"id":"261","q":"Kaip vadinamas deguonies badas, galintis stipriai paveikti pilotą?","a":["hiperventiliacija","hipoksija","hipotermija"],"c":[1],"expl":"Hipoksija – tai būklė, kai organizmo audiniai negauna pakankamai deguonies , reikalingo normaliam funkcionavimui.","hint":""},{"id":"262","q":"AngIies monoksidas:","a":["lengvai atpažįstamas dėl specifinio kvapo","lengvai atpažįstamas dėl specifinės spalvos","sunkiai atpažįstamas, nes jis bekvapis ir beskonis"],"c":[2],"expl":"Anglies monoksidas, cheminė formulė CO, yra bespalvės, bekvapės, beskonės, degios, paprastai lengvesnės už orą ir labai toksiškos dujos.","hint":""},{"id":"263","q":"Anglies monoksido efektai organizme:","a":["veikia nepastebimai ir mirtinai, 10-20proc. koncentracija- skauda galvą, silpna pykina, o virš 40 proc.- sutrinka kvėpavimas ir širdies veikla, traukuliai, oda rožinės spalvos","Išoriškai pastebėti anglies monoksido poveikio neįmanoma","Anglies monoksidas organizmui neturi jokio poveikio."],"c":[0],"expl":"Anglies monoksidas, cheminė formulė CO, yra bespalvės, bekvapės, beskonės, degios, paprastai lengvesnės už orą ir labai toksiškos dujos.","hint":""},{"id":"264","q":"Kokių dujų kiekis kraujyje iš esmės reguliuoja kvėpavimo dažnį?","a":["Deguonis","anglies dvideginio","anglies monoksido"],"c":[1],"expl":"Organizmas kvėpavimo dažnį daugiausiai reguliuoja pagal anglies dvideginio kiekį kraujyje. Kuo santykinai daugiau anglies dvideginio, tuo dažniau žmogus kvėpuoja.","hint":""},{"id":"265","q":"Kokioms dujoms hemoglobinas, esantis raudonuose kraujo kūneliuose, turi didesnę trauką?","a":["deguoniui","anglies dvideginiui","anglies monoksidui"],"c":[2],"expl":"Anglies monoksidas daug kartų labiau prisiriša prie hemoglobino negu deguonis todėl yra labai didelė rizika mirtinai nusinuodyti.","hint":""},{"id":"266","q":"Sugedusi variklio dujų išmetimo sistema kelia pavojų apsinuodyti:","a":["anglies monoksidu","anglies dvideginiu","azotu"],"c":[0],"expl":"Sugedus variklio išmetimo sistemai (pavyzdžiui, jei yra nesandarumų ar pažeistas duslintuvas), į orlaivio saloną gali patekti anglies monoksidas (CO) – bekvapės, bespalvės ir labai pavojingos dujos. Jų įkvėpimas net ir mažais kiekiais ilgą laiką gali sukelti: galvos skausmą, svaigimą, pykinimą, sąmonės netekimą, o sunkiais atvejais – mirtį dėl deguonies trūkumo kraujyje.","hint":""},{"id":"267","q":"Apsinuodijimas cheminėmis medžiagomis gali būti:","a":["Lėtinis","lėtinis ir ūmus","ūmus"],"c":[1],"expl":"Apsinuodijimas cheminėmis medžiagomis gali būti: Ūmus – kai nuodinga medžiaga į organizmą patenka per trumpą laiką (vieną ar kelis kartus), dažnai sukelia staigius ir stiprius simptomus.(Pvz. įkvėpus didelį kiekį amoniako ar prarijus nuodų). Lėtinis – kai organizmas ilgą laiką veikiamas mažų kiekių nuodingų medžiagų, kurios palaipsniui kaupiasi.(Pvz. ilgalaikis darbas su švinu ar gyvsidabriu be tinkamos apsaugos).","hint":""},{"id":"268","q":"Ar keleivio rūkomos cigaretės dūmas daro poveikį deguonies kiekiui piloto kraujyje?","a":["daro","nedaro","nedaro iki 4270 m aukščio"],"c":[0],"expl":"Cigaretės dūmuose yra anglies monoksido (CO), kuris jungiasi su hemoglobinu kraujyje daug stipriau nei deguonis. Dėl to: Mažėja deguonies kiekis kraujyje , nes hemoglobinas nebegali pernešti pakankamai deguonies į audinius. Šis poveikis yra reikšmingas net žemame aukštyje , o kylant į didesnį aukštį, kur oro slėgis ir deguonies kiekis natūraliai mažėja, rūkymo poveikis dar labiau sustiprėja .","hint":""},{"id":"269","q":"Dėl hiperventiliacijos:","a":["organizme padidėja deguonies ir sumažėja anglies dvideginio kiekis","organizme sumažėja deguonies ir sumažėja anglies dvideginio kiekis","organizme sumažėja deguonies ir padidėja anglies dvideginio kiekis"],"c":[0],"expl":"Hiperventiliacija yra greitas ir gilus kvėpavimas, o toks kvėpavimas sumažina CO₂ kiekį ir padidina deguonies kiekį kraujyje. Hiperventiliacija išsivysto dėl streso, nerimo, panikos priepuolio. Efektyvi kova prieš hiperventilecija yra kvepavimas savo iškvėptu oro.","hint":""},{"id":"270","q":"Dideliame aukštyje nehermetiniame lėktuve deguonies kiekis, kuris skverbiasi per plaučių membranas į kraują, yra:","a":["sumažėjęs dėl mažo aplinkos slėgio","sumažėjęs dėl žemos temperatūros","nepakitęs, kaip jūros lygyje"],"c":[0],"expl":"Dėl sumažėjusio atmosferos slėgio deguonies dalinis slėgis mažėja, todėl deguonies pasisavinimas į kraują sumažėja.","hint":""},{"id":"271","q":"Kaip keičiasi deguonies procentinis santykis ore, didėjant aukščiui?","a":["mažėja","didėja","nekinta"],"c":[2],"expl":"Oro sudėtis procentais lieka pastovi (~21 % deguonies, 78 % azoto, ir t.t ), nors absoliutus oro slėgis mažėja.","hint":""},{"id":"272","q":"Ar raumenų jėga sumažėja apsinuodijus anglies monoksidu?","a":["taip","ne"],"c":[0],"expl":"Apsinuodijus anglies monoksidu (CO) , sumažėja deguonies pernaša kraujyje, nes CO jungiasi su hemoglobinu 200–250 kartų stipriau nei deguonis. Dėl to: Į raumenis ir kitus audinius patenka nepakankamai deguonies . Raumenys silpnėja , atsiranda nuovargis , o sunkesniais atvejais – raumenų koordinacijos sutrikimai ar net paralyžius.","hint":""},{"id":"273","q":"Skrendate orlaiviu, kurio kabina nehermetinė. Koks mažiausias aukštis, kuriame reikia užsidėti deguonies kaukę?","a":["5200 m","3050 m","2500 m"],"c":[1],"expl":"","hint":""},{"id":"274","q":"Greitas arba gilus kvėpavimas, ypač kai naudojamas deguonis, gali sukelti:","a":["hipoksiją","hiperventiliacijos pavojų","miopiją"],"c":[1],"expl":"Hiperventiliacija yra greitas ir gilus kvėpavimas, o toks kvėpavimas sumažina CO₂ kiekį ir padidina deguonies kiekį kraujyje. Hiperventiliacija išsivysto dėl streso, nerimo, panikos priepuolio. Efektyvi kova prieš hiperventilecija yra kvepavimas savo iškvėptu oro.","hint":""},{"id":"275","q":"Siūlomas hiperventiliacijos gydymo būdas yra:","a":["dažninti kvėpavimą","Lėtinti kvėpavimą ir/ar kvėpuoti iškvėptomis dujomis","panaudoti deguonies kaukę"],"c":[1],"expl":"Hiperventiliacija išsivysto dėl streso, nerimo, panikos priepuolio. Efektyvi kova prieš hiperventilecija yra kvepavimas savo iškvėptu oro. Lėtesnis kvėpavimas į maišelį padeda atstatyti CO₂ lygį.","hint":""},{"id":"276","q":"Sumažėjęs deguonies kiekis organizme vadinamas:","a":["hipoksija","hiperventiliacija","baro trauma"],"c":[0],"expl":"Hipoksija – tai būklė, kai organizmui ar jo dalims trūksta deguonies . Gali kilti dėl mažo deguonies kiekio ore (pvz., aukštai kalnuose ar skrydžio metu), kvėpavimo sutrikimų, apsinuodijimų (pvz., anglies monoksidu).","hint":""},{"id":"277","q":"Anksčiausiai pasireiškiantis hipoksijos požymis yra:","a":["mieguistumas","euforija"],"c":[1],"expl":"Hipoksijos požymiai yra: euforija tada mieguistumas, koordinacijos sutrikimas, galvos skausmas, dilgčiojimas, pakitęs kvėpavimas, raumenų silpnumas, susilpnėjusi atmintis, susilpnėja regėjimo jautrumas, tunelinis matymas, sąmonės sutrikimai, cianozė, skruzdžių bėgiojimo pojūtis, sąmonės praradimas ir mirtis","hint":""},{"id":"278","q":"Būdingiausias hiperventiliacijos požymis yra:","a":["lėtas kvėpavimas","euforija","svaigulys"],"c":[2],"expl":"Hiperventiliacija sumažina CO₂ lygį, o tai pagrindinis faktorius, kuris gali sukelti galvos svaigimą ir galvos skausmą.","hint":""},{"id":"279","q":"Dažnas kvėpavimas dėl susijaudinimo, susirūpinimo ar judesių sutrikimo gali sukelti:","a":["Hiperventiliaciją","hipoksija"],"c":[0],"expl":"Hiperventiliacija yra greitas ir gilus kvėpavimas, o toks kvėpavimas sumažina CO₂ kiekį ir padidina deguonies kiekį kraujyje. Hiperventiliacija išsivysto dėl streso, nerimo, panikos priepuolio. Efektyvi kova prieš hiperventilecija yra kvepavimas savo iškvėptu oro.","hint":""},{"id":"280","q":"Jūs esate nedideliame - iki 3050 m (10000 pėdų) aukštyje. Ką galėtų reikšti padažnėjęs kvėpavimas ir požymiai, panašūs į hipoksija?","a":["hiperventiliaciją","miopiją","baro traumą"],"c":[0],"expl":"Esant iki 3050 m (10 000 pėdų) aukštyje, oro slėgis sumažėja, todėl organizmas pradeda kompensuoti sumažėjusį deguonies kiekį dažnesniu kvėpavimu.","hint":""},{"id":"281","q":"Dėl rūkymo hipoksijos tikimybė:","a":["didėja","mažėja","nekinta"],"c":[0],"expl":"Rūkymas mažina hemoglobino deguonies pernešimo pajėgumą, didindamas hipoksijos riziką.","hint":""},{"id":"282","q":"Rūkymas sukelia:","a":["ankščiau hipoksiją, labai sumažina kraujo sugebėjimą prisijungti deguonį","Rūkymo žala neturi didelės įtakos","Rūkymas sukelia raumenų spazmus, nuovargį"],"c":[0],"expl":"Cigarečių dūmuose esantis CO 2 ir kitos medžiagos mažina deguonies pernešimą taip skatina hipoksiją.","hint":""},{"id":"283","q":"Iki kurio aukščio, lėktuvui skrendant, pilotas sugeba veikti, nepatirdamas hipoksijos?","a":["3050 m (10000 ft)","6100 m (20000 ft)","9150 m (30000 ft)"],"c":[0],"expl":"","hint":""},{"id":"284","q":"Ar hipoksiją gali parodyti keistas fizinis arba protinis elgesys?","a":["negali","gali"],"c":[1],"expl":"Hipoksija – tai deguonies trūkumas organizme, o pirmiausia nukenčia smegenys , kurios yra labai jautrios deguonies stygiui.","hint":""},{"id":"285","q":"Atsisakę skrydžio po nardymo su akvalangu ir kvėpavimo suspaustu oru, jūs sumažinate:","a":["hipoksijos pavojų","hiperventiliacijos pavojų","dekompresijos ligos pavojų","pavojų apakti"],"c":[2],"expl":"Po nardymo su akvalangu ar kvėpavimo suspaustu oru organizmo audiniuose padaugėja azoto. Jei iš karto po nardymo iškeliaujate į didesnį aukštį (pavyzdžiui, skrydį lėktuvu), slėgio sumažėjimas priverčia azota plėstis, taip sukeldamas dekompresijos ligą.","hint":""},{"id":"286","q":"Kokios dujos, ištirpusios kraujyje, daugiausiai kenkia dekompresijos ligos atveju?","a":["deguonis","azotas","anglies dvideginis","angles monoksidas"],"c":[1],"expl":"Kylant greitai azotas ištirpęs audiniuose formuoja burbuliukus, sukeldamas taip dekompresijos ligą.","hint":""},{"id":"287","q":"Kiek laiko iki skrydžio turi palaukti davęs kraujo pilotas?","a":["24 val.","12 val.","20 val."],"c":[0],"expl":"","hint":""},{"id":"288","q":"Kuriam laikui reikia atidėti skrydį, jei nardėte su akvalangu ne giliau kaip 10 m (30 pėdų)?","a":["6 val.","12 val.","24 val."],"c":[1],"expl":"","hint":""},{"id":"289","q":"Kuriam laikui reikia atidėti skrydį, jei nardėte su akvalangu giliau kaip 10 m (30 pėdų)?","a":["6 val.","12 val.","24 val."],"c":[2],"expl":"","hint":""},{"id":"290","q":"Pulso dažniui įtakoja veiksniai:","a":["deguonies kiekis ore, stresas, fizinis krūvis","fizinė veikla","Stresas"],"c":[0],"expl":"Deguonies kiekis ore – sumažėjęs deguonies lygis (pvz., aukštyje) gali padidinti pulsą, kad organizmas kompensuotų deguonies trūkumą. Stresas – išskiria adrenalino ir kitų hormonų, kurie padidina širdies ritmą. Fizinis krūvis – didina širdies susitraukimų dažnį, kad raumenys gautų daugiau deguonies.","hint":""},{"id":"291","q":"Teigiamų +G perkrovų metu:","a":["Sumažėja smegenų aprūpinimas krauju, sustoja kraujotaka akių tinklainėse","vidaus organai kyla aukštyn, smegenys aprūpinamos krauju","vidaus organai leidžiasi žemyn, smegenys pilnai aprūpinamos krauju"],"c":[0],"expl":"+G perkrovos (teigiamos perkrovos) – tai situacijos, kai kūnas patiria didesnį nei normalų jėgos padidėjimą, dažniausiai kylant į viršų ar pasukant orlaivį. Dėl šios perkrovos kraujas nuteka į kūno apačią (kojas ir pilvą), o smegenys ir akys gali būti nepakankamai aprūpinami krauju.","hint":""},{"id":"292","q":"Neigiamų -G perkrovų metu:","a":["Padidėja arterinis ir veninis kraujo spaudimas galvos srityje, kraujas suteka į smegenis, gali sutrūkinėti akies kraujagyslės","Padidėja veninis kraujo spaudimą galvos srityje, kraujas teka iš smegenų","Padidėja arterinis spaudimas"],"c":[0],"expl":"Neigiamos - G perkrovos atsiranda, kai kūnas patiria pagreitį žemyn (pvz., greitai leidžiantis ar verčiantis orlaiviu aukštyn kojomis). Dėl šios perkrovos: Kraujas staigiai traukiasi link galvos , todėl galvos srityje labai padidėja tiek arterinis, tiek veninis kraujo spaudimas .","hint":""},{"id":"293","q":"Nuo kokios teigiamos +G perkrovos dydžio žmogus gali prarasti sąmonę:","a":["3,5 G","1 G","5G","6 G"],"c":[2],"expl":"","hint":""},{"id":"294","q":"VestibiuIiarinis aparatas atsakingas už:","a":["kūno orientaciją erdvėje","pusiausvyrą/ koordinaciją","judesius"],"c":[1],"expl":"Vestibuliarinis aparatas (esančias vidinėje ausyje) yra pagrindinė sistema, padedanti kūnui išlaikyti pusiausvyrą .","hint":""},{"id":"295","q":"Nuo ko daugiausiai priklauso akies prisitaikymo tamsoje greitis?","a":["nuo gero fizinio pasiruošimo","nuo kontrasto tarp ankščiau patirtos šviesos ryškumo ir tamsos laipsnio naujoje aplinkoje","nuo gero profesinio pasiruošimo"],"c":[1],"expl":"Akies prisitaikymo tamsoje greitis (t. y. naktinis regėjimas ) daugiausia priklauso nuo: Šviesos pokyčio stiprumo : kuo staigesnis ir didesnis kontrastas tarp buvusio šviesos ryškumo ir tamsos, tuo ilgiau trunka prisitaikyma.","hint":""},{"id":"296","q":"Kiek laiko užtrunka adaptacija šviesai?","a":["5-10 minučių","5-10s","30-60s"],"c":[1],"expl":"","hint":""},{"id":"297","q":"Kiek laiko užtrunka adaptacija tamsai?","a":["30-60 min.","10min.","20min.","15min."],"c":[0],"expl":"Rodopsino degradacija yra labai greita, jo regeneracija daug lėtesnė. Todėl adaptavimas (akis) nuo šviesos iki tamsos reikalauja kur kas daugiau laiko nei nuo tamsios iki šviesos: akims gali užtrukti iki 45 minučių, kad \"prisikabintų\" prie tamsos. Po trumpo, bet labai ryško apšvietimo prisitaikymas (akis) gali užtrukti iki valandos.","hint":""},{"id":"298","q":"Kas sukelia trumparegystę arba toliaregystę?","a":["akies obuolio pailgumas arba akies ragenos iškilimas","akies ragenos iškilimas","akies obuolio pailgumas"],"c":[0],"expl":"","hint":""},{"id":"299","q":"Koks regėjimo aštrumas laikomas normaliu?","a":["1","2","0,5"],"c":[0],"expl":"Regėjimo aštrumas - mažiausias kampas, kai akis dar skiria du vienodai nutolusius taškus. Daugumai žmonių tas kampas yra 1°; regėjimo aštrumas tada yra 1,0. Regėjimo aštrumas iš esmės reiškia aptikimą, skiriamąją gebą ar atpažinimą. Apibūdinant tiksliau, regėjimo aštrumas yra regėjimo sistemos skiriamoji geba, t. y. sugebėjimas matyti atskirus ir nesusiliejančius du ar daugiau taškų, linijų ar kitų objektų","hint":""},{"id":"300","q":"Toliaregystė koreguojama?","a":["cilindriniais lęšiais","skleidžiamaisiais lęšiais","glaudžiamaisiais lęšiais"],"c":[2],"expl":"Toliaregystė (hiperopija) atsiranda, kai akies optinė sistema per silpna arba akis per trumpa – todėl vaizdas susiformuoja už tinklainės . Glaudžiamieji lęšiai (teigiami, + dioptrijų) sutelkia spindulius anksčiau, taip perkeldami vaizdą ant tinklainės , ir leidžia matyti geriau.","hint":""},{"id":"301","q":"Trumparegystė koreguojama?","a":["cilindriniais lęšiais","skleidžiamaisiais lęšiais","glaudžiamaisiais lęšiais"],"c":[1],"expl":"Trumparegystė (miopija) atsiranda, kai akies obuolys yra per ilgas arba akies lūžio galia per stipri–todėl šviesos spinduliai susikerta prieš tinklainę . Skleidžiamieji lęšiai (neigiami,- dioptrijų) išsklaido šviesą , kad ji būtų sufokusuota tiksliai ant tinklainės , pagerindami matymą į tolį.","hint":""},{"id":"302","q":"Į akį patenkančios šviesos kiekį reguliuoja?","a":["ragena","Lęšis","rainelė","tinklainė"],"c":[2],"expl":"Rainelė – tai spalvota akies dalis, esanti aplink vyzdį. Ji veikia kaip diafragma: sutraukdama arba išplėsdama vyzdį , reguliuoja, kiek šviesos patenka į akies vidų – panašiai kaip fotoaparato diafragma.","hint":""},{"id":"303","q":"Dienos metu didžiausia tikimybė pastebėti kitą lėktuvą yra:","a":["kai vaizdas fokusuojamas tinklainės kolbelėse","kai vaizdas fokusuojamas tinklainės lazdelėse (periferijoje)"],"c":[0],"expl":"Dienos metu regėjimą daugiausia užtikrina kolbelės , esančios tinklainės centre (ypač geltonojoje dėmėje / centrinėje duobutėje ). Kolbelės yra atsakingos už: spalvų matymą , detalų regėjimą ir gerą regėjimo aštrumą esant ryškiai šviesai.","hint":""},{"id":"348","q":"Nakties metu didžiausia tikimybė pastebėti kitą lėktuvą yra:","a":["kai vaizdas fokusuojamas tinklainės kolbelėse ( centre)","kai vaizdas fokusuojamas tinklainės lazdelėse (periferijoje)"],"c":[1],"expl":"Lazdelės – tai šviesai jautrūs receptoriai, esantys tinklainės periferijoje , kurie puikiai veikia prieblandoje ir tamsoje . Naktį, kai šviesos labai mažai, būtent lazdelės leidžia aptikti silpnus šviesos šaltinius ir judesį – todėl naktį geriau pastebimi objektai yra tie, kurie fokusuojasi ne centre, o šiek tiek šonuose (periferijoje) .","hint":""},{"id":"349","q":"Stebint tuščią regėjimo lauką, akys fokusuoja žvilgsnį šiame nuotolyje:","a":["1-2 metrai","20 metrų","begalybė"],"c":[0],"expl":"Kai žmogus žiūri į tuščią lauką , kuriame nėra aiškaus objekto, į kurį būtų galima fokusuoti , akis automatiškai pereina į „tuščio lauko “ trumparegystė. Tyrimais nustatyta, kad daugumos žmonių šis taškas yra apie 1–2 metrus nuo akių .","hint":""},{"id":"350","q":"Kokiais akių judesiais patartina ore ieškoti kito orlaivio?","a":["akys nesustodamos juda","akių judesiai trumpi su reguliariais stabtelėjimais","ilgai stebint kaip galima didesnį dangaus plotą"],"c":[1],"expl":"Ieškant kitų orlaivių ore, svarbu neperkrauti akių ir nepavargti . Todėl rekomenduojama atlikti trumpus, sistemingus akių judesius , reguliariai stabtelint ir leidžiant akims sutelkti dėmesį į atskiras sritis. Tokiu būdu geriau aptinkami mažesni ir tolimesni objektai, o regėjimo našumas išlieka aukštas.","hint":""},{"id":"351","q":"Sunkiau pastebėti orlaivį priešais save, kai šis:","a":["skrenda susidūrimo kursu","neskrenda susidūrimo kursu"],"c":[0],"expl":"Kai orlaivis skrenda tiesiai į tave susidūrimo kursu , jo vaizdas tarsi nekinta – jis atrodo stacionarus ir nesikeičia dydžiu ar pozicija tinklainėje. Dėl to jį sunkiau pastebėti, nes akis ir smegenys daugiausia pastebi judėjimą ar pokyčius aplinkoje. Tokie objektai dažnai būna nepastebėti arba pastebimi per vėlai.","hint":""},{"id":"352","q":"Kokiu greičiu tiesiai į jus skrendantis orlaivis atrodys didėjantis?","a":["pastoviu","didėjančiu","mažėjančiu"],"c":[1],"expl":"Kai orlaivis skrenda tiesiai į jus, jo vaizdas tinklainėje didėja didėjančiu greičiu – jis atrodo vis didesnis ir artėja vis sparčiau, nes atstumas tarp jūsų mažėja. Tai reiškia, kad jo matomas dydis auga greičiau ir greičiau, ypač artėjant susidūrimo taškui. Laiką iki susidūrimo apskaičiuojame dalindami atstumą iš greičio: t = 5 Nm / 500 mazgų = 0,01 valandos. Kadangi valanda turi 3600 sekundžių, paverčiame laiką į sekundes: t = 0,01 × 3600 = 36 sekundės.","hint":""},{"id":"353","q":"Du orlaiviai, atitinkamais 150 mazgų ir 350 mazgų greičiais, priešprieša artėja vienas prie kito. Matomumas yra neribotas, bet susidūrimo pavojus pirmą kartą nustatytas, kai atstumas buvo 5 jūrmylės (Nm). Po kiek sekundžių apytikriai įvyks susidūrimas, jeigu nebus imtasi priemonių","a":["24 sek","36 sek","45 sek"],"c":[1],"expl":"Duoti du orlaiviai, kurie artėja vienas prie kito su greičiais 150 mazgų ir 350 mazgų. Bendras jų artėjimo greitis yra 500 mazgų (150 + 350 = 500). Pradinė atstumo reikšmė, kai nustatytas susidūrimo pavojus, yra 5 jūrmylės.","hint":""},{"id":"354","q":"Naktinio skrydžio metu jūs pastebite priešais save tame pat aukštyje nemirksinčią baltą ir raudoną mirksinčią šviesas. Kokia yra kito orlaivio skrydžio kryptis?","a":["kitas orlaivis kerta (jūsų kursą) į kairę","kitas orlaivis kerta jūsų kursą į dešinę","kitas orlaivis artėja tiesiai įjus","kitas orlaivis tolsta nuo jūsų"],"c":[0],"expl":"","hint":""},{"id":"355","q":"Du orlaiviai atitinkamais 120 mazgų ir 380 mazgų greičiais, priešprieša artėja vienas prie kito. Matomumas - 5 jūrmylės (Nm), bet susidūrimo pavojus pirmą kartą nustatytas, kai atstumas buvo 2 jūrmylės (Nm). Po kiek sekundžių apytikriai įvyks susidūrimas, jeigu nebus imtasi priemonių?","a":["14 sek","24 sek","30sek"],"c":[0],"expl":"Du orlaiviai skrenda vienas prieš kitą greičiais 120 ir 380 mazgų, bendras artėjimo greitis yra 500 mazgų. Susidūrimo pavojus pirmą kartą nustatytas, kai atstumas buvo 2 jūrmylės. Laikas iki susidūrimo apskaičiuojamas dalijant atstumą iš greičio: 2 Nm / 500 mazgų = 0,004 valandos. Paverčiant į sekundes: 0,004 × 3600 = 14,4 sekundės. Jei nebus imtasi priemonių, susidūrimas įvyks maždaug per 14 sekundžių.","hint":""},{"id":"356","q":"Naktinio skrydžio metu jūs pastebite priešais save tame pat aukštyje nemirksinčią raudoną ir raudoną mirksinčią šviesas. Kokia yra kito orlaivio skrydžio kryptis?","a":["kitas orlaivis kerta (jūsų kursą) į kairę","kitas orlaivis kerta (jūsų kursą) į dešinę","kitas orlaivis artėja tiesiai į jus","kitas orlaivis tolsta nuo jūsų"],"c":[0],"expl":"","hint":""},{"id":"357","q":"Naktinio skrydžio metu jūs pastebite priešais save tame pat aukštyje nemirksinčią žalią ir raudoną šviesas. Kokia yra kito orlaivio skrydžio kryptis?","a":["kitas orlaivis kerta jūsų kursą į karę","kitas orlaivis kerta jūsų kursą į dešinę","kitas orlaivis artėja tiesiai į jus","kitas orlaivis tolsta nuo jūsų"],"c":[2],"expl":"","hint":""},{"id":"358","q":"Kokia rekomenduojama miego trukmė parai?","a":["8 val.","12 val.","6 val."],"c":[0],"expl":"","hint":""},{"id":"359","q":"Visiškas darbingumas pabudus iš pogulio trunka:","a":["20 min","40 min","1h"],"c":[0],"expl":"","hint":""},{"id":"360","q":"Kuris iš fiziologinių reiškinių negali būti valdomas sąmoningai:","a":["stresas","alkis","mieguistumas","nuovargis"],"c":[3],"expl":"Nuovargis yra organizmo fiziologinė būsena, kuri atsiranda dėl ilgalaikio fizinio ar protinio darbo ir negali būti tiesiogiai valdomas sąmoningai. Jis yra organizmo signalas apie būtinybę pailsėti. Stresas gali būti valdomas sąmoningai per įvairias psichologines technikas ir elgesio pokyčius. Alkis gali būti šiek tiek kontroliuojamas valgymo įpročių ir dėmesio nukreipimo pagalba. Mieguistumas kartais galima įveikti trumpalaikiais budrumą skatinančiais veiksmais, pvz., kava ar fizine veikla.","hint":""},{"id":"361","q":"Laikino pasimetimo erdvėje būsena, kylanti dėl įvairių sensorinių organų klaidinančios informacijos, perduotos smegenims, vadinama:","a":["dekompresija","hipoksija","dezorientacija"],"c":[2],"expl":"Dezorientacija – tai būsena, kai žmogus praranda tikslų suvokimą apie savo padėtį erdvėje (aukštį, kryptį ar judėjimo greitį), dažniausiai dėl to, kad sensoriniai organai ( akis, vidinė ausis, raumenų pojūtis) perduoda klaidinančią arba prieštaringą informaciją smegenims. Tai ypač pavojinga naktį, debesyse ar esant ribotam matomumui, kai sunku remtis regos orientyrais.","hint":""},{"id":"362","q":"Nemalonus, erzinantis ir trukdantis dirbti bei ilsėtis garsas yra:","a":["triukšmas","aušti dažniai","žemi dažniai"],"c":[0],"expl":"Triukšmas – tai nepageidaujamas, nemalonus ar trikdantis garsas , kuris gali turėti neigiamą poveikį žmogaus savijautai, dėmesiui, darbo kokybei bei poilsiui. Nors triukšmas gali apimti įvairius dažnius (aukštus ar žemus), esminė jo savybė – neigiamas poveikis ir nepageidaujamumas.","hint":""},{"id":"363","q":"Kai skrendate migloje, jums gali susidaryti iliuzija, kad daiktai yra:","a":["arčiau, negu yra iš tikrųjų","toliau , negu yra iš tikrųjų"],"c":[0],"expl":"Migloje ar rūke sumažėja kontrastas ir aiškumas , todėl smegenys interpretuoja vaizdus kaip artimesnius , nei jie yra realybėje. Tai yra regos iliuzija, kuri gali būti ypač pavojinga leidžiantis ar prisiartinant prie kliūčių – objektai atrodo esantys arčiau, tad gali būti priimti neteisingi sprendimai dėl aukščio ar greičio.","hint":""},{"id":"364","q":"Kuo reikia pasitikėti, norint sumažinti skrydžio metu kylantį orientavimosi erdvėje sutrikimo pavojų?","a":["organizmo pojūčiais","skrydžio prietaisais","kolegų patarimais"],"c":[1],"expl":"Skrydžio metu, ypač esant prastam matomumui (naktį, debesyse, migloje), žmogaus pojūčiai gali klaidinti dėl fiziologinių apribojimų – tai vadinama erdvine dezorientacija . Vidinės ausies ir pusiausvyros organai gali sukurti klaidingą judėjimo ar padėties pojūtį. Norint to išvengti ir išlaikyti tikslų orientavimąsi, būtina visiškai pasitikėti skrydžio prietaisais , kurie objektyviai rodo orlaivio padėtį, greitį, aukštį ir kryptį.","hint":""},{"id":"365","q":"Kilimo ir tūpimo juosta, kuri yra ilgesnė už įprastine, atrodys esanti:","a":["arčiau, negu yra iš tikrųjų","toliau ,negu yra ištiktųjų"],"c":[1],"expl":"Kai kilimo ir tūpimo takas yra ilgesnis nei įprasta , smegenys tai interpretuoja kaip esantį toliau , nes regos sistema lygina matomą vaizdą su įprastais referenciniais dydžiais. Tai yra viena iš regos iliuzijų , galinčių paveikti skrydžio sprendimus — pavyzdžiui, gali kilti pavojus leistis per žemai, nes pilotui atrodo, kad takas dar toli.","hint":""},{"id":"366","q":"Kilimo ir tūpimo juosta, kuri yra trumpesnė už įprastine, atrodys esanti:","a":["arčiau, negu yra iš tikrųjų","toliau ,negu yra iš tikrųjų"],"c":[0],"expl":"Trumpesnė nei įprasta kilimo ir tūpimo juosta atrodo arčiau , nes regos sistema ją lygina su įprastais dydžiais. Smegenys mato mažesnį vaizdą ir interpretuoja, kad jis yra arčiau , nei yra realybėje.","hint":""},{"id":"367","q":"Siaura kilimo ir tūpimo juosta pilotui, esančiam teisingoje tūptinėje, sudarys įspūdį, kad jis yra pernelyg:","a":["aukštoje tūptinėje","Žemoje tūptinėje"],"c":[0],"expl":"Siaura kilimo ir tūpimo juosta , lyginant su standartine, pilotui vizualiai atrodo tolimesnė ir aukštesnė . Todėl net būdamas teisingoje tūptynėje pilotas gali manyti, kad leidžiasi per aukštai , nes smegenys klaidingai interpretuoja siaurą taką kaip nutolusį.","hint":""},{"id":"368","q":"Plati kilimo ir tūpimo juosta pilotui, esančiam teisingoje tūptinėje, sudarys įspūdį, kad jis yra pernelyg:","a":["aukštoje tūptinėje","žemoje tūptínėje"],"c":[1],"expl":"Plati kilimo ir tūpimo juosta , lyginant su įprastu pločiu, gali sukelti regos iliuziją , kad orlaivis yra pernelyg žemai .","hint":""},{"id":"369","q":"Pilotas ruošiasi tūpti aukštyn kylančioje kilimo ir tūpimo juostoje be nuožulnumo žymėjimų. Kokia būdingiausia piloto klaida artėjant prie juostos?","a":["pasirenka per didelį tūptinės kampą","pasirenka per mažą tūptinės kampą"],"c":[0],"expl":"","hint":""},{"id":"370","q":"Pilotas ruošiasi tūpti nuožulnioje kilimo ir tūpimo juostoje be nuožulnumo žymėjimų. Kokia būdingiausia piloto klaida artėjant prie juostos?","a":["pasirenka per didelį tūptinės kampą","pasirenka per mažą tūptinės kampą"],"c":[1],"expl":"","hint":""},{"id":"371","q":"Tūpiant ant sniego?","a":["Sunkiau įvertinti aukštį ir KTT ribas","lengviau orientuotis nei tūpiant ant žolės"],"c":[0],"expl":"Sniego padengtas paviršius dažnai būna lygus ir vientisas, todėl nėra aiškių ženklų ar orientyrų, pagal kuriuos būtų galima tiksliai įvertinti reljefo aukštį ar kritinių taškų ribas (KTT). Sniegas gali uždengti duobes, kalvutes ar kitus svarbius aukščio pokyčius, todėl matomumas ir orientacija tampa sudėtingesni. Tuo tarpu ant žolės arba kito natūralaus paviršiaus dažniau matyti žolės aukščio pokyčiai, akmenys ar kiti natūralūs ženklai, kurie padeda geriau suprasti reljefo formą ir orientuotis.","hint":""},{"id":"372","q":"Kokioje atmintyje saugomas mintinai išmoktas avarinio atvejo kontrolinis sąrašas?","a":["Ilgalaikėje","Trumpalaikėje"],"c":[0],"expl":"Mintinai išmokti kontroliniai sąrašai saugomi ilgalaikėje atmintyje, nes tai yra įgūdžiai ir žinios, kurios turi būti greitai ir tiksliai pasiekiamos bet kada, ypač avarinėse situacijose.","hint":""},{"id":"373","q":"Kokioje atmintyje bus saugoma instrukcija pereiti į 121.5 dažnį?","a":["Ilgalaikėje","trumpalaikėje"],"c":[1],"expl":"Instrukcija pereiti į 121.5 dažnį yra laikina informacija, reikalinga trumpam veiksmui, todėl ji saugoma trumpalaikėje atmintyje. Jei instrukcija būtų dažnai naudojama arba išmokta mintinai, ji galėtų būti perkelta į ilgalaikę atmintį.","hint":""},{"id":"374","q":"Kaip vadinami praktikos pagalba gauti įgūdžiai, saugomi kaip \"motorinė programa\", kuriuos galima atlikti automatiškai, beveik negalvojant?","a":["įgūdžiai paremtu elgesiu","taisyklės paremtu elgesiu čia supainiota","žiniomis paremtas elgesys"],"c":[0],"expl":"Praktikos metu įgyti įgūdžiai, kurie saugomi kaip „motorinė programa“ ir atliekami automatiškai, yra vadinami įgūdžiais paremtu elgesiu. Tai reiškia, kad veiksmai atliekami be sąmoningo galvojimo, remiantis įgytais motoriniais įgūdžiais.","hint":""},{"id":"375","q":"Kaip vadinamas elgesys pagal numatytą tvarka ar procedūrą, skirtą susitvarkyti numatomo (iš anksto prognozuoto) įvykio metu?","a":["įgūdžiais paremtu elgesiu","taisyklėmis paremtu elgesiu","žiniomis paremtas elgesys"],"c":[1],"expl":"Taisyklėmis paremtas elgesys atsiranda tada, kai asmuo veikia pagal iš anksto nustatytą tvarką, procedūrą ar kontrolinį sąrašą — ypač tais atvejais, kai situacija yra prognozuojama. Tokiu atveju sprendimai remiasi aiškiomis instrukcijomis, o ne vien įgūdžiais ar analize.","hint":""},{"id":"376","q":"Kaip vadinama medžiaga, patenkanti į kraują staigaus išgąsčio metu, kuri padidina širdies plakimo ir kvėpavimo dažnį, taip paruošdama organizmą veiksmui?","a":["prostaglandinas E2","adrenalinas","skrandžio sultys"],"c":[1],"expl":"Adrenalinas yra hormonas, kuris staigaus išgąsčio ar streso metu išsiskiria į kraują. Jis padidina širdies plakimo ir kvėpavimo dažnį, kraujospūdį bei paruošia organizmą greitai reaguoti","hint":""},{"id":"377","q":"Kokį kontrolinį sąrašą kabinoje geriau naudoti?","a":["raštu išdėstytą","mintinai išmoktą","nesvarbu"],"c":[0],"expl":"Raštu išdėstytas kontrolinis sąrašas sumažina riziką ką nors praleisti, ypač stresinėse situacijose. Net jei kai kurios dalys yra žinomos mintinai, vizualinis sąrašas padeda patikrinti kiekvieną punktą nuosekliai ir patikimai.","hint":""},{"id":"378","q":"Kabinos prietaisai, kurie reguliuoja skirtingas sistemas, turi atrodyti:","a":["Skirtingai","panašiai","nesvarbu"],"c":[0],"expl":"","hint":""},{"id":"379","q":"Jūs nepritariate veiksmų sekai, kurią planuoja jūsų pilotas instruktorius. Ar jūs galite išreikšti savo abejones ?","a":["Turite","negalite","nesvarbu"],"c":[0],"expl":"Skrydžio sauga yra svarbiausia, todėl jei abejojate instruktoriaus planuojama veiksmų seka, turite išreikšti savo nuomonę. Net kaip mokinys ar antras pilotas, esate atsakingas už skrydžio saugą ir turite teisę (ir pareigą) kalbėti apie galimas klaidas ar rizikas. Tai svarbi dalis geros komandinės komunikacijos","hint":""},{"id":"380","q":"Ar galite skristi, kuomet vartojate vaistus, kurių poveikio tiksliai nežinote?","a":["negalite","galite"],"c":[0],"expl":"Skristi vartojant vaistus, kurių poveikio savo organizmui nežinote, negalima , nes jie gali sukelti mieguistumą, sulėtinti reakciją ar paveikti sprendimų priėmimą. Net nedidelis nepageidaujamas poveikis gali kelti pavojų skrydžio saugai","hint":""},{"id": /* ---------------- būsena ---------------- */
const SKEY = 'ulo-teorija-v1';
const DEF = {start:'2026-08-30', exam:'2026-09-13', q:{}, days:{}, theme:null};
let S = load();
function load(){
  try{ const r = JSON.parse(localStorage.getItem(SKEY)||'null'); return r ? Object.assign({}, DEF, r) : Object.assign({}, DEF); }
  catch(e){ return Object.assign({}, DEF); }
}
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} }
function rec(uid){ return S.q[uid] || (S.q[uid] = {n:0, ok:0, streak:0, last:0}); }
function mark(uid, right){
  const r = rec(uid); r.n++; r.last = Date.now();
  if (right){ r.ok++; r.streak = Math.min(4, r.streak + 1); } else { r.streak = 0; }
  save();
}

const LT_DAY = ['sekmadienis','pirmadienis','antradienis','trečiadienis','ketvirtadienis','penktadienis','šeštadienis'];
const LT_MON = ['sausio','vasario','kovo','balandžio','gegužės','birželio','liepos','rugpjūčio','rugsėjo','spalio','lapkričio','gruodžio'];
function d0(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(dt, n){ const x = new Date(dt); x.setDate(x.getDate()+n); return x; }
function today0(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function fmt(dt){ return dt.getDate()+' '+LT_MON[dt.getMonth()]; }
function dayIndex(){ return Math.round((today0() - d0(S.start)) / 86400000) + 1; }

/* ---------------- pasirengimas ---------------- */
function subjStats(k){
  const qs = BY_SUBJ[k]; let seen = 0, ok = 0;
  qs.forEach(q => { const r = S.q[q.uid]; if (r && r.n){ seen++; if (r.streak >= 1) ok++; } });
  return {total:qs.length, seen, ok, pct: qs.length ? Math.round(100*ok/qs.length) : 0};
}
function weakest(n){
  return KEYS.map(k => ({k, ...subjStats(k)}))
             .sort((a,b) => a.pct - b.pct || b.total - a.total)
             .slice(0, n).map(x => x.k);
}
function errorPool(subjs){
  const set = subjs ? new Set(Array.isArray(subjs) ? subjs : [subjs]) : null;
  return ALL.filter(q => (!set || set.has(q.subj)) && S.q[q.uid] && S.q[q.uid].n > 0 && S.q[q.uid].streak === 0);
}

/* ---------------- atranka ---------------- */
function shuffle(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function priority(q){                       // mažesnis skaičius = svarbiau parodyti
  const r = S.q[q.uid];
  if (!r || !r.n) return 0;                 // dar nematyti
  if (r.streak === 0) return 1;             // paskutinį kartą suklydo
  return 1 + r.streak;                      // kuo ilgesnė teisingų serija, tuo rečiau
}
function pick(pool, n){
  const b = shuffle(pool).sort((a,b) => priority(a) - priority(b));
  return shuffle(b.slice(0, n));
}
function mockSet(n){
  const per = Math.floor(n / KEYS.length), out = [];
  KEYS.forEach(k => out.push(...pick(BY_SUBJ[k], per)));
  const rest = n - out.length;
  if (rest > 0){ const used = new Set(out.map(q => q.uid)); out.push(...pick(ALL.filter(q => !used.has(q.uid)), rest)); }
  return shuffle(out);
}

/* ---------------- sesijos paleidimas ---------------- */
function buildSession(spec){
  const m = spec.m;
  if (m === 'study'){
    return {mode:'study', title:spec.s, sub:'Peržiūra, atsakymas rodomas iš karto', qs:pick(BY_SUBJ[spec.s], BY_SUBJ[spec.s].length)};
  }
  if (m === 'exam'){
    return {mode:'exam', title:spec.s, sub:'Egzamino režimas, riba 75 proc.', qs:pick(BY_SUBJ[spec.s], spec.n)};
  }
  if (m === 'mock'){
    return {mode:'exam', title:'Bandomasis egzaminas', sub:spec.n+' klausimai iš visų aštuonių dalykų', qs:mockSet(spec.n)};
  }
  if (m === 'weakexam'){
    const w = weakest(spec.n > 20 ? 2 : 1);
    const pool = [].concat(...w.map(k => BY_SUBJ[k]));
    return {mode:'exam', title:w.join(', '), sub:'Silpniausia vieta pagal tavo statistiką', qs:pick(pool, spec.n)};
  }
  if (m === 'errors'){
    const pool = errorPool(spec.s);
    return {mode:'study', title:'Klaidų treniruoklis', sub:pool.length+' klausimai, kuriuos paskutinį kartą atsakei neteisingai', qs:shuffle(pool)};
  }
  return null;
}

let SES = null;
function startSession(spec, backTo){
  const s = buildSession(spec);
  if (!s || !s.qs.length){ render('siandien'); alert('Šitam pratimui klausimų nėra. Klaidų treniruoklis pildosi tik po testų.'); return; }
  SES = {...s, i:0, answers:[], t0:Date.now(), spec, backTo: backTo || 'siandien'};
  renderQuiz();
}

       <div class="qmeta">${q.subj}</div>
       <p class="qtext">${esc(q.q)}</p>
       <div class="opts" id="opts">
         ${q.order.map((oi, n) => `<button class="opt" data-o="${oi}"><kbd>${letters[n]}</kbd><span>${esc(q.a[oi])}</span></button>`).join('')}
       </div>
       <div id="after"></div>
     </div>
   </div>`;
  document.getElementById('quitBtn').onclick = () => { if (s.answers.length) renderResult(); else { SES = null; render(s.backTo); } };
  [...document.querySelectorAll('.opt')].forEach(b => b.onclick = () => answer(+b.dataset.o));
  tick();
}

function answer(oi){
  const s = SES, q = s.qs[s.i];
  if (s.locked) return;
  s.locked = true;
  const right = q.c.includes(oi);
  mark(q.uid, right);
  s.answers.push({q, pick:oi, right});
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b => b.disabled = true);
  if (s.mode === 'study'){
    btns.forEach(b => {
      const o = +b.dataset.o;
      if (q.c.includes(o)) b.classList.add('right');
      else if (o === oi) b.classList.add('wrong');
    });
    document.getElementById('after').innerHTML = `
      ${q.expl ? `<div class="expl"><h5>Paaiškinimas</h5>${esc(q.expl)}</div>`
               : `<div class="expl none">Šitam klausimui paaiškinimo banke nėra. Jei atsakymas neaiškus, pasižiūrėk dalyko medžiagą.</div>`}
      <div class="qfoot">
        <button class="btn" id="nextBtn">${s.i+1 < s.qs.length ? 'Toliau' : 'Rezultatas'}</button>
        <span class="hintkeys">Enter arba tarpas: toliau &nbsp;·&nbsp; A B C D arba 1 2 3 4: atsakymas</span>
      </div>`;
    document.getElementById('nextBtn').onclick = next;
  } else {
    btns.forEach(b => { if (+b.dataset.o === oi) b.classList.add('picked'); });
    setTimeout(next, 130);
  }
}
function next(){ SES.locked = false; SES.i++; renderQuiz(); }

function tick(){
  const c = document.getElementById('clock');
  if (!c || !SES) return;
  const sec = Math.floor((Date.now() - SES.t0)/1000);
  c.textContent = Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  setTimeout(tick, 1000);
}

document.addEventListener('keydown', e => {
  if (!SES || !document.getElementById('opts')) return;
  const k = e.key.toLowerCase();
  const map = {a:0, b:1, c:2, d:3, e:4, f:5, '1':0, '2':1, '3':2, '4':3, '5':4, '6':5};
  if (k in map){
    const b = document.querySelectorAll('.opt')[map[k]];
    if (b && !b.disabled){ e.preventDefault(); b.click(); }
  } else if ((k === 'enter' || k === ' ')){
    const n = document.getElementById('nextBtn');
    if (n){ e.preventDefault(); n.click(); }
  }
});

/* ---------------- rezultatas ---------------- */
function renderResult(){
  const s = SES, a = s.answers, ok = a.filter(x => x.right).length;
  const pct = a.length ? Math.round(100*ok/a.length) : 0;
  const pass = pct >= 75;
  const mins = Math.round((Date.now() - s.t0)/60000);
  const bySubj = {};
  a.forEach(x => { const b = bySubj[x.q.subj] || (bySubj[x.q.subj] = {n:0, ok:0}); b.n++; if (x.right) b.ok++; });
  const wrongs = a.filter(x => !x.right);
  const el = document.getElementById('main');
  el.innerHTML = `
   <div class="card">
     <div class="score">
       <div><div class="big ${pass?'pass':'fail'}">${pct}<span style="font-size:26px">%</span></div></div>
       <div>
         <div class="verdict" style="color:var(--${pass?'green':'magenta'})">${pass ? 'Riba pasiekta' : 'Riba nepasiekta'}</div>
         <div class="sub">${ok} iš ${a.length} · ${mins} min · riba 75 proc.</div>
       </div>
       <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
         ${wrongs.length ? `<button class="btn" id="redoBtn">Kartoti ${wrongs.length} klaidas</button>` : ''}
         <button class="btn quiet" id="backBtn">Baigti</button>
       </div>
     </div>
     ${Object.keys(bySubj).length > 1 ? `<div class="breakdown">
       ${Object.entries(bySubj).sort((x,y) => x[1].ok/x[1].n - y[1].ok/y[1].n).map(([k,v]) => `
         <div>${k}</div><div class="n">${v.ok}/${v.n}</div>
         <div class="n" style="color:var(--${v.ok/v.n >= .75 ? 'green' : 'magenta'})">${Math.round(100*v.ok/v.n)}%</div>`).join('')}
     </div>` : ''}
     ${wrongs.length ? `<div class="wrongs"><h4>Ką suklydai</h4>
       ${wrongs.map(x => `<div class="wrongitem">
          <div class="q">${esc(x.q.q)}</div>
          <div class="a"><b>Teisingai: ${esc(x.q.a[x.q.c[0]])}</b><br><i>Tu pasirinkai: ${esc(x.q.a[x.pick])}</i></div>
          ${x.q.expl ? `<div class="expl" style="margin-top:8px">${esc(x.q.expl)}</div>` : ''}
       </div>`).join('')}</div>` : `<div class="empty">Nė vienos klaidos.</div>`}
   </div>`;
  const cur = dayIndex();
  if (s.spec && cur >= 1 && cur <= 14){
    const slot = PLAN[cur-1] && (PLAN[cur-1].am === s.spec ? 'am' : PLAN[cur-1].pm === s.spec ? 'pm' : null);
    if (slot){ S.days[cur] = S.days[cur] || {}; S.days[cur][slot] = true; save(); }
  }
  const back = document.getElementById('backBtn');
  back.onclick = () => { SES = null; render(s.backTo); };
  const redo = document.getElementById('redoBtn');
  if (redo) redo.onclick = () => { SES = {mode:'study', title:'Klaidos', sub:'', qs:wrongs.map(x => ({...x.q, order:null})), i:0, answers:[], t0:Date.now(), spec:null, backTo:s.backTo}; renderQuiz(); };
  drawGauges();
}
