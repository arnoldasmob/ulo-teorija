<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="description" content="Asmeninis pasiruošimo įrankis ULO piloto teorijos egzaminui.">
<meta name="theme-color" content="#EDEFE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171F24" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>ULO teorijos treniruoklis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --paper:#DFE2DC; --surface:#EDEFE9; --raised:#F7F8F3; --edge:#BEC4BB; --edge-soft:#D2D7CE;
  --ink:#1B2226; --ink-2:#4A5157; --ink-3:#7C7C6E;
  --blue:#2C5F87; --blue-soft:#DCE6EE; --magenta:#B33472; --magenta-soft:#F2DDE7;
  --green:#2F6B4F; --green-soft:#DCE8DF; --khaki:#8A7A4E; --amber:#B5811F;
  --shadow:0 1px 0 rgba(27,34,38,.05), 0 2px 10px -6px rgba(27,34,38,.28);
  --on-accent:#FFFFFF;
  --f-disp:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Source Sans 3", -apple-system, Segoe UI, Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10161A; --surface:#171F24; --raised:#1D262C; --edge:#2E3B43; --edge-soft:#253138;
    --ink:#DEE5E7; --ink-2:#A3AEB4; --ink-3:#76838A;
    --blue:#6FA9D6; --blue-soft:#1B2C3A; --magenta:#E272AB; --magenta-soft:#361F2C;
    --green:#63B486; --green-soft:#152B21; --khaki:#B6A473; --amber:#D9A445;
    --on-accent:#0C1216;
    --shadow:0 1px 0 rgba(0,0,0,.35), 0 6px 18px -10px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#10161A; --surface:#171F24; --raised:#1D262C; --edge:#2E3B43; --edge-soft:#253138;
  --ink:#DEE5E7; --ink-2:#A3AEB4; --ink-3:#76838A;
  --blue:#6FA9D6; --blue-soft:#1B2C3A; --magenta:#E272AB; --magenta-soft:#361F2C;
  --green:#63B486; --green-soft:#152B21; --khaki:#B6A473; --amber:#D9A445;
  --on-accent:#0C1216;
    --shadow:0 1px 0 rgba(0,0,0,.35), 0 6px 18px -10px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.12}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- instrument strip ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--edge)}
.topbar-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .call{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--magenta);text-transform:uppercase}
.brand h1{font-size:23px;letter-spacing:.06em;text-transform:uppercase}
.countdown{margin-left:auto;display:flex;align-items:center;gap:14px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--ink-2)}
.countdown b{font-size:22px;color:var(--magenta);font-weight:600}
.iconbtn{background:none;border:1px solid var(--edge);border-radius:4px;padding:5px 9px;color:var(--ink-2);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em}
.iconbtn:hover{border-color:var(--blue);color:var(--blue)}

.gauges{max-width:1240px;margin:0 auto;padding:0 20px 12px;display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.gauge{background:none;border:0;padding:6px 0 0;text-align:left;border-top:1px solid var(--edge-soft)}
.gauge:hover .g-name{color:var(--blue)}
.g-name{font-family:var(--f-disp);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-bar{height:5px;background:var(--edge-soft);margin-top:5px;position:relative;overflow:hidden}
.g-seen{position:absolute;inset:0 auto 0 0;background:var(--khaki);opacity:.45}
.g-ok{position:absolute;inset:0 auto 0 0;background:var(--green)}
.g-num{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
.gauge.weak .g-num{color:var(--magenta)}

/* ---------- shell ---------- */
.shell{max-width:1240px;margin:0 auto;padding:22px 20px 80px;display:grid;grid-template-columns:262px 1fr;gap:26px;align-items:start}
.rail{position:sticky;top:132px}
.nav{display:flex;flex-direction:column;gap:1px;margin-bottom:20px}
.nav button{background:none;border:0;border-left:2px solid transparent;padding:7px 12px;text-align:left;font-family:var(--f-disp);font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.nav button:hover{color:var(--ink);background:var(--surface)}
.nav button[aria-current="true"]{color:var(--blue);border-left-color:var(--blue);background:var(--surface)}
.railcard{background:var(--surface);border:1px solid var(--edge);padding:12px 13px}
.railcard h4{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--khaki);margin-bottom:8px}
.railcard p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5}

.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--khaki);margin-bottom:6px}
.view>h2{font-size:30px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.lede{color:var(--ink-2);max-width:64ch;margin:0 0 22px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--shadow)}
.session{display:grid;grid-template-columns:96px 1fr auto;gap:18px;align-items:center;padding:18px 20px;margin-bottom:12px}
.session .when{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.1em;font-size:15px;color:var(--khaki);border-right:1px solid var(--edge-soft);padding-right:14px}
.session .when small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;color:var(--ink-3);text-transform:none}
.session h3{font-size:21px;letter-spacing:.02em}
.session p{margin:3px 0 0;font-size:14.5px;color:var(--ink-2)}
.btn{background:var(--blue);color:var(--on-accent);border:1px solid var(--blue);padding:9px 18px;font-family:var(--f-disp);font-size:16px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:none;color:var(--blue)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.quiet{background:none;color:var(--ink-2);border-color:var(--edge)}
.btn.quiet:hover{color:var(--ink);border-color:var(--ink-3)}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.done{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--green);text-transform:uppercase}

/* ---------- plan table ---------- */
.plan{width:100%;border-collapse:collapse;font-size:14.5px}
.plan th{font-family:var(--f-disp);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--khaki);text-align:left;padding:0 12px 7px;border-bottom:1px solid var(--edge)}
.plan td{padding:11px 12px;border-bottom:1px solid var(--edge-soft);vertical-align:top}
.plan tr.today td{background:var(--blue-soft)}
.plan tr.past td{color:var(--ink-3)}
.plan .dcell{font-family:var(--f-mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.plan .dcell b{display:block;font-size:17px;font-family:var(--f-disp);letter-spacing:.06em;color:var(--ink)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--edge);color:var(--ink-3);margin-right:6px}
.tag.am{border-color:var(--blue);color:var(--blue)}
.tag.pm{border-color:var(--magenta);color:var(--magenta)}

/* ---------- quiz ---------- */
.quizbar{display:flex;align-items:center;gap:16px;padding:11px 18px;border-bottom:1px solid var(--edge);font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;color:var(--ink-2);flex-wrap:wrap}
.quizbar .prog{flex:1;min-width:120px;height:4px;background:var(--edge-soft);position:relative}
.quizbar .prog i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.quizbar b{color:var(--ink);font-variant-numeric:tabular-nums}
.qbody{padding:26px 28px 28px}
.qmeta{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--khaki);margin-bottom:10px}
.qtext{font-size:21px;line-height:1.4;font-weight:600;margin:0 0 20px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;text-align:left;background:var(--raised);border:1px solid var(--edge);padding:12px 14px;width:100%;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--blue);background:var(--blue-soft)}
.opt kbd{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);border:1px solid var(--edge);border-radius:3px;padding:1px 0;text-align:center;background:var(--surface)}
.opt.picked{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right kbd{border-color:var(--green);color:var(--green)}
.opt.wrong{border-color:var(--magenta);background:var(--magenta-soft)}
.opt.wrong kbd{border-color:var(--magenta);color:var(--magenta)}
.expl{margin-top:18px;border-left:3px solid var(--khaki);padding:2px 0 2px 15px;color:var(--ink-2);font-size:15px}
.expl h5{font-family:var(--f-disp);font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--khaki);margin:0 0 3px}
.expl.none{border-color:var(--edge);color:var(--ink-3);font-style:italic}
.qfoot{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.hintkeys{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}

/* ---------- result ---------- */
.score{display:flex;gap:30px;align-items:flex-end;padding:26px 28px 22px;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.score .big{font-family:var(--f-mono);font-size:62px;font-weight:600;line-height:.9;font-variant-numeric:tabular-nums}
.score .big.pass{color:var(--green)} .score .big.fail{color:var(--magenta)}
.score .verdict{font-family:var(--f-disp);font-size:20px;letter-spacing:.09em;text-transform:uppercase}
.score .sub{font-size:14px;color:var(--ink-2);font-family:var(--f-mono)}
.breakdown{display:grid;grid-template-columns:1fr auto auto;gap:0 16px;padding:18px 28px;font-size:14.5px}
.breakdown div{padding:6px 0;border-bottom:1px solid var(--edge-soft);font-variant-numeric:tabular-nums}
.breakdown .n{font-family:var(--f-mono);text-align:right}
.wrongs{padding:6px 28px 28px}
.wrongs h4{font-family:var(--f-disp);font-size:15px;letter-spacing:.11em;text-transform:uppercase;color:var(--magenta);margin:18px 0 10px}
.wrongitem{border-top:1px solid var(--edge-soft);padding:12px 0}
.wrongitem .q{font-weight:600;margin-bottom:5px}
.wrongitem .a{font-size:14.5px;color:var(--ink-2)}
.wrongitem .a b{color:var(--green)}
.wrongitem .a i{color:var(--magenta);font-style:normal}

/* ---------- facts ---------- */
.pickrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.pick{background:var(--surface);border:1px solid var(--edge);padding:5px 12px;font-family:var(--f-disp);font-size:15px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.pick:hover{border-color:var(--blue);color:var(--blue)}
.pick[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.fact{border-bottom:1px solid var(--edge-soft);padding:10px 0;display:grid;grid-template-columns:34px 1fr;gap:12px}
.fact .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:3px;font-variant-numeric:tabular-nums}
.fact .q{font-weight:600}
.fact .a{color:var(--green);font-size:15px}
.fact .a::before{content:"▸ ";color:var(--khaki)}
.fact .x{font-size:14px;color:var(--ink-3);margin-top:3px}

/* ---------- generic ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:var(--surface);border:1px solid var(--edge);padding:18px 20px}
.box h3{font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.box h3 .fq{font-family:var(--f-mono);font-size:14px;color:var(--magenta);letter-spacing:0;text-transform:none;margin-left:8px}
.box ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:15px}
.box li{margin-bottom:5px}
.box li b{color:var(--ink)}
.deflist{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px;align-items:baseline}
.deflist dt{font-family:var(--f-mono);font-size:13px;color:var(--magenta);white-space:nowrap}
.deflist dd{margin:0;color:var(--ink-2)}
.linklist{list-style:none;padding:0;margin:0;font-size:14.5px}
.linklist li{padding:5px 0;border-bottom:1px solid var(--edge-soft)}
.linklist a{text-decoration:none;border-bottom:1px solid transparent}
.linklist a:hover{border-bottom-color:var(--blue)}
.linklist .ext{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;margin-left:6px}
.method{counter-reset:m}
.method li{margin-bottom:13px;color:var(--ink-2)}
.method li b{color:var(--ink);display:block;font-family:var(--f-disp);font-size:17px;letter-spacing:.04em}
.settings{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--f-disp);font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:var(--khaki)}
.field select,.field input{font:inherit;font-size:15px;background:var(--raised);color:var(--ink);border:1px solid var(--edge);padding:7px 9px}
.note{font-size:13.5px;color:var(--ink-3);margin-top:14px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}

@media (max-width:980px){
  .shell{grid-template-columns:1fr;gap:18px}
  .rail{position:static}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav button{border-left:0;border-bottom:2px solid transparent;padding:6px 10px}
  .nav button[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--blue)}
  .gauges{grid-template-columns:repeat(4,1fr)}
  .grid2{grid-template-columns:1fr}
  .session{grid-template-columns:1fr;gap:10px}
  .session .when{border-right:0;border-bottom:1px solid var(--edge-soft);padding:0 0 8px}
}
@media print{
  .topbar,.rail,.nav,.pickrow,.btn{display:none!important}
  .shell{display:block;padding:0}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>


<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="call">EYKS 135.500</span>
      <h1>ULO teorija</h1>
    </div>
    <div class="countdown">
      <span>iki egzamino</span><b id="cdDays">–</b><span id="cdDate"></span>
      <button class="iconbtn" id="themeBtn" title="Šviesi arba tamsi tema">TEMA</button>
    </div>
  </div>
  <div class="gauges" id="gauges"></div>
</header>

<main class="shell">
  <aside class="rail">
    <nav class="nav" id="nav">
      <button data-v="siandien" aria-current="true">Šiandien</button>
      <button data-v="planas">14 dienų planas</button>
      <button data-v="testas">Testas</button>
      <button data-v="faktai">Faktų lapas</button>
      <button data-v="aleksotas">Aleksotas</button>
      <button data-v="medziaga">Medžiaga</button>
      <button data-v="metodas">Metodas</button>
    </nav>
    <div class="railcard">
      <h4>Bankas</h4>
      <p id="railStats">–</p>
    </div>
  </aside>

  <section id="main"></section>
</main>

<script>
const BANK = {"Aerodinamika":{"slug":"aerodinamika-skrydzio-teorija","questions":[{"id":"1","q":"Kas tai yra aerodinamika?","a":["Mokslas apie atmosferos sandarą","Mokslas oro sandarą ir jo įtaką aptekant kūnus","Mokslas apie oro savybes ir jo įtaką skridimui","Mokslas, tiriantis oro (dujų) judėjimą ir jėgas, veikiančias dujose judančius kietus kūnus."],"c":[3],"expl":"Aerodinamika yra fizikos šaka, tirianti oro (ar kitos dujų terpės) judėjimą bei jėgas, kurios veikia kietus kūnus, kai jie juda per orą. Ši sąvoka tiesiogiai susijusi su orlaivių skridimu, sparnų pakėlimo jėga, pasipriešinimu ir pan.","hint":""},{"id":"2","q":"Kai oro temperatūra aukštesnė už standartinę, OL tikrasis aukštis bus:","a":["didesnis kaip barometrinis","lygus QNH lygiui","mažesnis kaip barometrinis","lygus QFE lygiui"],"c":[0],"expl":"Kai oro temperatūra aukštesnė už standartinę, tikrasis aukštis (reali padėtis virš jūros lygio) bus didesnis nei barometrinis aukštis, rodomas aukštimačiu nustatytu pagal standartinį slėgį (pvz., QNH). Taip yra todėl, kad šiltesnis oras plečiasi, o slėgio lygiai pakyla į aukštesnį aukštį nei esant standartinei temperatūrai. Tad orlaivis skris aukščiau nei rodo jo aukštimatis. Skrydžių saugumo požiūriu tai svarbu, nes gali klaidinti, ypač kalnuotose vietovėse ar artėjant tūpti.","hint":""},{"id":"10","q":"Nustatant aukštį pagal OL aukštimačio parodymus būtina atsižvelgti į:","a":["barometrinį aukštį ir QNH","barometrinį aukštį ir oro temperatūrą","tik QNH","QFE ir oro temperatūrą","Instrumentinė aukštimačio paklaida, QNH, Oro temperatūra t°"],"c":[4],"expl":"Nustatant aukštį pagal orlaivio aukštimačio parodymus būtina atsižvelgti į aukštimačio galimas paklaidas, taip pat į barometrinį slėgį, nustatomą pagal QNH, ir oro temperatūrą, nes temperatūros nukrypimai nuo standartinės įtakoja tikrąjį aukštį. Tai leidžia tiksliau nustatyti realų orlaivio aukštį virš jūros lygio.","hint":""},{"id":"54","q":"Kokie iš šių duomenų būtini nustatant oro tankį:","a":["Tik oro slėgis P","Tik t nulinė ir oro drėgnumas","Skrydžio aukštis H ir spaudimas kritiniame taške","Oro slėgis P, oro temperatūra t° ir oro drėgnumas"],"c":[3],"expl":"Norint tiksliai nustatyti oro tankį, reikia žinoti oro slėgį, nes jis tiesiogiai veikia tankį, temperatūrą, nes šiltesnis oras yra mažiau tankus, ir drėgnumą, nes drėgnas oras yra mažiau tankus nei sausas. Todėl visi šie trys parametrai kartu lemia tikslų oro tankio nustatymą.","hint":""},{"id":"57","q":"Oro tankis p keičiasi:","a":["Tik kintant P","Tik kintant t nulinei ir drėgnumui","Tik kintant skrydžio aukščiui H","Kintant oro slėgiui P, temperatūrai t° ir oro drėgnumui"],"c":[3],"expl":"Oro tankis priklauso nuo šių trijų pagrindinių faktorių — slėgio, kuris mažėja kylant aukštyn, temperatūros, nes šiltas oras yra mažiau tankus, ir drėgnumo, nes drėgnas oras yra mažiau tankus nei sausas. Todėl oro tankis keičiasi, kai kinta bet kuris iš šių parametrų.","hint":""},{"id":"59","q":"Koks oras tankesnis?","a":["Šaltas","Karštas","Šiltas"],"c":[0],"expl":"Šaltas oras yra tankesnis, nes mažesnėje temperatūroje oro molekulės juda lėčiau ir yra arčiau viena kitos, todėl oras užima mažiau vietos ir yra tankesnis nei šiltas ar karštas oras.","hint":""},{"id":"60","q":"Koks oras lengvesnis?","a":["Šiltesnis","Karštas","Šaltas"],"c":[1],"expl":"Karštas oras yra lengvesnis (mažiau tankus), nes aukštesnėje temperatūroje oro molekulės juda greičiau ir yra išsisklaidžiusios, todėl oro tankis mažėja, o oras tampa lengvesnis nei šaltas ar šiltesnis oras.","hint":""},{"id":"61","q":"Didėjant aukščiui temperatūra laipsniškai mažėja:","a":["0,65 laipsnio kas 100 m.","0,5 laipsnio kas 100m.","1 laipsniu kas 1km."],"c":[0],"expl":"","hint":""},{"id":"64","q":"Oro tankis p įtakoja:","a":["Tik OL pasipriešinimą (varža) X","OL X ir keliamąja jėgą Y, bet neturi įtakos variklio galiai N","Tik variklio galią N","Variklio galią N, Y ir X"],"c":[3],"expl":"Oro tankis tiesiogiai veikia variklio efektyvumą (dėl oro mišinio sudėties), keliamąją jėgą (nes keliamoji priklauso nuo oro tankio), taip pat ir oro pasipriešinimą, kuris priklauso nuo oro savybių. Todėl oro tankis turi įtakos visiems trims — variklio galią, keliamajai jėgai ir oro pasipriešinimui.","hint":""},{"id":"66","q":"Oro savybės įtakojančios lėktuvo skrydį:","a":["Oro temperatūra t°, oro tankis p, oro slėgis P","Oro temperatūra t° ir drėgnumas","Oro skaidrumas","Oro tamprumas ir oro slėgis P"],"c":[0],"expl":"Šios oro savybės tiesiogiai veikia lėktuvo skrydį: temperatūra ir slėgis lemia oro tankį, kuris savo ruožtu daro įtaką keliamajai jėgai, variklio galiai ir oro pasipriešinimui. Kitos savybės, kaip drėgnumas ar oro skaidrumas, yra svarbios, bet ne pagrindinės skrydžio fiziniam aspektui.","hint":""},{"id":"68","q":"Padidėjusi aplinkos temperatūra:","a":["padidina variklio N ir sumažina atsiplėšimo greiti V","sumažina variklio N ir padidina atsiplėšimo greitį V","sumažina variklio N ir pasipriešinimo greitį V","neturi įtakos"],"c":[1],"expl":"Padidėjusi oro temperatūra sumažina oro tankį, todėl variklio galia (N) sumažėja, nes variklis gauna mažiau deguonies. Dėl to lėktuvas turi didesnį atsiplėšimo greitį (V), nes dėl mažesnio oro tankio keliamoji jėga sumažėja, ir reikia didesnio greičio, kad lėktuvas pakiltų.","hint":""},{"id":"69","q":"Nustatant OL skrydžio charakteristikas būtina žinoti:","a":["absoliutų skrydžio aukštį H","oro tankį p skrydžio lygyje","planuojamą skrydžio lygį","P skrydžio lygyje"],"c":[1],"expl":"Oro tankis skrydžio lygyje tiesiogiai veikia orlaivio elgseną – jis lemia variklio efektyvumą, keliamąją jėgą ir aerodinaminį pasipriešinimą. Todėl norint tiksliai nustatyti skrydžio charakteristikas, būtina žinoti oro tankį tokiam aukštyje.","hint":""},{"id":"72","q":"Žemesnė negu standartinėmis sąlygomis temperatūra t*:","a":["didina variklio galingumą N, mažina atplyšimo greitį V","mažina variklio galingumą N, didina atplyšimo greitį V","įtakos neturi"],"c":[0],"expl":"Žemesnė nei standartinė temperatūra reiškia, kad oras yra tankesnis, todėl variklis veikia efektyviau (didesnė galia), o orlaivio sparnai sukuria didesnę keliamąją jėgą esant mažesniam greičiui – todėl atsiplėšimo greitis sumažėja. Tankesnis oras geriau palaiko variklio darbą ir skridimą.","hint":""},{"id":"74","q":"Aerodinamikoje statiniu slėgiu vadinamas:","a":["atmosferinis slėgis","slėgis, veikiantis kūną ,kurį apteka nenutrūkstantis oro srautas","slėgis į bet kurią srovės apipučiamo kūno vietą, išskyrus kritinį tašką","teisingi teiginiai tik a ir b"],"c":[0],"expl":"","hint":""},{"id":"76","q":"Kiek pasikeičia P kritiniame taške sumažinus apipūtimo greitį dvigubai?","a":["sumažėja dvigubai","sumažėja trigubai","sumažėja keturgubai","priklauso nuo oro tankio p ir nesikeičia jam nepakitus"],"c":[2],"expl":"","hint":""},{"id":"79","q":"Kas atsitinka susiaurėjus oro srovės pjūvio plotui?","a":["P dinaminis sumažėja, P kritiniame taške padidėja","P statinis padidėja, o P kritini9ame taške sumažėja","P statinis ir P kritiniame taške nesikeičia, nes aptaka nesikeičia","P statinis sumažėja, o P kritiniame taške išauga"],"c":[3],"expl":"Susiaurėjus oro srovės pjūvio plotui, oro greitis didėja (tęstinumo dėsnis). Pagal Bernulio lygtį, didėjant greičiui, statinis slėgis mažėja, o bendras (kritinis) slėgis didėja dinaminio slėgio dėka.","hint":""},{"id":"81","q":"Kiek pasikeičia P kritiniame taške padidinus apipūtimo greitį dvigubai?","a":["Išauga dvigubai","Išauga trigubai","Išauga keturgubai","Priklausomai nuo oro tankio p ir nesikeičia jam nepakitus"],"c":[2],"expl":"Dinaminis slėgis yra slėgis, kurį sukelia oro judėjimas, ir jis tiesiogiai priklauso nuo oro greičio kvadrato. Tai reiškia, kad jei oro greitis padidėja dvigubai, dinaminis slėgis padidės keturgubai (nes 2 2 =4).","hint":""},{"id":"85","q":"Aptekančios sparno profilį srovės greitis yra didžiausias ten, kur:","a":["sparno profilis storiausias","sparno profilis ploniausias","yra kritinis taškas","yra didžiausia statinio slėgio zona"],"c":[0],"expl":"Oro srovės greitis sparno profilyje yra didžiausias ten, kur sparnas yra storiausias, nes oro srautas virš sparno turi nueiti ilgesnį kelią. Dėl sparno išlinkimo ir profilio formos oras viršuje teka greičiau, kad pasiektų sparno galą kartu su srove, tekančia per trumpesnį kelią sparno apačioje. Šis greičio padidėjimas sparno viršuje sukelia statinio slėgio sumažėjimą, todėl susidaro keliamoji jėga. Taigi, sparno storiausioje vietoje oro srovės greitis yra didžiausias, nes čia oras priverstas judėti greičiau per ilgesnį kelią.","hint":""},{"id":"86","q":"Kaip kinta sparno profilį aptekančios srovės greitis priklausomai profilio storio:","a":["kuo profilis storesnis, tuo srovės greitis didesnis","kuo profilis plonesnis, tuo srovės greitis didesnis"],"c":[0],"expl":"Didesnis profilio storis reiškia didesnį sparno išlinkimą ir ilgesnį kelią oro srovei aptekant sparną, todėl oro greitis sparno viršuje padidėja, kad srovė spėtų nueiti ilgesnį kelią per tą pačią laiką. Taigi, storesnis sparno profilis sukelia didesnį srovės greitį virš sparno.","hint":""},{"id":"87","q":"Ką sukelia oro srovė, veikdama viršutinę sparno pusę, esant teigiamam atakos kampui a?","a":["žymius sūkurių darinius","padidėjusio slėgio zoną","sumažėjusio slėgio zoną","žymius slėgio pakitimus"],"c":[2],"expl":"Esant teigiamam atakos kampui, oro srovė, tekanti virš sparno viršutinės pusės, pagreitėja, dėl to slėgis virš sparno sumažėja. Šis slėgio skirtumas tarp viršutinės ir apatinės sparno pusės sukuria keliamąją jėgą.","hint":""},{"id":"88","q":"Kaip pakinta pasipriešinimas X, kai viršutinėje sparno dalyje atsiranda oro sukūriai?","a":["Nepakinta","Padidėja","Sumažėja","Trumpam padidėja, po to staigiai sumažėja"],"c":[1],"expl":"Kai viršutinėje sparno dalyje atsiranda oro sūkurių, tai reiškia, kad oro srautas nebegali sklandžiai tekėti paviršiumi – jis „atsitrūksta“. Dėl to padidėja srauto netolygumas ir turbulencija, o tai stipriai padidina aerodinaminį pasipriešinimą, vadinamą pasipriešinimu X. Šis reiškinys dažniausiai atsiranda padidinus atakos kampą per didelėmis ribomis, kai sparnas nebesugeba generuoti stabilios keliančiosios jėgos.","hint":""},{"id":"89","q":"Kodėl atsiranda sukūriai sparnų galuose?","a":["Dėl blogos OL liemens formos","Dėl slėgių viršutinėje ir apatinėje sparno pusėse skirtumo","Dėl neįtraukiamos važiuoklės","Dėl netinkamų jėgainės gaubtų ir cilindrų defliatorių konstrukcijos"],"c":[1],"expl":"","hint":""},{"id":"90","q":"Kaip vadinasi oro sluoksnis, kuriame oro greitis, dėl sąveikos su sparno profilio paviršiumi, yra kitoks (kai kuriais atvejais gali būti netgi priešingos krypties)?","a":["Paribio sluoksnis","Turbulentinis sluoksnis","Laminarinis sluoksnis","Cirkuliacija"],"c":[0],"expl":"","hint":""},{"id":"91","q":"Kokią įtaką pasipriešinimui (varžai) X turi sukūriai, atsirandantys oro srovei aptekant kūną?","a":["Didėjant sūkuriams X didėja","Didėjant sūkuriams-X mažėja","Neturi įtakos","Esant mažiems sūkuriams X didėja, o stipriems-mažėja"],"c":[0],"expl":"Sukūriai, atsirandantys oro srovei aptekant kūną, rodo, kad srautas tampa netolygus ir pereina į turbulentinę būseną. Tokie sutrikimai sukelia papildomą energijos praradimą, o tai padidina aerodinaminį pasipriešinimą, dar vadinamą varža (X). Kuo daugiau ir stipresni sūkurių dariniai aplink kūną – tuo daugiau turbulencijos ir tuo didesnė energijos sąnauda norint išlaikyti judėjimą ore.","hint":""},{"id":"92","q":"Kaip keičiasi pasipriešinimas X, keičiant greitį V:","a":["keičiant greitį V, pasipriešinimas X keisis kvadratu","mažinant V, X mažėja"],"c":[0],"expl":"","hint":""},{"id":"93","q":"Sumažinus greitį V, pasipriešinimas X:","a":["padidėja","sumažėja","nesikeičia"],"c":[1],"expl":"","hint":""},{"id":"94","q":"Padidinus greitį V, pasipriešinimas X:","a":["padidėja","sumažėja","nesikeičia"],"c":[0],"expl":"","hint":""},{"id":"95","q":"Kokia kryptimi veikia pasipriešinimas (varža) X?","a":["Žemyn, svorio jėgos kryptimi","Srauto kryptimi","Visose skrydžio padėtyse atgal, lygiagrečiai lėktuvo išilginiai ašiai","Priešinga kilimui"],"c":[1],"expl":"","hint":""},{"id":"96","q":"Kokia kryptimi veikia sparno keliamoji jėga Y?","a":["Statmena aptekančiam oro srautui","Žemyn, svorio jėgos kryptimi"],"c":[0],"expl":"","hint":""},{"id":"97","q":"Kaip keičiasi pasipriešinimas X mažėjant oro tankiui p:","a":["didėja","mažėja","nekinta"],"c":[1],"expl":"","hint":""},{"id":"98","q":"Oro tankiui p sumažėjus 2 kartus (50%), X pasikeis:","a":["4 kartus","dvigubai ( 50 %) sumažės","nepakis","dvigubai padidės"],"c":[1],"expl":"","hint":""},{"id":"99","q":"Kodėl kūnų, turinčių vienodus skersinius pjūvius, bet skirtingas formas, X yra skirtingi ?","a":["Kūnai sukelia skirtingo dydžio sūkurius","Skirtinga svorio centro padėtis","Skirtingi svoriai","Kūnų tankis skirtingas"],"c":[0],"expl":"","hint":""},{"id":"100","q":"Sparno keliamoji jėga Y atsiranda dėl:","a":["slėgio apatinėje ir viršutinėje dalyje skirtumo","oro suspaudžiamumo apatinėje sparno dalyje","oro nulenktojo srauto greitėjimo užpakalinėje (galinėje) sparno dalyje"],"c":[0],"expl":"","hint":""},{"id":"101","q":"Kokių jėgų atstojamoji sudaro pilnąją aerodinaminę jėgą R?","a":["Keliamoji jėga L (Y) ir pasipriešinimo jėga D (X)","L (Y) ir srovės greičio","D (X) ir W (G)","Traukos T (P) ir D (X)"],"c":[0],"expl":"","hint":""},{"id":"102","q":"Sparno keliamąją jėgą Y apibūdina:","a":["variklio galia N, oro tankis , atakos kampas ά , greitis V","oro tankis , atakos kampas ά , greitis V","variklio galia N, oro tankis, atakos kampas ά","svorio jėga G, Greitis V, oro tankis"],"c":[1],"expl":"","hint":""},{"id":"103","q":"Kaip yra vadinamas pilnos aerodinaminės jėgos R pridėjimo taškas?","a":["Pasipriešinimo centras","Sunkio (svorio) centras","Slėgio centras","Simetrinis vidurio centras"],"c":[2],"expl":"Pilnos aerodinaminės jėgos R (kuri susideda iš keliančiosios jėgos ir pasipriešinimo) pridėjimo taškas ant profilio paviršiaus yra vadinamas slėgio centru . Tai taškas, per kurį galima laikyti, kad visa aerodinaminė jėga veikia.","hint":""},{"id":"104","q":"Didesnę Y sąlygoja:","a":["sparnų paviršius, sparnų forma ir mažas OL svoris","didelis V, storas sparnų profilis, didelis skrydžio aukštis","ne per didelis atakos kampas a, didelis V, mažas p","nedidelis a didelis V, aukštas p"],"c":[3],"expl":"Keliamoji jėga Y priklauso nuo kelių pagrindinių veiksnių: skrydžio greičio V , oro tankio p , sparno ploto S , keliamojo koeficiento Cᵧ , kuris savo ruožtu priklauso nuo atakos kampo α ir sparno formos. Kuo greitesnė oro srovė , tuo didesnė keliamoji jėga , nes ji yra tiesiogiai proporcinga greičio kvadratui. Taip pat, kuo tankesnis oras (pvz., žemame aukštyje ar esant žemai temperatūrai), tuo didesnė keliamoji jėga. Nors atakos kampo padidinimas tam tikrose ribose taip pat padidina keliamąją jėgą, per didelis kampas gali sukelti sūkurių susidarymą ir aerodinaminį atsiskyrimą, dėl kurio keliamoji jėga smarkiai sumažėja. Todėl optimalus – nedidelis α , aukštas greitis , didžiausias galimas oro tankis yra sąlygos, kuriomis pasiekiama maksimali ar efektyvi keliamoji jėga.","hint":""},{"id":"105","q":"Kaip yra vadinamas viso OL svorio jėgos pridėjimo taškas?","a":["Slėgio centru","Pasipriešinimo centru","Svorio centru","Simetrinio vidurio centru"],"c":[2],"expl":"Viso orlaivio svorio jėgos pridėjimo taškas vadinamas svorio centru. Tai taškas, kuriame galima laikyti, kad veikia visa orlaivio gravitacinė jėga – kitaip tariant, visa jo masė yra sutelkta viename taške. Nuo svorio centro vietos priklauso orlaivio pusiausvyra ir stabilumas skrydžio metu.","hint":""},{"id":"107","q":"Atakos kampas a tai:","a":["kampas, tarp profilio stygos ir vidurio (aerodinaminės) linijos","kampas ,tarp profilio stygos ir OL išilginės ašies","kampas, tarp sparno profilio stygos ir profilį aptekančios srovės krypties","kampa tarp OL išilginės ašies ir profilį aptekančios oro srauto krypties"],"c":[2],"expl":"","hint":""},{"id":"109","q":"Kokia jėga OL sklendžiant yra lygi OL svorio jėgai?","a":["X","Y","Pilna aerodinaminė jėga R","Y ir traukos sudedamoji"],"c":[2],"expl":"","hint":""},{"id":"111","q":"Kaip vadinamas a, kuriam esant viršutinėje sparno dalyje atsiranda sukūriai (srovė atplyšta)?","a":["Srovės atplyšimo kampas","Kabravimo kampas","Kritinis a","Sūkurio pradžios kampas"],"c":[2],"expl":"Kritinis atakos kampas yra toks sparno atakos kampas, kuriam esant viršutinėje sparno dalyje oro srovė pradeda atplyšti, tai yra, nebeseka sparno paviršiumi ir ima formuoti sūkurius. Dėl šio reiškinio smarkiai sumažėja keliamoji jėga ir gali prasidėti orlaivio smuka (stall).","hint":""},{"id":"113","q":"Padidinus a , slėgio centras:","a":["pasislenka į priekį, o pilnoji aerodinaminė jėga R pasvyra srauto kryptimi","pasislenka atgal, o R pasvyra į priekį","išlaiko pirmykštę padėtį","nusileidžia į apačią"],"c":[0],"expl":"Padidinus atakos kampą, pasikeičia slėgio pasiskirstymas aplink sparną. Viršutinėje sparno dalyje slėgis dar labiau sumažėja, todėl slėgio centras pasislenka į priekį. Tuo pačiu pilnoji aerodinaminė jėga, kuri yra keliančiosios jėgos ir pasipriešinimo vektorinė suma, pasisuka srauto kryptimi, nes pasipriešinimo jėgos komponentė didėja. Tai būdinga normaliam skrydžiui iki kritinio atakos kampo.","hint":""},{"id":"116","q":"Tam kad išlaikytume tą patį skrydžio aukštį sumažėjus greičiui, reikia:","a":["sumažėjusio X kompensavimui sumažinti a","padidinti a ,kad Y būtų didesnė už G","išlaikyti a iki sumažės V po to a padidinti","Y sumažėjimą kompensuoti padidinant a"],"c":[3],"expl":"Sumažėjus greičiui, mažėja keliamoji jėga Y, nes ji priklauso nuo greičio kvadrato. Kad orlaivis nenukristų, reikia kompensuoti šį sumažėjimą. Vienas iš būdų – padidinti atakos kampą (a), nes taip galima išlaikyti arba atkurti reikiamą keliamąją jėgą esant mažesniam greičiui","hint":""},{"id":"118","q":"Ką vadiname pilna aerodinaminė jėga R?","a":["Tai atsiradęs spaudimas į kritinį tašką","Tai atskirų veikiančių jėgų suma","Tai apibendrinanti Y sąvoka","Tai visų, atsiradusių apipučiant sparno profilį aerodinaminių jėgų suma"],"c":[3],"expl":"Pilna aerodinaminė jėga R – tai bendroji jėga, susidariusi dėl oro srauto apipučiamo kūno (dažniausiai sparno) veikimo. Ji yra dviejų komponentų – keliančiosios jėgos Y (statmenos oro srautui) ir pasipriešinimo jėgos X (lygiagrečios srautui) – vektorinė suma. Ši jėga parodo bendrą oro poveikį orlaivio paviršiui.","hint":""},{"id":"120","q":"Kaip kinta Y ir X padidėjus oro tankiui p?","a":["Abi jėgos padidėja","X nepakinta, Y padidėja","Y nepakinta, X padidėja","Abi jėgos sumažėja"],"c":[0],"expl":"","hint":""},{"id":"122","q":"Slėgio centras, tai:","a":["centras tarp pagrindinių važiuoklės ratų","OL svorio jėgos veikimo taškas","Pilnos aerodinaminės jėgos R pridėjimo taškas","Pasipriešinimo jėgų sudedamosios taškas"],"c":[2],"expl":"Slėgio centras – tai taškas ant orlaivio profilio (dažniausiai sparno), kuriame veikia visa pilna aerodinaminė jėga R. Kitaip tariant, tai taškas, per kurį galima įsivaizduoti, kad veikia visa dėl oro aptekėjimo susidariusi aerodinaminė jėga. Keičiantis atakos kampui ar srovės charakteristikoms, slėgio centro vieta gali keistis.","hint":""},{"id":"125","q":"Svorio centras, tai:","a":["geometrinis taškas, per kurį eina visų lėktuvo dalių svorių atstojamosios veikimo linija","centras tarp pagrindinių važiuoklės ratų","pasipriešinimo jėgų sudedamosios taškas"],"c":[0],"expl":"Svorio centras – tai vienas taškas, kuriame tarsi sutelktas visas orlaivio svoris. Per šį tašką eina sunkio jėgos (G) veikimo linija. Svorio centro padėtis labai svarbi skrydžio stabilumui, valdymui ir saugumui – jei jis per daug pasislenka į priekį ar atgal (pvz., netolygiai paskirstant krovinį), lėktuvas gali tapti sunkiai valdomas arba net nevaldomas.","hint":""},{"id":"127","q":"OL masės svorio centras pasislenka dėl:","a":["sparno tvirtinimo kampo pakeitimo","OL įkrovos vietos pakeitimo","pakeitus a","išleidus užsparnius"],"c":[1],"expl":"","hint":""},{"id":"129","q":"Kaip pasikeičia OL svorio centro padėtis keičiantis a?","a":["Nesikeičia","Pasikeičia nežymiai","Smarkiai pasikeičia"],"c":[0],"expl":"Keičiantis alfa, keičiasi aerodinaminės jėgos, bet masės svorio centro padėtis nesikeičia, nes tai yra fizinė masės paskirstymo savybė, nepriklausanti nuo sparno kampo prie atakos.","hint":""},{"id":"132","q":"Kampas, tarp profilio stygos ir profilį aptekančios srovės krypties tai:","a":["sklendimo kampu","sparno tvirtinimo kampu","atakos kampu alfa","leidimosi kampu"],"c":[2],"expl":"","hint":""},{"id":"154","q":"Kaip yra vadinamas OL (profilio, sparno) Y ir X priklausomybės nuo grafiškas vaizdavimas?","a":["Emagrama","Greičių poliarė","OL (Profilio, sparno) poliarė","Kokybės diagrama"],"c":[2],"expl":"","hint":""},{"id":"155","q":"OL (sparno) aerodinaminė kokybė K, tai:","a":["sparno apdirbimo kokybės rodiklis","Y ir G santykis","Keliamosios jėgos Y ir pasipriešinimo jėgos X santykis","P ir X santykis"],"c":[2],"expl":"Aerodinaminė kokybė K apibūdina sparno efektyvumą ir yra keliamosios jėgos (Y) ir pasipriešinimo jėgos (X) santykis. Kuo didesnis šis santykis, tuo geresnė aerodinaminė kokybė.","hint":""},{"id":"156","q":"Kas sąlygoja sparno profilį veikiančių Y ir X priklausomybę?","a":["Oro srauto greitis","Sparnų paviršius","Oro tankis","Atakos kampas a"],"c":[3],"expl":"","hint":""},{"id":"157","q":"Kas vaizduojama poliarėje?","a":["Cy priklausomybė nuo a","Cx priklausomybė nuo a","Cy priklausomybė nuo Cx","Cy ir Cx priklausomybė nuo a"],"c":[3],"expl":"Reikia atsiminti kaip vizualiai atrodo grafikas ir kad tai yra keliamosios ir pasipriešinimo jėgų priklausomybė nuo atakos kampo.","hint":""},{"id":"158","q":"Kuri iš šių kreivių yra žemėjimo poliarė (žr. pav.)?","a":["A","B"],"c":[0],"expl":"Klausimas apgaulingas, nes neduoti ašių pavadinimai. Reikia atsiminti kaip vizualiai atrodo grafikas.","hint":""},{"id":"159","q":"Kas įvyksta su keliamąja jėga Y ir pasipriešinimo jėga X, viršijus kritinį atakos kampą?","a":["Y staigiai sumažėja, o X staigiai išauga","Y ir X staigiai išauga","Y staigiai išauga, o X staigiai sumažėja","Y ir X sumažėja"],"c":[0],"expl":"Viršijus kritinį atakos kampą, keliamoji jėga Y staigiai sumažėja, nes oro srautas nustoja tolygiai tekėti virš sparno ir sparnas nebegali efektyviai generuoti pakėlimo. Tuo pačiu metu pasipriešinimo jėga X staigiai padidėja dėl atsiradusio turbulentinio srauto ir didesnio oro pasipriešinimo.","hint":""},{"id":"160","q":"Ką darytumėt, kad orlaivis nusklęstų toliau?","a":["Laikytumėt V kad atitiktų K max","Laikytumėt V min","Išleistumėte užsparnius","Laikytumėt Veko"],"c":[0],"expl":"Kad orlaivis nusklęstų kuo toliau be variklio traukos, reikia laikyti greitį, kuriam esant pasiekiama maksimali aerodinaminė kokybė (K max) – tai geriausias keliamoji jėga / pasipriešinimo jėga santykis. Šiuo greičiu orlaivis sklęs toliausiai horizontalia kryptimi nuo dabartinio aukščio.","hint":""},{"id":"161","q":"Esant blaškai ir skrendant minimaliu leistinu greičiu (arti kritinio a ):","a":["OL patiria padidintą perkrovą","pasikeičia svorio centro padėtis","atsiranda aukščio vairo svyravimai","OL gali atsidurti už didesnių kaip kritiniai a ir įvykti srauto atotrūkis"],"c":[3],"expl":"Esant blaškai (turbulencijai) ir skrendant arti kritinio atakos kampo, net ir nedidelis oro srauto pokytis gali laikinai padidinti atakos kampą virš kritinio. Tokiu atveju oro srautas atsiskiria nuo sparno paviršiaus – įvyksta srauto atotrūkis.","hint":""},{"id":"162","q":"Ką reiškia skaičius, kuriuo pažymėta OL kokybė?","a":["Norint toliau nusklęst- privalu laikyti tokį a","Norint toliau nusklęsti būtina laikyti tokį, tarp išilginės ašies ir horizonto kampą","Norint toliausiai nusklęsti reikia laikyti tiek mazgų didesnį greitį","Sklendžiant be vėjo OL iš 1 km aukščio tokį nuotolį nusklęs"],"c":[3],"expl":"","hint":""},{"id":"163","q":"Kaip Jūs suprantate pikiravimą?","a":["Sklendimas daugiau nei 30 laipsnių kampu","Tai sklendimas (žemėjimas), kai Y ir sklendimo kampas lygus nuliui","Staigus žemėjimas","Kiekvienas didžiausio leistino greičio viršijimas"],"c":[2],"expl":"Pikiravimas – tai staigus orlaivio nosies nukritimas žemyn, lydimas greito aukščio praradimo.","hint":""},{"id":"164","q":"Apledėjus priekinei sparno briaunai:","a":["padidėja X","ženkliai padidėja G","labai sumažėja Cy, sumažėja kritinis a ir padidėja X","padidėja kritinis a"],"c":[2],"expl":"Kai priekinė sparno briauna apledėja, keičiasi sparno aerodinaminė forma. Dėl to pablogėja oro srauto aptekėjimas, todėl labai sumažėja keliamoji jėga (Cy), sumažėja kritinis atakos kampas (sparnas gali anksčiau užvirti) ir padidėja pasipriešinimo jėga (X). Visa tai reikšmingai blogina orlaivio aerodinamines savybes ir kelia pavojų skrydžio saugumui.","hint":""},{"id":"165","q":"Padengęs viršutinę sparno dalį sniegas:","a":["neturi įtakos, nes kylant yra didelė galimybė jį nupūsti","padidėja X ir G","padidėja X ir G, o Cy žymiai sumažėja","padidėja tik G"],"c":[2],"expl":"Sniegas ant viršutinės sparno dalies keičia sparno paviršiaus lygumą ir formą, todėl blogina oro srauto aptekėjimą. Dėl to žymiai sumažėja keliamoji jėga (Cy), padidėja pasipriešinimas (X) ir sunkėja orlaivio svoris (G), nes sniegas prideda papildomos masės. Šie veiksniai ženkliai blogina kilimo savybes ir gali sukelti pavojų skrydžiui. Sniegas nuo sparno visiškai nenusipūs, nes yra paribio sluoksnis, kuriame prie oro srauto greitis lygus 0.","hint":""},{"id":"166","q":"Kaip pasikeičia OL aerodinaminės charakteristikos išleidus užsparnius?","a":["Cy padidėja","Cy ir C× padidėja, bet Cx padidėja daugiau","žymiai padidėja X","K lieka nepakitus"],"c":[1],"expl":"Išleidus užsparnius, padidėja sparno kreivumas ir plotas, todėl padidėja keliamoji jėga (Cy) – orlaivis gali skristi mažesniu greičiu. Tačiau kartu labai padidėja pasipriešinimo koeficientas (Cx), nes oro srautas labiau stabdomas. Dėl to aerodinaminė kokybė (K) sumažėja, nes Cx didėja labiau nei Cy. Tai naudinga leidžiantis – orlaivis tampa labiau valdomas, bet greičiau praranda aukštį.","hint":""},{"id":"167","q":"Ar teisinga teigti, kad tūpiant užsparniai atlenkiami pilnai tam, kad:","a":["padidėtų žemėjimo kampas","sumažėtų žemėjimo kampas","sumažėtų tūpimo V","sumažėtų riedėjimo žeme ilgis","teisingi a,c,d"],"c":[4],"expl":"Atlenkus užsparnius, lėktuvas gali leistis stačiau, nes padidėja keliamoji jėga ir pasipriešinimas, todėl pilotas gali saugiai tūpti didesniu žemėjimo kampu. Užsparniai didina keliamąją jėgą ir pasipriešinimą, leidžiant skristi lėčiau, kas suteikia daugiau kontrolės ir saugumo tūpimo metu. Dėl sumažėjusio tūpimo greičio ir didesnio pasipriešinimo lėktuvas gali greičiau sustoti nusileidęs, trumpėja riedėjimo atstumas.","hint":""},{"id":"168","q":"Kodėl rekomenduojama kilti su užsparniais atlenktais tarpinėje padėtyje (nepilnai)?","a":["Starto metu didelė galimybė akmenukais pažeisti užsparnius","Pilnai atlenkus užsparnius pasipriešinimo jėga X padidėja žymiai daugiau, nei keliamoji jėga Y","OL įgauna tendenciją pikiruoti","Padidėja atsiplėšimo V"],"c":[1],"expl":"","hint":""},{"id":"169","q":"Kaip vadinamas OL sukimasis apie išilginę ašį ir kokiais vairais tai atliekama?","a":["Pokrypis-posūkio krypties vairu","Polinkis – eleronais","Posvyris- eleronais","Pokrypis – posūkio (krypties) vairu"],"c":[2],"expl":"","hint":""},{"id":"170","q":"Kaip vadinamas OL sukimasis apie vertikalią ašį ir kokiais vairais tai atliekama?","a":["Pokrypis-posūkio (krypties) vairu","Polinkis-aukštumos vairu","Posvyris-eleronais","Pokrypis-eleronais"],"c":[0],"expl":"","hint":""},{"id":"171","q":"Kaip vadinamas OL sukimasis apie skersinę ašį ir kokiais vairais tai atliekama?","a":["Pokrypis- posūkio (krypties) vairu","Polinkis- aukštumos vairu","Posvyris- eleronais","Pokrypis- eleronais"],"c":[1],"expl":"","hint":""},{"id":"172","q":"Koks skirtumas tarp sparno tvirtinimo kampo ir ά?","a":["Tvirtinimo kampas kintantis, o ά –pastovus","Tvirtinimo kampas ir ά -visada nekintantys","Tvirtinimo kampas paprastai visada didesnis už ά","Tvirtinimo kampas pastovus, ά kintantis (priklausomai nuo greičio V)"],"c":[3],"expl":"Tvirtinimo kampas (angl. angle of incidence) – tai pastovus kampas tarp orlaivio išilginės ašies ir sparno profilio stygos. Šis kampas nustatomas konstrukcijos metu ir paprastai nekinta skrydžio metu. Atakos kampas (graikiškai žymimas kaip ά, angl. angle of attack) – tai kampas tarp atsklindančios oro srovės krypties ir sparno profilio stygos. Šis kampas kinta skrydžio metu priklausomai nuo orlaivio greičio, trajektorijos, pakilimo ar leidimosi kampo.","hint":""},{"id":"173","q":"Aukštėjimo greitis V:","a":["turi būti mažesnis, negu V horizontaliame skridime, priklausomai nuo aukštėjimo kampo","toks pats kaip horizontaliame skridime","turi būti didesnis, negu V horizontaliame skridime, priklausomai nuo aukštėjimo kampo"],"c":[0],"expl":"Aukštėjimo greitis (angl. climb speed ) – tai reali orlaivio greičio komponentė vertikalia kryptimi. Tikrasis greitis (V) skrendant aukštyn turi būti mažesnis nei horizontaliame skridime, nes dalis variklio traukos panaudojama kovai su sunkio jėga, o ne horizontaliam judėjimui palaikyti.","hint":""},{"id":"174","q":"Sklendimo kampas mažiausias bus:","a":["sklendžiant minimaliu V","sklendžiant ekonominiu V","sklendžiant naudingiausiu (sklandžiausiu) V (K maksimali)","sklendžiant išleidus užsparnius"],"c":[2],"expl":"Sklendimo kampas yra kampas tarp horizontalios linijos ir orlaivio trajektorijos sklendžiant be variklio traukos. Kuo šis kampas mažesnis, tuo toliau orlaivis gali nuskristi iš tam tikro aukščio. Mažiausias sklendimo kampas pasiekiamas tada, kai orlaivis sklendžia tokiu greičiu, kuriuo pasiekiama maksimali aerodinaminė kokybė (K), tai yra didžiausias pakėlimo ir pasipriešinimo jėgų santykis. Toks greitis vadinamas naudingiausiu arba sklandžiausiu greičiu. Skrendant per lėtai, pavyzdžiui, minimaliu greičiu, pasipriešinimas padidėja ir sklendimo kampas tampa didesnis.","hint":""},{"id":"175","q":"Sklendimo sparta (Vy) bus minimali:","a":["sklendžiant minimaliu V, išleidus pilnai užsparnius","sklendžiant naudingiausiu (sklandžiausiu) V (K maksimali)","sklendžiant ekonominiu V","sklendžiant išleidus užsparnius"],"c":[1],"expl":"Sklendimo sparta (Vy) yra vertikalioji greičio sudedamoji sklendžiant – tai, kiek orlaivis praranda aukščio per laiką. Kuo mažesnė sklendimo sparta, tuo lėčiau orlaivis leidžiasi ir gali nuskristi didesnį atstumą iš to paties aukščio. Mažiausia sklendimo sparta pasiekiama tada, kai aerodinaminė kokybė yra maksimali – tai yra, kai pakėlimo jėga yra didžiausia lyginant su pasipriešinimo jėga. Ši sąlyga įvykdoma sklendžiant vadinamuoju naudingiausiu arba sklandžiausiu greičiu.","hint":""},{"id":"186","q":"Didžiausias aukštėjimo kampas bus skrendant, kai:","a":["traukos perteklius (delta P) didžiausias","aukštėjimo V prilygsta ekonominiam","G mažiausias (minimalus)","Visi teisingi"],"c":[0],"expl":"Traukos perteklius didžiausias – tai yra vienintelė sąlyga, lemianti didžiausią aukštėjimo kampą. Kai traukos (variklio jėgos) perteklius didelis, daugiau jos galima panaudoti kilimui, o ne tik pasipriešinimui įveikti. Todėl kampas su horizontu gali būti statesnis.","hint":""},{"id":"187","q":"OL \"perkrova\" suprantama kaip:","a":["per didelė OL kabinos įkrova","viršsvoris, kuris labai padidina įsibėgėjimo ilgį kylant","kiek kartų esamu momentu orlaivio Y yra didesnė už G","apkrova, išbandant sparnų tvirtumą"],"c":[2],"expl":"Orlaivio „perkrova“– tai santykis tarp orlaivį veikiančios bendros pakėlimo jėgos (Y) ir jo sunkio jėgos (G). Kitaip tariant, tai rodo, kiek kartų pakėlimo jėga tam tikru momentu viršija svorį.","hint":""},{"id":"188","q":"Kokią perkrovą patiria ramybėje sėdintis žmogus?","a":["Nepatiria","1G","2G","0,5G"],"c":[1],"expl":"Ramybėje sėdintis žmogus patiria normalią Žemės traukos jėgą, vadinamą 1G. Tai reiškia, kad kūną veikianti jėga yra lygi jo svoriui. Tokia būsena laikoma standartine ir ją jaučiame nuolat kasdienybėje, kai nejuda nei žmogus, nei aplinka. Perkrova atsiranda tik tada, kai kūnas patiria papildomą pagreitį ar lėtėjimą, pavyzdžiui, skrendant orlaiviu ir atliekant staigius manevrus ar posūkius. Tokiu atveju pakėlimo jėga viršija arba yra mažesnė už svorį, ir perkrova tampa didesnė arba mažesnė už 1G. Tačiau kai žmogus sėdi ramiai be jokio judesio ar papildomo pagreičio, perkrova yra pastovi ir lygi 1G.","hint":""},{"id":"189","q":"Kokiose sąlygose visų krypčių kūną veikiančios perkrovos lygios nuliui?","a":["Ramybės būsenoj","Nesvarumo","Laisvo kritimo būklėje"],"c":[1],"expl":"Nesvarumo būsena yra tokia būsena, kai kūnas nejaučia jokios atraminės jėgos. Tokiu atveju visų krypčių perkrovos yra lygios nuliui.","hint":""},{"id":"190","q":"Pagal veikimo ašis perkrova skirstoma į:","a":["išilginę Gz, skersinę G× ir šoninę Gy","išilginę Gz, skersinę G×","skersinę G× šoninę Gy"],"c":[0],"expl":"","hint":""},{"id":"191","q":"Kokią perkrovą patirs orlaivis posūkyje kai posvyris 60°? (perkrovos paskaičiavimo formulė: n=1/cos)","a":["2G","1G","4G","0,5G"],"c":[0],"expl":"n=> 1/cos(60°)=2G","hint":""},{"id":"192","q":"Kaip OL įvedamas į koordinuotą viražą?","a":["Tik posūkio vairu","Koordinuotais eleronų ir posūkio vairo atlenkimais","Tik eleronų pagalba","Eleronų ir aukštumos vairais"],"c":[1],"expl":"","hint":""},{"id":"193","q":"Viraže (posūkyje) reikalingas V:","a":["mažesnis negu horizontaliame skridime","didesnis negu horizontaliame skridime","toks pats kaip horizontaliame skridime"],"c":[1],"expl":"Viraže, ypač kai orlaivis skrenda koordinuotą posūkį su posvyriu, pakėlimo jėga turi būti padidinta, kad kompensuotų ne tik svorį, bet ir suformuotų centripetinę jėgą, reikalingą posūkiui atlikti.","hint":""},{"id":"194","q":"Vidinis slydimas atliekant posūkį atsiranda, kai:","a":["posvyris yra didelis, o posūkio vairas atlenktas nepakankamai","posūkio vairas yra atlenktas per daug, o posvyris per mažas","aukštumos vairas yra neteisingai subalansuotas","posūkyje laikomas per mažas V"],"c":[0],"expl":"","hint":""},{"id":"195","q":"Išorinis slydimas atliekant posūkį atsiranda, kai:","a":["posvyris yra per didelis, o posūkio vairas atlenktas nepakankamai","posūkio vairas yra atlenktas per daug, o posvyris per mažas","aukštumos vairas yra neteisingai subalansuotas","posūkyje laikomas per mažas V"],"c":[1],"expl":"","hint":""},{"id":"196","q":"Kokio prietaiso pagalba nustatomas posūkyje slydimas?","a":["Posūkio rodyklė","Variometru","Rutuliuko (gulsčiuko) pagalba","Pagal horizontą"],"c":[2],"expl":"","hint":""},{"id":"197","q":"Kaip Jums suprantama suktuko sąvoka?","a":["Tai lėktuvo gilus šoninis slydimas","Tai lėktuvo sukimasis apie išilginę ašį","Tai lėktuvo sukimasis apie išilginę ir vertikalią ašis vienu metu","Tai lėktuvo sukimasis apie skersinę ir vertikalią ašis"],"c":[2],"expl":"","hint":""},{"id":"198","q":"Kodėl suktuke lėktuvas sukasi apie išilginę ašį?","a":["Yra didelis sparnų pasipriešinimo X skirtumas","Yra didelis sparnų Y skirtumą todėl, kad besileidžiantis sparnas yra už kritinio (smukos) a ribos","Dėl gilaus slydimo","Posūkio vairas yra atlenktas į lėktuvo sukimosi pusę"],"c":[1],"expl":"","hint":""},{"id":"199","q":"Kodėl suktuke lėktuvas sukasi apie vertikalią ašį?","a":["Dėl gilaus slydimo į lėktuvo sukimosi pusę","Lėktuvo sukimosi krypties sparno eleronas yra pilnai pakilęs i viršų","Dėl didelio sparnų pasipriešinimo jėgų X skirtumo"],"c":[2],"expl":"","hint":""},{"id":"200","q":"Kaip skrydžio metu galima pakeisti centruotę?","a":["Keičiant variklio darbo režimą","Keičiant aukščio vairo povairių(trimerių) padėtį","Perdedant bagažą arba persodinant keleivius į kitą vietą","Pakeisti negalima"],"c":[2],"expl":"Skrydžio metu centruotė (orlaivio masės centro padėtis) gali būti paveikta tik fiziškai perkeliant svorį – tai yra, persodinant keleivius arba perdedant bagažą (jei tokia galimybė egzistuoja).","hint":""},{"id":"201","q":"Ar keičiasi centruotė skridimo metu?","a":["Nesikeičia","Nežymiai sunaudojus degalus","Staigiai patraukus vairalazdę į save","Perstatant povairį (trimerį)"],"c":[1],"expl":"Centruotė – tai orlaivio masės centro padėtis, kuri gali nežymiai keistis skridimo metu, ypač kai sunaudojami degalai. Kadangi degalų bakai dažnai yra sparnuose arba fiuzeliažo priekyje ar gale, jų svorio pokytis paveikia bendrą svorio pasiskirstymą orlaivyje.","hint":""},{"id":"202","q":"OL dinamiškai stabilus, jeigu:","a":["Skrendant su pakeltais užsparniais perkrova siekia nuo 4g iki 2g","Pakitus skrydžio padėčiai OL pats susibalansuoja naujoje padėtyje","OL per trumpą laiką susibalansuojamas aukštumos vairo pagalba","OL savaime, be piloto pagalbos, grįžta į pirmykštę padėtį"],"c":[3],"expl":"","hint":""},{"id":"203","q":"Kas užtikrina OL išilginį stabilumą?","a":["Stabilizatorius","Kilis","Sparnų skersinis „V“","Sparno strėliškumas"],"c":[0],"expl":"","hint":""},{"id":"204","q":"Iš kur atsiranda oro sraigto trauka?","a":["Dėl didelio prieš ir už sraigto menčių slėgių skirtumo","Dėl įsisukimo į užgriebiamąją oro masę","Abu teisingi"],"c":[0],"expl":"Oro sraigto trauka atsiranda dėl to, kad sraigto mentės veikia kaip sparnai – jos keičia oro srauto slėgį: priekinėje pusėje (užgriebiamojoje) slėgis yra mažesnis, o užpakalinėje (traukos) pusėje – didesnis. Šis slėgių skirtumas sukuria traukos jėgą, varančią orlaivį į priekį.","hint":""},{"id":"205","q":"Kodėl naudojami keičiamo žingsnio oro sraigtai?","a":["Kad palengvinti šalto variklio paleidimą","Kad sumažinti sraigto sukimosi laiką išjungus variklį","Kad skrendant sraigtas dirbtų kuo naudingiau darbo režimu, su didžiausiu naudingo veikimo koeficientu (arti ά naud)","Apsaugoti variklį nuo per didelių apsukų jį išjungiant"],"c":[2],"expl":"","hint":""},{"id":"206","q":"Oro sraigto su fiksuotu tvirtinimo kampu, didėjant V, esant pastovioms sraigto apsukoms n=const:","a":["trauka didėja - ά didėja","trauka lieka ta pati - ά be pakitimų (ά -const)","trauka mažėja - atakos kampas ά mažėja"],"c":[2],"expl":"Oro sraigto su fiksuotu menčių tvirtinimo kampu (fiksuotu žingsniu) atveju, jei sraigto apsukos (n) lieka pastovios, o orlaivio greitis (V) didėja, oro srautas į mentę ateina labiau iš priekio, todėl efektyvus atakos kampas α mažėja. Kadangi atakos kampas mažėja, sraigto mentės efektyvumas krenta ir trauka mažėja.","hint":""},{"id":"207","q":"Kurie iš šių faktorių turi įtakos įsibėgėjimo ilgiui?","a":["Atplyšimo V","Variklio N","Aerodrome paviršiaus kokybė","G,P,t nulinė","Vėjas","Visi"],"c":[5],"expl":"Įsibėgėjimo ilgiui turi įtakos visi išvardyti veiksniai. Atplyšimo greitis lemia, kiek greitai orlaivis turi pasiekti reikiamą greitį, todėl kuo jis didesnis, tuo ilgesnis reikalingas kelias. Variklio galia turi tiesioginę įtaką traukai – kuo galingesnis variklis, tuo greičiau įsibėgėjama. Aerodromo paviršiaus kokybė taip pat svarbi – minkštas, šlapias ar nelygus paviršius padidina pasipriešinimą ir prailgina riedėjimo laiką. Oro tankis, slėgis ir temperatūra veikia variklio našumą ir keliamąją jėgą – esant mažam oro tankiui (pvz., aukštoje temperatūroje ar aukštai virš jūros lygio), įsibėgėjimo kelias pailgėja. Vėjas taip pat turi reikšmę – priešpriešinis vėjas sutrumpina įsibėgėjimą, o galinis jį pailgina.","hint":""},{"id":"208","q":"Nuo ko priklauso ridos ilgis nutūpus?","a":["Tūpimo V","Ratų su aerodromo paviršiumi sukibimo koeficiento ir stabdžių efektyvumo","Vėjo","Visi teisingi"],"c":[3],"expl":"Ridos ilgis po nutūpimo priklauso nuo kelių veiksnių. Tūpimo greitis turi įtakos, nes kuo didesnis greitis lėktuvui paliečiant žemę, tuo ilgesnė rida reikalinga jį sustabdyti. Sukibimo koeficientas tarp ratų ir paviršiaus bei stabdžių efektyvumas lemia, kaip greitai orlaivis gali būti sulėtintas – prastas sukibimas arba neefektyvūs stabdžiai prailgina ridos ilgį. Vėjas taip pat svarbus: priešpriešinis vėjas sumažina tūpimo greitį žemės atžvilgiu ir taip sutrumpina ridą, o galinis vėjas – priešingai, pailgina.","hint":""},{"id":"209","q":"Nustatant aukštį pagal OL aukštimačio parodymus būtina atsižvelgti:","a":["QFE ir oro temperatūrą","barometrinį aukštį ir oro temperatūrą","barometrinį aukštį ir QNH","tik QNH"],"c":[1],"expl":"Nustatant tikrąjį aukštį pagal OL (oro linijų) aukštimačio parodymus, reikia atsižvelgti į barometrinį aukštį, kurį rodo aukštimatis, bei į esamą oro temperatūrą. Barometrinis aukštis parodo aukštį pagal standartinį atmosferos slėgio pasiskirstymą (kai aukštimatis nustatytas pagal QNH ar QNE), tačiau tikrasis aukštis nuo žemės paviršiaus gali skirtis, jei faktinė oro temperatūra skiriasi nuo standartinės. Esant žemesnei nei ISA temperatūrai, tikrasis aukštis bus mažesnis nei rodo aukštimatis, todėl skrydžių saugumui svarbu tai įvertinti.","hint":""},{"id":"210","q":"Skrydžio aukštis 800m. Jūsų aparato kokybė- 8. Kiek galite nuskristi nepučiant vėjui?","a":["1,6 km","6,4 km","2,4 km","24 km"],"c":[1],"expl":"Kokybė 8 reiškia, kad aparatas iš 1 km aukščio nusklęs 8 km į priekį. Tai iš 800m orlaivis nusklęs 6,4km. (0,8km x 8km=6,4km.)","hint":""},{"id":"211","q":"Judėdamas 30 km/h greičiu, kūnas priešinasi 1kN jėga. Kokia bus kūno pasipriešinimo jėga jei jis judės 120 km/h greičiu?","a":["8 kN","4 kN","16 kN","12 kN"],"c":[2],"expl":"Tai gaunasi, kad prie 120km/h. greičio keliamoji jėga bus lygi 16kN, nes formulėje prie greičio yra kvadratas. (120km/h / 30km/h=4; 4^(2)=16 )","hint":""},{"id":"212","q":"Kiek kilometrų iš 500 metrų gali nuskristi orlaivis, kurio skridimo svoris - 430 kg, o aerodinaminė kokybė 1:18?","a":["18 km","9 km","35 km"],"c":[1],"expl":"Kokybė 1:18 reiškia, kad orlaivis iš 1 km aukščio nusklęs 18 km į priekį. Tai iš 500m orlaivis nusklęs 9km. (0,5km x 18km=9km.) Svoris šiuo atveju neturi tiesioginės įtakos skaičiavimui, nes aerodinaminė kokybė jau apibūdina orlaivio gebėjimą efektyviai leistis.","hint":""},{"id":"213","q":"Aptekančios sparno profilį srovės greitis yra didžiausias ten, kur:","a":["statinio slėgio zona yra didžiausia","Sparno profilis ploniausias","sparno profilis storiausias","yra kritinis taškas"],"c":[2],"expl":"Oro srovės greitis sparno profilyje yra didžiausias ten, kur sparnas yra storiausias, nes oro srautas virš sparno turi nueiti ilgesnį kelią. Dėl sparno išlinkimo ir profilio formos oras viršuje teka greičiau, kad pasiektų sparno galą kartu su srove, tekančia per trumpesnį kelią sparno apačioje. Šis greičio padidėjimas sparno viršuje sukelia statinio slėgio sumažėjimą, todėl susidaro keliamoji jėga. Taigi, sparno storiausioje vietoje oro srovės greitis yra didžiausias, nes čia oras priverstas judėti greičiau per ilgesnį kelią.","hint":""},{"id":"214","q":"Ar pasikeičia orlaivio masės centro padėtis padidinus atakos kampą α?","a":["Pasislenka labai nežymiai","Pasislenka į priekį","Nepasikeičia"],"c":[2],"expl":"Masės centro padėtis priklauso nuo svorio pasiskirstymo orlaivyje, o atakos kampas veikia aerodinamines jėgas, bet nesukelia masės centro pasikeitimo. Todėl keičiant atakos kampą masės centro padėtis lieka ta pati.","hint":""},{"id":"215","q":"Kurio objekto aerodinaminės savybės blogesnės: 3 mm troso ar 25 mm diametro profiliuoto vamzdžio?","a":["25 mm profiliuoto vamzdžio","3 mm troso","savybės panašios"],"c":[1],"expl":"Nors jo skersmuo mažesnis, troso forma dažniausiai sukelia didesnį oro pasipriešinimą dėl turbulencijos aplink ploną cilindrą, o profiliuotas vamzdis yra specialiai suformuotas taip, kad oras aplink jį tekėtų sklandžiau ir būtų mažesnis pasipriešinimas. Todėl, palyginus, 3 mm troso aerodinaminės savybės yra prastesnės nei 25 mm profiliuoto vamzdžio.","hint":""},{"id":"216","q":"Iš kur atsiranda oro sraigto trauka?","a":["Dėl įsisukimo (kaip sraigtas) į užgriebiamąją oro masę","Dėl didelio prieš ir už sraigto menčių slėgių skirtumų","Dėl didelio prieš ir už sraigto menčių slėgių skirtumų ir įsisukimo (kaip sraigtas) į užgriebiamąją oro masę"],"c":[1],"expl":"Oro sraigto trauka atsiranda dėl to, kad sraigto mentės veikia kaip sparnai – jos keičia oro srauto slėgį: priekinėje pusėje (užgriebiamojoje) slėgis yra mažesnis, o užpakalinėje (traukos) pusėje – didesnis. Šis slėgių skirtumas sukuria traukos jėgą, varančią orlaivį į priekį.","hint":""},{"id":"217","q":"Kokį greitį V pasirinktumėte, kad sklendžiant ilgiau išsilaikyti ore?","a":["Greitį V, atitinkantį Kmax (Vnaud)","Minimalų greitį","Greitį V, kuriam esant Vy minimalus (Vekon)"],"c":[2],"expl":"","hint":""},{"id":"218","q":"Kokią perkrovą patirs orlaivis posūkyje, kai posvyris β=60°. (Perkrovos paskaičiavimo formulė n = 1/cosβ)","a":["1G","2G","0,5G","1,5G"],"c":[1],"expl":"n=> (1/cos(60))=2","hint":""},{"id":"219","q":"Kurioje sparno dalyje susidaro didžiausia keliamoji galia?","a":["Prie galinės briaunos","Priekiniame trečdalyje","Išorėje, prie sparnų galų"],"c":[1],"expl":"","hint":""},{"id":"220","q":"Nuo ko priklauso keliamosios jėgos dydis (Vx=const)?","a":["Nuo profilio formos, sparno ploto ir atakos kampo ά","Tik nuo atakos kampo ά","Tik nuo sparnų ploto","Tik nuo sparno profilio"],"c":[0],"expl":"","hint":""},{"id":"221","q":"Nuo ko priklauso kūno pasipriešinimas oro srautui?","a":["Nuo kūno tankio","Nuo skerspjūvio ploto, statmeno oro srautui, greičio, oro tankio","Nuo svorio","Nuo masės centro vietos"],"c":[1],"expl":"","hint":""},{"id":"222","q":"Orlaivio \"perkrova\" G suprantama kaip:","a":["kiek kartų esamu momentu perkrovą sukūrusi jėga didesnė už orlaivio svorį","viršsvoris, kuris labai padidina įsibėgėjimo ilgį kylant","apkrova, išbandant sparnų tvirtumą","viršyta orlaivio kabinos įkrova"],"c":[0],"expl":"Perkrova (žymima G arba n) aviacijoje reiškia, kiek kartų orlaivį veikianti bendra jėga (pvz., manevruojant, skrendant kilpoje ar smarkiai keičiant trajektoriją) yra didesnė už jo svorį ramybės (1G) būsenoje. Pavyzdžiui, 3G reiškia, kad orlaivį ir jame esančius objektus ar žmones veikia trijų kartų didesnė jėga nei įprastas svoris.","hint":""},{"id":"223","q":"Oro srauto nutrūkimo priežastis yra:","a":["mažesnis žemėjimo greitis, negu horizontalus greitis","per didelis atakos kampas","vienodas horizontalus ir žemėjimo greitis","per didelis skridimo greitis"],"c":[1],"expl":"Oro srauto nutrūkimas įvyksta tada, kai atakos kampas viršija kritinę ribą, kurią pasiekus oro srautas nebegali tolygiai tekėti per sparno viršutinį paviršių. Dėl to labai sumažėja keliamoji jėga, orlaivis netenka pakilimo galios ir pradeda kristi. Tai yra pagrindinė oro srauto nutrūkimo priežastis.","hint":""}]},"Meteorologija":{"slug":"meteorologija","questions":[{"id":"4","q":"Atmosferos sluoksnis, esantis arčiausiai žemės paviršiaus, vadinamas:","a":["troposfera","stratosfera","tropopauzė"],"c":[0],"expl":"","hint":""},{"id":"530","q":"Dvi pagrindinės sudėtinės oro dalys yra:","a":["azotas ir deguonis","Argonas, deguonis"],"c":[0],"expl":"Azotas sudaro apie 78% oro tūrio, deguonis apie 21% ir likęs 1% sudarytas iš kitų dujų, tokių kaip argonas, anglies dioksidas, neonas, helis ir kt.","hint":""},{"id":"531","q":"Kokiame atmosferos sluoksnyje vyksta meteorologiniai reiškiniai, nulemiantys orą?","a":["Troposferoje","Egzosferoje","Stratosferoje"],"c":[0],"expl":"Esantis arčiausiai Žemės paviršiaus. Jo storis siekia apie 8 km ties ašigaliais ir iki 18 km ties pusiauju. Būtent šiame sluoksnyje yra beveik visa atmosferos drėgmė ir vyksta pagrindiniai orų pokyčiai. Taigi, meteorologiniai reiškiniai, nulemiantys orą (tokie kaip debesų susidarymas, krituliai, vėjai), vyksta troposferoje.","hint":""},{"id":"532","q":"Vandens garų atmosferoje daugiausia susikaupę yra:","a":["traposferoje","stratosferoje","trapopauzėje"],"c":[0],"expl":"Tai apatinis atmosferos sluoksnis, kuriame yra apie 99% visų atmosferos vandens garų. Troposferoje vyksta garavimas, kondensacija, debesų formavimasis ir krituliai – visi pagrindiniai vandens apytakos rato procesai.","hint":""},{"id":"533","q":"Kokios sudedamosios atmosferos dalies nepakanka didesniame aukštyje, kad galėtų išgyventi žmogus?","a":["Deguonies","Azoto","Argono"],"c":[0],"expl":"Nors deguonies procentinė dalis atmosferoje išlieka panaši (apie 21 %), kylant aukštyn oro slėgis mažėja, todėl mažėja ir įkvepiamo deguonies kiekis. Dėl to organizmas negauna pakankamai deguonies, o tai gali sukelti deguonies badą (hipoksiją), jei nėra papildomo deguonies tiekimo.","hint":""},{"id":"534","q":"Šilumos perdavimas, esant horizontaliai oro masių pernašai, vadinamas:","a":["Advekcija","Konvekcija","Izotermija"],"c":[0],"expl":"Advekcija – tai šilumos (ar drėgmės) pernaša horizontalia kryptimi kartu su oro masėmis. Pavyzdžiui, kai šiltas oras iš pietų juda į šiaurę ir atneša šiltesnį orą, tai vadinama šilumos advekcija.","hint":""},{"id":"535","q":"Šilumos perdavimas, esant vertikaliems oro masių judėjimams, vadinamas:","a":["advekcija","konvekcija","izotermija"],"c":[1],"expl":"Konvekcija – tai šilumos pernaša, kai šiltas oras kyla aukštyn, o vėsesnis leidžiasi žemyn. Šis procesas ypač svarbus formuojantis debesims, audroms ir kitiems atmosferos reiškiniams.","hint":""},{"id":"536","q":"Koks oras lengvesnis?","a":["Šiltesnis","Karštas","Šaltas"],"c":[1],"expl":"Šylant orui, oro molekulės juda greičiau, todėl oras plečiasi ir tampa mažiau tankus – dėl to jis tampa lengvesnis palyginus su šaltu.","hint":""},{"id":"537","q":"Ar šiltas oras kyla į viršų?","a":["Taip, kyIa","Ne, nekyla"],"c":[0],"expl":"Šylant orui, oro molekulės juda greičiau, todėl oras plečiasi ir tampa mažiau tankus – dėl to jis kyla aukštyn. Šildomo oro principu veikia oro balionai.","hint":""},{"id":"538","q":"Kaip keičiasi kylančio oro baliono apimtis ir temperatūra, didėjant aukščiui?","a":["Apimtis didėja, temperatūra lieka ta pati","Apimtis lieka ta pati, temperatūra mažėja","Apimtis didėja, temperatūra mažėja","Apimtis ir temperatūra mažėja"],"c":[2],"expl":"Balionui kylant į viršų aplinkos slėgis mažėja, taigi uždarame oro balione oro dalelės plečiasi taip plėsdamos baliono tūrį. Besiplėsdamos daleles naudoja šilumos energija to pasekoje baliono temperatūra mažėja.","hint":""},{"id":"539","q":"Kodėl poliariniuose regionuose yra šalčiau, negu prie ekvatoriaus?","a":["Nes saulės spindulių kritimo kampas ten labai mažas","Dėl poliarinių regionų padėties ypatumo","Nes oro cirkuliacijos greitis dėl žemės sukimosi ten yra mažesnis","Dėl šaltų jūros srovių"],"c":[0],"expl":"Prie ekvatoriaus saulės spinduliai krinta statmenai, todėl energija sutelkiama mažesniame paviršiaus plote. Tuo tarpu poliariniuose regionuose spinduliai krinta įstrižai, todėl ta pati energija pasiskirsto didesniame plote ir mažiau šildo paviršių.","hint":""},{"id":"540","q":"Linijos, jungiančios vienodo slėgio jūros lygyje taškus, esančius sinoptiniuose žemėlapiuose, vadinamos:","a":["SL gradlantais","izobaromis","vienodo slėgio linijomis"],"c":[1],"expl":"Linijos, jungiančios vienodo slėgio jūros lygyje taškus sinoptiniuose žemėlapiuose, vadinamos izobaromis. Izobaros padeda analizuoti atmosferos slėgio pasiskirstymą, nustatyti aukšto ir žemo slėgio sritis bei numatyti vėjo kryptį ir stiprumą. Vėjas dažniausiai pučia lygiagrečiai izobaroms ir juda iš aukšto slėgio srities į žemo slėgio sritį.","hint":""},{"id":"541","q":"Slėgio pokytis horizontalioje plokštumoje yra vadinamas:","a":["slėgio gradientu","bariniu gradientu"],"c":[1],"expl":"Barinis gradientas – tai slėgio kitimas horizontalioje plokštumoje izobaromis statmena kryptimi. Jis matuojamas mbar (hPa)/100 km. Horizontalaus barinio gradiento dydį rodo izobarų tankumas: kuo jos tankesnės, tuo didesnis barinis gradientas.","hint":""},{"id":"542","q":"Ar teisinga teigti, kad TSA (angl. ISA International Standard Atmosphere) yra tarptautinė standartinė atmosfera?","a":["Taip","Ne"],"c":[0],"expl":"TSA- yra tarptautinė standartinė atmosfera.","hint":""},{"id":"543","q":"TSA (tarptautinė standartinė atmosfera) oro temperatūra jūros lygyje yra:","a":["0 C","+15 C","+20 C"],"c":[1],"expl":"Tarptautinė standartinė atmosfera (ISA) yra hipotetinis atmosferos modelis, parodantis, kaip atmosferos slėgis, oro temperatūra, tankis kinta didėjant aukščiui. Dabartinė ISA buvo patvirtinta 1976 metais. Pagal ją jūros lygyje: atmosferos slėgis – 1013,25 hPa (arba 760 mm); oro temperatūra – 288,15 K (arba +15 °C); oro tankis – 1,225 kg/m3; oro molinė masė – 28,964 g/mol.","hint":""},{"id":"544","q":"Aukščių skirtumas, dėl kurio atmosferos slėgis pakinta 1 mb (hPa) vadinamas:","a":["vertikalusis barinis gradientas","barometrinis žingsnis"],"c":[1],"expl":"Barinis žingsnis – tai vertė, kuri nurodo, kiek metrų aukščio pasikeičia, kai atmosferos slėgis kinta 1 hPa (milibaras). Meteorologijoje tai labai svarbu nustatant aukštį pagal slėgį ir numatyti atmosferos reiškinius.","hint":""},{"id":"545","q":"Horizontalus oro masės judėjimas kreive, kai nėra trinties, o horizontalųjį barinį gradientą atsveria išcentrinės jėgos, yra vadinamas:","a":["geostrofiniu vėju","gradientiniu vėju"],"c":[0],"expl":"Geostrofinis vėjas – tai horizontalus oro masės judėjimas, kai jėgos yra pusiausvyroje tarp barinio gradientinio jėgos ir Koriolio jėgos (ne išcentrinės), o trinties nėra. Jis juda lygiagrečiai izobaroms.","hint":""},{"id":"546","q":"Jūros brizas pavakary pučia:","a":["nuo kranto","į krantą"],"c":[1],"expl":"Vėjas pučia iš aukštos slėgio zonos ir žemą slėgio zona. Dažniausiai jūros brizas būna dienos metu. Atsakant į šitą klausimą reikia kreipti dėmesį į brizo pavadinimą, o ne į paros metą. Jūros brizas visada pučia nuo jūros į krantą.","hint":""},{"id":"547","q":"Kranto brizas aušros metu pučia:","a":["nuo kranto","į krantą"],"c":[0],"expl":"Vėjas pučia iš aukštos slėgio zonos ir žemą slėgio zona. Dažniausiai kranto brizas būna tamsiuoju paros metu. Atsakant į šitą klausimą reikia kreipti dėmesį į brizo pavadinimą, o ne į paros metą. Kranto brizas visada pučia nuo kranto į jūrą.","hint":""},{"id":"548","q":"Kokiame aukštyje vėjas prie žemės yra matuojamas?","a":["0 m","Nuo 0 iki 5 m aukštyje","Nuo 7 iki 10 m aukštyje"],"c":[2],"expl":"Vėjas prie žemės standartiškai matuojamas 7-10 metrų aukštyje virš žemės paviršiaus. Tai tarptautinis meteorologinis standartas, naudojamas siekiant gauti palyginamus ir vienodus vėjo duomenis visame pasaulyje. Matuojama atviroje vietovėje, toliau nuo pastatų, medžių ar kitų kliūčių, kad būtų išvengta didesnių paklaidų.","hint":""},{"id":"549","q":"Kaip suprantate sąvoką \"meteorologinė vėjo kryptis\"?","a":["Kryptis iš kur pučia vėjas","Kryptis į kur pučia vėjas"],"c":[0],"expl":"Meteorologinė vėjo kryptis nurodo, iš kurios pusės pučia vėjas. Pavyzdžiui aerodrome esanti vėjarodė rodo meteorologinė vėjo kryptį.","hint":""},{"id":"550","q":"Dėl ko atsiranda vėjas?","a":["Nes oro masės iš didesnio slėgio sričių slenka į mažesnio slėgio sritis","Nes oro masės iš didelio drėgnumo sričių slenka į mažesnio drėgnumo sritis","Nes oro masės slenka iš mažo slėgio sričių į didesnio slėgio sritis"],"c":[0],"expl":"Vėjas kyla, atsiradus skirtumui tarp dviejų oro masių slėgio: vėjas pučia iš aukšto slėgio regiono link žemo slėgio regiono, kol abiejų oro masių slėgiai susilygina.","hint":""},{"id":"551","q":"Vėjo greitis prie žemės yra:","a":["Kuo didesnis oro slėgio taškų skirtumas, tuo vėjas didesnis (kuo didesnis barinis gradientas)","Kuo mažesnis oro slėgio taškų skirtumas, tuo vėjas didesnis"],"c":[0],"expl":"Vėjas kyla, atsiradus skirtumui tarp dviejų oro masių slėgio: vėjas pučia iš aukšto slėgio regiono link žemo slėgio regiono, kol abiejų oro masių slėgiai susilygina. Kuo slėgių skirtumas didesnis tuo vėjas stipriau pučia.","hint":""},{"id":"552","q":"Koks reiškinys trukdo matuoti oro temperatūrą žemės paviršiuje?","a":["Saulės spinduliai ir daiktai esantys netoli termometro","Įkaitęs žemės paviršius"],"c":[0],"expl":"Tiesioginė saulės spinduliuotė ar atspindėta šiluma nuo aplinkinių objektų (pvz., sienų, akmenų, pastatų) gali dirbtinai pakelti termometro rodmenis.","hint":""},{"id":"553","q":"Koks prietaisas naudojamas oro slėgiui matuoti?","a":["Barometras (barografas)","Fliugeris","Odometras"],"c":[0],"expl":"Barometras – prietaisas, matuojantis atmosferos slėgį (Baro-slėgis).","hint":""},{"id":"554","q":"Koks prietaisas naudojamas meteorologijos stotyse vėjo greičiui matuoti?","a":["Anemometras","Variometras"],"c":[0],"expl":"Anemometras – prietaisas, matuojantis vėjo greitį. Vėjo greitis matuojamas atviroje vietoje, nes pastatai, medžiai, kalvos gali mažinti greitį. Standartiškai matavimai atliekami 7-10 metrų aukštyje virš žemės paviršiaus.","hint":""},{"id":"555","q":"Koks prietaisas naudojamas oro drėgnumui nustatyti?","a":["Hidrometras ir psichrometras","Barometras"],"c":[0],"expl":"","hint":""},{"id":"556","q":"Koks būsenos pasikeitimas vadinamas garavimu?","a":["Skysčių virtimas į garų pavidalą","Garų virtimas į skysčio pavidalą"],"c":[0],"expl":"","hint":""},{"id":"557","q":"Koks būsenos pasikeitimas vadinamas sušalimu?","a":["Skysčių virtimas ledu arba ledo gabalėliais","Kietos medžiagos virtimas skysta"],"c":[0],"expl":"","hint":""},{"id":"558","q":"Koks būsenos pasikeitimas vadinamas tirpimu?","a":["Perėjimas iš kietos būsenos į skystą","Perėjimas iš skystos būsenos į dujinę","Perėjimas iš skystos būsenos į kietą","Perėjimas iš kietos būsenos į dujinę"],"c":[0],"expl":"","hint":""},{"id":"559","q":"Koks būsenos pasikeitimas vadinamas kondensacija?","a":["Perėjimas iš dujinės būsenos į skystą","Perėjimas iš dujinės būsenos į kietą","Perėjimas iš skystos būsenos į kietą","Perėjimas iš skystos būsenos į dujinę"],"c":[0],"expl":"","hint":""},{"id":"560","q":"Koks būsenos pasikeitimas sukelia šilumos sugėrimą?","a":["Skysčio virtimas į dujas","Dujų virtimas į skystį"],"c":[0],"expl":"Molekulėms pereiti iš skystos būsenos į dujine reikia energijos. Jos energiją pasiima iš šilumos. Pavyzdžiui: kai vanduo garuoja nuo odos būna vėsiau arba staigiai išleidus dujų balionėlį jis apšerkšnija.","hint":""},{"id":"561","q":"Vertikalūs oro judėjimai atmosferoje dieną įvyksta:","a":["daugiau negu naktį","mažiau negu naktį"],"c":[0],"expl":"Saulė įšildo Žemės paviršių, o šis šilumą perduoda apatiniam oro sluoksniui. Įšilęs oras tampa lengvesnis ir kyla aukštyn – tai vadinama konvekcija.","hint":""},{"id":"562","q":"Vertikalūs oro judėjimai atmosferoje naktį įvyksta:","a":["daugiau negu dieną","mažiau negu dieną"],"c":[1],"expl":"Diena Saulė įšildo Žemės paviršių, o šis šilumą perduoda apatiniam oro sluoksniui. Įšilęs oras tampa lengvesnis ir kyla aukštyn – tai vadinama konvekcija. Naktį nėra kas saulės todėl vertikalūs oro judėjimai vyksta silpniau.","hint":""},{"id":"563","q":"Vėjas prie žemės dieną yra:","a":["stipresnis negu naktį","silpnesnis negu naktį"],"c":[0],"expl":"Dieną vėjas prie žemės paprastai būna stipresnis nei naktį: Saulė įšildo paviršių, todėl susidaro šilumos srautai. Dėl šio maišymosi aukštesnių sluoksnių vėjas „nusileidžia“ arčiau paviršiaus, todėl vėjas prie žemės stiprėja.","hint":""},{"id":"564","q":"Debesys pagal aukštį yra klasifikuojami:","a":["apatinio, vidurinio, vertikalaus ir viršutinio aukščio debesys","viršutinio ir apatinio aukščio debesys","vidurinio ir žemo aukščio debesys","vertikaliniai ir aukšti debesys"],"c":[0],"expl":"","hint":""},{"id":"565","q":"Debesys, panašūs į kalnus arba į bokštus, kurių viršūnės yra priekalo formos, yra vadinami:","a":["Towering Cu (TCu)","Cb","Sc"],"c":[1],"expl":"","hint":""},{"id":"566","q":"Kokios yra dvi pagrindinės debesų rūšys?","a":["Sluoksniniai ir kamuoliniai","Kamuoliniai Cb"],"c":[0],"expl":"","hint":""},{"id":"567","q":"Kokia yra debesų susidarymo priežastis?","a":["Vandens garų kondensacija/sublimacija (Oras atšąla iki kondensacijos temperatūros)","Staigūs slėgio pokyčiai"],"c":[0],"expl":"Debesys – vandens garų kondensacijos produktas. Jie susidaro, kai vandens garų prisotintas šiltas oras kyla aukštyn ir ten atvėsta iki rasos taško temperatūros. Ore esantys vandens garai kondensuojasi į vandens lašelius ir ledo kristalėlius.","hint":""},{"id":"568","q":"Kokie debesys linkę į kritulius?","a":["Cb,Ns (sluoksniniai- lietaus)","Plunksniniai"],"c":[0],"expl":"","hint":""},{"id":"569","q":"Kokie debesys sukelia audras?","a":["Cb – lietaus kamuoliniai","Towering","Sluoksniniai"],"c":[0],"expl":"Liūtiniai kamuoliniai ( Cumulonimbus, Cb ) — labai ištęsti į aukštį, galingi „priekalo“ formos audros, „kalbantieji“ debesys — debesų karaliai, galintys pasiekti pačius aukščiausius troposferos sluoksnius.","hint":""},{"id":"570","q":"Kokiuose debesyse susidaro kruša?","a":["Cb – lietaus kamuoliniuose","Sluoksniniuose","Plunksniniuose"],"c":[0],"expl":"Liūtiniai kamuoliniai ( Cumulonimbus, Cb ) — labai ištęsti į aukštį, galingi „priekalo“ formos audros, „kalbantieji“ debesys — debesų karaliai, galintys pasiekti pačius aukščiausius troposferos sluoksnius.","hint":""},{"id":"571","q":"Debesys, iš kurių vasarą iškrinta ilgai trunkantis lietus, žiemą- sniegas, vadinami:","a":["sluoksniniai lietaus debesys (Ns)","Cb","Sc"],"c":[0],"expl":"Sluoksniniai lietaus ( Nimbostratus, Ns iki 2 km) — apatinio aukšto debesys, kuriuos sudaro tankus, storas, pilkas debesų sluoksnis.","hint":""},{"id":"572","q":"Jei kylant aukštyn, tam tikrame oro sluoksnyje oro temperatūra didėja, yra vadinama:","a":["inversija","izotermija"],"c":[0],"expl":"Inversija – tai atmosferos reiškinys, kai temperatūra su aukščiu ne krenta, o kyla. Kitaip tariant, aukštesni atmosferos sluoksniai yra šiltesni už apatinius, nors paprastai turėtų būti atvirkščiai.","hint":""},{"id":"573","q":"Oro temperatūra troposferoje, kylant aukštyn vidutiniškai mažėja:","a":["po 0,4C/100 m","po 0,75C/100 m","po 0,6C/100 m","po 0,65C/100 m arba 6,5C/1km"],"c":[3],"expl":"","hint":""},{"id":"574","q":"Kai oras yra pasiekęs prisotinimo drėgme būseną, santykinis drėgnumas yra:","a":["100%","0%","50%"],"c":[0],"expl":"Pasiekus prisotinimo drėgme būseną (100 % santykiniam drėgnumui), bet koks papildomas garų kiekis arba temperatūros sumažėjimas sukels kondensaciją (rasos, rūko, debesų ar lietaus formavimąsi).","hint":""},{"id":"575","q":"Oro temperatūra, iki kurios turi atvėsti oras, kad pasiektų prisotinimo drėgme būseną, nepakitus atmosferiniam slėgiui ir vandens garų kiekiui ore, vadinama:","a":["atšalimo temperatūra","drėgnumo temperatūra","rasos taško temperatūra","prisotinimo temperatūra"],"c":[2]
