function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const MODE_LABEL = {
  study:'Peržiūra per visą dalyką', exam:'Testas, 20 klausimų', mock:'Mišrus bandomasis',
  errors:'Klaidų treniruoklis', weakexam:'Silpniausio dalyko testas', facts:'Faktų lapas'
};
function specText(sp){
  if (!sp) return '';
  if (sp.m === 'study')    return BY_SUBJ[sp.s].length + ' klausimai, atsakymas ir paaiškinimas iš karto po kiekvieno';
  if (sp.m === 'exam')     return sp.n + ' klausimai egzamino režimu iš dalyko „' + sp.s + '"';
  if (sp.m === 'mock')     return sp.n + ' klausimai, po ' + Math.floor(sp.n/8) + ' iš kiekvieno dalyko';
  if (sp.m === 'weakexam') return sp.n + ' klausimai iš to, kur tavo rodmuo žemiausias';
  if (sp.m === 'errors')   return (errorPool(sp.s).length || 0) + ' klausimai, kuriuos paskutinį kartą atsakei neteisingai';
  if (sp.m === 'facts')    return 'Du silpniausi dalykai: klausimas ir teisingas atsakymas viena eilute';
  return '';
}
function specTitle(sp){
  if (sp.m === 'study' || sp.m === 'exam') return sp.s;
  if (sp.m === 'mock')     return 'Bandomasis egzaminas, ' + sp.n + ' klausimai';
  if (sp.m === 'weakexam') return 'Silpniausia vieta';
  if (sp.m === 'errors')   return 'Klaidų treniruoklis';
  if (sp.m === 'facts')    return 'Faktų lapas';
  return '';
}

function drawGauges(){
  const g = document.getElementById('gauges');
  const worst = weakest(2);
  g.innerHTML = SUBJECTS.map(s => {
    const st = subjStats(s.k);
    return `<button class="gauge${worst.includes(s.k) && st.seen ? ' weak' : ''}" data-s="${esc(s.k)}" title="${esc(s.k)}: ${st.ok} iš ${st.total} įvaldyta">
      <div class="g-name">${s.n}</div>
      <div class="g-bar"><i class="g-seen" style="width:${100*st.seen/st.total}%"></i><i class="g-ok" style="width:${st.pct}%"></i></div>
      <div class="g-num">${st.pct}% · ${st.ok}/${st.total}</div>
    </button>`;
  }).join('');
  [...g.querySelectorAll('.gauge')].forEach(b => b.onclick = () => startSession({m:'study', s:b.dataset.s}, 'siandien'));
  const seen = Object.keys(S.q).length, ok = ALL.filter(q => S.q[q.uid] && S.q[q.uid].streak >= 1).length;
  document.getElementById('railStats').innerHTML =
    `<b style="font-family:var(--f-mono)">${ALL.length}</b> klausimai iš pilotai.lt<br>matyti <b style="font-family:var(--f-mono)">${seen}</b>, įvaldyta <b style="font-family:var(--f-mono)">${ok}</b>`;
  const left = Math.round((d0(S.exam) - today0())/86400000);
  document.getElementById('cdDays').textContent = left >= 0 ? left : '—';
  document.getElementById('cdDate').textContent = left >= 0 ? 'd. · '+fmt(d0(S.exam)) : 'egzamino data praeityje';
}

const V = {};

V.siandien = () => {
  const i = dayIndex();
  if (i < 1){
    const p1 = PLAN[0];
    return `<div class="eyebrow">Planas prasideda ${fmt(d0(S.start))}, ${LT_DAY[d0(S.start).getDay()]}</div>
     <h2>Pirma diena: ${specTitle(p1.am)}</h2>
     <p class="lede">${esc(p1.why)} Jei nori pradėti jau šiandien, perkelk startą į šiandieną, ir visos keturiolika dienų persistums.</p>
     <div class="card session"><div class="when">Startas<small>šiandien</small></div>
       <div><h3>Pradėti dabar</h3><p>Startas persikelia į šiandieną, egzamino data lieka ta pati</p></div>
       <div><button class="btn" id="startTodayBtn">Perkelti startą</button></div></div>
     ${sessionCard('Rytas', '45 iki 60 min', p1.am, 'am', null)}
     ${sessionCard('Vakaras', '25 iki 30 min', p1.pm, 'pm', null)}`;
  }
  if (i > 14) return `<div class="eyebrow">Planas baigtas</div><h2>Laisvas režimas</h2>
     <p class="lede">Keturiolika dienų praėjo. Toliau varyk klaidų treniruoklį ir bandomuosius egzaminus, kol visi aštuoni rodmenys bus virš 90 proc.</p>
     ${sessionCard('Klaidų treniruoklis', 'Viskas, ką kada nors atsakei neteisingai', {m:'errors', s:null}, 'am', null)}
     ${sessionCard('Pilnas bandomasis', '160 klausimų, po 20 kiekvienam dalykui', {m:'mock', n:160}, 'pm', null)}`;
  const p = PLAN[i-1], dt = addDays(d0(S.start), i-1), done = S.days[i] || {};
  return `<div class="eyebrow">${i} diena iš 14 · ${LT_DAY[dt.getDay()]}, ${fmt(dt)}</div>
    <h2>${specTitle(p.am)}</h2>
    <p class="lede">${esc(p.why)}</p>
    ${sessionCard('Rytas', p.am.m === 'study' ? '45 iki 60 min' : '30 iki 45 min', p.am, 'am', done.am)}
    ${sessionCard('Vakaras', '25 iki 30 min', p.pm, 'pm', done.pm)}
    ${p.am.m === 'study' ? `<div class="box" style="margin-top:18px">
      <h3>Dalyko medžiaga</h3>
      <p style="margin:0 0 8px;color:var(--ink-2);font-size:14.5px">Neskaityk nuo pradžių. Atsiversk tik tada, kai klausimas lieka neaiškus net po paaiškinimo.</p>
      <ul class="linklist">${(MAT[p.am.s]||[]).map(m => `<li><a href="${D(m[1])}" target="_blank" rel="noopener">${esc(m[0])}</a><span class="ext">${m[2]}</span></li>`).join('')}</ul>
    </div>` : ''}`;
};
function sessionCard(when, sub, spec, slot, done){
  const id = 'go-'+slot+'-'+Math.random().toString(36).slice(2,7);
  return `<div class="card session">
    <div class="when">${when}<small>${sub}</small></div>
    <div><h3>${specTitle(spec)}</h3><p>${specText(spec)}</p></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
      <button class="btn" data-go="${id}">${done ? 'Kartoti' : 'Pradėti'}</button>
      ${done ? '<span class="done">atlikta</span>' : ''}
    </div>
  </div>`.replace('data-go="'+id+'"', 'data-spec="'+esc(JSON.stringify(spec))+'"');
}

V.planas = () => {
  const cur = dayIndex();
  return `<div class="eyebrow">${fmt(d0(S.start))} iki ${fmt(addDays(d0(S.start),13))}</div><h2>Keturiolika dienų</h2>
   <p class="lede">Rytais imi po vieną dalyką ištisai, vakarais tikrini tą patį dalyką egzamino režimu. Nuo devintos dienos mokaisi tik tai, ką realiai klysti.</p>
   <div class="settings">
     <div class="field"><label>Planas prasideda</label><input type="date" id="startInp" value="${S.start}"></div>
     <div class="field"><label>Egzamino data</label><input type="date" id="examInp" value="${S.exam}"></div>
     <div class="field"><button class="btn quiet" id="resetBtn">Išvalyti progresą</button></div>
   </div>
   <div style="overflow-x:auto"><table class="plan"><thead><tr>
     <th>Diena</th><th>Rytas, 45 iki 60 min</th><th>Vakaras, 30 min</th><th>Kodėl</th>
   </tr></thead><tbody>
   ${PLAN.map(p => {
     const dt = addDays(d0(S.start), p.d-1), done = S.days[p.d] || {};
     const cls = p.d === cur ? 'today' : p.d < cur ? 'past' : '';
     return `<tr class="${cls}">
       <td class="dcell"><b>${p.d}</b>${LT_DAY[dt.getDay()].slice(0,3)}<br>${fmt(dt)}</td>
       <td><span class="tag am">${done.am ? '✓' : 'AM'}</span>${esc(specTitle(p.am))}<br><small style="color:var(--ink-3)">${esc(MODE_LABEL[p.am.m])}</small></td>
       <td><span class="tag pm">${done.pm ? '✓' : 'PM'}</span>${esc(specTitle(p.pm))}<br><small style="color:var(--ink-3)">${esc(MODE_LABEL[p.pm.m])}</small></td>
       <td style="color:var(--ink-2);font-size:13.5px">${esc(p.why)}</td></tr>`;
   }).join('')}
   </tbody></table></div>`;

/* ---------------- maršrutizavimas ---------------- */
let CUR = 'siandien';
function render(v){
  CUR = v || CUR; SES = null;
  document.getElementById('main').innerHTML = V[CUR]();
  [...document.querySelectorAll('#nav button')].forEach(b => b.setAttribute('aria-current', b.dataset.v === CUR));
  wire();
  drawGauges();
  window.scrollTo({top:0, behavior:'instant'});
}
function wire(){
  document.querySelectorAll('[data-spec]').forEach(b => b.onclick = () => {
    const sp = JSON.parse(b.dataset.spec);
    if (sp.m === 'facts'){ FACT_SUBJ = weakest(2); render('faktai'); return; }
    startSession(sp, CUR);
  });
  document.querySelectorAll('[data-quick]').forEach(a => a.onclick = e => { e.preventDefault(); startSession(JSON.parse(a.dataset.quick), CUR); });
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    const k = b.dataset.f, cur = FACT_SUBJ || [KEYS[0]];
    FACT_SUBJ = cur.includes(k) ? cur.filter(x => x !== k) : cur.concat([k]);
    if (!FACT_SUBJ.length) FACT_SUBJ = [k];
    render('faktai');
  });
  const si = document.getElementById('startInp');
  if (si) si.onchange = () => { S.start = si.value; save(); render('planas'); };
  const ei = document.getElementById('examInp');
  if (ei) ei.onchange = () => { S.exam = ei.value; save(); render('planas'); };
  const st = document.getElementById('startTodayBtn');
  if (st) st.onclick = () => { const t = today0(); S.start = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); save(); render('siandien'); };
  const rb = document.getElementById('resetBtn');
  if (rb) rb.onclick = () => { if (confirm('Ištrinti visą atsakymų statistiką ir atliktų sesijų žymas?')){ S.q = {}; S.days = {}; save(); render('planas'); } };
  const tg = document.getElementById('tGo');
  if (tg) tg.onclick = () => {
    const subj = document.getElementById('tSubj').value;
    const n = +document.getElementById('tN').value;
    const mode = document.getElementById('tMode').value;
    const only = document.getElementById('tOnly').value;
    TEST_CFG = {subj, n, mode, only};
    let pool = subj === '*' ? ALL : BY_SUBJ[subj];
    if (only === 'wrong') pool = pool.filter(q => S.q[q.uid] && S.q[q.uid].n && S.q[q.uid].streak === 0);
    if (only === 'new')   pool = pool.filter(q => !S.q[q.uid] || !S.q[q.uid].n);
    if (!pool.length){ alert('Su tokiais filtrais klausimų nelieka.'); return; }
    const qs = (subj === '*' && only === 'all') ? mockSet(Math.min(n, pool.length)) : pick(pool, Math.min(n, pool.length));
    SES = {mode, title: subj === '*' ? 'Mišrus testas' : subj, sub:'', qs, i:0, answers:[], t0:Date.now(), spec:null, backTo:'testas'};
    renderQuiz();
  };
}
document.getElementById('nav').onclick = e => { const b = e.target.closest('button'); if (b) render(b.dataset.v); };

/* ---------------- tema ---------------- */
function applyTheme(){
  if (S.theme) document.documentElement.setAttribute('data-theme', S.theme);
  else document.documentElement.removeAttribute('data-theme');
}
document.getElementById('themeBtn').onclick = () => {
  const dark = S.theme ? S.theme === 'dark'
             : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; save(); applyTheme();
};
applyTheme();
render('siandien');
</script>
